">\n    \n  </ul>\n</div>\n"},"/design-system/":{"title":"DESIGN SYSTEM — PINK INDEX","chrome":true,"pre":"","main":"\n\n\n  <div class=\"page page-head\">\n    <div class=\"page-head__title\">\n      <span class=\"page-head__no num\">00</span>\n      <h1 class=\"page-head__en\">DESIGN SYSTEM</h1>\n    </div>\n    <p class=\"page-head__jp\">このサイトの色・文字・部品・動きの決まりごと。番号のついた章に分けてあります。</p>\n  </div>\n\n<nav class=\"page ds-index\" id=\"ds-index\" aria-labelledby=\"ds-index-title\">\n  <h2 class=\"ds-index__title\" id=\"ds-index-title\">もくじ</h2>\n  <ol class=\"ds-index__list\">\n    \n    <li><a href=\"#ds-01\">\n      <span class=\"ds-index__no num\">01</span>\n      <span class=\"ds-index__jp\">色</span>\n      <span class=\"ds-index__en\">COLOR</span>\n      <span class=\"ds-index__lead\">白・淡いピンク 75% / 黒 20% / 鮮やかなピンク 5%</span>\n    </a></li>\n    <li><a href=\"#ds-02\">\n      <span class=\"ds-index__no num\">02</span>\n      <span class=\"ds-index__jp\">文字</span>\n      <span class=\"ds-index__en\">TYPOGRAPHY</span>\n      <span class=\"ds-index__lead\">可愛さは丸文字ではなく、サイズ差・行間・配置のずれで作る</span>\n    </a></li>\n    <li><a href=\"#ds-03\">\n      <span class=\"ds-index__no num\">03</span>\n      <span class=\"ds-index__jp\">部品</span>\n      <span class=\"ds-index__en\">COMPONENTS</span>\n      <span class=\"ds-index__lead\">角丸・影・ピルを多用せず、罫線と余白で階層を作る</span>\n    </a></li>\n    <li><a href=\"#ds-04\">\n      <span class=\"ds-index__no num\">04</span>\n      <span class=\"ds-index__jp\">動き</span>\n      <span class=\"ds-index__en\">MOTION</span>\n      <span class=\"ds-index__lead\">開始が素早く、停止が静かなイージング。1画面の主移動軸は1方向</span>\n    </a></li>\n    <li><a href=\"#ds-05\">\n      <span class=\"ds-index__no num\">05</span>\n      <span class=\"ds-index__jp\">画面幅</span>\n      <span class=\"ds-index__en\">RESPONSIVE</span>\n      <span class=\"ds-index__lead\">固定端末幅ではなく、コンテンツが窮屈になる地点で切り替える</span>\n    </a></li>\n    <li><a href=\"#ds-06\">\n      <span class=\"ds-index__no num\">06</span>\n      <span class=\"ds-index__jp\">使いやすさ</span>\n      <span class=\"ds-index__en\">ACCESSIBILITY</span>\n      <span class=\"ds-index__lead\">実装済みの確認項目</span>\n    </a></li>\n    <li><a href=\"#ds-07\">\n      <span class=\"ds-index__no num\">07</span>\n      <span class=\"ds-index__jp\">表示の速さ</span>\n      <span class=\"ds-index__en\">PERFORMANCE</span>\n      <span class=\"ds-index__lead\">イラストが主役なので、画質と表示速度を初期設計に含める</span>\n    </a></li>\n    <li><a href=\"#ds-08\">\n      <span class=\"ds-index__no num\">08</span>\n      <span class=\"ds-index__jp\">広告なし</span>\n      <span class=\"ds-index__en\">NO ADS</span>\n      <span class=\"ds-index__lead\">広告を設けない方針</span>\n    </a></li>\n    <li><a href=\"#ds-09\">\n      <span class=\"ds-index__no num\">09</span>\n      <span class=\"ds-index__jp\">制作フェーズ</span>\n      <span class=\"ds-index__en\">PHASES</span>\n      <span class=\"ds-index__lead\">デザイン制作フェーズ V0 – V6</span>\n    </a></li>\n    <li><a href=\"#ds-10\">\n      <span class=\"ds-index__no num\">10</span>\n      <span class=\"ds-index__jp\">決めたこと</span>\n      <span class=\"ds-index__en\">DECIDED</span>\n      <span class=\"ds-index__lead\">現時点の決定事項</span>\n    </a></li>\n    <li><a href=\"#ds-11\">\n      <span class=\"ds-index__no num\">11</span>\n      <span class=\"ds-index__jp\">あとで決めること</span>\n      <span class=\"ds-index__en\">OPEN</span>\n      <span class=\"ds-index__lead\">後で選ぶ項目（実装を止めない未決事項）</span>\n    </a></li>\n  </ol>\n</nav>\n\n<section class=\"page section ds-chapter\" id=\"ds-01\" aria-labelledby=\"ds-01-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">01</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-01-title\">色</h2>\n      <p class=\"ds-chapter__en\">COLOR</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n<div class=\"card-grid\">\n  <div class=\"card\" style=\"padding:0\">\n    <div style=\"height:88px;background:#FFF9FC;border-bottom:var(--line-hair)\"></div>\n    <div class=\"card__body\">\n      <p class=\"card__no num\">#FFF9FC</p>\n      <h3 class=\"card__name\">Canvas</h3>\n      <p class=\"card__meta\"><span>面(75%)</span></p>\n      <p style=\"font-size:var(--t-xs);color:var(--c-ink-muted);margin:0\">サイト全体の基本背景</p>\n    </div>\n  </div>\n  <div class=\"card\" style=\"padding:0\">\n    <div style=\"height:88px;background:#FFFFFF;border-bottom:var(--line-hair)\"></div>\n    <div class=\"card__body\">\n      <p class=\"card__no num\">#FFFFFF</p>\n      <h3 class=\"card__name\">Pure White</h3>\n      <p class=\"card__meta\"><span>面(75%)</span></p>\n      <p style=\"font-size:var(--t-xs);color:var(--c-ink-muted);margin:0\">画像面、モーダル、入力欄</p>\n    </div>\n  </div>\n  <div class=\"card\" style=\"padding:0\">\n    <div style=\"height:88px;background:#FFE8F2;border-bottom:var(--line-hair)\"></div>\n    <div class=\"card__body\">\n      <p class=\"card__no num\">#FFE8F2</p>\n      <h3 class=\"card__name\">Pale Pink</h3>\n      <p class=\"card__meta\"><span>面(75%)</span></p>\n      <p style=\"font-size:var(--t-xs);color:var(--c-ink-muted);margin:0\">巨大背景文字、選択領域の淡色面</p>\n    </div>\n  </div>\n  <div class=\"card\" style=\"padding:0\">\n    <div style=\"height:88px;background:#FFF2F7;border-bottom:var(--line-hair)\"></div>\n    <div class=\"card__body\">\n      <p class=\"card__no num\">#FFF2F7</p>\n      <h3 class=\"card__name\">Pink Mist</h3>\n      <p class=\"card__meta\"><span>面(75%)</span></p>\n      <p style=\"font-size:var(--t-xs);color:var(--c-ink-muted);margin:0\">ホバー、空状態、補助背景</p>\n    </div>\n  </div>\n  <div class=\"card\" style=\"padding:0\">\n    <div style=\"height:88px;background:#171417;border-bottom:var(--line-hair)\"></div>\n    <div class=\"card__body\">\n      <p class=\"card__no num\">#171417</p>\n      <h3 class=\"card__name\">Ink Black</h3>\n      <p class=\"card__meta\"><span>骨格(20%)</span></p>\n      <p style=\"font-size:var(--t-xs);color:var(--c-ink-muted);margin:0\">数字、見出し、主要テキスト、線</p>\n    </div>\n  </div>\n  <div class=\"card\" style=\"padding:0\">\n    <div style=\"height:88px;background:#756A71;border-bottom:var(--line-hair)\"></div>\n    <div class=\"card__body\">\n      <p class=\"card__no num\">#756A71</p>\n      <h3 class=\"card__name\">Muted Ink</h3>\n      <p class=\"card__meta\"><span>骨格(20%)</span></p>\n      <p style=\"font-size:var(--t-xs);color:var(--c-ink-muted);margin:0\">補足、制作日、メタ情報</p>\n    </div>\n  </div>\n  <div class=\"card\" style=\"padding:0\">\n    <div style=\"height:88px;background:#E8DEE3;border-bottom:var(--line-hair)\"></div>\n    <div class=\"card__body\">\n      <p class=\"card__no num\">#E8DEE3</p>\n      <h3 class=\"card__name\">Hairline</h3>\n      <p class=\"card__meta\"><span>骨格(20%)</span></p>\n      <p style=\"font-size:var(--t-xs);color:var(--c-ink-muted);margin:0\">罫線、非選択枠、区切り</p>\n    </div>\n  </div>\n  <div class=\"card\" style=\"padding:0\">\n    <div style=\"height:88px;background:#FF4FA3;border-bottom:var(--line-hair)\"></div>\n    <div class=\"card__body\">\n      <p class=\"card__no num\">#FF4FA3</p>\n      <h3 class=\"card__name\">Accent Pink</h3>\n      <p class=\"card__meta\"><span>アクセント(5%)</span></p>\n      <p style=\"font-size:var(--t-xs);color:var(--c-ink-muted);margin:0\">小さな印、選択点、リンク矢印のみ</p>\n    </div>\n  </div>\n  <div class=\"card\" style=\"padding:0\">\n    <div style=\"height:88px;background:#6D4AFF;border-bottom:var(--line-hair)\"></div>\n    <div class=\"card__body\">\n      <p class=\"card__no num\">#6D4AFF</p>\n      <h3 class=\"card__name\">Focus Violet</h3>\n      <p class=\"card__meta\"><span>状態</span></p>\n      <p style=\"font-size:var(--t-xs);color:var(--c-ink-muted);margin:0\">キーボードフォーカス</p>\n    </div>\n  </div></div>\n  <div class=\"callout\" style=\"margin-top:var(--s-5)\">\n    <h3>ピンクの使用制限</h3>\n    <p style=\"margin:0\">濃いピンク（Accent Pink）は、大きな面・主要数字・本文・長い罫線には使わない。\n    直径数pxの点、矢印、チェック、選択インジケーターに限定する。数字と線は原則として黒。</p>\n  </div>\n  <div style=\"margin-top:var(--s-5);display:flex;height:28px;border:var(--line-hair);border-radius:var(--r-2);overflow:hidden\">\n    <div style=\"flex:75;background:var(--c-pale-pink)\"></div>\n    <div style=\"flex:20;background:var(--c-ink)\"></div>\n    <div style=\"flex:5;background:var(--c-accent)\"></div>\n  </div>\n  <p class=\"card__meta\" style=\"margin-top:var(--s-2)\"><span>75% 面</span><span>20% 骨格</span><span>5% アクセント</span></p>\n  \n</section>\n\n<section class=\"page section ds-chapter\" id=\"ds-02\" aria-labelledby=\"ds-02-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">02</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-02-title\">文字</h2>\n      <p class=\"ds-chapter__en\">TYPOGRAPHY</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n<p style=\"font-size:var(--t-hero);line-height:.85;font-family:var(--font-num);font-weight:700\" class=\"num\">100<span style=\"font-size:.2em\">%</span></p>\n  <p style=\"font-size:var(--t-display);font-family:var(--font-en);font-weight:700\">DRESS UP</p>\n  <p style=\"font-size:var(--t-title)\">見出し / タイトル</p>\n  <p style=\"font-size:var(--t-lead)\">リード文。日本語本文は行間を広めに取り、極端に細いウェイトを避ける。</p>\n  <p>本文。数字は <span class=\"num\">0123456789</span> を tabular-nums で表示し、カウント中に幅が揺れないようにする。</p>\n  <p class=\"index-label\"><span class=\"index-label__no\">01</span>INDEX LABEL / 字間を広げた小さな英字</p>\n  \n</section>\n\n<section class=\"page section ds-chapter\" id=\"ds-03\" aria-labelledby=\"ds-03-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">03</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-03-title\">部品</h2>\n      <p class=\"ds-chapter__en\">COMPONENTS</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n<div class=\"stack\">\n    <div class=\"toolbar\" style=\"display:flex;gap:var(--s-3);flex-wrap:wrap;align-items:center\">\n      <button class=\"btn btn--primary\" type=\"button\">主要操作</button>\n      <button class=\"btn\" type=\"button\">副次操作</button>\n      <button class=\"btn btn--ghost\" type=\"button\">目立たない操作</button>\n      <button class=\"btn\" type=\"button\" disabled>無効</button>\n      <a class=\"link-arrow\" href=\"#top\">テキストリンク</a>\n    </div>\n    <div style=\"display:flex;gap:var(--s-2);flex-wrap:wrap\">\n      <button class=\"chip\" type=\"button\" aria-pressed=\"false\">未選択チップ</button>\n      <button class=\"chip\" type=\"button\" aria-pressed=\"true\">選択中チップ</button>\n      <span class=\"tag-chip\">衣服タグ</span>\n      <span class=\"status-pill\" data-status=\"PUBLISHED\">PUBLISHED</span>\n      <span class=\"status-pill\" data-status=\"DRAFT\">DRAFT</span>\n    </div>\n    <div class=\"empty\">\n      <p class=\"empty__title\">まだ登録がありません</p>\n      <p class=\"empty__body\">未登録を否定的に扱わず、「次の1点を追加する余白」として表示する。</p>\n    </div>\n  </div>\n  <div class=\"callout\" style=\"margin-top:var(--s-5)\">\n    <h3>選択状態の示しかた</h3>\n    <p style=\"margin:0\">色だけで示さない。<strong>黒い1px枠 + 直径6pxのピンクの点 + 支援技術向けのテキスト</strong>の3つを必ず揃える。\n    これによりコントラスト条件や色覚特性に依存しない。</p>\n  </div>\n  \n</section>\n\n<section class=\"page section ds-chapter\" id=\"ds-04\" aria-labelledby=\"ds-04-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">04</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-04-title\">動き</h2>\n      <p class=\"ds-chapter__en\">MOTION</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n\n  <div style=\"overflow-x:auto\">\n  <table style=\"width:100%;border-collapse:collapse;font-size:var(--t-sm);min-width:520px\">\n    <thead><tr><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">種類</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">目安</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">用途</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">トークン</th></tr></thead>\n    <tbody><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">Micro</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"num\">140–200ms</span></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">ホバー、選択、チェック</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><code>--m-micro</code></td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">Panel</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"num\">240–360ms</span></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">フィルター、ボトムシート、モーダル</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><code>--m-panel</code></td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">Reveal</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"num\">400–600ms</span></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">セクション見出し、作品の初回表示</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><code>--m-reveal</code></td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">Loader Exit</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"num\">450–650ms</span></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">数字分割からヒーロー表示</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><code>--m-loader-exit</code></td></tr></tbody>\n  </table></div>\n  <p style=\"margin-top:var(--s-4)\">衣装選択時は、パーツ画像そのものを派手に動かさず、選択枠・番号・短いクロスフェードで反応を示す。\n  <code>prefers-reduced-motion</code> では線描画と数字分割を省略し、短いクロスフェードに切り替える。</p>\n  \n</section>\n\n<section class=\"page section ds-chapter\" id=\"ds-05\" aria-labelledby=\"ds-05-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">05</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-05-title\">画面幅</h2>\n      <p class=\"ds-chapter__en\">RESPONSIVE</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n\n  <div style=\"overflow-x:auto\">\n  <table style=\"width:100%;border-collapse:collapse;font-size:var(--t-sm);min-width:520px\">\n    <thead><tr><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">画面</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">幅</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">基本レイアウト</th></tr></thead>\n    <tbody><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">Large Desktop</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"num\">1440px〜</span></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">12列。余白を大きく取り、作品を大胆に配置</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">Desktop / Tablet Landscape</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"num\">901–1439px</span></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">8〜12列。着せ替えはプレビュー＋右パネル</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">Tablet Portrait</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"num\">641–900px</span></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">6〜8列。操作パネルを下部または折りたたみへ</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">Mobile</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"num\">〜640px</span></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">4列。プレビュー＋ボトムシート、一覧は2列中心</td></tr></tbody>\n  </table></div>\n  <p style=\"margin-top:var(--s-4)\">タップ対象は 44px 以上（<code>--tap-min</code>）。スマートフォンでホバー前提の操作を残さない。</p>\n  \n</section>\n\n<section class=\"page section ds-chapter\" id=\"ds-06\" aria-labelledby=\"ds-06-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">06</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-06-title\">使いやすさ</h2>\n      <p class=\"ds-chapter__en\">ACCESSIBILITY</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n<ul class=\"prose\" style=\"padding:0\">\n    <li>本文と背景のコントラストを確保し、淡いピンクの文字を長文・重要情報に使わない</li>\n    <li>選択状態は枠・点・テキストの3点で示す</li>\n    <li>全操作をキーボードで実行でき、フォーカスリングを消さない（Focus Violet）</li>\n    <li>装飾画像は <code>alt=\"\"</code>、作品画像には用途に応じた代替テキストを設定</li>\n    <li><code>prefers-reduced-motion</code> に対応し、ローディングは短いクロスフェードへ</li>\n    <li>拡大 200% でも主要操作が失われない（相対単位と流体タイプスケール）</li>\n    <li>ローディング中もページタイトルと進捗を <code>aria-live</code> で支援技術へ伝える</li>\n  </ul>\n  <p>正式な適合宣言を行う場合は、実装後に WCAG 2.2 AA 相当の専門的検証を別途実施する。</p>\n  \n</section>\n\n<section class=\"page section ds-chapter\" id=\"ds-07\" aria-labelledby=\"ds-07-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">07</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-07-title\">表示の速さ</h2>\n      <p class=\"ds-chapter__en\">PERFORMANCE</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n<ul class=\"prose\" style=\"padding:0\">\n    <li>ファーストビュー画像のみ <code>fetchpriority=\"high\"</code>、それ以外は <code>loading=\"lazy\"</code></li>\n    <li>一覧は配信用の軽量画像を使い、内部合成用の原寸データと分離する</li>\n    <li>フォントは必要ウェイトだけを配信し、ローディング演出に動画を使わない</li>\n    <li>大量素材一覧はページング・段階読み込み・仮想化を用途ごとに選ぶ</li>\n    <li>低速回線ではアニメーションより表示完了を優先する（ローダーには最大待機時間を設ける）</li>\n  </ul>\n  \n</section>\n\n<section class=\"page section ds-chapter\" id=\"ds-08\" aria-labelledby=\"ds-08-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">08</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-08-title\">広告なし</h2>\n      <p class=\"ds-chapter__en\">NO ADS</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n<div class=\"callout\">\n    <p>導入しないもの：ディスプレイ広告／アフィリエイト枠／スポンサー枠／広告SDK／広告クリック計測／\n    広告目的のCookie同意UI／ダウンロードボタンに近接する外部誘導。</p>\n    <p style=\"margin:0\">画面・データ構造・公開準備のいずれにも広告枠を持たない。\n    そのため広告ブロックやno-fillによるレイアウト崩れ、誤タップ、CLSの検証項目自体が存在しない。</p>\n  </div>\n  \n</section>\n\n<section class=\"page section ds-chapter\" id=\"ds-09\" aria-labelledby=\"ds-09-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">09</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-09-title\">制作フェーズ</h2>\n      <p class=\"ds-chapter__en\">PHASES</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n\n  <div style=\"overflow-x:auto\">\n  <table style=\"width:100%;border-collapse:collapse;font-size:var(--t-sm);min-width:520px\">\n    <thead><tr><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">Phase</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">内容</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">作業</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">完了条件</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">状態</th></tr></thead>\n    <tbody><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><strong class=\"num\">V0</strong></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">ビジュアル方向確定</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">仮ロゴ、カラーパレット、書体候補、代表イラスト選定、参考サイトとの差別化チェック</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">1枚のキービジュアルとデザイン原則でサイト固有の印象を説明できる</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"status-pill\" data-status=\"PUBLISHED\">実装済</span></td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><strong class=\"num\">V1</strong></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">デザインシステム</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">色・余白・文字・罫線・角丸のトークン化、ボタン/タグ/カード/入力欄/モーダル、PC・モバイルの基本グリッド、アクセシビリティ確認</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">新しいページを同じルールで追加できる</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"status-pill\" data-status=\"PUBLISHED\">実装済</span></td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><strong class=\"num\">V2</strong></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">ローダー＋ホーム試作</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">実進捗連動カウンター、外周ライン、100%からヒーローへの接続、Reduced Motion版、セッション内再表示ルール</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">参考サイトと並べても構図と遷移が別物として説明できる</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"status-pill\" data-status=\"PUBLISHED\">実装済</span></td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><strong class=\"num\">V3</strong></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">DRESS UP操作試作</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">プレビューと素材パネル、カテゴリ・検索・選択状態、ロック / undo・redo、モバイルのボトムシート</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">初見ユーザーが説明なしで着せ替えを完了できる</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"status-pill\" data-status=\"PUBLISHED\">実装済</span></td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><strong class=\"num\">V4</strong></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">アーカイブ画面</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">CLOSET / GIRLS / COLLECTIONS / GALLERY、検索結果と特集のレイアウト分離、詳細ページ、空状態</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">作品が数千件になっても探せて、眺めて楽しい</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"status-pill\" data-status=\"PUBLISHED\">実装済</span></td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><strong class=\"num\">V5</strong></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">管理画面</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">登録フォーム、画像検査とレイヤープレビュー、下書き・複製・公開チェック、登録数とコレクション進捗</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">コードを編集せず、新しい作品を安全に公開できる</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"status-pill\" data-status=\"PUBLISHED\">実装済</span></td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><strong class=\"num\">V6</strong></td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">公開品質調整</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">実機レスポンシブ確認、パフォーマンス計測、キーボード・支援技術確認、規約/プライバシー/問い合わせ導線、公開用画像の確認</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">長期運用する正式サービスとして公開できる</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"><span class=\"status-pill\" data-status=\"REVIEW\">実装中</span></td></tr></tbody>\n  </table></div>\n  \n</section>\n\n<section class=\"page section ds-chapter\" id=\"ds-10\" aria-labelledby=\"ds-10-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">10</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-10-title\">決めたこと</h2>\n      <p class=\"ds-chapter__en\">DECIDED</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n\n  <div style=\"overflow-x:auto\">\n  <table style=\"width:100%;border-collapse:collapse;font-size:var(--t-sm);min-width:520px\">\n    <thead><tr><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">項目</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">決定</th></tr></thead>\n    <tbody><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">基調色</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">白・ごく淡いピンク</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">主要文字・数字</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">黒</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">主要罫線</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">黒または薄いグレー</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">鮮やかなピンク</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">小さなアクセントのみ（面・本文・長い罫線には使わない）</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">ローダー</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">0% → 100% の数値表示を採用</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">ローダー独自表現</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">画面外周ラインと、ホームの枠線への連続変形</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">ホーム</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">女の子を大きく見せる非対称エディトリアル構成</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">一覧</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">検索性を優先した整列グリッド</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">特集</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">雑誌的な可変レイアウトを許可</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">広告</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">掲載しない（枠・データ構造・同意UIのいずれも設けない）</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">管理画面</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">世界観を共有しつつ、操作性を優先</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">参考サイト</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">抽象原則のみ参照し、具体構成は模倣しない</td></tr></tbody>\n  </table></div>\n  \n</section>\n\n<section class=\"page section ds-chapter\" id=\"ds-11\" aria-labelledby=\"ds-11-title\">\n  <div class=\"ds-chapter__head\">\n    <span class=\"ds-chapter__no num\">11</span>\n    <div>\n      <h2 class=\"ds-chapter__jp\" id=\"ds-11-title\">あとで決めること</h2>\n      <p class=\"ds-chapter__en\">OPEN</p>\n    </div>\n    <a class=\"ds-chapter__back\" href=\"#ds-index\">↑ もくじ</a>\n  </div>\n  \n\n  <div style=\"overflow-x:auto\">\n  <table style=\"width:100%;border-collapse:collapse;font-size:var(--t-sm);min-width:520px\">\n    <thead><tr><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">項目</th><th style=\"text-align:left;padding:var(--s-2) var(--s-3);border-bottom:var(--line-ink);font-size:var(--t-xs);letter-spacing:var(--ls-label);color:var(--c-ink-muted)\">現在の暫定値</th></tr></thead>\n    <tbody><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">正式サイト名とロゴ表記</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">PINK INDEX は企画上の仮称。ロゴは文字組みのみで仮運用中</td></tr><tr><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\">日本語・英字の最終フォント</td><td style=\"padding:var(--s-3);border-bottom:var(--line-hair);vertical-align:top\"> <script>
/* --- ルーター ---------------------------------------------
   ハッシュが変わったら読み込み直す。ページごとの初期化スクリプトを
   ちょうど1回だけ走らせるため（listener の二重登録を避ける）。
   --------------------------------------------------------- */
window.PINK_SINGLE = true;
window.PINK_ASSETS = JSON.parse(document.getElementById("assets").textContent);
(function () {
  var ROUTES = JSON.parse(document.getElementById("routes").textContent);
  var raw = location.hash.replace(/^#/, "") || "/";
  var q = raw.indexOf("?");
  var path = q < 0 ? raw : raw.slice(0, q);
  window.PINK_QUERY = q < 0 ? "" : raw.slice(q);
  if (!ROUTES[path]) path = "/";

  var page = ROUTES[path];
  document.title = page.title;
  document.body.dataset.chrome = page.chrome ? "on" : "off";
  if (page.pre) {
    document.getElementById("pre").innerHTML = page.pre;
    document.body.dataset.loading = "true";
  }
  document.getElementById("main").innerHTML = page.main;

  // 画像は表から data URI へ差し替える（同じ絵を何度も埋め込まないため）
  var imgs = document.querySelectorAll('img[src^="/assets/"]');
  for (var i = 0; i < imgs.length; i++) {
    var src = imgs[i].getAttribute("src");
    if (window.PINK_ASSETS[src]) imgs[i].setAttribute("src", window.PINK_ASSETS[src]);
  }

  // 現在地をナビへ反映
  var links = document.querySelectorAll(".site-nav a");
  for (var j = 0; j < links.length; j++) {
    var href = links[j].getAttribute("href").replace(/^#/, "");
    if (href === path) links[j].setAttribute("aria-current", "page");
    else links[j].removeAttribute("aria-current");
  }

  addEventListener("hashchange", function () { location.reload(); });
})();
</script>

 * 組み込みの素材とまったく同じ経路で描画・判定できるようにするため。
 */
  const builtinItems = items;

/** 素体と表情は空にできない（外すと絵が成立しないため） */
const REQUIRED_SLOTS = ["body", "face"];

let CAT = {
  items: builtinItems,
  categories: builtinCategories,
  equipSlots: builtinSlots,
  layerDefinitions: builtinLayers,
  compatibilityRules: builtinRules,
  baseLayers: builtinBaseLayers,
