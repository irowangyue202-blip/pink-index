<script>/**
 * サイト共通の振る舞い。ページ固有の処理は各ページのモジュールに置く。
 *
 * ヘッダーは4つの状態を持つ:
 *   top      先頭。背景は完全に透明で、キービジュアルが背後まで見える
 *   hidden   下へ一定量スクロールした。上へ滑らせて隠す
 *   frosted  途中で上へスクロールした。乳白色＋ぼかし＋薄い下線で戻す
 *   （先頭へ戻ると top に戻る）
 */
(() => {

/* --- メニュー -------------------------------------------- */
const toggle = document.querySelector(".nav-toggle");
const nav = document.getElementById("site-nav");
if (toggle && nav) {
  const label = toggle.querySelector(".nav-toggle__label");
  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    nav.dataset.open = String(!open);
    document.body.dataset.navOpen = String(!open);
    if (label) label.textContent = open ? "MENU" : "CLOSE";
  });
  nav.addEventListener("click", (e) => { if (e.target.tagName === "A") toggle.click(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && nav.dataset.open === "true") { toggle.click(); toggle.focus(); }
  });
}

/* --- ヘッダーの4状態 -------------------------------------- */
const header = document.getElementById("site-header");
if (header) {
  const TOP = 12;        // ここまでは「先頭」とみなす
  const STEP = 8;        // 小さな揺れで反転しないためのしきい値
  const HIDE_AFTER = 220; // これより下でなければ隠さない
  let last = window.scrollY;

  const setState = (state) => {
    if (header.dataset.state !== state) header.dataset.state = state;
  };

  const update = () => {
    const y = window.scrollY;
    const menuOpen = nav?.dataset.open === "true";
    const diff = y - last;

    if (y <= TOP) setState("top");
    else if (menuOpen) setState("frosted");
    else if (diff > STEP && y > HIDE_AFTER) { setState("hidden"); last = y; }
    else if (diff < -STEP) { setState("frosted"); last = y; }
    if (Math.abs(diff) > STEP) last = y;
  };

  // 読むのは scrollY だけなので、そのまま実行してよい（描き直しは起こさない）
  addEventListener("scroll", update, { passive: true });
  update();
}

/* --- トースト -------------------------------------------- */
function toast(message) {
  const region = document.getElementById("toast-region");
  if (!region) return;
  const el = document.createElement("p");
  el.className = "toast";
  el.textContent = message;
  region.append(el);
  setTimeout(() => el.remove(), 3200);
}
window.pinkToast = toast;
})();

/**
 * サイトの文字
 *
 * ページに出ている文字を1つずつ扱えるようにする。
 *   ・保存された書き換え・そろえ・非表示を、読み込み時にあてる
 *   ・管理画面（/studio/texts/）から呼ばれたら、いまの一覧を返す
 *
 * 管理画面はこのページを枠（iframe）の中に置いて編集する。
 * file:// では枠の中を直接読めないため、やり取りは postMessage で行う。
 */
(() => {
  const { store } = window.PINK ?? {};
  if (!store) return;

  /* --- どの文字かを表す鍵 -----------------------------------
     ページの中での位置（親をさかのぼったタグと組の並び）で作る。
     文言そのものを鍵にしないので、書き換えても同じ文字を指し続ける。
     --------------------------------------------------------- */
  const route = () => {
    const h = location.hash.replace(/^#/, "");
    if (h) return h.split("?")[0];
    const p = location.pathname.replace(/index\.html$/, "");
    const i = p.indexOf("/pink-index/");
    return i >= 0 ? p.slice(i + "/pink-index".length) : p;
  };

  const step = (n) => {
    const tag = n.tagName.toLowerCase();
    const cls = (n.getAttribute("class") || "").trim().split(/\s+/).filter(Boolean).slice(0, 2).join(".");
    const sibs = [...(n.parentElement ? n.parentElement.children : [])].filter((x) => x.tagName === n.tagName);
    return tag + (cls ? "." + cls : "") + (sibs.length > 1 ? ":" + sibs.indexOf(n) : "");
  };

  const keyOf = (el) => {
    const parts = [];
    for (let n = el; n && n !== document.body; n = n.parentElement) parts.unshift(step(n));
    return route() + "|" + parts.join(">");
  };

  /* --- 扱う対象 ---------------------------------------------
     読み込み中の演出、支援技術むけの補助テキスト、入力欄、
     HOMEのキービジュアル（HOMEの編集で扱う）は対象にしない。
     --------------------------------------------------------- */
  const SKIP = "#loader, .perimeter, .home-frame, .toast-region, [data-kv], .visually-hidden, [aria-hidden='true'], .studio";
  const targets = () => [...document.querySelectorAll("main *, .site-header *, .site-footer *")]
    .filter((el) => {
      if (el.children.length) return false;
      if (!(el.textContent || "").trim()) return false;
      if (el.closest(SKIP)) return false;
      if (/^(script|style|input|textarea|select|option|svg|path|rect|circle)$/.test(el.tagName.toLowerCase())) return false;
      return true;
    });

  /** 保存されている指定を、いまのページへあてる */
  const apply = () => {
    const over = store.textsAll();
    for (const el of targets()) {
      const o = over[keyOf(el)];
      if (!el.dataset.tOrig) el.dataset.tOrig = el.textContent;
      if (!o) {
        if (el.hidden) el.hidden = false;
        if (el.textContent !== el.dataset.tOrig) el.textContent = el.dataset.tOrig;
        el.style.textAlign = "";
        continue;
      }
      el.hidden = Boolean(o.hidden);
      el.textContent = typeof o.text === "string" ? o.text : el.dataset.tOrig;
      el.style.textAlign = o.align || "";
    }
  };

  /** 管理画面へ渡す一覧 */
  const collect = () => {
    const over = store.textsAll();
    return targets().map((el) => {
      const key = keyOf(el);
      const o = over[key] ?? {};
      return {
        key,
        text: typeof o.text === "string" ? o.text : (el.dataset.tOrig ?? el.textContent),
        original: el.dataset.tOrig ?? el.textContent,
        hidden: Boolean(o.hidden),
        align: o.align || "",
        where: el.closest("header") ? "ヘッダー" : el.closest("footer") ? "フッター" : "本文",
        edited: Boolean(over[key]),
      };
    });
  };

  let marked = null;
  const mark = (key) => {
    if (marked) marked.classList.remove("is-text-marked");
    marked = targets().find((el) => keyOf(el) === key) ?? null;
    if (!marked) return;
    marked.classList.add("is-text-marked");
    marked.scrollIntoView({ block: "center", behavior: "smooth" });
  };

  /** 最下部のロゴを、登録された画像へ差し替える */
  const applyLogo = () => {
    const img = document.getElementById("brand-logo-img");
    const type = document.getElementById("brand-logo-type");
    if (!img || !type) return;
    const src = store.brandLogo();
    img.hidden = !src;
    type.hidden = Boolean(src);
    if (src) img.src = src;
  };

  apply();
  applyLogo();
  window.PINK_TEXTS = { apply, collect, mark, keyOf };

  // 管理画面（親の窓）とのやり取り
  addEventListener("message", (e) => {
    const msg = e.data;
    if (!msg || msg.pinkTexts === undefined) return;
    if (msg.pinkTexts === "collect") {
      e.source.postMessage({ pinkTexts: "list", route: route(), rows: collect() }, "*");
    } else if (msg.pinkTexts === "refresh") {
      store.reload();          // 管理画面が保存した内容を読み直す
      apply();
      applyLogo();
      e.source.postMessage({ pinkTexts: "list", route: route(), rows: collect() }, "*");
    } else if (msg.pinkTexts === "mark") {
      mark(msg.key);
    }
  });

  // 親から見えるよう、読み込みが終わったことを伝える
  try { parent !== window && parent.postMessage({ pinkTexts: "ready", route: route() }, "*"); } catch { /* 単独で開いたとき */ }
})();

/**
 * 初回ローディング演出。
 *
 * 設計上の要点（企画書 5.3 / 5.4）:
 * - 実際の読み込み進捗で数字を進める（偽のアニメーションにしない）
 * - 外周ラインを同じ進捗率で時計回りに描き、先端にだけピンクの点を置く
 * - 100%で数字が左右へ離れ、その間からヒーローのイラストが現れる
 * - 外周ラインはフェードアウトせず、ホームの枠線へ縮んで接続する
 * - 同一セッションでは初回のみフル演出
 * - 進捗が取れない場合も 99% で止めず、最大待機時間でホームへ進める
 */
(() => {
const loader = document.getElementById("loader");
const perimeter = document.getElementById("perimeter");
if (loader) {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const seen = (() => { try { return sessionStorage.getItem("pinkindex.loader.seen") === "1"; } catch { return false; } })();
  const d1 = document.getElementById("loader-d1");
  const d2 = document.getElementById("loader-d2");
  const status = document.getElementById("loader-status");
  const svg = document.getElementById("perimeter-svg");
  const track = document.getElementById("perimeter-track");
  const lineRect = document.getElementById("perimeter-line");
  const tip = document.getElementById("perimeter-tip");
  const homeFrame = document.getElementById("home-frame");

  const MAX_WAIT = 4000;      // これ以上は待たずにホームへ進める
  const MIN_SHOW = seen ? 260 : 900;
  const INSET = 12;           // ホーム側の枠線と同じ内側寸法

  let inset = 0;
  const layout = () => {
    const w = window.innerWidth, h = window.innerHeight;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    for (const r of [track, lineRect]) {
      r.setAttribute("x", inset + 0.5); r.setAttribute("y", inset + 0.5);
      r.setAttribute("width", Math.max(0, w - inset * 2 - 1));
      r.setAttribute("height", Math.max(0, h - inset * 2 - 1));
    }
    return 2 * ((w - inset * 2 - 1) + (h - inset * 2 - 1));
  };
  let perim = layout();
  addEventListener("resize", () => { perim = layout(); draw(shown); }, { passive: true });

  /** 進捗を数字と外周ラインへ反映する */
  let shown = 0;
  const draw = (p) => {
    shown = p;
    const n = Math.round(p * 100);
    const text = String(n).padStart(2, "0");
    d1.textContent = text[0];
    d2.textContent = text.slice(1);
    status.textContent = `サイトを読み込んでいます ${n}%`;
    lineRect.style.strokeDasharray = `${perim}`;
    lineRect.style.strokeDashoffset = `${perim * (1 - p)}`;
    // 先端の点は実際のパス上の座標に置く
    try {
      const pt = lineRect.getPointAtLength(perim * p);
      tip.setAttribute("cx", pt.x); tip.setAttribute("cy", pt.y);
      tip.style.opacity = p > 0.01 && p < 0.999 ? "1" : "0";
    } catch { tip.style.opacity = "0"; }
  };
  draw(0);

  /* --- 実進捗: ファーストビューに必要な画像とフォント ------ */
  const critical = [...document.querySelectorAll('img[fetchpriority="high"], .hero__figure img')];
  const jobs = critical.map((img) => img.complete && img.naturalWidth
    ? Promise.resolve()
    : new Promise((res) => { img.addEventListener("load", res, { once: true }); img.addEventListener("error", res, { once: true }); }));
  if (document.fonts?.ready) jobs.push(document.fonts.ready);
  jobs.push(new Promise((res) => (document.readyState === "complete" ? res() : addEventListener("load", res, { once: true }))));

  let done = 0;
  const total = jobs.length;
  const realProgress = () => Math.min(1, done / total);
  jobs.forEach((j) => j.then(() => { done++; }));

  const started = performance.now();
  let finished = false;

  // 進捗はタイマーで進める。requestAnimationFrame はタブが背面にあると
  // 供給が止まり、ローダーが途中で固まって見えるため、進行の主軸にはしない。
  const TICK = 40;
  const timer = setInterval(() => {
    const elapsed = performance.now() - started;
    // 実進捗を主にしつつ、取得不能なときも時間で補間して 99% 停止を避ける
    const target = Math.max(realProgress(), Math.min(0.92, elapsed / MAX_WAIT));
    const ready = (done >= total && elapsed > MIN_SHOW) || elapsed > MAX_WAIT;
    const next = ready ? shown + 0.08 : shown + (target - shown) * 0.25;
    draw(Math.max(shown, Math.min(1, next)));
    if (ready && shown > 0.985) finish();
  }, TICK);

  // 何が起きても必ずホームへ進める最終防衛線
  const hardStop = setTimeout(finish, MAX_WAIT + 1500);

  function finish() {
    if (finished) return;
    finished = true;
    clearInterval(timer);
    clearTimeout(hardStop);
    draw(1);
    status.textContent = "読み込みが完了しました";
    try { sessionStorage.setItem("pinkindex.loader.seen", "1"); } catch { /* 無視してよい */ }

    if (reduced) {
      // 線描画と数字分割を省略し、短いクロスフェードにする
      loader.dataset.state = "done";
      perimeter.classList.add("perimeter--faded");
      setTimeout(release, 200);
      return;
    }

    loader.dataset.state = "exit";     // 数字が左右へ離れる
    perimeter.classList.add("perimeter--handoff");

    // 外周ラインをホームの枠線位置まで縮め、そのまま静的な枠へ引き継ぐ
    const startTime = performance.now();
    const shrinkTimer = setInterval(() => {
      const t = Math.min(1, (performance.now() - startTime) / 520);
      inset = INSET * (1 - Math.pow(1 - t, 3));
      perim = layout();
      lineRect.style.strokeDasharray = `${perim}`;
      lineRect.style.strokeDashoffset = "0";
      if (t >= 1) {
        clearInterval(shrinkTimer);
        homeFrame?.classList.add("is-on");
        perimeter.classList.add("perimeter--faded");
      }
    }, 24);

    setTimeout(() => { loader.dataset.state = "done"; }, 120);
    setTimeout(release, 900);
  }

  function release() {
    loader.hidden = true;
    perimeter.hidden = true;
    document.body.removeAttribute("data-loading");
    document.dispatchEvent(new CustomEvent("pinkindex:loaded"));
  }
}
})();

/**
 * STUDIO（管理画面）の振る舞い。
 *
 * 一覧はここで組み立てる（この端末に登録した作品を読むため）。
 * 公開画面からはリンクしない。ラベルは短く、説明は詳細設定の中へ。
 */
(() => {
  const { store, home, url } = window.PINK;
  const toast = (m) => window.pinkToast?.(m);
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const d = (s) => String(s ?? "").replace(/-/g, ".");

  /**
   * 取り消しの確認。ダイアログを出せない環境でも動くよう、
   * ボタン自身を2度押しに切り替える。
   */
  const confirmTwice = (btn, label) => {
    if (btn.dataset.armed === "1") return true;
    const original = btn.textContent;
    btn.dataset.armed = "1";
    btn.textContent = label;
    btn.classList.add("btn--danger");
    setTimeout(() => {
      if (!btn.isConnected) return;
      btn.dataset.armed = "";
      btn.textContent = original;
      btn.classList.remove("btn--danger");
    }, 4000);
    return false;
  };

  /** 画像を読み込んで data URL にする */
  const readImage = (file) => new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => res(null);
    r.readAsDataURL(file);
  });

  /** 長辺 1600px までに縮めて保存する（原寸は手元に置いたまま） */
  const fitImage = (file) => new Promise((res) => {
    if (/svg/.test(file.type)) { readImage(file).then(res); return; }
    const reader = new FileReader();
    reader.onerror = () => res(null);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => res(null);
      img.onload = () => {
        const MAX = 1600;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res({ media: c.toDataURL("image/jpeg", 0.86), w: img.width, h: img.height });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  const VIS = ["DRAFT", "PRIVATE", "PUBLIC"];

  /* ============ 公開ページへの反映 ============
     管理画面には公開ファイルのひな型が入っている。
     いまの内容を差し込んだ index.html を、その場で組み立てて渡す。
     ============================================ */
  const publicTemplate = () => {
    const tag = document.getElementById("public-template");
    if (!tag) return null;
    try { return JSON.parse(tag.textContent); } catch { return null; }
  };

  /** ひな型の中の「同梱データ」だけを、いまの内容へ差し替える */
  const buildPublicFile = () => {
    const tpl = publicTemplate();
    if (!tpl) return null;
    const data = store.exportData().replace(/<\//g, "<\\/");
    const mark = "window.PINK_SEED = null;";
    if (!tpl.includes(mark)) return null;
    return tpl.replace(mark, `window.PINK_SEED = ${data};`);
  };

  const saveFile = (text, name, type) => {
    const blob = new Blob([text], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  const wirePublish = () => {
    const btns = document.querySelectorAll("#dash-publish");
    if (!btns.length) return;
    if (!publicTemplate()) {
      btns.forEach((b) => { b.disabled = true; b.title = "このファイルにはひな型が入っていません"; });
      return;
    }
    btns.forEach((btn) => btn.addEventListener("click", () => {
      const html = buildPublicFile();
      if (!html) { toast("書き出せませんでした"); return; }
      saveFile(html, "index.html", "text/html;charset=utf-8");
      const kb = Math.round(html.length / 1024);
      const size = el("dash-publish-size");
      if (size) size.textContent = `${kb} KB`;
      toast(`index.html を書き出しました（${kb} KB）`);
    }));
  };
  wirePublish();

  /* ============ ダッシュボード ============ */
  if (el("dash-counts")) {
    const paint = () => {
      const s = store.stats();
      el("dash-counts").innerHTML = [
        ["作品", s.works], ["公開中", s.published], ["編集中", s.drafts],
        ["保管", s.private], ["シリーズ", s.series],
      ].map(([label, value]) => `
        <div class="dash-card">
          <p class="index-label">${esc(label)}</p>
          <p class="num" style="font-size:var(--t-title)">${value}</p>
        </div>`).join("");

      const recent = [...store.mergedWorks()]
        .sort((a, b) => String(b.createdOn ?? "").localeCompare(String(a.createdOn ?? ""))).slice(0, 6);
      el("dash-recent").innerHTML = recent.length ? recent.map((w) => `
        <li>
          <img src="${esc(w.mainImage)}" alt="" width="34" height="34" style="object-fit:cover">
          <span><strong>${esc(w.title)}</strong><br>
            <span style="color:var(--c-ink-muted)">${esc(d(w.createdOn))}</span></span>
          <span class="vis-pill" data-vis="${esc(w.visibility)}">${esc(w.visibility)}</span>
        </li>`).join("") : `<li><span class="hint">まだ作品がありません</span></li>`;
      el("dash-bytes").textContent = `${Math.round(s.bytes / 1024)} KB`;
    };

    el("dash-export").addEventListener("click", () => {
      saveFile(store.exportData(), "site-data.json", "application/json");
      toast("site-data.json を書き出しました");
    });
    el("dash-import").addEventListener("click", () => el("dash-import-file").click());
    el("dash-import-file").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const r = store.importData(await file.text());
      toast(r.ok ? "読み込みました" : r.reason);
      paint();
    });
    el("dash-reset").addEventListener("click", (e) => {
      if (!confirmTwice(e.currentTarget, "すべて取り消す（もう一度押す）")) return;
      store.resetAll();
      toast("編集をすべて取り消しました");
      paint();
    });
    paint();
  }

  /* ============ 作品を追加 ============ */
  if (el("entry-form")) {
    let picked = null;
    const chips = { tags: [] };

    const fillSelects = () => {
      el("e-cat").innerHTML = store.mergedCategories()
        .map((c) => `<option value="${esc(c.key)}">${esc(c.name)}</option>`).join("");
      el("e-series").innerHTML = `<option value="">（なし）</option>` + store.mergedSeries()
        .map((s) => `<option value="${esc(s.slug)}">${esc(s.name)}</option>`).join("");
    };
    fillSelects();
    el("e-date").value = new Date().toISOString().slice(0, 10);

    /* --- タグ（押して外せるチップ） --- */
    const drawChips = () => {
      const box = el("tags-input");
      box.querySelector(".chips-input__list").innerHTML = chips.tags.map((t) => `
        <button class="chip-token" type="button" data-drop-chip="${esc(t)}">${esc(t)}<span aria-hidden="true">×</span>
          <span class="visually-hidden">を外す</span></button>`).join("");
      const all = [...new Set(store.mergedWorks().flatMap((w) => w.tags ?? []))].sort();
      box.querySelector("datalist").innerHTML = all.filter((t) => !chips.tags.includes(t))
        .map((t) => `<option value="${esc(t)}">`).join("");
    };
    const addChip = (v) => {
      const t = String(v ?? "").trim();
      if (!t || chips.tags.includes(t)) return;
      chips.tags.push(t);
      drawChips();
    };
    const tagInput = el("e-tags");
    tagInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== "," && e.key !== " ") return;
      e.preventDefault(); addChip(tagInput.value); tagInput.value = "";
    });
    tagInput.addEventListener("change", () => { addChip(tagInput.value); tagInput.value = ""; });
    tagInput.addEventListener("blur", () => { addChip(tagInput.value); tagInput.value = ""; });
    el("entry-form").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-drop-chip]");
      if (!btn) return;
      chips.tags = chips.tags.filter((t) => t !== btn.dataset.dropChip);
      drawChips();
    });
    drawChips();

    /* --- 画像 --- */
    const dz = el("dropzone");
    const input = el("file-input");
    const inspect = (rows) => {
      const box = el("inspect");
      box.hidden = !rows.length;
      box.innerHTML = rows.map(([ok, label, state]) =>
        `<li data-ok="${ok}"><span class="mark">●</span><span>${esc(label)}</span><span class="state">${esc(state)}</span></li>`).join("");
    };
    const drawPreview = () => {
      el("work-preview").innerHTML = picked
        ? `<img src="${esc(picked.media)}" alt="登録する作品のプレビュー">`
        : `<span class="hint">画像を選ぶとここに出ます</span>`;
    };

    async function takeFile(file) {
      if (!file) return;
      const out = await fitImage(file);
      const media = typeof out === "string" ? out : out?.media;
      if (!media) { inspect([["false", "画像", "この形式は取り込めませんでした"]]); return; }
      picked = { media, w: out?.w ?? 0, h: out?.h ?? 0 };
      const kb = Math.round(media.length / 1024);
      inspect([
        ["true", "形式", file.type || "画像"],
        ["true", "大きさ", picked.w ? `${picked.w} × ${picked.h}` : "そのまま"],
        [kb > 1200 ? "false" : "true", "データ量", `${kb} KB`],
      ]);
      if (!el("e-title").value) el("e-title").value = file.name.replace(/\.[^.]+$/, "");
      drawPreview();
    }
    dz.addEventListener("click", () => input.click());
    dz.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
    input.addEventListener("change", () => takeFile(input.files[0]));
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.dataset.over = "true"; });
    dz.addEventListener("dragleave", () => { dz.dataset.over = "false"; });
    dz.addEventListener("drop", (e) => { e.preventDefault(); dz.dataset.over = "false"; takeFile(e.dataTransfer.files[0]); });
    drawPreview();

    /* --- 公開状態の要約 --- */
    const visValue = () => document.querySelector('input[name="vis"]:checked')?.value ?? "DRAFT";
    const summarize = () => {
      const v = visValue();
      el("register-summary").textContent = v === "PUBLIC" ? "PUBLIC で登録（WORKSに出る）" : `${v} で登録`;
    };
    document.querySelectorAll('input[name="vis"]').forEach((r) => r.addEventListener("change", summarize));
    el("entry-form").addEventListener("input", () => { el("autosave").textContent = "入力中"; });
    summarize();

    el("btn-clear-form").addEventListener("click", () => {
      el("entry-form").reset();
      picked = null; chips.tags = [];
      inspect([]); drawChips(); drawPreview(); summarize();
      el("e-date").value = new Date().toISOString().slice(0, 10);
    });

    el("btn-register").addEventListener("click", () => {
      if (!picked) { toast("先に画像を選んでください"); return; }
      const r = store.addWork({
        title: el("e-title").value.trim(),
        mainImage: picked.media,
        altText: el("e-alt").value.trim(),
        createdOn: el("e-date").value,
        category: el("e-cat").value,
        series: el("e-series").value,
        slug: el("e-slug").value.trim(),
        sortOrder: el("e-sort").value,
        tags: [...chips.tags],
        description: el("e-desc").value,
        memo: el("e-memo").value,
        featured: el("e-featured").checked,
        visibility: visValue(),
      });
      if (!r.ok) { toast(r.reason); return; }
      toast(r.persisted ? `「${r.work.title}」を登録しました` : `登録しました（${r.reason}）`);
      el("btn-clear-form").click();
    });
  }

  /* ============ 作品の管理 ============ */
  if (el("works-list")) {
    const search = el("works-search");
    const visSel = el("works-vis");

    const render = () => {
      const q = search.value.trim().toLowerCase();
      const rows = store.mergedWorks().filter((w) => {
        if (visSel.value && w.visibility !== visSel.value) return false;
        if (!q) return true;
        return `${w.title} ${(w.tags ?? []).join(" ")}`.toLowerCase().includes(q);
      });
      el("works-count").textContent = String(rows.length);
      el("works-empty").hidden = rows.length > 0;
      el("works-list").innerHTML = rows.map((w) => `
        <li data-id="${esc(w.id)}">
          <img src="${esc(w.mainImage)}" alt="" width="40" height="40" style="object-fit:cover">
          <span><strong>${esc(w.title)}</strong>
            ${w.featured ? '<span class="tag-chip">FEATURE</span>' : ""}<br>
            <span style="color:var(--c-ink-muted)">${esc(d(w.createdOn))} ・ ${esc(w.category ?? "")}</span></span>
          <span class="vis-pill" data-vis="${esc(w.visibility)}">${esc(w.visibility)}</span>
          <span class="home-slot__actions">
            <button class="btn btn--sm" data-edit="${esc(w.id)}">編集</button>
            <button class="btn btn--sm" data-delete="${esc(w.id)}">削除</button>
          </span>
          <div class="item-edit" id="edit-${esc(w.id)}" hidden></div>
        </li>`).join("");
    };

    const editForm = (w) => `
      <div class="form-row">
        <div class="field"><label>作品名</label><input class="input" data-f="title" value="${esc(w.title)}"></div>
        <div class="field"><label>制作日</label><input class="input" type="date" data-f="createdOn" value="${esc(w.createdOn)}"></div>
        <div class="field"><label>分類</label>
          <select class="select" data-f="category">
            ${store.mergedCategories().map((c) => `<option value="${esc(c.key)}"${w.category === c.key ? " selected" : ""}>${esc(c.name)}</option>`).join("")}
          </select></div>
      </div>
      <div class="form-row">
        <div class="field"><label>シリーズ</label>
          <select class="select" data-f="series">
            <option value="">（なし）</option>
            ${store.mergedSeries().map((s) => `<option value="${esc(s.slug)}"${w.series === s.slug ? " selected" : ""}>${esc(s.name)}</option>`).join("")}
          </select></div>
        <div class="field"><label>公開状態</label>
          <select class="select" data-f="visibility">
            ${VIS.map((v) => `<option value="${v}"${w.visibility === v ? " selected" : ""}>${v}</option>`).join("")}
          </select></div>
        <div class="field"><label>並び順</label><input class="input" type="number" data-f="sortOrder" value="${Number(w.sortOrder) || 0}"></div>
      </div>
      <div class="field"><label>画像の説明（読み上げ用）</label><input class="input" data-f="altText" value="${esc(w.altText ?? "")}"></div>
      <div class="field"><label>作品の文章</label><textarea class="textarea" data-f="description">${esc(w.description ?? "")}</textarea></div>
      <div class="field"><label>タグ（スペース区切り）</label><input class="input" data-f="tags" value="${esc((w.tags ?? []).join(" "))}"></div>
      <label class="check"><input type="checkbox" data-f="featured"${w.featured ? " checked" : ""}> HOMEの特集に出す</label>
      <div class="field"><label>管理メモ</label><textarea class="textarea" data-f="memo">${esc(w.memo ?? "")}</textarea></div>
      <div class="publish-bar">
        <span class="spacer"></span>
        <button class="btn btn--sm" data-cancel="${esc(w.id)}">閉じる</button>
        <button class="btn btn--sm btn--primary" data-save="${esc(w.id)}">保存する</button>
      </div>`;

    el("works-list").addEventListener("click", (e) => {
      const edit = e.target.closest("[data-edit]");
      const save = e.target.closest("[data-save]");
      const cancel = e.target.closest("[data-cancel]");
      const del = e.target.closest("[data-delete]");

      if (edit) {
        const panel = el(`edit-${edit.dataset.edit}`);
        const w = store.workById(edit.dataset.edit);
        if (panel.hidden) { panel.innerHTML = editForm(w); panel.hidden = false; }
        else panel.hidden = true;
        return;
      }
      if (cancel) { el(`edit-${cancel.dataset.cancel}`).hidden = true; return; }
      if (save) {
        const panel = el(`edit-${save.dataset.save}`);
        const v = (f) => panel.querySelector(`[data-f="${f}"]`);
        const r = store.updateWork(save.dataset.save, {
          title: v("title").value.trim(),
          createdOn: v("createdOn").value,
          category: v("category").value,
          series: v("series").value,
          visibility: v("visibility").value,
          sortOrder: Number(v("sortOrder").value) || 0,
          altText: v("altText").value.trim(),
          description: v("description").value,
          tags: v("tags").value.split(/\s+/).filter(Boolean),
          featured: v("featured").checked,
          memo: v("memo").value,
        });
        toast(r.ok ? (r.persisted ? "保存しました" : `保存しました（${r.reason}）`) : r.reason);
        render();
        return;
      }
      if (del) {
        if (!confirmTwice(del, "完全に削除（もう一度押す）")) return;
        store.deleteWork(del.dataset.delete);
        toast("削除しました（元に戻せません）");
        render();
      }
    });

    search.addEventListener("input", render);
    visSel.addEventListener("change", render);
    render();
  }

  /* ============ シリーズ ============ */
  if (el("series-list")) {
    const render = () => {
      const list = store.mergedSeries();
      el("series-list").innerHTML = list.length ? list.map((s) => {
        const count = store.seriesUsage(s.slug);
        return `<li>
          <span class="order">◆</span>
          <span><strong>${esc(s.name)}</strong> <span class="order">${esc(s.slug)}</span><br>
            <span style="color:var(--c-ink-muted)">${esc(s.copy ?? "")}</span></span>
          <span class="order num">${count}</span>
          <span><button class="btn btn--sm" data-del-series="${esc(s.slug)}">削除</button></span>
        </li>`;
      }).join("") : `<li><span class="hint">まだシリーズがありません</span></li>`;
    };

    el("s-add").addEventListener("click", () => {
      const r = store.addSeries({ name: el("s-name").value, copy: el("s-copy").value });
      if (!r.ok) { toast(r.reason); return; }
      toast(r.persisted ? `「${r.series.name}」を追加しました` : `追加しました（${r.reason}）`);
      el("s-name").value = ""; el("s-copy").value = "";
      render();
    });

    el("series-list").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-del-series]");
      if (!btn) return;
      const slug = btn.dataset.delSeries;
      const used = store.seriesUsage(slug);
      if (used && btn.dataset.force !== "yes") {
        btn.dataset.force = "yes";
        btn.textContent = `${used}点の紐付けを外して削除`;
        setTimeout(() => { btn.dataset.force = ""; btn.textContent = "削除"; }, 4000);
        toast(`このシリーズは作品 ${used} 点で使われています`);
        return;
      }
      if (!used && !confirmTwice(btn, "削除（もう一度押す）")) return;
      const r = store.deleteSeries(slug, { force: true });
      toast(r.ok ? `削除しました${r.detached ? `（${r.detached}点の紐付けを外しました）` : ""}` : r.reason);
      render();
    });
    render();
  }

  /* ============ 分類 ============ */
  if (el("cat-list")) {
    const render = () => {
      el("cat-list").innerHTML = store.mergedCategories().map((c) => {
        const count = store.categoryUsage(c.key);
        return `<li>
          <span class="order">◆</span>
          <span><strong>${esc(c.name)}</strong> ${c.jp ? `<span class="order">${esc(c.jp)}</span>` : ""}</span>
          <span class="order num">${count}</span>
          <span><button class="btn btn--sm" data-del-cat="${esc(c.key)}">削除</button></span>
        </li>`;
      }).join("");
    };

    el("cat-add").addEventListener("click", () => {
      const r = store.addCategory({ name: el("c-name").value, jp: el("c-jp").value });
      if (!r.ok) { toast(r.reason); return; }
      toast(r.persisted ? `「${r.category.name}」を追加しました` : `追加しました（${r.reason}）`);
      el("c-name").value = ""; el("c-jp").value = "";
      render();
    });

    el("cat-list").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-del-cat]");
      if (!btn) return;
      const key = btn.dataset.delCat;
      const used = store.categoryUsage(key);
      if (used && btn.dataset.force !== "yes") {
        btn.dataset.force = "yes";
        btn.textContent = `${used}点を別の分類へ移して削除`;
        setTimeout(() => { btn.dataset.force = ""; btn.textContent = "削除"; }, 4000);
        toast(`この分類の作品が ${used} 点あります`);
        return;
      }
      if (!used && !confirmTwice(btn, "削除（もう一度押す）")) return;
      const r = store.deleteCategory(key, { force: true });
      toast(r.ok ? `削除しました${r.moved ? `（${r.moved}点を移しました）` : ""}` : r.reason);
      render();
    });
    render();
  }

  /* ============ HOMEの編集 ============ */
  if (el("home-editor")) {
    const LAYOUTS = [
      ["hero", "キービジュアル"],
      ["feature", "FEATURE（1点を大きく）"],
      ["details", "DETAILS（部分を切り取った帯）"],
      ["new", "SELECTED（非対称の4枠）"],
      ["spotlight", "SPOTLIGHT（横幅いっぱい）"],
      ["colorstory", "（旧）色でまとめる"],
      ["archive", "（旧）モザイク"],
    ];
    const RATIOS = [
      ["box", "5:4"], ["wide", "16:9"], ["cinema", "2:1"],
      ["square", "1:1"], ["tall", "4:5"], ["portrait", "3:4"],
    ];
    const LINKS = [["/works/", "WORKS"], ["/series/", "SERIES"]];
    const open = new Set();

    const mediaSelect = (attrs, value) => {
      const lib = store.mediaLibrary();
      const known = lib.some((m) => m.value === value);
      return `<select class="select" ${attrs}>
        <option value="">（画像なし）</option>
        ${lib.map((m) => `<option value="${esc(m.value)}"${m.value === value ? " selected" : ""}>${esc(m.label)}</option>`).join("")}
        ${!known && value ? `<option value="${esc(value)}" selected>アップロードした画像</option>` : ""}
      </select>`;
    };

    /** 文字を置く場所。9つの押しボタンと、細かく決めるつまみ */
    const SPOTS = [
      ["左上", 0, 0], ["中央上", 50, 0], ["右上", 100, 0],
      ["左", 0, 50], ["中央", 50, 50], ["右", 100, 50],
      ["左下", 0, 100], ["中央下", 50, 100], ["右下", 100, 100],
    ];
    /** 数値のつまみ1行 */
    const rangeRow = (label, key, value, min, max, step, unit) => `
      <div class="range-row"><span>${label}</span>
        <input type="range" min="${min}" max="${max}" step="${step}" value="${value}" data-s="${key}">
        <span class="num" data-out="${key}" data-unit="${unit}">${value}${unit}</span></div>`;

    /** 押しボタンの並び1行 */
    const segRow = (label, key, value, options) => `
      <div class="range-row"><span>${label}</span>
        <span class="seg">
          ${options.map(([v, l]) => `<button class="seg__btn" type="button" data-s-set="${key}"
            data-value="${v}" aria-pressed="${String(value) === String(v)}">${l}</button>`).join("")}
        </span></div>`;

    const numOf = (v, fallback) => (Number.isFinite(Number(v)) ? Number(v) : fallback);

    const textPlaceRows = (o) => {
      const tx = numOf(o.tx, 0), ty = numOf(o.ty, 100), tw = numOf(o.tw, 62);
      const align = o.align || "left";
      return `
      <fieldset class="place">
        <legend>文字の位置</legend>
        <div class="place__grid">
          ${SPOTS.map(([label, x, y]) => `<button class="place__spot" type="button" title="${label}"
            data-spot="${x},${y}" aria-label="${label}に置く"
            aria-pressed="${tx === x && ty === y}"></button>`).join("")}
        </div>
        <div class="place__ranges">
          ${rangeRow("左右", "tx", tx, 0, 100, 0.5, "%")}
          ${rangeRow("上下", "ty", ty, 0, 100, 0.5, "%")}
          ${rangeRow(o.tvert ? "文字の長さ" : "文字の幅", "tw", tw, 10, 100, 0.5, "%")}
          ${segRow("行のそろえ", "align", align, [["left", "左"], ["center", "中"], ["right", "右"]])}
        </div>
      </fieldset>
      <fieldset class="place">
        <legend>文字の組み</legend>
        <div class="place__ranges">
          ${rangeRow("大きさ", "tsize", numOf(o.tsize, 100), 40, 260, 1, "%")}
          ${rangeRow("字間", "tls", numOf(o.tls, -2), -8, 40, 0.5, "")}
          ${rangeRow("行間", "tlh", numOf(o.tlh, 95), 70, 240, 1, "%")}
          ${rangeRow("傾き", "trot", numOf(o.trot, 0), -20, 20, 0.5, "°")}
          ${segRow("流れ", "tvert", o.tvert ? "1" : "", [["", "横書き"], ["1", "縦書き"]])}
          ${segRow("読みやすく", "tplate", o.tplate || "none",
            [["none", "なし"], ["veil", "うすい膜"], ["band", "帯"]])}
          ${segRow("置ける範囲", "tfull", o.tfull ? "1" : "",
            [["", "ヘッダーを避ける"], ["1", "画面いっぱい"]])}
        </div>
      </fieldset>`;
    };

    const focusRows = (o) => {
      const [fx, fy] = String(o.focus || "50% 40%").split(" ").map((v) => parseInt(v, 10) || 50);
      return `
      <div class="range-row"><span>見せる位置（左右）</span>
        <input type="range" min="0" max="100" value="${fx}" data-s-focus="x"><span class="num">${fx}%</span></div>
      <div class="range-row"><span>見せる位置（上下）</span>
        <input type="range" min="0" max="100" value="${fy}" data-s-focus="y"><span class="num">${fy}%</span></div>`;
    };

    /** 編集ステージ。公開ページと同じ1枚を出し、その上でつかんで動かす */
    const stage = (slide) => `
      <div class="edit-stage" data-stage data-mode="text" data-view="pc">
        <div class="edit-stage__bar">
          <span class="seg">
            <button class="seg__btn" type="button" data-stage-mode="text" aria-pressed="true">文字を動かす</button>
            <button class="seg__btn" type="button" data-stage-mode="image" aria-pressed="false">絵を動かす</button>
          </span>
          <span class="seg">
            <button class="seg__btn" type="button" data-stage-view="pc" aria-pressed="true">PC</button>
            <button class="seg__btn" type="button" data-stage-view="sp" aria-pressed="false">スマホ</button>
          </span>
          <span class="spacer"></span>
          <span class="zoom">
            <button class="btn btn--sm" type="button" data-zoom="-1" aria-label="縮小">−</button>
            <span class="num" data-stage-zoom>${Math.round((slide.zoom || 1) * 100)}%</span>
            <button class="btn btn--sm" type="button" data-zoom="1" aria-label="拡大">＋</button>
          </span>
          <span class="num edit-stage__read" data-stage-read></span>
        </div>
        <div class="edit-stage__frame" data-stage-frame>
          ${home.slideHTML(slide, { url })}
        </div>
        <p class="hint" data-stage-hint>文字をつかんで動かせます。角をひくと幅が変わります。</p>
      </div>`;

    const slideForm = (slot, slide, i, total) => `
      <article class="home-slide" data-slide="${esc(slide.id)}">
        <header class="home-slot__head">
          <span class="home-slot__no num">${i + 1}</span>
          ${slide.media ? `<img class="home-slot__thumb" src="${esc(url(slide.media))}" alt="">` : `<span class="home-slot__thumb"></span>`}
          <span class="home-slot__title"><strong>${esc(slide.title || slide.eyebrow || "（文字なし）")}</strong>
            ${slide.media ? "" : '<span class="tag-chip">画像なし</span>'}</span>
          <span class="home-slot__actions">
            <button class="btn btn--sm" data-slide-move="-1" aria-label="前へ">↑</button>
            <button class="btn btn--sm" data-slide-move="1" aria-label="後ろへ">↓</button>
            ${total > 1 ? '<button class="btn btn--sm" data-slide-drop>削除</button>' : ""}
          </span>
        </header>
        <div class="home-slot__body">
          ${stage(slide)}
          <div class="form-row">
            <div class="field"><label>PC用の画像</label>${mediaSelect('data-s="media"', slide.media)}
              <input type="file" accept="image/*" data-s-file="media" class="input" style="padding:var(--s-1)"></div>
            <div class="field"><label>スマホ用の画像</label>${mediaSelect('data-s="mediaMobile"', slide.mediaMobile)}
              <input type="file" accept="image/*" data-s-file="mediaMobile" class="input" style="padding:var(--s-1)"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>小見出し</label><input class="input" data-s="eyebrow" value="${esc(slide.eyebrow ?? "")}"></div>
            <div class="field"><label>作品名</label><input class="input" data-s="title" value="${esc(slide.title ?? "")}"></div>
            <div class="field"><label>補足（年など）</label><input class="input" data-s="subtitle" value="${esc(slide.subtitle ?? "")}"></div>
          </div>
          <div class="form-row">
            <div class="field"><label>リンク先</label>
              <select class="select" data-s="href">
                ${LINKS.map(([v, l]) => `<option value="${esc(v)}"${slide.href === v ? " selected" : ""}>${esc(l)}</option>`).join("")}
              </select></div>
            <div class="field"><label>リンクの文字</label><input class="input" data-s="linkLabel" value="${esc(slide.linkLabel ?? "")}"></div>
            <div class="field"><label>ヘッダーの文字色</label>
              <select class="select" data-s="tone">
                <option value="dark"${slide.tone !== "light" ? " selected" : ""}>BLACK（明るい絵）</option>
                <option value="light"${slide.tone === "light" ? " selected" : ""}>WHITE（暗い絵）</option>
              </select></div>
          </div>
          <div class="color-row">
            <label>背景色 <input type="color" data-s="bg" value="${esc(slide.bg || "#FFF9FC")}"></label>
            <label>文字色 <input type="color" data-s="fg" value="${esc(slide.fg || "#171417")}"></label>
            <label class="check"><input type="checkbox" data-s="showText"${slide.showText !== false ? " checked" : ""}> 文字を出す</label>
          </div>
          <details class="fine">
            <summary>数値で決める</summary>
            ${focusRows(slide)}
            ${textPlaceRows(slide)}
          </details>
        </div>
      </article>`;

    /** 作品を選ぶ入れ物。空なら自動で選ぶ */
    const workSelect = (attrs, value, auto) => {
      const list = store.publicWorks();
      return `<select class="select" ${attrs}>
        <option value="">${esc(auto)}</option>
        ${list.map((w) => `<option value="${esc(w.id)}"${w.id === value ? " selected" : ""}
          >${esc(w.title)}</option>`).join("")}
      </select>`;
    };

    const optionRow = (label, inner) => `<div class="field"><label>${label}</label>${inner}</div>`;

    const selectOf = (attrs, options, value, auto) => `<select class="select" ${attrs}>
      ${auto != null ? `<option value="">${esc(auto)}</option>` : ""}
      ${options.map(([v, l]) => `<option value="${esc(v)}"${String(value) === String(v) ? " selected" : ""}
        >${esc(l)}</option>`).join("")}
    </select>`;

    /**
     * キービジュアル以外の区画。
     * 中身は登録した作品から拾うので、ここでは「どれを・どの形で見せるか」を決める。
     */
    const sectionForm = (slot) => {
      const tags = [...new Set(store.mergedWorks().flatMap((w) => w.tags ?? []))];
      const picks = Array.isArray(slot.pickIds) ? slot.pickIds : [];
      const SHAPES = ["大きな縦長", "横長 その1", "横長 その2", "正方形"];

      const perLayout = {
        feature: `
        <div class="form-row">
          ${optionRow("大きく見せる作品", workSelect('data-h="workId"', slot.workId, "（おすすめ→最新の順に自動）"))}
          ${optionRow("絵の形", selectOf('data-h="ratio"', RATIOS, slot.ratio, "5:4（既定）"))}
        </div>
        <div class="form-row">
          ${optionRow("絵を置く側", selectOf('data-h="side"', [["right", "左に絵・右に文字"], ["left", "右に絵・左に文字"]], slot.side || "right"))}
          ${optionRow("文字の高さ", selectOf('data-h="valign"', [["bottom", "下ぞろえ"], ["center", "中ほど"], ["top", "上ぞろえ"]], slot.valign || "bottom"))}
        </div>
        <details class="fine"><summary>絵の見せる位置</summary>${focusRows(slot)}</details>`,

        details: `
        <div class="form-row">
          ${optionRow("枡の数", selectOf('data-h="count"', [["4", "4つ"], ["6", "6つ"], ["8", "8つ"]], slot.count || 6))}
          ${optionRow("元にする作品", selectOf('data-h="tag"', tags.map((t) => [t, t]), slot.tag, "（すべての絵から）"))}
        </div>
        <p class="hint">枡ごとに比率と切り取る場所が変わります。</p>`,

        new: `
        <div class="form-row">
          ${SHAPES.map((label, i) => optionRow(label,
            workSelect(`data-h="pick${i}"`, picks[i] ?? "", "（新しい順に自動）"))).join("")}
        </div>`,

        spotlight: `
        <div class="form-row">
          ${optionRow("特集する作品", workSelect('data-h="workId"', slot.workId, "（シリーズを使う）"))}
          ${optionRow("特集するシリーズ", selectOf('data-h="seriesSlug"',
            store.mergedSeries().map((x) => [x.slug, x.name]), slot.seriesSlug, "（自動で選ぶ）"))}
        </div>
        <div class="form-row">
          ${optionRow("絵の形", selectOf('data-h="ratio"', RATIOS, slot.ratio, "4:3（既定）"))}
          ${optionRow("文字を置く側", selectOf('data-h="side"', [["right", "左に絵・右に文字"], ["left", "右に絵・左に文字"]], slot.side || "right"))}
        </div>
        <div class="color-row">
          <label>背景色 <input type="color" data-h="bg" value="${esc(slot.bg || "#171417")}"></label>
          <label>文字色 <input type="color" data-h="fg" value="${esc(slot.fg || "#FFFFFF")}"></label>
        </div>
        <details class="fine"><summary>絵の見せる位置</summary>${focusRows(slot)}</details>`,

        colorstory: `
        <div class="field"><label>まとめるタグ</label>
          ${selectOf('data-h="tag"', tags.map((t) => [t, t]), slot.tag, "（すべての作品から）")}</div>`,

        archive: "",
      };

      return `
      <div class="form-row">
        ${optionRow("見せ方", `<select class="select" data-h="layout">
          ${LAYOUTS.filter(([v]) => v !== "hero").map(([v, l]) =>
            `<option value="${v}"${slot.layout === v ? " selected" : ""}>${esc(l)}</option>`).join("")}
        </select>`)}
        ${optionRow("見出し（英字）", `<input class="input" data-h="title" value="${esc(slot.title ?? "")}">`)}
        ${optionRow("リンクの文字", `<input class="input" data-h="linkLabel" value="${esc(slot.linkLabel ?? "")}">`)}
      </div>
      ${perLayout[slot.layout] ?? ""}
      <div class="color-row">
        <label class="check"><input type="checkbox" data-h="published"${slot.published !== false ? " checked" : ""}> HOMEに表示する</label>
      </div>
      <div>
        <p class="hint">プレビュー（公開ページと同じ組み）</p>
        <div class="home-preview"><div class="home-preview__page">${home.homeSlotHTML(slot, {
          url, works: store.publicWorks(), series: store.mergedSeries(), slots: store.homeSlotsAll(),
        }) || '<p class="coming">作品が増えると、ここに出ます</p>'}</div></div>
      </div>`;
    };

    const form = (slot) => {
      if (slot.layout !== "hero") return sectionForm(slot);
      const slides = slot.slides ?? [];
      return `
      <p class="hint">1枚ずつ切り替わります。上から順に出ます。</p>
      <div class="home-slides">${slides.map((sl, i) => slideForm(slot, sl, i, slides.length)).join("")}</div>
      <div class="publish-bar">
        <button class="btn btn--sm" type="button" data-slide-add>＋ 1枚ふやす</button>
        <span class="spacer"></span>
        <label class="check"><input type="checkbox" data-h="autoplay"${slot.autoplay ? " checked" : ""}> 自動送り</label>
        <label class="check">間隔
          <input class="input" type="number" min="2" max="30" style="width:5rem" data-h="interval"
                 value="${Number(slot.interval) || 6}"> 秒</label>
        <label class="check"><input type="checkbox" data-h="published"${slot.published !== false ? " checked" : ""}> HOMEに表示する</label>
      </div>`;
    };

    /** 入力のたびに描き直すので、打っていた場所へカーソルを戻す */
    const keepFocus = (redraw) => {
      const box = el("home-editor");
      const a = document.activeElement;
      const spot = box.contains(a) && a !== box ? {
        slot: a.closest(".home-slot")?.dataset.id,
        slide: a.closest(".home-slide")?.dataset.slide,
        key: a.dataset.s ?? a.dataset.h ?? "",
        pos: (() => { try { return a.selectionStart; } catch { return null; } })(),
      } : null;
      redraw();
      if (!spot?.slot) return;
      const scope = spot.slide
        ? box.querySelector(`.home-slot[data-id="${spot.slot}"] .home-slide[data-slide="${spot.slide}"]`)
        : box.querySelector(`.home-slot[data-id="${spot.slot}"]`);
      const back = scope?.querySelector(`[data-s="${spot.key}"],[data-h="${spot.key}"]`);
      if (!back) return;
      back.focus();
      if (spot.pos != null) { try { back.setSelectionRange(spot.pos, spot.pos); } catch { /* 位置を持たない入力もある */ } }
    };

    const render = () => keepFocus(() => {
      const slots = store.homeSlotsAll();
      el("home-editor").innerHTML = slots.map((slot, i) => `
        <article class="home-slot" data-id="${esc(slot.id)}" data-published="${slot.published !== false}">
          <header class="home-slot__head">
            <span class="home-slot__no num">${String(i + 1).padStart(2, "0")}</span>
            ${(() => { const m = slot.layout === "hero" ? (slot.slides ?? []).find((x) => x.media)?.media : "";
              return m ? `<img class="home-slot__thumb" src="${esc(url(m))}" alt="">` : `<span class="home-slot__thumb"></span>`; })()}
            <span class="home-slot__title">
              <strong>${esc(slot.layout === "hero" ? "キービジュアル" : (slot.title || "（無題）"))}</strong>
              ${slot.layout === "hero" ? `<span class="tag-chip">${(slot.slides ?? []).length}枚</span>` : ""}
              <span class="tag-chip">${esc(LAYOUTS.find((l) => l[0] === slot.layout)?.[1] ?? slot.layout)}</span>
              ${slot.published === false ? '<span class="tag-chip">非公開</span>' : ""}
            </span>
            <span class="home-slot__actions">
              <button class="btn btn--sm" data-move="-1" data-id="${esc(slot.id)}" aria-label="上へ">↑</button>
              <button class="btn btn--sm" data-move="1" data-id="${esc(slot.id)}" aria-label="下へ">↓</button>
              <button class="btn btn--sm" data-toggle="${esc(slot.id)}">${slot.published === false ? "公開する" : "非公開にする"}</button>
              <button class="btn btn--sm" data-open="${esc(slot.id)}">${open.has(slot.id) ? "閉じる" : "編集"}</button>
              <button class="btn btn--sm" data-drop="${esc(slot.id)}">削除</button>
            </span>
          </header>
          <div class="home-slot__body"${open.has(slot.id) ? "" : " hidden"}>${open.has(slot.id) ? form(slot) : ""}</div>
        </article>`).join("");
      el("home-editor").querySelectorAll("[data-stage]").forEach(decorate);
      fitPreviews();
    });

    /** 公開ページの幅で組んだプレビューを、枠に収まるまで縮める */
    function fitPreviews() {
      for (const box of el("home-editor").querySelectorAll(".home-preview")) {
        const page = box.querySelector(".home-preview__page");
        if (!page) continue;
        // 幅にも高さにも収まるところまで縮める（切らずに全部見せる）
        const MAX_H = 460;
        page.style.transform = "none";
        const tall = page.scrollHeight || 1;
        const scale = Math.min(1, (box.clientWidth || 1) / 1280, MAX_H / tall);
        page.style.transform = `scale(${scale})`;
        box.style.height = `${Math.round(tall * scale)}px`;
      }
    }
    addEventListener("resize", fitPreviews, { passive: true });

    /** ステージの中の文字に、つかむための取っ手を足す */
    function decorate(stageEl) {
      const type = stageEl.querySelector(".kv__type");
      if (type && !type.querySelector("[data-stage-handle]")) {
        type.tabIndex = 0;
        type.setAttribute("role", "application");
        type.setAttribute("aria-label", "文字の位置。つかんで動かすか、矢印キーで動かします");
        const h = document.createElement("span");
        h.className = "edit-stage__handle";
        h.setAttribute("data-stage-handle", "");
        h.title = "幅を変える";
        type.appendChild(h);
      }
      readout(stageEl);
    }

    const slotOf = (id) => store.homeSlotsAll().find((s) => s.id === id);
    const patch = (id, p) => { store.updateHomeSlot(id, p); render(); };

    const idsOf = (stageEl) => ({
      slot: stageEl.closest(".home-slot").dataset.id,
      slide: stageEl.closest(".home-slide").dataset.slide,
    });
    const slideData = (stageEl) => {
      const { slot, slide } = idsOf(stageEl);
      return (slotOf(slot)?.slides ?? []).find((x) => x.id === slide) ?? {};
    };

    /** ステージ上の見た目を先に動かし、そのまま保存する */
    const put = (stageEl, p) => {
      const sl = stageEl.querySelector(".kv__slide");
      if ("tx" in p) sl.style.setProperty("--hs-tx", `${p.tx}%`);
      if ("ty" in p) sl.style.setProperty("--hs-ty", `${p.ty}%`);
      if ("tw" in p) sl.style.setProperty("--hs-tw", `${p.tw}%`);
      if ("zoom" in p) sl.style.setProperty("--hs-zoom", String(p.zoom));
      if ("focus" in p) sl.style.setProperty("--hs-focus", p.focus);
      const { slot, slide } = idsOf(stageEl);
      store.updateHomeSlide(slot, slide, p);
      readout(stageEl);
    };

    function readout(stageEl) {
      const s = slideData(stageEl);
      const read = stageEl.querySelector("[data-stage-read]");
      if (read) {
        read.textContent = stageEl.dataset.mode === "image"
          ? `見せる位置 ${s.focus || "50% 40%"}`
          : `左右 ${s.tx ?? 0}% ／ 上下 ${s.ty ?? 100}% ／ 幅 ${s.tw ?? 62}%`;
      }
      const z = stageEl.querySelector("[data-stage-zoom]");
      if (z) z.textContent = `${Math.round((s.zoom || 1) * 100)}%`;
      const box = stageEl.closest(".home-slide");
      const now = {
        tx: s.tx ?? 0, ty: s.ty ?? 100, tw: s.tw ?? 62,
        tsize: s.tsize ?? 100, tls: s.tls ?? -2, tlh: s.tlh ?? 95, trot: s.trot ?? 0,
      };
      for (const [k, v] of Object.entries(now)) {
        const i = box.querySelector(`[data-s="${k}"]`);
        if (i && i.type === "range") i.value = v;
      }
      box.querySelectorAll("[data-out]").forEach((o) => {
        const v = now[o.dataset.out];
        if (v != null) o.textContent = `${v}${o.dataset.unit ?? ""}`;
      });
      box.querySelectorAll("[data-spot]").forEach((b) => {
        const [x, y] = b.dataset.spot.split(",").map(Number);
        b.setAttribute("aria-pressed", String((s.tx ?? 0) === x && (s.ty ?? 100) === y));
      });
      box.querySelectorAll("[data-s-set]").forEach((b) => {
        const k = b.dataset.sSet;
        const cur = k === "align" ? (s.align ?? "left")
          : k === "tplate" ? (s.tplate ?? "none")
          : (s[k] ? "1" : "");
        b.setAttribute("aria-pressed", String(String(cur) === b.dataset.value));
      });
    }

    /* --- クリック --- */
    el("home-editor").addEventListener("click", (e) => {
      const t = (attr) => e.target.closest(`[data-${attr}]`);
      const card = e.target.closest(".home-slot");
      const slideEl = e.target.closest(".home-slide");

      const stageBtn = e.target.closest("[data-stage-mode],[data-stage-view],[data-zoom]");
      if (stageBtn) {
        const st = stageBtn.closest("[data-stage]");
        const mode = stageBtn.dataset.stageMode, view = stageBtn.dataset.stageView, zoom = stageBtn.dataset.zoom;
        if (mode) {
          st.dataset.mode = mode;
          st.querySelectorAll("[data-stage-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.stageMode === mode)));
          st.querySelector("[data-stage-hint]").textContent = mode === "image"
            ? "絵をつかむと見せる位置が動きます。ホイール・2本指・＋−で拡大縮小。"
            : "文字をつかんで動かせます。角をひくと幅が変わります。";
        }
        if (view) {
          st.dataset.view = view;
          st.querySelectorAll("[data-stage-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.stageView === view)));
        }
        if (zoom) {
          const s = slideData(st);
          put(st, { zoom: Math.min(3, Math.max(1, Number(((s.zoom || 1) + Number(zoom) * 0.1).toFixed(2)))) });
        }
        readout(st);
        return;
      }

      const spot = t("spot"), setBtn = e.target.closest("[data-s-set]");
      if (card && slideEl && (spot || setBtn)) {
        const p = spot
          ? { tx: Number(spot.dataset.spot.split(",")[0]), ty: Number(spot.dataset.spot.split(",")[1]) }
          : { [setBtn.dataset.sSet]: setBtn.dataset.value };
        open.add(card.dataset.id);
        store.updateHomeSlide(card.dataset.id, slideEl.dataset.slide, p);
        // 縦書き・敷き・置ける範囲は組み直さないと見た目に出ない
        if (setBtn && ["tvert", "tplate", "tfull"].includes(setBtn.dataset.sSet)) { render(); return; }
        const st = slideEl.querySelector("[data-stage]");
        if (st) {
          const sl = st.querySelector(".kv__slide");
          if ("tx" in p) sl.style.setProperty("--hs-tx", `${p.tx}%`);
          if ("ty" in p) sl.style.setProperty("--hs-ty", `${p.ty}%`);
          if ("align" in p) sl.style.setProperty("--hs-align", p.align);
          readout(st);
        }
        return;
      }

      const add = t("slide-add"), smove = t("slide-move"), sdrop = t("slide-drop");
      if (card && (add || smove || sdrop)) {
        open.add(card.dataset.id);
        if (add) { store.addHomeSlide(card.dataset.id); toast("1枚ふやしました"); }
        if (smove) {
          const r = store.moveHomeSlide(card.dataset.id, slideEl.dataset.slide, Number(smove.dataset.slideMove));
          if (!r.ok) toast(r.reason);
        }
        if (sdrop) {
          if (!confirmTwice(sdrop, "この1枚を削除")) return;
          const r = store.deleteHomeSlide(card.dataset.id, slideEl.dataset.slide);
          toast(r.ok ? "削除しました" : r.reason);
        }
        render();
        return;
      }

      const openBtn = t("open"), drop = t("drop"), toggle = t("toggle"), move = t("move");
      if (openBtn) {
        const id = openBtn.dataset.open;
        open.has(id) ? open.delete(id) : open.add(id);
        render();
      } else if (toggle) {
        patch(toggle.dataset.toggle, { published: slotOf(toggle.dataset.toggle).published === false });
      } else if (move) {
        const r = store.moveHomeSlot(move.dataset.id, Number(move.dataset.move));
        if (!r.ok) toast(r.reason); else render();
      } else if (drop) {
        if (!confirmTwice(drop, "この区画を削除")) return;
        const r = store.deleteHomeSlot(drop.dataset.drop);
        toast(r.ok ? "削除しました" : r.reason);
        render();
      }
    });

    /* --- 入力 --- */
    const NUMERIC = new Set(["tx", "ty", "tw", "interval", "tsize", "tls", "tlh", "trot", "count"]);
    el("home-editor").addEventListener("input", (e) => {
      const card = e.target.closest(".home-slot");
      if (!card) return;
      const slideEl = e.target.closest(".home-slide");
      const t = e.target;
      const axis = t.dataset.sFocus;
      const field = t.dataset.s ?? t.dataset.h;

      let p = null;
      if (axis) {
        const box = (slideEl ?? card).querySelector(".home-slot__body");
        const at = (a) => box.querySelector(`[data-s-focus="${a}"]`).value;
        p = { focus: `${at("x")}% ${at("y")}%` };
      } else if (/^pick[0-3]$/.test(field ?? "")) {
        // SELECTED の4枠。決めた並びのまま1つの配列で持つ
        const slot = slotOf(card.dataset.id) ?? {};
        const ids = Array.isArray(slot.pickIds) ? slot.pickIds.slice() : [];
        while (ids.length < 4) ids.push("");
        ids[Number(field.slice(4))] = t.value;
        p = { pickIds: ids };
      } else if (field) {
        p = { [field]: t.type === "checkbox" ? t.checked
          : NUMERIC.has(field) ? Number(t.value)
          : t.value };
      }
      if (!p) return;

      open.add(card.dataset.id);
      if (slideEl) store.updateHomeSlide(card.dataset.id, slideEl.dataset.slide, p);
      else store.updateHomeSlot(card.dataset.id, p);

      // つまみを動かしている間は組み直さず、ステージだけ更新する
      const st = slideEl?.querySelector("[data-stage]");
      if (st && (t.type === "range" || t.type === "color")) {
        const sl = st.querySelector(".kv__slide");
        for (const [k, v] of Object.entries(p)) {
          if (k === "tx" || k === "ty" || k === "tw") sl.style.setProperty(`--hs-${k}`, `${v}%`);
          if (k === "tsize") sl.style.setProperty("--hs-tsize", String(v / 100));
          if (k === "tls") sl.style.setProperty("--hs-tls", `${v / 100}em`);
          if (k === "tlh") sl.style.setProperty("--hs-tlh", String(v / 100));
          if (k === "trot") sl.style.setProperty("--hs-trot", `${v}deg`);
          if (k === "focus") sl.style.setProperty("--hs-focus", v);
          if (k === "bg") sl.style.setProperty("--hs-bg", v);
          if (k === "fg") sl.style.setProperty("--hs-fg", v);
        }
        readout(st);
      } else render();
    });

    /* --- 画像のアップロード --- */
    el("home-editor").addEventListener("change", async (e) => {
      const field = e.target.dataset.sFile;
      if (!field || !e.target.files?.[0]) return;
      const card = e.target.closest(".home-slot");
      const slideEl = e.target.closest(".home-slide");
      const out = await fitImage(e.target.files[0]);
      const media = typeof out === "string" ? out : out?.media;
      if (!media) { toast("この画像は取り込めませんでした"); return; }
      open.add(card.dataset.id);
      const r = store.updateHomeSlide(card.dataset.id, slideEl.dataset.slide, { [field]: media });
      toast(r.persisted ? "画像を差し替えました" : `差し替えました（${r.reason}）`);
      render();
    });

    /* --- つかんで動かす --- */
    let move = null;
    el("home-editor").addEventListener("pointerdown", (e) => {
      const st = e.target.closest("[data-stage]");
      if (!st || e.button !== 0) return;
      const sl = st.querySelector(".kv__slide");
      const area = st.querySelector(".kv__free");
      const type = st.querySelector(".kv__type");
      if (!sl || !area) return;
      const data = slideData(st);

      if (e.target.closest("[data-stage-handle]")) {
        move = { kind: "width", st, area: area.getBoundingClientRect(), x: e.clientX, tw: data.tw ?? 62 };
      } else if (st.dataset.mode === "text" && type && e.target.closest(".kv__type")) {
        move = { kind: "text", st, area: area.getBoundingClientRect(), box: type.getBoundingClientRect(),
          x: e.clientX, y: e.clientY, tx: data.tx ?? 0, ty: data.ty ?? 100 };
      } else if (st.dataset.mode === "image") {
        const [fx, fy] = String(data.focus || "50% 40%").split(" ").map((v) => parseInt(v, 10) || 50);
        move = { kind: "image", st, rect: sl.getBoundingClientRect(), x: e.clientX, y: e.clientY, fx, fy };
      }
      if (!move) return;
      move.id = e.pointerId;
      st.dataset.dragging = move.kind;
      try { st.setPointerCapture(e.pointerId); } catch { /* 掴めない環境もある */ }
      e.preventDefault();
    });

    const near = (v, to, dd = 3) => (Math.abs(v - to) <= dd ? to : v);
    const round = (v) => Math.min(100, Math.max(0, Math.round(v * 10) / 10));

    el("home-editor").addEventListener("pointermove", (e) => {
      if (!move || e.pointerId !== move.id) return;
      const dx = e.clientX - move.x, dy = e.clientY - move.y;
      if (move.kind === "text") {
        const freeW = Math.max(1, move.area.width - move.box.width);
        const freeH = Math.max(1, move.area.height - move.box.height);
        put(move.st, {
          tx: near(round(move.tx + (dx / freeW) * 100), 50),
          ty: near(round(move.ty + (dy / freeH) * 100), 50),
        });
      } else if (move.kind === "width") {
        put(move.st, { tw: Math.min(100, Math.max(10, round(move.tw + (dx / move.area.width) * 100))) });
      } else if (move.kind === "image") {
        put(move.st, {
          focus: `${round(move.fx - (dx / move.rect.width) * 100)}% ${round(move.fy - (dy / move.rect.height) * 100)}%`,
        });
      }
    });

    const endMove = () => {
      if (!move) return;
      try { move.st.releasePointerCapture(move.id); } catch { /* 同上 */ }
      delete move.st.dataset.dragging;
      move = null;
    };
    el("home-editor").addEventListener("pointerup", endMove);
    el("home-editor").addEventListener("pointercancel", endMove);

    el("home-editor").addEventListener("wheel", (e) => {
      const st = e.target.closest("[data-stage]");
      if (!st || st.dataset.mode !== "image") return;
      e.preventDefault();
      const s = slideData(st);
      put(st, { zoom: Math.min(3, Math.max(1, Number(((s.zoom || 1) + (e.deltaY < 0 ? 0.05 : -0.05)).toFixed(2)))) });
    }, { passive: false });

    el("home-editor").addEventListener("keydown", (e) => {
      const st = e.target.closest("[data-stage]");
      if (!st || !/^Arrow/.test(e.key) || !e.target.closest(".kv__type")) return;
      const s = slideData(st);
      const step = e.shiftKey ? 5 : 1;
      const dd = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (!dd) return;
      e.preventDefault();
      put(st, { tx: round((s.tx ?? 0) + dd[0]), ty: round((s.ty ?? 100) + dd[1]) });
    });

    el("home-add").addEventListener("click", () => {
      const r = store.addHomeSlot();
      open.add(r.slot.id);
      toast("区画を追加しました（非公開の状態です）");
      render();
    });
    el("home-reset").addEventListener("click", (e) => {
      if (!confirmTwice(e.currentTarget, "初期状態に戻す（もう一度押す）")) return;
      store.resetHome();
      toast("HOMEを初期状態に戻しました");
      render();
    });

    render();
  }

  /* ============ 最下部のロゴ ============ */
  if (el("brand-logo-field")) {
    const preview = el("brand-logo-preview");
    const paint = () => {
      const src = store.brandLogo();
      preview.innerHTML = src ? `<img src="${esc(src)}" alt="いま使っているロゴ">`
        : `<span class="hint">いまは文字で組んでいます</span>`;
    };
    el("brand-logo-file").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const data = await readImage(file);
      if (!data) { toast("この画像は取り込めませんでした"); return; }
      const r = store.setBrandLogo(data);
      toast(r.persisted ? "ロゴを差し替えました" : `差し替えました（${r.reason}）`);
      paint();
    });
    el("brand-logo-clear").addEventListener("click", () => {
      store.setBrandLogo("");
      toast("文字のロゴに戻しました");
      paint();
    });
    paint();
  }

  /* ============ サイトの文字 ============ */
  if (el("texts-list")) {
    const frame = el("texts-frame");
    const list = el("texts-list");
    const pages = el("texts-pages");
    let rows = [];
    let page = "/";

    const ask = (msg) => { try { frame.contentWindow.postMessage(msg, "*"); } catch { /* まだ読み込み中 */ } };
    // 編集用のファイルからは、公開用のファイルを枠に出して直す
    const pageURL = (p) => (window.PINK_SINGLE
      ? `${window.PINK_PUBLIC ?? ""}#${p}`
      : url(p));
    const ALIGN = [["", "自動"], ["left", "左"], ["center", "中"], ["right", "右"]];

    const draw = () => {
      if (!rows.length) { list.innerHTML = `<p class="hint">このページに直せる文字はありません。</p>`; return; }
      list.innerHTML = rows.map((r, i) => `
        <div class="text-row${r.hidden ? " is-off" : ""}${r.edited ? " is-edited" : ""}" data-i="${i}">
          <div class="text-row__head">
            <span class="tag-chip">${esc(r.where)}</span>
            ${r.edited ? '<span class="tag-chip">変更あり</span>' : ""}
            ${r.hidden ? '<span class="tag-chip">非表示</span>' : ""}
            <span class="spacer"></span>
            <span class="seg seg--tight">
              ${ALIGN.map(([v, l]) => `<button class="seg__btn" type="button" data-align="${v}"
                aria-pressed="${(r.align || "") === v}" title="そろえ：${l}">${l}</button>`).join("")}
            </span>
            <button class="btn btn--sm" type="button" data-act="mark" title="この文字の場所を示す">位置</button>
            <button class="btn btn--sm" type="button" data-act="toggle">${r.hidden ? "出す" : "消す"}</button>
            <button class="btn btn--sm" type="button" data-act="reset"${r.edited ? "" : " disabled"}>戻す</button>
          </div>
          <textarea class="textarea" data-act="text" rows="${r.text.length > 40 ? 3 : 1}">${esc(r.text)}</textarea>
        </div>`).join("");
    };

    const rowOf = (t) => {
      const box = t.closest(".text-row");
      return box ? rows[Number(box.dataset.i)] : null;
    };
    const saveText = (r, p) => { store.updateText(r.key, p); ask({ pinkTexts: "refresh" }); };

    list.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      const r = rowOf(e.target);
      if (!btn || !r) return;
      if (btn.dataset.align !== undefined) saveText(r, { align: btn.dataset.align || undefined });
      else if (btn.dataset.act === "toggle") saveText(r, { hidden: !r.hidden || undefined });
      else if (btn.dataset.act === "reset") { store.resetText(r.key); ask({ pinkTexts: "refresh" }); }
      else if (btn.dataset.act === "mark") ask({ pinkTexts: "mark", key: r.key });
    });

    let typing = null;
    list.addEventListener("input", (e) => {
      const r = rowOf(e.target);
      if (!r || e.target.dataset.act !== "text") return;
      r.text = e.target.value;
      clearTimeout(typing);
      typing = setTimeout(() => { store.updateText(r.key, { text: r.text }); ask({ pinkTexts: "refresh" }); }, 250);
    });

    pages.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-page]");
      if (!btn) return;
      page = btn.dataset.page;
      pages.querySelectorAll("[data-page]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      list.innerHTML = `<p class="hint">読み込み中…</p>`;
      frame.src = pageURL(page);
    });

    el("texts-reset").addEventListener("click", (e) => {
      if (!confirmTwice(e.currentTarget, "文字の編集を取り消す（もう一度押す）")) return;
      store.resetTexts();
      ask({ pinkTexts: "refresh" });
      toast("文字を元に戻しました");
    });

    addEventListener("message", (e) => {
      const msg = e.data;
      if (!msg || !msg.pinkTexts) return;
      if (msg.pinkTexts === "ready") ask({ pinkTexts: "collect" });
      if (msg.pinkTexts === "list") {
        const editing = document.activeElement?.dataset?.act === "text"
          ? Number(document.activeElement.closest(".text-row").dataset.i) : -1;
        const keep = editing >= 0 ? rows[editing] : null;
        rows = msg.rows;
        if (keep) { const same = rows.findIndex((r) => r.key === keep.key); if (same >= 0) rows[same].text = keep.text; }
        if (editing >= 0) {
          rows.forEach((r, i) => {
            const box = list.querySelector(`.text-row[data-i="${i}"]`);
            if (box) box.classList.toggle("is-off", r.hidden);
          });
          return;
        }
        draw();
      }
    });

    frame.src = pageURL(page);
  }
})();
</script>
