        <div class="field"><label>サブタイトル</label><input class="input" data-h="subtitle" value="${esc(slot.subtitle ?? "")}"></div>
        <div class="field"><label>リンク先</label>
          <select class="select" data-h="href">
            ${LINKS.map(([v, l]) => `<option value="${esc(v)}"${slot.href === v ? " selected" : ""}>${esc(l)}</option>`).join("")}
          </select></div>
        <div class="field"><label>リンクの文字</label><input class="input" data-h="linkLabel" value="${esc(slot.linkLabel ?? "")}"></div>
      </div>
      <div class="field"><label>短いコピー</label>
        <textarea class="textarea" data-h="copy" style="min-height:64px">${esc(slot.copy ?? "")}</textarea></div>

      <div class="form-row">
        <div class="field"><label>PC用の画像</label>${mediaSelect('data-h="media"', slot.media)}
          <input type="file" accept="image/*" data-h-file="media" class="input" style="padding:var(--s-1)"></div>
        <div class="field"><label>スマートフォン用の画像</label>${mediaSelect('data-h="mediaMobile"', slot.mediaMobile)}
          <input type="file" accept="image/*" data-h-file="mediaMobile" class="input" style="padding:var(--s-1)"></div>
      </div>
      ${slot.layout === "editorial" ? `
      <div class="form-row">
        <div class="field"><label>2枚目の画像</label>${mediaSelect('data-h="media2"', slot.media2)}</div>
        <div class="field"><label>3枚目の画像</label>${mediaSelect('data-h="media3"', slot.media3)}</div>
      </div>` : ""}
      ${focusRows("data-h", slot)}
      <fieldset class="place">
        <legend>文字の位置</legend>
        <div class="form-row">
          <div class="field"><label>左右</label>
            <select class="select" data-h="ax">
              ${[["start", "左に寄せる"], ["center", "中央"], ["end", "右に寄せる"]].map(([v, l]) =>
                `<option value="${v}"${(slot.ax ?? "start") === v ? " selected" : ""}>${l}</option>`).join("")}
            </select></div>
          <div class="field"><label>上下</label>
            <select class="select" data-h="ay">
              ${[["start", "上に寄せる"], ["center", "中央"], ["end", "下に寄せる"]].map(([v, l]) =>
                `<option value="${v}"${(slot.ay ?? "center") === v ? " selected" : ""}>${l}</option>`).join("")}
            </select></div>
          <div class="field"><label>行のそろえ</label>
            <select class="select" data-h="align">
              ${[["left", "左ぞろえ"], ["center", "中央ぞろえ"], ["right", "右ぞろえ"]].map(([v, l]) =>
                `<option value="${v}"${(slot.align ?? "left") === v ? " selected" : ""}>${l}</option>`).join("")}
            </select></div>
        </div>
      </fieldset>
      <div class="color-row">
        <label>背景色 <input type="color" data-h="bg" value="${esc(slot.bg || "#FFF9FC")}"></label>
        <label>文字色 <input type="color" data-h="fg" value="${esc(slot.fg || "#171417")}"></label>
        <label class="check"><input type="checkbox" data-h="showText"${slot.showText !== false ? " checked" : ""}> 文字を出す</label>
        <label class="check"><input type="checkbox" data-h="published"${slot.published !== false ? " checked" : ""}> HOMEに表示する</label>
      </div>
      <div>
        <p class="hint">プレビュー（上部のみ表示）</p>
        <div class="home-preview">${home.homeSlotHTML(slot, { url })}</div>
      </div>`;
    };

    /** 入力のたびに描き直すので、打っていた場所へカーソルを戻す */
    const keepFocus = (redraw) => {
      const box = el("home-editor");
      const a = document.activeElement;
      const spot = box.contains(a) && a !== box ? {
        slot: a.closest(".home-slot")?.dataset.id,
        slide: a.closest(".home-slide")?.dataset.slide,
        key: a.dataset.s ?? a.dataset.h ?? "",
        focusAxis: a.dataset.sFocus ?? a.dataset.hFocus ?? "",
        pos: (() => { try { return a.selectionStart; } catch { return null; } })(),
      } : null;
      redraw();
      if (!spot?.slot) return;
      const scope = spot.slide
        ? box.querySelector(`.home-slot[data-id="${spot.slot}"] .home-slide[data-slide="${spot.slide}"]`)
        : box.querySelector(`.home-slot[data-id="${spot.slot}"]`);
      const sel = spot.focusAxis
        ? `[data-s-focus="${spot.focusAxis}"],[data-h-focus="${spot.focusAxis}"]`
        : `[data-s="${spot.key}"],[data-h="${spot.key}"]`;
      const back = scope?.querySelector(sel);
      if (!back) return;
      back.focus();
      if (spot.pos != null) { try { back.setSelectionRange(spot.pos, spot.pos); } catch { /* 位置を持たない入力もある */ } }
    };

    const render = () => keepFocus(() => {
      const slots = store.homeSlotsAll();
      el("home-editor").innerHTML = slots.map((slot, i) => `
        <article class="home-slot" data-id="${esc(slot.id)}" data-published="${slot.published !== false}">
          <header class="home-slot__head">
            <span class="home-slot__no num">${String(i + 1).padStart(2, "0")}</span>
            ${(() => { const m = slot.layout === "hero" ? (slot.slides ?? []).find((x) => x.media)?.media : slot.media;
              return m ? `<img class="home-slot__thumb" src="${esc(url(m))}" alt="">` : `<span class="home-slot__thumb"></span>`; })()}
            <span class="home-slot__title">
              <strong>${esc(slot.layout === "hero" ? "キービジュアル" : (slot.title || "（無題）"))}</strong>
              ${slot.layout === "hero" ? `<span class="tag-chip">${(slot.slides ?? []).length}枚</span>` : ""}
              <span class="tag-chip">${esc(LAYOUTS.find((l) => l[0] === slot.layout)?.[1] ?? slot.layout)}</span>
              ${slot.published === false ? '<span class="tag-chip">非公開</span>' : ""}
            </span>
            <span class="home-slot__actions">
              <button class="btn btn--sm" data-move="-1" data-id="${esc(slot.id)}" aria-label="上へ">↑</button>
              <button class="btn btn--sm" data-move="1" data-id="${esc(slot.id)}" aria-label="下へ">↓</button>
              <button class="btn btn--sm" data-toggle="${esc(slot.id)}">${slot.published === false ? "公開する" : "非公開にする"}</button>
              <button class="btn btn--sm" data-open="${esc(slot.id)}">${open.has(slot.id) ? "閉じる" : "編集"}</button>
              <button class="btn btn--sm" data-drop="${esc(slot.id)}">削除</button>
            </span>
          </header>
          <div class="home-slot__body"${open.has(slot.id) ? "" : " hidden"}>${open.has(slot.id) ? form(slot) : ""}</div>
        </article>`).join("");
    });

    const slotOf = (id) => store.homeSlotsAll().find((s) => s.id === id);
    const patch = (id, p) => { store.updateHomeSlot(id, p); render(); };

    /** 枠（またはキービジュアル1枚）へ書き込む */
    const writePatch = (card, slideEl, p) => {
      open.add(card.dataset.id);
      if (slideEl) store.updateHomeSlide(card.dataset.id, slideEl.dataset.slide, p);
      else store.updateHomeSlot(card.dataset.id, p);
    };

    /**
     * つまみを動かしている最中はフォームを組み直さず、
     * プレビューと数値と押しボタンの状態だけを更新する。
     */
    const refresh = (card, slideEl) => {
      const slot = slotOf(card.dataset.id);
      if (!slot) return;
      const box = card.querySelector(".home-preview");
      if (box) box.innerHTML = home.homeSlotHTML(slot, { url });
      const target = slideEl
        ? (slot.slides ?? []).find((x) => x.id === slideEl.dataset.slide)
        : slot;
      const scope = slideEl ?? card;
      if (!target) return;
      const val = { tx: target.tx ?? 0, ty: target.ty ?? 100, tw: target.tw ?? 62 };
      scope.querySelectorAll("[data-out]").forEach((o) => {
        const v = val[o.dataset.out];
        if (v != null) o.textContent = `${Math.round(Number(v))}%`;
      });
      scope.querySelectorAll("[data-spot]").forEach((b) => {
        const [x, y] = b.dataset.spot.split(",").map(Number);
        b.setAttribute("aria-pressed", String(Number(val.tx) === x && Number(val.ty) === y));
      });
      scope.querySelectorAll("[data-s-set],[data-h-set]").forEach((b) => {
        const key = b.dataset.sSet ?? b.dataset.hSet;
        b.setAttribute("aria-pressed", String((target[key] ?? "left") === b.dataset.value));
      });
    };

    el("home-editor").addEventListener("click", (e) => {
      const t = (attr) => e.target.closest(`[data-${attr}]`);
      const card = e.target.closest(".home-slot");
      const slideEl = e.target.closest(".home-slide");
      const add = t("slide-add"), smove = t("slide-move"), sdrop = t("slide-drop");
      if (card && (add || smove || sdrop)) {
        open.add(card.dataset.id);
        if (add) { store.addHomeSlide(card.dataset.id); toast("キービジュアルを追加しました"); }
        if (smove) {
          const r = store.moveHomeSlide(card.dataset.id, slideEl.dataset.slide, Number(smove.dataset.slideMove));
          if (!r.ok) toast(r.reason);
        }
        if (sdrop) {
          if (!confirmTwice(sdrop, "この1枚を削除")) return;
          const r = store.deleteHomeSlide(card.dataset.id, slideEl.dataset.slide);
          toast(r.ok ? "削除しました" : r.reason);
        }
        render();
        return;
      }
      // 文字の位置（9点ボタン / 行のそろえ）はその場で反映し、フォームは組み直さない
      const spot = t("spot"), setBtn = e.target.closest("[data-s-set],[data-h-set]");
      if (card && (spot || setBtn)) {
        const p = spot
          ? { tx: Number(spot.dataset.spot.split(",")[0]), ty: Number(spot.dataset.spot.split(",")[1]) }
          : { [setBtn.dataset.sSet ?? setBtn.dataset.hSet]: setBtn.dataset.value };
        writePatch(card, slideEl, p);
        refresh(card, slideEl);
        return;
      }

      const openBtn = t("open"), drop = t("drop"), toggle = t("toggle"), move = t("move");
      if (openBtn) {
        const id = openBtn.dataset.open;
        open.has(id) ? open.delete(id) : open.add(id);
        render();
      } else if (toggle) {
        patch(toggle.dataset.toggle, { published: slotOf(toggle.dataset.toggle).published === false });
      } else if (move) {
        const r = store.moveHomeSlot(move.dataset.id, Number(move.dataset.move));
        if (!r.ok) toast(r.reason); else render();
      } else if (drop) {
        if (!confirmTwice(drop, "この枠を削除")) return;
        const r = store.deleteHomeSlot(drop.dataset.drop);
        toast(r.ok ? "枠を削除しました" : r.reason);
        render();
      }
    });

    // 入力はその場で保存する（下書きを持たない）
    const NUMERIC = new Set(["tx", "ty", "tw"]);
    el("home-editor").addEventListener("input", (e) => {
      const card = e.target.closest(".home-slot");
      if (!card) return;
      const slideEl = e.target.closest(".home-slide");
      const t = e.target;
      const axis = t.dataset.sFocus ?? t.dataset.hFocus;
      const field = t.dataset.s ?? t.dataset.h;

      let p = null;
      if (axis) {
        const box = (slideEl ?? card).querySelector(".home-slot__body");
        const at = (a) => box.querySelector(`[data-s-focus="${a}"],[data-h-focus="${a}"]`).value;
        p = { focus: `${at("x")}% ${at("y")}%` };
      } else if (field) {
        p = { [field]: t.type === "checkbox" ? t.checked
          : field === "zoom" ? Number(t.value) / 100
          : NUMERIC.has(field) ? Number(t.value)
          : t.value };
      }
      if (!p) return;

      writePatch(card, slideEl, p);
      // つまみを動かしている間に組み直すと指が離れてしまうので、見た目だけ更新する
      if (t.type === "range" || t.type === "color") refresh(card, slideEl);
      else render();
    });

    // 画像のアップロード（この端末に保存される）
    el("home-editor").addEventListener("change", async (e) => {
      const field = e.target.dataset.hFile ?? e.target.dataset.sFile;
      if (!field || !e.target.files?.[0]) return;
      const card = e.target.closest(".home-slot");
      const slideEl = e.target.closest(".home-slide");
      const file = e.target.files[0];
      const data = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      }).catch(() => null);
      if (!data) { toast("この画像は取り込めませんでした"); return; }
      open.add(card.dataset.id);
      const r = slideEl
        ? store.updateHomeSlide(card.dataset.id, slideEl.dataset.slide, { [field]: data })
        : store.updateHomeSlot(card.dataset.id, { [field]: data });
      toast(r.persisted ? "画像を差し替えました" : `差し替えました（${r.reason}）`);
      render();
    });

    el("home-add").addEventListener("click", () => {
      const r = store.addHomeSlot();
      open.add(r.slot.id);
      toast("枠を追加しました（非公開の状態です）");
      render();
    });
    el("home-reset").addEventListener("click", (e) => {
      if (!confirmTwice(e.currentTarget, "初期状態に戻す（もう一度押す）")) return;
      store.resetHome();
      toast("HOMEを初期状態に戻しました");
      render();
    });

    // HOMEの下に置く区画（もくじ・点数）
    const secBox = el("home-sections");
    if (secBox) {
      const paintSections = () => {
        const now = store.homeSectionsAll();
        for (const input of secBox.querySelectorAll("[data-sec]")) {
          input.checked = now[input.dataset.sec] !== false;
        }
      };
      secBox.addEventListener("change", (e) => {
        const key = e.target.dataset.sec;
        if (!key) return;
        const r = store.updateHomeSections({ [key]: e.target.checked });
        toast(r.persisted ? "HOMEに反映しました" : `変えました（${r.reason}）`);
      });
      paintSections();
    }

    render();
  }
})();
</script>
