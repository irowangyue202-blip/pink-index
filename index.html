<script>/**
 * サイト共通の振る舞い。ページ固有の処理は各ページのモジュールに置く。
 *
 * ヘッダーは4つの状態を持つ:
 *   top      先頭。背景は完全に透明で、キービジュアルが背後まで見える
 *   hidden   下へ一定量スクロールした。上へ滑らせて隠す
 *   frosted  途中で上へスクロールした。乳白色＋ぼかし＋薄い下線で戻す
 *   （先頭へ戻ると top に戻る）
 */
(() => {

/* --- メニュー -------------------------------------------- */
const toggle = document.querySelector(".nav-toggle");
const nav = document.getElementById("site-nav");
if (toggle && nav) {
  const label = toggle.querySelector(".nav-toggle__label");
  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    nav.dataset.open = String(!open);
    document.body.dataset.navOpen = String(!open);
    if (label) label.textContent = open ? "MENU" : "CLOSE";
  });
  nav.addEventListener("click", (e) => { if (e.target.tagName === "A") toggle.click(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && nav.dataset.open === "true") { toggle.click(); toggle.focus(); }
  });
}

/* --- ヘッダーの4状態 -------------------------------------- */
const header = document.getElementById("site-header");
if (header) {
  const TOP = 12;        // ここまでは「先頭」とみなす
  const STEP = 8;        // 小さな揺れで反転しないためのしきい値
  const HIDE_AFTER = 220; // これより下でなければ隠さない
  let last = window.scrollY;

  const setState = (state) => {
    if (header.dataset.state !== state) header.dataset.state = state;
  };

  const update = () => {
    const y = window.scrollY;
    const menuOpen = nav?.dataset.open === "true";
    const diff = y - last;

    if (y <= TOP) setState("top");
    else if (menuOpen) setState("frosted");
    else if (diff > STEP && y > HIDE_AFTER) { setState("hidden"); last = y; }
    else if (diff < -STEP) { setState("frosted"); last = y; }
    if (Math.abs(diff) > STEP) last = y;
  };

  // 読むのは scrollY だけなので、そのまま実行してよい（描き直しは起こさない）
  addEventListener("scroll", update, { passive: true });
  update();
}

/* --- トースト -------------------------------------------- */
function toast(message) {
  const region = document.getElementById("toast-region");
  if (!region) return;
  const el = document.createElement("p");
  el.className = "toast";
  el.textContent = message;
  region.append(el);
  setTimeout(() => el.remove(), 3200);
}
window.pinkToast = toast;
})();

/**
 * サイトの文字
 *
 * ページに出ている文字を1つずつ扱えるようにする。
 *   ・保存された書き換え・そろえ・非表示を、読み込み時にあてる
 *   ・管理画面（/studio/texts/）から呼ばれたら、いまの一覧を返す
 *
 * 管理画面はこのページを枠（iframe）の中に置いて編集する。
 * file:// では枠の中を直接読めないため、やり取りは postMessage で行う。
 */
(() => {
  const { store } = window.PINK ?? {};
  if (!store) return;

  /* --- どの文字かを表す鍵 -----------------------------------
     ページの中での位置（親をさかのぼったタグと組の並び）で作る。
     文言そのものを鍵にしないので、書き換えても同じ文字を指し続ける。
     --------------------------------------------------------- */
  const route = () => {
    const h = location.hash.replace(/^#/, "");
    if (h) return h.split("?")[0];
    const p = location.pathname.replace(/index\.html$/, "");
    const i = p.indexOf("/pink-index/");
    return i >= 0 ? p.slice(i + "/pink-index".length) : p;
  };

  const step = (n) => {
    const tag = n.tagName.toLowerCase();
    const cls = (n.getAttribute("class") || "").trim().split(/\s+/).filter(Boolean).slice(0, 2).join(".");
    const sibs = [...(n.parentElement ? n.parentElement.children : [])].filter((x) => x.tagName === n.tagName);
    return tag + (cls ? "." + cls : "") + (sibs.length > 1 ? ":" + sibs.indexOf(n) : "");
  };

  const keyOf = (el) => {
    const parts = [];
    for (let n = el; n && n !== document.body; n = n.parentElement) parts.unshift(step(n));
    return route() + "|" + parts.join(">");
  };

  /* --- 扱う対象 ---------------------------------------------
     読み込み中の演出、支援技術むけの補助テキスト、入力欄、
     HOMEのキービジュアル（HOMEの編集で扱う）は対象にしない。
     --------------------------------------------------------- */
  const SKIP = "#loader, .perimeter, .home-frame, .toast-region, [data-kv], .visually-hidden, [aria-hidden='true'], .studio";
  const targets = () => [...document.querySelectorAll("main *, .site-header *, .site-footer *")]
    .filter((el) => {
      if (el.children.length) return false;
      if (!(el.textContent || "").trim()) return false;
      if (el.closest(SKIP)) return false;
      if (/^(script|style|input|textarea|select|option|svg|path|rect|circle)$/.test(el.tagName.toLowerCase())) return false;
      return true;
    });

  /** 保存されている指定を、いまのページへあてる */
  const apply = () => {
    const over = store.textsAll();
    for (const el of targets()) {
      const o = over[keyOf(el)];
      if (!el.dataset.tOrig) el.dataset.tOrig = el.textContent;
      if (!o) {
        if (el.hidden) el.hidden = false;
        if (el.textContent !== el.dataset.tOrig) el.textContent = el.dataset.tOrig;
        el.style.textAlign = "";
        continue;
      }
      el.hidden = Boolean(o.hidden);
      el.textContent = typeof o.text === "string" ? o.text : el.dataset.tOrig;
      el.style.textAlign = o.align || "";
    }
  };

  /** 管理画面へ渡す一覧 */
  const collect = () => {
    const over = store.textsAll();
    return targets().map((el) => {
      const key = keyOf(el);
      const o = over[key] ?? {};
      return {
        key,
        text: typeof o.text === "string" ? o.text : (el.dataset.tOrig ?? el.textContent),
        original: el.dataset.tOrig ?? el.textContent,
        hidden: Boolean(o.hidden),
        align: o.align || "",
        where: el.closest("header") ? "ヘッダー" : el.closest("footer") ? "フッター" : "本文",
        edited: Boolean(over[key]),
      };
    });
  };

  let marked = null;
  const mark = (key) => {
    if (marked) marked.classList.remove("is-text-marked");
    marked = targets().find((el) => keyOf(el) === key) ?? null;
    if (!marked) return;
    marked.classList.add("is-text-marked");
    marked.scrollIntoView({ block: "center", behavior: "smooth" });
  };

  /** 最下部のロゴを、登録された画像へ差し替える */
  const applyLogo = () => {
    const img = document.getElementById("brand-logo-img");
    const type = document.getElementById("brand-logo-type");
    if (!img || !type) return;
    const src = store.brandLogo();
    img.hidden = !src;
    type.hidden = Boolean(src);
    if (src) img.src = src;
  };

  apply();
  applyLogo();
  window.PINK_TEXTS = { apply, collect, mark, keyOf };

  // 管理画面（親の窓）とのやり取り
  addEventListener("message", (e) => {
    const msg = e.data;
    if (!msg || msg.pinkTexts === undefined) return;
    if (msg.pinkTexts === "collect") {
      e.source.postMessage({ pinkTexts: "list", route: route(), rows: collect() }, "*");
    } else if (msg.pinkTexts === "refresh") {
      store.reload();          // 管理画面が保存した内容を読み直す
      apply();
      applyLogo();
      e.source.postMessage({ pinkTexts: "list", route: route(), rows: collect() }, "*");
    } else if (msg.pinkTexts === "mark") {
      mark(msg.key);
    }
  });

  // 親から見えるよう、読み込みが終わったことを伝える
  try { parent !== window && parent.postMessage({ pinkTexts: "ready", route: route() }, "*"); } catch { /* 単独で開いたとき */ }
})();

/**
 * 初回ローディング演出。
 *
 * 設計上の要点（企画書 5.3 / 5.4）:
 * - 実際の読み込み進捗で数字を進める（偽のアニメーションにしない）
 * - 外周ラインを同じ進捗率で時計回りに描き、先端にだけピンクの点を置く
 * - 100%で数字が左右へ離れ、その間からヒーローのイラストが現れる
 * - 外周ラインはフェードアウトせず、ホームの枠線へ縮んで接続する
 * - 同一セッションでは初回のみフル演出
 * - 進捗が取れない場合も 99% で止めず、最大待機時間でホームへ進める
 */
(() => {
const loader = document.getElementById("loader");
const perimeter = document.getElementById("perimeter");
if (loader) {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const seen = (() => { try { return sessionStorage.getItem("pinkindex.loader.seen") === "1"; } catch { return false; } })();
  const d1 = document.getElementById("loader-d1");
  const d2 = document.getElementById("loader-d2");
  const status = document.getElementById("loader-status");
  const svg = document.getElementById("perimeter-svg");
  const track = document.getElementById("perimeter-track");
  const lineRect = document.getElementById("perimeter-line");
  const tip = document.getElementById("perimeter-tip");
  const homeFrame = document.getElementById("home-frame");

  const MAX_WAIT = 4000;      // これ以上は待たずにホームへ進める
  const MIN_SHOW = seen ? 260 : 900;
  const INSET = 12;           // ホーム側の枠線と同じ内側寸法

  let inset = 0;
  const layout = () => {
    const w = window.innerWidth, h = window.innerHeight;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    for (const r of [track, lineRect]) {
      r.setAttribute("x", inset + 0.5); r.setAttribute("y", inset + 0.5);
      r.setAttribute("width", Math.max(0, w - inset * 2 - 1));
      r.setAttribute("height", Math.max(0, h - inset * 2 - 1));
    }
    return 2 * ((w - inset * 2 - 1) + (h - inset * 2 - 1));
  };
  let perim = layout();
  addEventListener("resize", () => { perim = layout(); draw(shown); }, { passive: true });

  /** 進捗を数字と外周ラインへ反映する */
  let shown = 0;
  const draw = (p) => {
    shown = p;
    const n = Math.round(p * 100);
    const text = String(n).padStart(2, "0");
    d1.textContent = text[0];
    d2.textContent = text.slice(1);
    status.textContent = `サイトを読み込んでいます ${n}%`;
    lineRect.style.strokeDasharray = `${perim}`;
    lineRect.style.strokeDashoffset = `${perim * (1 - p)}`;
    // 先端の点は実際のパス上の座標に置く
    try {
      const pt = lineRect.getPointAtLength(perim * p);
      tip.setAttribute("cx", pt.x); tip.setAttribute("cy", pt.y);
      tip.style.opacity = p > 0.01 && p < 0.999 ? "1" : "0";
    } catch { tip.style.opacity = "0"; }
  };
  draw(0);

  /* --- 実進捗: ファーストビューに必要な画像とフォント ------ */
  const critical = [...document.querySelectorAll('img[fetchpriority="high"], .hero__figure img')];
  const jobs = critical.map((img) => img.complete && img.naturalWidth
    ? Promise.resolve()
    : new Promise((res) => { img.addEventListener("load", res, { once: true }); img.addEventListener("error", res, { once: true }); }));
  if (document.fonts?.ready) jobs.push(document.fonts.ready);
  jobs.push(new Promise((res) => (document.readyState === "complete" ? res() : addEventListener("load", res, { once: true }))));

  let done = 0;
  const total = jobs.length;
  const realProgress = () => Math.min(1, done / total);
  jobs.forEach((j) => j.then(() => { done++; }));

  const started = performance.now();
  let finished = false;

  // 進捗はタイマーで進める。requestAnimationFrame はタブが背面にあると
  // 供給が止まり、ローダーが途中で固まって見えるため、進行の主軸にはしない。
  const TICK = 40;
  const timer = setInterval(() => {
    const elapsed = performance.now() - started;
    // 実進捗を主にしつつ、取得不能なときも時間で補間して 99% 停止を避ける
    const target = Math.max(realProgress(), Math.min(0.92, elapsed / MAX_WAIT));
    const ready = (done >= total && elapsed > MIN_SHOW) || elapsed > MAX_WAIT;
    const next = ready ? shown + 0.08 : shown + (target - shown) * 0.25;
    draw(Math.max(shown, Math.min(1, next)));
    if (ready && shown > 0.985) finish();
  }, TICK);

  // 何が起きても必ずホームへ進める最終防衛線
  const hardStop = setTimeout(finish, MAX_WAIT + 1500);

  function finish() {
    if (finished) return;
    finished = true;
    clearInterval(timer);
    clearTimeout(hardStop);
    draw(1);
    status.textContent = "読み込みが完了しました";
    try { sessionStorage.setItem("pinkindex.loader.seen", "1"); } catch { /* 無視してよい */ }

    if (reduced) {
      // 線描画と数字分割を省略し、短いクロスフェードにする
      loader.dataset.state = "done";
      perimeter.classList.add("perimeter--faded");
      setTimeout(release, 200);
      return;
    }

    loader.dataset.state = "exit";     // 数字が左右へ離れる
    perimeter.classList.add("perimeter--handoff");

    // 外周ラインをホームの枠線位置まで縮め、そのまま静的な枠へ引き継ぐ
    const startTime = performance.now();
    const shrinkTimer = setInterval(() => {
      const t = Math.min(1, (performance.now() - startTime) / 520);
      inset = INSET * (1 - Math.pow(1 - t, 3));
      perim = layout();
      lineRect.style.strokeDasharray = `${perim}`;
      lineRect.style.strokeDashoffset = "0";
      if (t >= 1) {
        clearInterval(shrinkTimer);
        homeFrame?.classList.add("is-on");
        perimeter.classList.add("perimeter--faded");
      }
    }, 24);

    setTimeout(() => { loader.dataset.state = "done"; }, 120);
    setTimeout(release, 900);
  }

  function release() {
    loader.hidden = true;
    perimeter.hidden = true;
    document.body.removeAttribute("data-loading");
    document.dispatchEvent(new CustomEvent("pinkindex:loaded"));
  }
}
})();

/**
 * HOME
 *
 * - 管理画面で組み替えた区画があれば、その並びで描き直す
 * - キービジュアルは1枚ずつ切り替える。矢印・横スワイプ・つかんで振る・
 *   絵の左右半分のクリック・ドット・キーボードのどれでも動く
 * - 表示中の作品に合わせて、ヘッダーの文字色（黒／白）を切り替える
 */
(() => {
  const { store, home, url } = window.PINK ?? {};
  const root = document.getElementById("home-slots");
  if (!root || !store) return;

  // この端末に登録した作品と、組み替えた区画で描き直す。
  // 書き出したデータと同じ内容なら、見た目は変わらない。
  root.innerHTML = home.homeSlotsHTML(store.visibleHomeSlots(), {
    url, works: store.publicWorks(), series: store.mergedSeries(), about: store.about(),
  });

  /* --- 寄ったら短くフェードして現れる ---------------------- */
  const calmMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const targets = [...root.querySelectorAll("[data-reveal]")];
  if (targets.length && "IntersectionObserver" in window && !calmMotion.matches) {
    document.body.dataset.revealReady = "true";
    const seen = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        e.target.dataset.shown = "true";
        seen.unobserve(e.target);
      }
    }, { rootMargin: "0px 0px -12% 0px", threshold: 0.06 });
    targets.forEach((t) => seen.observe(t));
    // 画面に入らないまま終わることがないよう、少し経ったら全部出す
    setTimeout(() => targets.forEach((t) => { t.dataset.shown = "true"; }), 4000);
  }

  /* --- 横へ流す帯（DETAILS）------------------------------
     つかんで動かす・細い棒をつまむ・指で払う のどれでも動く。
     マウスだけの環境では、はみ出していても手がかりが無かったので棒を出す。
     ------------------------------------------------------- */
  for (const rail of root.querySelectorAll("[data-rail]")) {
    const track = rail.querySelector("[data-rail-track]");
    const bar = rail.querySelector("[data-rail-bar]");
    const thumb = rail.querySelector("[data-rail-thumb]");
    if (!track) continue;

    const room = () => Math.max(0, track.scrollWidth - track.clientWidth);

    const paintBar = () => {
      const max = room();
      if (max < 8) { delete rail.dataset.railReady; return; }
      rail.dataset.railReady = "true";
      const ratio = Math.min(1, track.clientWidth / track.scrollWidth);
      const p = track.scrollLeft / max;
      thumb.style.width = `${Math.max(8, ratio * 100)}%`;
      thumb.style.left = `${p * (100 - Math.max(8, ratio * 100))}%`;
    };

    let grab = null;
    const stopDrag = () => {
      if (!grab) return;
      try { grab.on.releasePointerCapture(grab.id); } catch { /* 掴めない環境もある */ }
      delete rail.dataset.dragging;
      track.style.scrollBehavior = "";
      track.style.scrollSnapType = "";
      // つかんで動かしたときは、離した先のリンクを開かない
      if (grab.moved > 8) { rail.dataset.justDragged = "true"; setTimeout(() => { delete rail.dataset.justDragged; }, 0); }
      grab = null;
    };

    track.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "touch" || e.button !== 0) return;   // 指は元から動く
      grab = { on: track, id: e.pointerId, x: e.clientX, from: track.scrollLeft, moved: 0, kind: "track" };
      track.style.scrollBehavior = "auto";
      track.style.scrollSnapType = "none";
      try { track.setPointerCapture(e.pointerId); } catch { /* 同上 */ }
    });

    if (bar) bar.addEventListener("pointerdown", (e) => {
      const max = room();
      if (max < 8) return;
      grab = { on: bar, id: e.pointerId, x: e.clientX, from: track.scrollLeft, moved: 99, kind: "bar",
               rect: bar.getBoundingClientRect() };
      rail.dataset.dragging = "bar";
      track.style.scrollBehavior = "auto";
      try { bar.setPointerCapture(e.pointerId); } catch { /* 同上 */ }
      track.scrollLeft = ((e.clientX - grab.rect.left) / grab.rect.width) * max;
      e.preventDefault();
    });

    addEventListener("pointermove", (e) => {
      if (!grab || e.pointerId !== grab.id) return;
      if (grab.kind === "bar") {
        track.scrollLeft = ((e.clientX - grab.rect.left) / grab.rect.width) * room();
        return;
      }
      const dx = e.clientX - grab.x;
      grab.moved = Math.max(grab.moved, Math.abs(dx));
      if (grab.moved > 4) rail.dataset.dragging = "track";
      track.scrollLeft = grab.from - dx;
    });
    addEventListener("pointerup", stopDrag);
    addEventListener("pointercancel", stopDrag);

    track.addEventListener("click", (e) => {
      if (rail.dataset.justDragged) { e.preventDefault(); e.stopPropagation(); }
    }, true);

    // 描き直しは軽いので、そのまま呼ぶ（rAF は環境によって走らない）
    track.addEventListener("scroll", paintBar, { passive: true });
    addEventListener("resize", paintBar, { passive: true });
    paintBar();
    // 絵が入ったあとで幅が決まるので、読み終わってからもう一度測る
    addEventListener("load", paintBar);
    setTimeout(paintBar, 600);
  }

  /* --- キービジュアル -------------------------------------
     端をつないで、ぐるぐる回れるようにする。
     先頭の前に「最後の複製」を、最後の後ろに「先頭の複製」を置き、
     複製まで来たら同じ絵の本体へ音もなく移す。
     ------------------------------------------------------- */
  const kv = root.querySelector("[data-kv]");
  const header = document.getElementById("site-header");
  if (!kv) return;
  const track = kv.querySelector(".kv__track");
  const real = [...track.querySelectorAll(".kv__slide")];
  const total = real.length;
  const dots = [...kv.querySelectorAll("[data-kv-go]")];
  const prev = kv.querySelector("[data-kv-prev]");
  const next = kv.querySelector("[data-kv-next]");

  /** 表示中の作品の明るさに合わせて、ヘッダーの文字色を決める */
  const tone = (cellEl) => {
    if (header) header.dataset.tone = cellEl?.dataset.tone === "light" ? "light" : "dark";
  };

  if (total < 2) {
    kv.querySelectorAll(".kv__arrow, .kv__dots").forEach((x) => x.remove());
    tone(real[0]);
    return;
  }

  /** 読み上げにも操作にも出てこない、見た目だけの複製 */
  const twin = (src) => {
    const c = src.cloneNode(true);
    c.setAttribute("aria-hidden", "true");
    c.removeAttribute("aria-label");
    c.dataset.kvClone = "true";
    c.querySelectorAll("a, button").forEach((x) => { x.tabIndex = -1; });
    return c;
  };
  track.insertBefore(twin(real[total - 1]), real[0]);
  track.appendChild(twin(real[0]));

  const cells = [...track.querySelectorAll(".kv__slide")];   // total + 2
  const LAST = cells.length - 1;
  /** 複製を含めた並びの位置 → 本体での番号 */
  const at = (p) => ((p - 1) % total + total) % total;

  let pos = 1;
  let painted = -1;
  const calm = matchMedia("(prefers-reduced-motion: reduce)");
  const left = (p) => cells[p].offsetLeft - cells[0].offsetLeft;

  /** 現在地を、色・ドット・読み上げ対象に反映する */
  const paint = () => {
    painted = pos;
    const cur = at(pos);
    dots.forEach((d, k) => d.setAttribute("aria-current", String(k === cur)));
    cells.forEach((c, k) => c.toggleAttribute("inert", k !== pos));
    tone(cells[pos]);
  };

  /**
   * 行き先を、複製を含めた並びの中へ収める。
   * 何かの理由で滑りが終わらないまま次へ進んでも、並びの外を指さないようにする。
   */
  const inRange = (p) => (p >= 0 && p <= LAST ? p : at(p) + 1);

  /** 音もなく移す（複製から本体へ戻すときに使う） */
  const jump = (p0) => {
    const p = inRange(p0);
    pos = p;
    const keep = track.style.scrollBehavior;
    track.style.scrollBehavior = "auto";
    track.scrollLeft = left(p);
    track.style.scrollBehavior = keep;
    paint();
  };

  const goTo = (p0) => {
    const p = inRange(p0);
    // 動きを減らす設定のときは滑らせない。
    // CSS の scroll-behavior が smooth のままだと behavior:"auto" では止まらないので、
    // その場で移す方（jump）へ回す。
    if (calm.matches) { jump(p); wrap(); return; }
    pos = p;
    paint();
    track.scrollTo({ left: left(p), behavior: "smooth" });
    // 滑り終えたころに、複製かどうかを確かめる。
    // scroll の通知だけに頼ると、通知が間引かれる環境で入れ替えが起きない
    clearTimeout(settle);
    settle = setTimeout(wrap, 700);
  };

  /**
   * 複製まで来たら、同じ絵の本体へ入れ替える。見た目は変わらない。
   * 滑っている途中で入れ替えると動きが途切れるので、
   * 「行き先にぴたりと止まった」ときだけ入れ替える。
   */
  let settle = null;
  const arrived = () => Math.abs(track.scrollLeft - left(pos)) < Math.max(2, track.clientWidth * 0.01);
  const wrap = () => {
    if (!arrived()) return;
    if (pos === 0) jump(total);
    else if (pos === LAST) jump(1);
  };
  const sync = () => {
    const w = track.clientWidth || 1;
    const i = Math.max(0, Math.min(LAST, Math.round(track.scrollLeft / w)));
    if (i !== painted) { pos = i; paint(); }
    // 止まってから確かめる（指で払ったあとの滑りにも間に合わせる）
    clearTimeout(settle);
    settle = setTimeout(wrap, 180);
  };

  prev.addEventListener("click", () => goTo(pos - 1));
  next.addEventListener("click", () => goTo(pos + 1));
  dots.forEach((d) => d.addEventListener("click", () => goTo(Number(d.dataset.kvGo) + 1)));

  track.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); goTo(pos + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); goTo(pos - 1); }
  });

  /* つかんで振る・絵の左右半分のクリック */
  const interactive = (el) => el.closest("a, button, input, select, textarea, [role='button']");
  let drag = null;

  track.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch" || e.button !== 0 || interactive(e.target)) return;
    drag = { x: e.clientX, from: track.scrollLeft, moved: 0, dx: 0, id: e.pointerId };
    track.style.scrollBehavior = "auto";
    track.style.scrollSnapType = "none";
  });

  track.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x;
    if (!drag.captured && Math.abs(dx) > 4) {
      drag.captured = true;
      try { track.setPointerCapture(drag.id); } catch { /* 掴めない環境もある */ }
      kv.dataset.dragging = "true";
    }
    drag.moved = Math.max(drag.moved, Math.abs(dx));
    drag.dx = dx;
    if (drag.captured) track.scrollLeft = drag.from - dx;
  });

  const endDrag = () => {
    if (!drag) return;
    const { moved, dx, captured, id } = drag;
    if (captured) { try { track.releasePointerCapture(id); } catch { /* 同上 */ } }
    delete kv.dataset.dragging;
    track.style.scrollSnapType = "";
    track.style.scrollBehavior = "";
    drag = null;
    if (moved > 8) {
      const step = Math.abs(dx) > track.clientWidth * 0.12 ? (dx < 0 ? 1 : -1) : 0;
      goTo(pos + step);
      kv.dataset.justDragged = "true";
      setTimeout(() => { delete kv.dataset.justDragged; }, 0);
    }
  };
  track.addEventListener("pointerup", endDrag);
  track.addEventListener("pointercancel", endDrag);

  track.addEventListener("click", (e) => {
    if (kv.dataset.justDragged || interactive(e.target)) return;
    const r = track.getBoundingClientRect();
    goTo(e.clientX < r.left + r.width / 2 ? pos - 1 : pos + 1);
  });

  track.addEventListener("scroll", sync, { passive: true });
  addEventListener("resize", () => jump(pos), { passive: true });

  /* 自動送りは既定で止まっている（管理画面でONにしたときだけ動く） */
  const every = Number(kv.dataset.autoplay) || 0;
  if (every && !calm.matches) {
    let timer = null;
    const stop = () => { clearInterval(timer); timer = null; };
    const start = () => {
      if (timer || document.hidden) return;
      timer = setInterval(() => goTo(pos + 1), every * 1000);
    };
    kv.addEventListener("pointerenter", stop);
    kv.addEventListener("pointerleave", start);
    kv.addEventListener("focusin", stop);
    kv.addEventListener("focusout", start);
    document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
    start();
  }

  // 本体の1枚目から始める（左隣には最後の絵が控えている）
  jump(1);
})();

/**
 * WORKS / 作品の詳細 / SERIES
 *
 * 一覧も詳細も、登録したデータから組み立てる。
 * こうしておけば、追加した作品がそのまま公開ページに出る。
 */
(() => {
  const { store, url } = window.PINK ?? {};
  if (!store) return;

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const d = (s) => String(s ?? "").replace(/-/g, ".");
  const works = store.publicWorks();
  const series = store.mergedSeries();

  /** 1ファイル版ではハッシュの後ろに、通常版では検索文字列に付く */
  const query = () => new URLSearchParams(window.PINK_QUERY || location.search);
  const workURL = (w) => `${url("/work/")}?w=${encodeURIComponent(w.slug)}`;
  const seriesURL = (s) => `${url("/series/")}?s=${encodeURIComponent(s.slug)}`;

  const card = (w) => `
    <a class="work-card" href="${esc(workURL(w))}"
       data-card data-id="${esc(w.id)}" data-cat="${esc(w.category ?? "")}"
       data-series="${esc(w.series ?? "")}" data-name="${esc(w.title)}"
       data-tags="${esc((w.tags ?? []).join(" "))}" data-date="${esc(w.createdOn ?? "")}">
      <span class="work-card__media">
        <img src="${esc(w.mainImage)}" alt="${esc(w.altText ?? w.title)}" loading="lazy" decoding="async">
      </span>
      <span class="work-card__body">
        <span class="work-card__title">${esc(w.title)}</span>
        <span class="work-card__meta num">${esc(d(w.createdOn))}</span>
      </span>
    </a>`;

  /* ============================ WORKS ============================ */
  const grid = document.getElementById("works-grid");
  if (grid) {
    const box = document.querySelector("[data-works-filter]");
    const emptyEl = document.getElementById("works-empty");
    const countEl = document.getElementById("works-count");
    const search = document.getElementById("works-search");

    grid.innerHTML = works.map(card).join("");
    box.hidden = works.length < 2;
    emptyEl.hidden = works.length > 0;

    // 分類とタグは、いま出せる作品からだけ作る（空の条件を出さない）
    const cats = store.mergedCategories().filter((c) => works.some((w) => w.category === c.key));
    document.getElementById("works-cats").innerHTML = cats.length > 1
      ? `<button class="chip" type="button" data-filter="cat" data-value="" aria-pressed="true">ALL</button>` +
        cats.map((c) => `<button class="chip" type="button" data-filter="cat" data-value="${esc(c.key)}"
          aria-pressed="false">${esc(c.name)}</button>`).join("")
      : "";
    const tags = [...new Set(works.flatMap((w) => w.tags ?? []))].slice(0, 24);
    document.getElementById("works-tags").innerHTML = tags
      .map((t) => `<button class="chip chip--sm" type="button" data-filter="tag" data-value="${esc(t)}"
        aria-pressed="false">${esc(t)}</button>`).join("");

    let cat = "";
    const picked = new Set();
    const apply = () => {
      const q = (search.value ?? "").trim().toLowerCase();
      let shown = 0;
      for (const el of grid.querySelectorAll("[data-card]")) {
        const own = (el.dataset.tags ?? "").split(/\s+/).filter(Boolean);
        let ok = !cat || el.dataset.cat === cat;
        if (ok && picked.size) ok = [...picked].every((t) => own.includes(t));
        if (ok && q) ok = `${el.dataset.name} ${el.dataset.tags}`.toLowerCase().includes(q);
        el.hidden = !ok;
        if (ok) shown++;
      }
      countEl.textContent = String(shown);
      if (works.length) {
        emptyEl.hidden = shown > 0;
        emptyEl.textContent = shown ? "" : "NO RESULTS";
      }
    };

    box.addEventListener("click", (e) => {
      const chip = e.target.closest("[data-filter]");
      if (!chip) return;
      if (chip.dataset.filter === "cat") {
        cat = chip.dataset.value;
        box.querySelectorAll('[data-filter="cat"]').forEach((b) => b.setAttribute("aria-pressed", String(b === chip)));
      } else {
        const t = chip.dataset.value;
        picked.has(t) ? picked.delete(t) : picked.add(t);
        chip.setAttribute("aria-pressed", String(picked.has(t)));
      }
      apply();
    });
    search.addEventListener("input", apply);
    apply();
  }

  /* --------------------------- 作品の詳細 -------------------------- */
  const detail = document.getElementById("work-detail");
  if (detail) {
    const w = works.find((x) => x.slug === query().get("w"));
    if (w) {
      const s = series.find((x) => x.slug === w.series);
      const related = works.filter((x) => x.id !== w.id
        && (x.series === w.series || x.category === w.category)).slice(0, 4);
      document.title = `${w.title} — PINK INDEX`;
      detail.innerHTML = `
        <article class="page work">
          <div class="work__media">
            <img src="${esc(w.mainImage)}" alt="${esc(w.altText ?? w.title)}" fetchpriority="high" decoding="async">
          </div>
          <header class="work__head">
            <h1 class="work__title">${esc(w.title)}</h1>
            <p class="work__meta">
              <time class="num" datetime="${esc(w.createdOn)}">${esc(d(w.createdOn))}</time>
              ${s ? `<a href="${esc(seriesURL(s))}">${esc(s.name)}</a>` : ""}
            </p>
          </header>
          ${w.description ? `<div class="work__text"><p>${esc(w.description).replace(/\n/g, "<br>")}</p></div>` : ""}
          ${(w.images ?? []).length ? `<div class="work__more">${w.images.map((src, i) =>
            `<img src="${esc(src)}" alt="${esc(w.altText ?? w.title)} ${i + 2}" loading="lazy" decoding="async">`).join("")}</div>` : ""}
          ${(w.tags ?? []).length ? `<p class="work__tags">${w.tags.map((t) => `<span class="tag-chip">${esc(t)}</span>`).join("")}</p>` : ""}
        </article>
        ${related.length ? `
        <section class="page section">
          <div class="sec__head"><h2 class="sec__title">RELATED</h2></div>
          <div class="work-grid">${related.map(card).join("")}</div>
        </section>` : ""}`;
    }
  }

  /* ============================ SERIES =========================== */
  const view = document.getElementById("series-view");
  if (view) {
    const head = (title) => `
      <div class="page page-head"><div class="page-head__title">
        <h1 class="page-head__en">${esc(title)}</h1>
      </div></div>`;

    const slug = query().get("s");
    const one = slug ? series.find((x) => x.slug === slug) : null;

    if (one) {
      const list = works.filter((w) => w.series === one.slug);
      document.title = `${one.name} — SERIES | PINK INDEX`;
      view.innerHTML = `
        <div class="page series-head">
          <h1 class="page-head__en">${esc(one.name)}</h1>
          ${one.copy ? `<p class="series-head__copy">${esc(one.copy)}</p>` : ""}
        </div>
        <div class="page section">
          ${list.length ? `<div class="work-grid">${list.map(card).join("")}</div>`
            : `<p class="coming">COMING SOON</p>`}
        </div>`;
      return;
    }

    const shown = series.filter((s) => works.some((w) => w.series === s.slug));
    view.innerHTML = head("SERIES") + (shown.length ? `
      <div class="page section">
        <div class="series-list">
          ${shown.map((s) => {
            const list = works.filter((w) => w.series === s.slug);
            return `
            <a class="series-row" href="${esc(seriesURL(s))}">
              <span class="series-row__media">
                <img src="${esc(s.cover || list[0]?.mainImage || "")}" alt="${esc(list[0]?.altText ?? s.name)}"
                     loading="lazy" decoding="async">
              </span>
              <span class="series-row__body">
                <span class="series-row__name">${esc(s.name)}</span>
                ${s.copy ? `<span class="series-row__copy">${esc(s.copy)}</span>` : ""}
                <span class="series-row__count num">${list.length}</span>
              </span>
            </a>`;
          }).join("")}
        </div>
      </div>` : `<div class="page section"><p class="coming">COMING SOON</p></div>`);
  }
})();
</script>
