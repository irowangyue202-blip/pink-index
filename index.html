};

let layerOrder, slotCapacity, byId;
const rebuild = () => {
  layerOrder = new Map(CAT.layerDefinitions.map((l) => [l.key, l.baseOrder]));
  slotCapacity = new Map(CAT.equipSlots.map((s) => [s.key, s.capacity]));
  byId = new Map(CAT.items.map((i) => [i.id, i]));
};
rebuild();

/** 利用者が登録した素材・カテゴリを含むカタログへ差し替える */
function configure(patch) {
  CAT = { ...CAT, ...patch };
  rebuild();
}
const catalog = () => CAT;
const getItem = (id) => byId.get(id);
const categoryOf = (key) => CAT.categories.find((c) => c.key === key);
const catName = (key) => categoryOf(key)?.name ?? key;

/* ---------------------------------------------------------
   状態: 選択中アイテムIDの配列(選択順)。描画順には影響させない。
   --------------------------------------------------------- */
const emptyState = () => ({
  schemaVersion: SCHEMA_VERSION,
  renderProfileId: CAT.renderProfile.id,
  selected: [],
  locks: [],
});

/**
 * レイヤー解決。
 * 実描画順は (layer.baseOrder, piece.localOrder, 安定ID) のタプルで決定する。
 * 選択順では変えない — 共有・再現・visual regression が不安定になるため。
 */
function resolveLayers(state) {
  const pieces = [];
  const push = (piece, ownerId, index) => {
    const base = layerOrder.get(piece.layer);
    if (base === undefined) return; // 未知レイヤーは描かない(壊れた素材を握りつぶさない)
    pieces.push({
      key: `${ownerId}:${index}`,
      media: piece.media,
      layer: piece.layer,
      baseOrder: base,
      localOrder: piece.localOrder ?? 0,
      stableId: `${ownerId}:${index}`,
      ownerId,
    });
  };
  CAT.baseLayers.forEach((p, i) => push(p, "__base", i));
  for (const id of state.selected) {
    const item = byId.get(id);
    if (!item) continue;                       // 廃止アイテムは黙って飛ばす
    item.pieces.forEach((p, i) => push(p, item.id, i));
  }
  return pieces.sort((a, b) =>
    a.baseOrder - b.baseOrder ||
    a.localOrder - b.localOrder ||
    (a.stableId < b.stableId ? -1 : a.stableId > b.stableId ? 1 : 0));
}

/* --- 互換性 ---------------------------------------------- */

/** 明示ルールに反するか。反する場合は理由文つきのルールを返す */
function findConflict(selectedIds, candidateId) {
  for (const rule of CAT.compatibilityRules) {
    if (rule.type !== "FORBID") continue;
    const a = rule.left.item, b = rule.right.item;
    if (candidateId === a && selectedIds.includes(b)) return rule;
    if (candidateId === b && selectedIds.includes(a)) return rule;
  }
  return null;
}

/** 同じ枠を奪い合うために外れるアイテム */
function itemsToEvict(selectedIds, item) {
  const evict = new Set();
  for (const slot of item.slots) {
    const cap = slotCapacity.get(slot) ?? 1;
    const holders = selectedIds.filter((id) => byId.get(id)?.slots.includes(slot));
    const over = holders.length + 1 - cap;   // 容量を超える分だけ、古い順に外す
    for (let i = 0; i < over; i++) if (holders[i]) evict.add(holders[i]);
  }
  return [...evict];
}

const isRequired = (item) => item?.slots.some((s) => REQUIRED_SLOTS.includes(s));

/**
 * アイテムを選ぶ。
 * - すでに選択済みなら解除(トグル)。ただし素体と表情は外せない
 * - 明示ルール違反は「黙って外さず」blocked を返し、呼び出し側が理由を表示する
 */
function select(state, itemId) {
  const item = byId.get(itemId);
  if (!item) return { state, blocked: { message: "この素材は現在利用できません。" } };

  if (state.selected.includes(itemId)) {
    if (isRequired(item)) {
      return { state, blocked: { message: `${catName(item.cat)}は必ず1つ選ばれている必要があります。別のものに切り替えてください。` } };
    }
    if (state.locks.includes(item.cat)) {
      return { state, blocked: { message: `${catName(item.cat)}はロック中です。解除してから変更してください。` } };
    }
    return { state: { ...state, selected: state.selected.filter((id) => id !== itemId) }, removed: [itemId] };
  }

  const conflict = findConflict(state.selected, itemId);
  if (conflict) return { state, blocked: { message: conflict.message, ruleId: conflict.id } };

  const evict = itemsToEvict(state.selected, item);
  const lockedEvict = evict.filter((id) => state.locks.includes(byId.get(id)?.cat));
  if (lockedEvict.length) {
    const names = lockedEvict.map((id) => byId.get(id).name).join("・");
    return { state, blocked: { message: `${names} がロック中のため、この素材に変更できません。` } };
  }

  const selected = state.selected.filter((id) => !evict.includes(id)).concat(itemId);
  return { state: { ...state, selected }, removed: evict };
}

function deselect(state, itemId) {
  const item = byId.get(itemId);
  if (isRequired(item)) return state;
  return { ...state, selected: state.selected.filter((id) => id !== itemId) };
}

/** 全解除。ロック中のカテゴリと必須スロットは残す */
function clearAll(state) {
  const selected = state.selected.filter((id) => {
    const item = byId.get(id);
    if (!item) return false;
    return state.locks.includes(item.cat) || isRequired(item);
  });
  return { ...state, selected };
}

function toggleLock(state, cat) {
  const locks = state.locks.includes(cat)
    ? state.locks.filter((c) => c !== cat)
    : state.locks.concat(cat);
  return { ...state, locks };
}

/** 素体と表情が空にならないよう最低限を補う */
function ensureRequired(state) {
  let selected = state.selected.filter((id) => byId.has(id));
  for (const slot of REQUIRED_SLOTS) {
    if (selected.some((id) => byId.get(id)?.slots.includes(slot))) continue;
    const fallback = CAT.items.find((i) => i.slots.includes(slot) && (i.status ?? "PUBLISHED") === "PUBLISHED")
      ?? CAT.items.find((i) => i.slots.includes(slot));
    if (fallback) selected = [fallback.id, ...selected];
  }
  return { ...state, selected };
}

/* --- 共有・保存 ------------------------------------------ */

/** URL共有用。schemaVersion と renderProfileId を必ず含める */
function encodeState(state) {
  const payload = { v: state.schemaVersion, p: state.renderProfileId, s: [...state.selected].sort() };
  return b64url(JSON.stringify(payload));
}

function decodeState(token) {
  let payload;
  try { payload = JSON.parse(unb64url(token)); } catch { return null; }
  if (!payload || typeof payload !== "object" || !Array.isArray(payload.s)) return null;
  if (payload.v !== SCHEMA_VERSION) return null;              // 将来は migration を通す
  if (payload.p !== CAT.renderProfile.id) return null;        // 別プロフィールの状態は再現しない
  const known = payload.s.filter((id) => byId.has(id));
  return {
    ...emptyState(),
    selected: known,
    // 廃止・非公開になった素材は「現在は利用不可」として呼び出し側へ返す
    missing: payload.s.filter((id) => !byId.has(id)),
  };
}

function b64url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  const b64 = typeof btoa === "function" ? btoa(bin) : Buffer.from(bin, "binary").toString("base64");
  return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function unb64url(token) {
  const b64 = token.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(token.length / 4) * 4, "=");
  const bin = typeof atob === "function" ? atob(b64) : Buffer.from(b64, "base64").toString("binary");
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

/** キャラクターの既定衣装 → 選択状態 */
function lookFromDefault(defaultLook) {
  const selected = [];
  for (const value of Object.values(defaultLook ?? {})) {
    for (const id of Array.isArray(value) ? value : [value]) if (byId.has(id)) selected.push(id);
  }
  return ensureRequired({ ...emptyState(), selected });
}

/**
 * PINK INDEX — スタジオの保存領域
 *
 * 素体・衣装・小物・作品・カテゴリ・HOMEのビジュアルは、すべてここに入る。
 * 絵は同梱していないので、管理画面（/studio/）から登録したものが正本になる。
 * 保存先はこの端末のブラウザ（localStorage）で、書き出し／読み込みで持ち運ぶ。
 *
 * ゴミ箱は持たない。削除したものはその場で完全に消える。
 * Node のテストでも同じコードを使えるよう、localStorage が無い環境では
 * メモリ上の保存領域へ自動的に切り替える。
 */
  const builtinArtworks = artworks;
  const builtinHomeSlots = homeSlots;
  const builtinHomeSections = homeSections;


const KEY = "pinkindex.studio.v1";
const EMPTY = () => ({
  v: 3,
  categories: [], items: [], artworks: [],
  removed: { items: [], artworks: [], categories: [] },  // 削除は即時・復元なし
  overrides: {},   // 配布データへの上書き（名前・フレーバーテキストなど）
  home: null,      // HOMEの並び。未編集なら初期の枠をそのまま使う
  homeSections: null,  // HOME下部の区画（もくじ・点数）を出すかどうか
});

let memory = null;   // localStorage が使えない環境用

const storage = () => {
  try {
    if (typeof localStorage !== "undefined") return localStorage;
  } catch { /* file:// やプライベートモードでは触れないことがある */ }
  return null;
};

/** 保存された内容や配布データを、いまの形へそろえる */
const normalize = (parsed) => ({
  ...EMPTY(), ...parsed,
  // v2 までは「ゴミ箱」だった。削除は即時に変えたので、そのまま削除済みとして扱う
  removed: { ...EMPTY().removed, ...(parsed.removed ?? parsed.hidden ?? {}) },
  overrides: parsed.overrides ?? {},
});

function load() {
  if (memory) return memory;
  const s = storage();
  if (s) {
    try {
      const raw = s.getItem(KEY);
      if (raw) { memory = normalize(JSON.parse(raw)); return memory; }
    } catch { /* 壊れていたら初期状態から始める */ }
  }
  // この端末にまだ何もないときは、サイトに同梱された公開データを土台にする
  const seed = typeof window !== "undefined" ? window.PINK_SEED : null;
  memory = seed ? normalize(seed) : EMPTY();
  return memory;
}

/** 管理画面で編集した内容を、公開用に書き出す */
const exportData = () => JSON.stringify(load(), null, 2);

/** 書き出したデータを読み込む（別の端末へ持っていくため） */
function importData(json) {
  let parsed;
  try { parsed = typeof json === "string" ? JSON.parse(json) : json; }
  catch { return { ok: false, reason: "このファイルは読み込めませんでした。" }; }
  if (!parsed || typeof parsed !== "object") return { ok: false, reason: "このファイルは読み込めませんでした。" };
  const result = save(normalize(parsed));
  apply();
  return { ok: true, ...result };
}

/**
 * 保存を試みる。
 * 「操作が成立したか(ok)」と「この端末に保存できたか(persisted)」を分けて返す。
 * 保存できない環境でも操作自体は続けられるようにするため。
 */
function save(next = memory) {
  memory = next;
  const s = storage();
  if (!s) return { persisted: false, reason: "この環境では保存できないため、次に開いたときは元に戻ります。" };
  try {
    s.setItem(KEY, JSON.stringify(next));
    return { persisted: true };
  } catch {
    return { persisted: false, reason: "保存領域がいっぱいです。使わない素材や作品を削除してください。" };
  }
}

function resetAll() {
  memory = EMPTY();
  const s = storage();
  try { s?.removeItem(KEY); } catch { /* 無視してよい */ }
  apply();
}

/* --- 合成ビュー ------------------------------------------ */

const customCategories = () => load().categories;
const customItems = () => load().items;
const customArtworks = () => load().artworks;
const removedIds = () => load().removed;

/** 組み込み + 自作。カテゴリは並び順を保つ */
function mergedCategories() {
  const st = load();
  return [...builtinCategories, ...st.categories].filter((c) => !st.removed.categories.includes(c.key));
}

/** 自作カテゴリが持ち込む同時使用枠も足す */
function mergedEquipSlots() {
  const extra = load().categories
    .filter((c) => !builtinSlots.some((s) => s.key === c.slot))
    .map((c) => ({ key: c.slot, name: c.name, capacity: c.capacity ?? 1 }));
  return [...builtinSlots, ...extra];
}

/** 上書き（管理画面で編集した内容）を当てて返す */
const applyOverride = (item) => {
  const patch = load().overrides[item.id];
  if (!patch) return item;
  return {
    ...item, ...patch,
    flavor: patch.flavor ? { ...(item.flavor ?? {}), ...patch.flavor,
      ja: { ...(item.flavor?.ja ?? {}), ...(patch.flavor.ja ?? {}) } } : item.flavor,
  };
};

const mergedItems = () => [...builtinItems, ...load().items].map(applyOverride);
const mergedArtworks = () => [...builtinArtworks, ...load().artworks];

/** 削除されていない、実際に使える素材 */
const visibleItems = () => {
  const st = load();
  const cats = new Set(mergedCategories().map((c) => c.key));
  return mergedItems().filter((i) => !st.removed.items.includes(i.id) && cats.has(i.cat));
};
const visibleArtworks = () => mergedArtworks().filter((a) => !load().removed.artworks.includes(a.id));

const isCustom = (id) => load().items.some((i) => i.id === id) || load().artworks.some((a) => a.id === id);
const isRemoved = (id) => load().removed.items.includes(id) || load().removed.artworks.includes(id);

/** 現在の状態を着せ替えコアへ反映する */
function apply() {
  configure({
    items: visibleItems(),
    categories: mergedCategories(),
    equipSlots: mergedEquipSlots(),
  });
}

/* --- カテゴリ -------------------------------------------- */

const slugify = (name) => "u-" + (name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")
  || Math.random().toString(36).slice(2, 7));

function addCategory({ name, en, icon, layer, capacity = 1 }) {
  const st = load();
  if (!name?.trim()) return { ok: false, reason: "カテゴリ名を入力してください。" };
  if (!layerDefinitions.some((l) => l.key === layer)) return { ok: false, reason: "描画レイヤーを選んでください。" };
  let key = slugify(name);
  if (mergedCategories().some((c) => c.key === key)) key = `${key}-${Date.now().toString(36).slice(-3)}`;
  const cat = { key, name: name.trim(), en: (en || name).trim().toUpperCase(), icon: icon || "◇",
    layer, slot: key, capacity: Number(capacity) || 1, custom: true };
  const result = save({ ...st, categories: [...st.categories, cat] });
  apply();
  return { ok: true, ...result, category: cat };
}

/** 使っている素材が残っているカテゴリは削除させない */
function deleteCategory(key) {
  const st = load();
  if (!st.categories.some((c) => c.key === key)) {
    return { ok: false, reason: "組み込みのカテゴリは削除できません（素材は1点ずつ削除できます）。" };
  }
  const used = visibleItems().filter((i) => i.cat === key);
  if (used.length) return { ok: false, reason: `このカテゴリの素材が ${used.length} 点あります。先に素材を削除してください。` };
  const result = save({ ...st, categories: st.categories.filter((c) => c.key !== key) });
  apply();
  return { ok: true, ...result };
}

/* --- 素材 ------------------------------------------------ */

const nextNo = (prefix) => {
  const used = mergedItems().filter((i) => i.no?.startsWith(prefix)).length + 1;
  return `${prefix}-${String(used).padStart(3, "0")}`;
};

/**
 * 自分で描いた画像を素材として登録する。
 * media は data URL（PNG/SVG）を想定し、この端末の中だけに保存する。
 */
function addItem({ name, cat, media, layer, tags = [], colors = [], season = "オールシーズン",
  series = "base-set", memo = "", createdOn, flavor }) {
  const st = load();
  if (!name?.trim()) return { ok: false, reason: "名前を入力してください。" };
  if (!media) return { ok: false, reason: "画像を選んでください。" };
  const category = mergedCategories().find((c) => c.key === cat);
  if (!category) return { ok: false, reason: "カテゴリを選んでください。" };

  const resolvedLayer = layer || category.layer
    || { body: "BODY", hair: "HAIR_FRONT", face: "FACE", dress: "DRESS", top: "TOP", bottom: "BOTTOM",
         socks: "SOCKS", shoes: "SHOES", outer: "OUTER_BODY", headwear: "HEADWEAR",
         accessory: "FRONT_ACCESSORY", background: "BACKGROUND" }[cat] || "FRONT_ACCESSORY";

  const slots = category.slot ? [category.slot]
    : cat === "dress" ? ["dress_primary", "top", "bottom"] : [cat];

  const item = {
    id: `u-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
    no: nextNo("U"),
    name: name.trim(), cat, slots,
    tags: [...tags], colors: [...colors], season, series,
    createdOn: createdOn || new Date().toISOString().slice(0, 10),
    memo, custom: true,
    flavor: flavor ?? { public: true, ja: { short: "", body: "" } },
    pieces: [{ media, layer: resolvedLayer }],
  };
  const result = save({ ...st, items: [...st.items, item] });
  apply();
  return { ok: true, ...result, item };
}

function addArtwork({ name, media, series = "base-set", tags = [], memo = "", createdOn, flavor }) {
  const st = load();
  if (!name?.trim()) return { ok: false, reason: "作品名を入力してください。" };
  if (!media) return { ok: false, reason: "画像を選んでください。" };
  const artwork = {
    id: `ua-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
    no: String(mergedArtworks().length + 1).padStart(3, "0"),
    name: name.trim(), media, series, tags: [...tags], memo,
    flavor: flavor ?? { public: true, ja: { short: "", body: "" } },
    createdOn: createdOn || new Date().toISOString().slice(0, 10),
    shape: "normal", custom: true,
  };
  const result = save({ ...st, artworks: [...st.artworks, artwork] });
  return { ok: true, ...result, artwork };
}

/* --- 既存素材の編集（上書き） ------------------------------ */

/**
 * 名前やフレーバーテキストを書き換える。
 * 組み込みの素材は元データを壊さず、上書きだけを保存する。
 */
function updateItem(id, patch) {
  const st = load();
  const own = st.items.find((i) => i.id === id);
  if (own) {
    const next = st.items.map((i) => (i.id === id ? mergePatch(i, patch) : i));
    const result = save({ ...st, items: next });
    apply();
    return { ok: true, ...result };
  }
  if (!builtinItems.some((i) => i.id === id)) return { ok: false, reason: "この素材は見つかりません。" };
  const before = st.overrides[id] ?? {};
  const result = save({ ...st, overrides: { ...st.overrides, [id]: mergePatch(before, patch) } });
  apply();
  return { ok: true, ...result };
}

const mergePatch = (base, patch) => ({
  ...base, ...patch,
  flavor: patch.flavor
    ? { ...(base.flavor ?? {}), ...patch.flavor, ja: { ...(base.flavor?.ja ?? {}), ...(patch.flavor.ja ?? {}) } }
    : base.flavor,
});

/** 組み込み素材への上書きを取り消して、元の内容に戻す */
function clearItemOverride(id) {
  const st = load();
  if (!st.overrides[id]) return { ok: true, persisted: true };
  const overrides = { ...st.overrides };
  delete overrides[id];
  const result = save({ ...st, overrides });
  apply();
  return { ok: true, ...result };
}
const hasOverride = (id) => Boolean(load().overrides[id]);

/* --- HOME に並べるビジュアル ------------------------------- */

const cloneHome = () => builtinHomeSlots.map((s) => ({ ...s }));

/** 編集前は組み込みのまま。1度でも編集したら、その内容を正とする */
const homeSlotsAll = () => (load().home ?? cloneHome()).slice().sort((a, b) => a.order - b.order);
const visibleHomeSlots = () => homeSlotsAll().filter((s) => s.published !== false);

const writeHome = (slots) => {
  const st = load();
  const normalized = slots.map((s, i) => ({ ...s, order: i + 1 }));
  const result = save({ ...st, home: normalized });
  return { ok: true, ...result, slots: normalized };
};

function updateHomeSlot(id, patch) {
  const slots = homeSlotsAll();
  if (!slots.some((s) => s.id === id)) return { ok: false, reason: "この枠は見つかりません。" };
  return writeHome(slots.map((s) => (s.id === id ? { ...s, ...patch } : s)));
}

function addHomeSlot(layout = "left-image") {
  const slots = homeSlotsAll();
  const slot = {
    id: `hs-u-${Date.now().toString(36)}`, layout, order: slots.length + 1, published: false,
    eyebrow: "", title: "新しい枠", subtitle: "", copy: "", href: "/gallery/", linkLabel: "見る",
    media: "", mediaMobile: "", focus: "50% 40%", zoom: 1, bg: "#FFF9FC", fg: "#171417",
    tx: 0, ty: 100, tw: 62, align: "left", ax: "start", ay: "center", custom: true,
  };
  const r = writeHome([...slots, slot]);
  return { ...r, slot };
}

function deleteHomeSlot(id) {
  const slots = homeSlotsAll();
  if (slots.length <= 1) return { ok: false, reason: "HOMEの枠を全部消すことはできません。" };
  return writeHome(slots.filter((s) => s.id !== id));
}

/** 上下の入れ替え。dir は -1 か 1 */
function moveHomeSlot(id, dir) {
  const slots = homeSlotsAll();
  const i = slots.findIndex((s) => s.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= slots.length) return { ok: false, reason: "これ以上は動かせません。" };
  const next = slots.slice();
  [next[i], next[j]] = [next[j], next[i]];
  return writeHome(next);
}

function resetHome() {
  const st = load();
  const result = save({ ...st, home: null, homeSections: null });
  return { ok: true, ...result };
}

/* --- HOME下部の区画（もくじ・点数） ------------------------ */

/** 文字を出したくないときは、区画ごと消せる */
const homeSectionsAll = () => ({ ...builtinHomeSections, ...(load().homeSections ?? {}) });

function updateHomeSections(patch) {
  const st = load();
  const next = { ...homeSectionsAll(), ...patch };
  const result = save({ ...st, homeSections: next });
  return { ok: true, ...result, sections: next };
}

/** HOMEに使える画像の一覧。自分で登録した絵だけが並ぶ */
function mediaLibrary() {
  const st = load();
  return [
    ...st.artworks.map((a) => ({ value: a.media, label: `作品｜${a.name}` })),
    ...st.items.map((i) => ({ value: i.pieces[0].media, label: `素材｜${i.name}` })),
  ];
}

/* --- HOMEのキービジュアル（横スクロールで切り替える枚数） ---- */

const slidesOf = (slot) => slot?.slides ?? [];

function addHomeSlide(slotId) {
  const slot = homeSlotsAll().find((s) => s.id === slotId);
  if (!slot) return { ok: false, reason: "この枠は見つかりません。" };
  const slide = {
    id: `sl-${Date.now().toString(36)}`, eyebrow: "", title: "", subtitle: "", copy: "",
    href: "/dressup/", linkLabel: "見る", media: "", mediaMobile: "",
    focus: "50% 40%", zoom: 1, bg: "#FFF9FC", fg: "#171417",
    tx: 0, ty: 100, tw: 62, align: "left",
  };
  const r = updateHomeSlot(slotId, { slides: [...slidesOf(slot), slide] });
  return { ...r, slide };
}

function updateHomeSlide(slotId, slideId, patch) {
  const slot = homeSlotsAll().find((s) => s.id === slotId);
  if (!slot) return { ok: false, reason: "この枠は見つかりません。" };
  return updateHomeSlot(slotId, {
    slides: slidesOf(slot).map((sl) => (sl.id === slideId ? { ...sl, ...patch } : sl)),
  });
}

function deleteHomeSlide(slotId, slideId) {
  const slot = homeSlotsAll().find((s) => s.id === slotId);
  const slides = slidesOf(slot);
  if (slides.length <= 1) return { ok: false, reason: "キービジュアルを全部消すことはできません。" };
  return updateHomeSlot(slotId, { slides: slides.filter((sl) => sl.id !== slideId) });
}

/** 表示順の入れ替え。dir は -1 か 1 */
function moveHomeSlide(slotId, slideId, dir) {
  const slot = homeSlotsAll().find((s) => s.id === slotId);
  const slides = slidesOf(slot).slice();
  const i = slides.findIndex((sl) => sl.id === slideId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= slides.length) return { ok: false, reason: "これ以上は動かせません。" };
  [slides[i], slides[j]] = [slides[j], slides[i]];
  return updateHomeSlot(slotId, { slides });
}

/* --- 削除（即時・完全） -----------------------------------
   ゴミ箱は持たない。削除したものはその場で消える。
   組み込みの素材は元データを消せないため、削除済みとして記録し、
   以後どこにも出さない（ダッシュボードの初期化でのみ戻る）。
   --------------------------------------------------------- */

const removeFrom = (kind, id) => {
  const st = load();
  const list = new Set(st[kind === "items" ? "items" : "artworks"].map((x) => x.id));
  const isMine = list.has(id);
  const next = {
    ...st,
    items: kind === "items" && isMine ? st.items.filter((i) => i.id !== id) : st.items,
    artworks: kind === "artworks" && isMine ? st.artworks.filter((a) => a.id !== id) : st.artworks,
    removed: isMine ? st.removed : { ...st.removed, [kind]: [...new Set([...st.removed[kind], id])] },
    overrides: (() => { const o = { ...st.overrides }; delete o[id]; return o; })(),
  };
  const result = save(next);
  apply();
  return { ok: true, ...result, permanent: isMine };
};

const deleteItem = (id) => removeFrom("items", id);
const deleteArtwork = (id) => removeFrom("artworks", id);

function stats() {
  const st = load();
  return {
    custom: st.items.length + st.artworks.length,
    removed: st.removed.items.length + st.removed.artworks.length,
    categories: st.categories.length,
    edited: Object.keys(st.overrides ?? {}).length,
    homeEdited: Boolean(st.home || st.homeSections),
    bytes: (() => { try { return JSON.stringify(st).length; } catch { return 0; } })(),
  };
}

/**
 * HOMEに並べるビジュアル1枠ぶんのHTML。
 *
 * サーバー側の書き出しと、管理画面で編集したあとのブラウザ側の描き直しで
 * 同じ関数を使う。DOMには触れず、文字列だけを返す。
 *
 * 画像はカード・枠線・影に入れず、色面の上へ直接置く。
 * 文字は画像の上に小さく重ねるか、大きな余白の側に置く。
 * 先頭のキービジュアルは、横スクロールで1枚ずつ切り替える。
 */

const esc = (s) => String(s ?? "")
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

/** 数値は必ず範囲内に収める（style属性に入るため） */
const pct = (v, fallback) => {
  const n = Number(v);
  return Number.isFinite(n) ? Math.min(100, Math.max(0, Math.round(n))) : fallback;
};
const ALIGN = ["left", "center", "right"];
const SPOT = { start: "start", center: "center", end: "end" };

/**
 * 1枠ぶんの見た目をCSS変数で渡す。
 * 文字の置き場所（--hs-tx / --hs-ty）は管理画面から自由に動かせる。
 */
const style = (o) => [
  `--hs-bg:${/^#[0-9a-fA-F]{3,8}$/.test(o.bg || "") ? o.bg : "#FFF9FC"}`,
  `--hs-fg:${/^#[0-9a-fA-F]{3,8}$/.test(o.fg || "") ? o.fg : "#171417"}`,
  `--hs-focus:${/^[\d.]+% [\d.]+%$/.test(o.focus || "") ? o.focus : "50% 40%"}`,
  `--hs-zoom:${Math.min(3, Math.max(1, Number(o.zoom) || 1))}`,
  `--hs-tx:${pct(o.tx, 0)}%`,
  `--hs-ty:${pct(o.ty, 100)}%`,
  `--hs-tw:${pct(o.tw, 62)}%`,
  `--hs-align:${ALIGN.includes(o.align) ? o.align : "left"}`,
  `--hs-ax:${SPOT[o.ax] ?? "start"}`,
  `--hs-ay:${SPOT[o.ay] ?? "center"}`,
].join(";");

const alt = (o) => esc([o.eyebrow, o.title].filter(Boolean).join(" — ") || "キービジュアル");

const link = (o) => (o.href && o.linkLabel
  ? `<a class="hs__link" href="${esc(o.href)}">${esc(o.linkLabel)}</a>`
  : "");

const type = (o, { heading = "h2" } = {}) => `
      ${o.eyebrow ? `<p class="hs__eyebrow">${esc(o.eyebrow)}</p>` : ""}
      ${o.title ? `<${heading} class="hs__title">${esc(o.title)}</${heading}>` : ""}
      ${o.subtitle ? `<p class="hs__sub">${esc(o.subtitle)}</p>` : ""}
      ${o.copy ? `<p class="hs__copy">${esc(o.copy)}</p>` : ""}
      ${link(o)}`;

const media = (src, url, cls, loading = "lazy") => (src
  ? `<img class="${cls}" src="${esc(url(src))}" alt="" loading="${loading}"
       decoding="async"${loading === "eager" ? ' fetchpriority="high"' : ""}>`
  : "");

/** 画像がまだ無いときは、色面と文字だけで成立させる */
const emptyNote = (o) => (o.media ? "" :
  `<p class="hs__empty">画像は管理画面から登録します</p>`);

/**
 * 文字のかたまり。
 * showText: false なら1文字も出さない（絵だけの面にする）。
 * 文字を1つも書いていないときも、空の入れ物は置かない。
 */
const typeBlock = (o, { cls = "hs__type", heading = "h2", note = true } = {}) => {
  if (o.showText === false) return "";
  const body = type(o, { heading }).trim();
  const tail = note ? emptyNote(o) : "";
  return body || tail ? `<div class="${cls}">${body}${tail}</div>` : "";
};

/** 横スクロールで切り替えるキービジュアル */
function heroHTML(slot, { url, first }) {
  const slides = (slot.slides ?? []).filter((s) => s.published !== false);
  if (!slides.length) {
    return `
  <section class="hs hs--hero hs--hero-empty" style="${style(slot)}">
    <div class="hs__type hs__type--hero">
      <p class="hs__eyebrow">KEY VISUAL</p>
      <${first ? "h1" : "h2"} class="hs__title">PINK INDEX</${first ? "h1" : "h2"}>
      <p class="hs__copy">キービジュアルはまだ登録されていません。管理画面のHOMEから、自分の絵を並べてください。</p>
      <a class="hs__link" href="/studio/home/">HOMEを編集する</a>
    </div>
  </section>`;
  }

  return `
  <section class="hs hs--hero" style="${style(slot)}">
    <div class="kv" data-kv>
      <div class="kv__track" id="kv-track" tabindex="0"
           role="group" aria-roledescription="カルーセル" aria-label="キービジュアル">
        ${slides.map((s, i) => `
        <article class="kv__slide" style="${style(s)}" data-kv-slide="${i}"
                 role="group" aria-roledescription="スライド" aria-label="${i + 1} / ${slides.length}｜${alt(s)}">
          ${s.media ? `<picture class="kv__media">
            ${s.mediaMobile ? `<source media="(max-width: 820px)" srcset="${esc(url(s.mediaMobile))}">` : ""}
            ${media(s.media, url, "hs__img", i === 0 ? "eager" : "lazy")}
          </picture>` : ""}
          <div class="hs__free">
            ${typeBlock(s, { cls: "hs__type hs__type--hero", heading: first && i === 0 ? "h1" : "h2" })}
          </div>
        </article>`).join("")}
      </div>

      <div class="kv__nav">
        <button class="kv__arrow" type="button" data-kv-prev aria-label="前のビジュアル">←</button>
        <ol class="kv__dots">
          ${slides.map((s, i) => `<li><button type="button" data-kv-go="${i}"
            aria-label="${i + 1}枚目を見る"${i === 0 ? ' aria-current="true"' : ""}></button></li>`).join("")}
        </ol>
        <button class="kv__arrow" type="button" data-kv-next aria-label="次のビジュアル">→</button>
        <p class="kv__count num"><span data-kv-current>1</span> / ${slides.length}</p>
      </div>
    </div>
  </section>`;
}

/**
 * @param {object} slot
 * @param {{url?: (path: string) => string, first?: boolean}} opts
 */
function homeSlotHTML(slot, opts = {}) {
  const url = opts.url ?? ((p) => p);
  const s = ` style="${style(slot)}"`;

  if (slot.layout === "hero") return heroHTML(slot, { url, first: opts.first });

  if (slot.layout === "editorial") {
    return `
  <section class="hs hs--editorial"${s} aria-label="${alt(slot)}">
    <div class="hs__ed-wide">${media(slot.media, url, "hs__img")}</div>
    ${typeBlock(slot, { cls: "hs__ed-type" })}
    <div class="hs__ed-a">${media(slot.media2, url, "hs__img")}</div>
    <div class="hs__ed-b">${media(slot.media3, url, "hs__img")}</div>
  </section>`;
  }

  if (slot.layout === "cta") {
    return `
  <section class="hs hs--cta"${s} aria-label="${alt(slot)}">
    ${typeBlock(slot, { note: false })}
    ${slot.media ? `<div class="hs__cta-media">${media(slot.media, url, "hs__img")}</div>` : ""}
  </section>`;
  }

  // left-image / right-image
  const side = slot.layout === "right-image" ? "right" : "left";
  return `
  <section class="hs hs--split hs--${side}"${s} aria-label="${alt(slot)}">
    <div class="hs__media">
      <picture>
        ${slot.mediaMobile ? `<source media="(max-width: 820px)" srcset="${esc(url(slot.mediaMobile))}">` : ""}
        ${media(slot.media, url, "hs__img")}
      </picture>
    </div>
    ${typeBlock(slot)}
  </section>`;
}

/** 並んだ枠すべて */
const homeSlotsHTML = (slots, opts = {}) =>
  slots.map((slot, i) => homeSlotHTML(slot, { ...opts, first: i === 0 })).join("\n");


  /**
   * ページの深さに応じた相対パスへ変換する（file:// でも壊れないようにする）。
   * 1ファイル版では、埋め込んだ画像の表を先に引く。
   */
  function url(path) {
    var p = String(path == null ? "" : path);
    // 自分で登録した絵は data: URL のまま。外部URLも書き換えない
    if (p.slice(0, 5) === "data:" || p.slice(0, 5) === "blob:" || /^https?:/.test(p) || p.charAt(0) === "#") return p;
    var map = window.PINK_ASSETS;
    if (map && map[p]) return map[p];
    var base = window.PINK_BASE || "/";
    return base + p.replace(/^\//, "");
  }

  window.PINK = {
    catalog: { SCHEMA_VERSION, renderProfile, layerDefinitions, equipSlots, categories, items, baseLayers, compatibilityRules, girls, collections, artworks, updates, homeSlots, homeSections, flavorOf, thumbOf, itemById, itemsByCategory, collectionBySlug, publicItems, archiveCounts },
    core: { REQUIRED_SLOTS, configure, catalog, getItem, categoryOf, emptyState, resolveLayers, findConflict, select, deselect, clearAll, toggleLock, ensureRequired, encodeState, decodeState, lookFromDefault },
    store: { load, exportData, importData, save, resetAll, customCategories, customItems, customArtworks, removedIds, mergedCategories, mergedEquipSlots, mergedItems, mergedArtworks, visibleItems, visibleArtworks, isCustom, isRemoved, apply, addCategory, deleteCategory, addItem, addArtwork, updateItem, clearItemOverride, hasOverride, homeSlotsAll, visibleHomeSlots, updateHomeSlot, addHomeSlot, deleteHomeSlot, moveHomeSlot, resetHome, homeSectionsAll, updateHomeSections, mediaLibrary, addHomeSlide, updateHomeSlide, deleteHomeSlide, moveHomeSlide, deleteItem, deleteArtwork, stats },
    home: { homeSlotHTML, homeSlotsHTML },
    url: url,
  };
})();
</script>
<script>/** サイト共通の振る舞い。ページ固有の処理は各ページのモジュールに置く。 */
(() => {

/* --- メニュー -------------------------------------------- */
const toggle = document.querySelector(".nav-toggle");
const nav = document.getElementById("site-nav");
if (toggle && nav) {
  toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    nav.dataset.open = String(!open);
    toggle.querySelector(".nav-toggle__text").textContent = open ? "MENU" : "CLOSE";
  });
  nav.addEventListener("click", (e) => { if (e.target.tagName === "A") toggle.click(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && nav.dataset.open === "true") { toggle.click(); toggle.focus(); }
  });
}

/* --- セクションの初回表示 --------------------------------- */
const revealTargets = document.querySelectorAll("[data-reveal]");
if (revealTargets.length) {
  if (!window.IntersectionObserver || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    revealTargets.forEach((el) => el.classList.add("is-in"));
  } else {
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
      }
    }, { rootMargin: "0px 0px -12% 0px" });
    revealTargets.forEach((el) => io.observe(el));
  }
}

/* --- 管理画面で書き換えたフレーバーテキストを反映する -------- */
(() => {
  const { store, catalog } = window.PINK ?? {};
  if (!store || !document.querySelector("[data-flavor-short], [data-flavor-body], [data-item-name]")) return;
  const byId = new Map(store.mergedItems().map((i) => [i.id, i]));
  for (const a of store.mergedArtworks()) byId.set(a.id, a);
  for (const el of document.querySelectorAll("[data-flavor-short]")) {
    const f = catalog.flavorOf(byId.get(el.dataset.flavorShort));
    el.textContent = f?.short ?? "";
  }
  for (const el of document.querySelectorAll("[data-flavor-body]")) {
    const f = catalog.flavorOf(byId.get(el.dataset.flavorBody));
    el.textContent = f?.body ?? "";
  }
  for (const el of document.querySelectorAll("[data-item-name]")) {
    const item = byId.get(el.dataset.itemName);
    if (item?.name) el.textContent = item.name;
  }
})();

/* --- トースト -------------------------------------------- */
function toast(message) {
  const region = document.getElementById("toast-region");
  if (!region) return;
  const el = document.createElement("p");
  el.className = "toast";
  el.textContent = message;
  region.append(el);
  setTimeout(() => el.remove(), 3200);
}
window.pinkToast = toast;

/* --- お気に入り(この端末のブラウザにだけ保存) --------------- */
const FAV_KEY = "pinkindex.favorites.v1";
const readFav = () => {
  try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) ?? "[]")); }
  catch { return new Set(); }
};
const writeFav = (set) => {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...set])); } catch { /* 保存できなくても操作は続行する */ }
};

const favs = readFav();
for (const btn of document.querySelectorAll("[data-fav]")) {
  const id = btn.dataset.fav;
  const sync = () => {
    const on = favs.has(id);
    btn.setAttribute("aria-pressed", String(on));
    if (btn.classList.contains("card__fav")) btn.textContent = on ? "♥" : "♡";
  };
  sync();
  btn.addEventListener("click", (e) => {
    e.preventDefault();
    if (favs.has(id)) { favs.delete(id); toast("お気に入りから外しました"); }
    else { favs.add(id); toast("お気に入りに追加しました（このブラウザにのみ保存）"); }
    writeFav(favs);
    sync();
  });
}

/* --- カウントアップ(ARCHIVE COUNTER) ---------------------- */
const counters = document.querySelectorAll("[data-count-to]");
if (counters.length && window.IntersectionObserver && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      io.unobserve(e.target);
      const to = Number(e.target.dataset.countTo);
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / 700);
        e.target.textContent = String(Math.round(to * (1 - Math.pow(1 - t, 3))));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
  }, { threshold: 0.4 });
  counters.forEach((el) => io.observe(el));
}
})();

/**
 * 初回ローディング演出。
 *
 * 設計上の要点（企画書 5.3 / 5.4）:
 * - 実際の読み込み進捗で数字を進める（偽のアニメーションにしない）
 * - 外周ラインを同じ進捗率で時計回りに描き、先端にだけピンクの点を置く
 * - 100%で数字が左右へ離れ、その間からヒーローのイラストが現れる
 * - 外周ラインはフェードアウトせず、ホームの枠線へ縮んで接続する
 * - 同一セッションでは初回のみフル演出
 * - 進捗が取れない場合も 99% で止めず、最大待機時間でホームへ進める
 */
(() => {
const loader = document.getElementById("loader");
const perimeter = document.getElementById("perimeter");
if (loader) {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const seen = (() => { try { return sessionStorage.getItem("pinkindex.loader.seen") === "1"; } catch { return false; } })();
  const d1 = document.getElementById("loader-d1");
  const d2 = document.getElementById("loader-d2");
  const status = document.getElementById("loader-status");
  const svg = document.getElementById("perimeter-svg");
  const track = document.getElementById("perimeter-track");
  const lineRect = document.getElementById("perimeter-line");
  const tip = document.getElementById("perimeter-tip");
  const homeFrame = document.getElementById("home-frame");

  const MAX_WAIT = 4000;      // これ以上は待たずにホームへ進める
  const MIN_SHOW = seen ? 260 : 900;
  const INSET = 12;           // ホーム側の枠線と同じ内側寸法

  let inset = 0;
  const layout = () => {
    const w = window.innerWidth, h = window.innerHeight;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    for (const r of [track, lineRect]) {
      r.setAttribute("x", inset + 0.5); r.setAttribute("y", inset + 0.5);
      r.setAttribute("width", Math.max(0, w - inset * 2 - 1));
      r.setAttribute("height", Math.max(0, h - inset * 2 - 1));
    }
    return 2 * ((w - inset * 2 - 1) + (h - inset * 2 - 1));
  };
  let perim = layout();
  addEventListener("resize", () => { perim = layout(); draw(shown); }, { passive: true });

  /** 進捗を数字と外周ラインへ反映する */
  let shown = 0;
  const draw = (p) => {
    shown = p;
    const n = Math.round(p * 100);
    const text = String(n).padStart(2, "0");
    d1.textContent = text[0];
    d2.textContent = text.slice(1);
    status.textContent = `サイトを読み込んでいます ${n}%`;
    lineRect.style.strokeDasharray = `${perim}`;
    lineRect.style.strokeDashoffset = `${perim * (1 - p)}`;
    // 先端の点は実際のパス上の座標に置く
    try {
      const pt = lineRect.getPointAtLength(perim * p);
      tip.setAttribute("cx", pt.x); tip.setAttribute("cy", pt.y);
      tip.style.opacity = p > 0.01 && p < 0.999 ? "1" : "0";
    } catch { tip.style.opacity = "0"; }
  };
  draw(0);

  /* --- 実進捗: ファーストビューに必要な画像とフォント ------ */
  const critical = [...document.querySelectorAll('img[fetchpriority="high"], .hero__figure img')];
  const jobs = critical.map((img) => img.complete && img.naturalWidth
    ? Promise.resolve()
    : new Promise((res) => { img.addEventListener("load", res, { once: true }); img.addEventListener("error", res, { once: true }); }));
  if (document.fonts?.ready) jobs.push(document.fonts.ready);
  jobs.push(new Promise((res) => (document.readyState === "complete" ? res() : addEventListener("load", res, { once: true }))));

  let done = 0;
  const total = jobs.length;
  const realProgress = () => Math.min(1, done / total);
  jobs.forEach((j) => j.then(() => { done++; }));

  const started = performance.now();
  let finished = false;

  // 進捗はタイマーで進める。requestAnimationFrame はタブが背面にあると
  // 供給が止まり、ローダーが途中で固まって見えるため、進行の主軸にはしない。
  const TICK = 40;
  const timer = setInterval(() => {
    const elapsed = performance.now() - started;
    // 実進捗を主にしつつ、取得不能なときも時間で補間して 99% 停止を避ける
    const target = Math.max(realProgress(), Math.min(0.92, elapsed / MAX_WAIT));
    const ready = (done >= total && elapsed > MIN_SHOW) || elapsed > MAX_WAIT;
    const next = ready ? shown + 0.08 : shown + (target - shown) * 0.25;
    draw(Math.max(shown, Math.min(1, next)));
    if (ready && shown > 0.985) finish();
  }, TICK);

  // 何が起きても必ずホームへ進める最終防衛線
  const hardStop = setTimeout(finish, MAX_WAIT + 1500);

  function finish() {
    if (finished) return;
    finished = true;
    clearInterval(timer);
    clearTimeout(hardStop);
    draw(1);
    status.textContent = "読み込みが完了しました";
    try { sessionStorage.setItem("pinkindex.loader.seen", "1"); } catch { /* 無視してよい */ }

    if (reduced) {
      // 線描画と数字分割を省略し、短いクロスフェードにする
      loader.dataset.state = "done";
      perimeter.classList.add("perimeter--faded");
      setTimeout(release, 200);
      return;
    }

    loader.dataset.state = "exit";     // 数字が左右へ離れる
    perimeter.classList.add("perimeter--handoff");

    // 外周ラインをホームの枠線位置まで縮め、そのまま静的な枠へ引き継ぐ
    const startTime = performance.now();
    const shrinkTimer = setInterval(() => {
      const t = Math.min(1, (performance.now() - startTime) / 520);
      inset = INSET * (1 - Math.pow(1 - t, 3));
      perim = layout();
      lineRect.style.strokeDasharray = `${perim}`;
      lineRect.style.strokeDashoffset = "0";
      if (t >= 1) {
        clearInterval(shrinkTimer);
        homeFrame?.classList.add("is-on");
        perimeter.classList.add("perimeter--faded");
      }
    }, 24);

    setTimeout(() => { loader.dataset.state = "done"; }, 120);
    setTimeout(release, 900);
  }

  function release() {
    loader.hidden = true;
    perimeter.hidden = true;
    document.body.removeAttribute("data-loading");
    document.dispatchEvent(new CustomEvent("pinkindex:loaded"));
  }
}
})();

/**
 * HOME
 *
 * - 管理画面（/studio/home/）で編集した内容があれば、その並びで描き直す
 * - 先頭のキービジュアルは横スクロールで切り替える。
 *   スワイプ・矢印・ドット・キーボードのどれでも動かせるようにする
 */
(() => {
  const { store, home, url } = window.PINK ?? {};
  const root = document.getElementById("home-slots");
  if (!root || !store) return;

  if (store.stats().homeEdited) {
    const slots = store.visibleHomeSlots();
    root.innerHTML = slots.length
      ? home.homeSlotsHTML(slots, { url })
      : `<section class="hs" style="padding:var(--s-9) var(--page-x)">
           <p class="hs__eyebrow">HOME</p>
           <h1 class="hs__title">PINK INDEX</h1>
           <p class="hs__copy">表示する枠がありません。管理画面のHOMEから、公開する枠を選んでください。</p>
           <a class="hs__link" href="${url("/studio/home/")}">HOMEを編集する</a>
         </section>`;
  }

  /* --- 下部の区画（もくじ・点数）の表示切替 ---------------- */
  const sections = store.homeSectionsAll();
  const box = (id) => document.getElementById(id);
  if (box("home-index")) box("home-index").hidden = sections.index === false;
  if (box("home-archive")) box("home-archive").hidden = sections.archive === false;

  /* --- キービジュアルの切り替え --------------------------- */
  const kv = root.querySelector("[data-kv]");
  if (!kv) return;
  const track = kv.querySelector(".kv__track");
  const slides = [...track.querySelectorAll(".kv__slide")];
  const dots = [...kv.querySelectorAll("[data-kv-go]")];
  const current = kv.querySelector("[data-kv-current]");
  const prev = kv.querySelector("[data-kv-prev]");
  const next = kv.querySelector("[data-kv-next]");
  if (slides.length < 2) { kv.querySelector(".kv__nav")?.remove(); return; }

  let index = 0;
  let painted = -1;
  const clamp = (i) => Math.max(0, Math.min(slides.length - 1, i));

  /** 現在位置を、色だけでなく数字・ドット・読み上げ対象にも反映する */
  const paint = () => {
    painted = index;
    dots.forEach((d, n) => d.setAttribute("aria-current", String(n === index)));
    if (current) current.textContent = String(index + 1);
    prev.disabled = index === 0;
    next.disabled = index === slides.length - 1;
    // 見えていないスライドは読み上げ・タブ移動の対象から外す
    slides.forEach((s, n) => s.toggleAttribute("inert", n !== index));
  };

  // 動きを減らす設定の人には、なめらかな移動をせず即座に切り替える
  const calm = matchMedia("(prefers-reduced-motion: reduce)");
  const goTo = (i) => {
    index = clamp(i);
    track.scrollTo({ left: slides[index].offsetLeft - slides[0].offsetLeft, behavior: calm.matches ? "auto" : "smooth" });
    paint();
  };

  /** 指でスワイプされたときも、いま写っている枚数から現在位置を合わせる */
  const sync = () => {
    const i = clamp(Math.round(track.scrollLeft / track.clientWidth));
    if (i === painted) return;
    index = i;
    paint();
  };

  prev.addEventListener("click", () => goTo(index - 1));
  next.addEventListener("click", () => goTo(index + 1));
  dots.forEach((d) => d.addEventListener("click", () => goTo(Number(d.dataset.kvGo))));

  track.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); goTo(index + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); goTo(index - 1); }
  });

  let ticking = false;
  track.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { sync(); ticking = false; });
  }, { passive: true });
  addEventListener("resize", sync, { passive: true });
  paint();
})();

/**
 * DRESS UP の操作。
 *
 * 判定ロジックは src/data/dressup-core.mjs（Nodeのテストと同じコード）にあり、
 * ビルド時に client/core.js へまとめて window.PINK として渡される。
 * ここは DOM への反映だけを担当する。
 *
 * 素材一覧はサーバー側で組み込み分を書き出したうえで、
 * 読み込み後に、自分で登録した素材だけで組み立て直す。
 */
(() => {
  const { core, store, catalog, url } = window.PINK;
  const root = document.getElementById("dressup");
  if (!root) return;
  store.apply();

  const canvas = document.getElementById("canvas");
  const conflictEl = document.getElementById("conflict");
  const currentEl = document.getElementById("current-look");
  const panelList = document.getElementById("panel-list");
  const catTabs = document.querySelector(".cat-tabs");
  const toast = (m) => window.pinkToast?.(m);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const thumbFor = (item) => (item.custom ? item.pieces[0].media : url(catalog.thumbOf(item)));

  /* --- 履歴つき状態 -------------------------------------- */
  let state = core.ensureRequired(initialState());
  const past = [];
  const future = [];

  function initialState() {
    const params = new URLSearchParams(window.PINK_QUERY ?? location.search);
    const look = params.get("look");
    if (look) {
      const decoded = core.decodeState(look);
      if (decoded) {
        if (decoded.missing?.length) {
          setTimeout(() => toast(`${decoded.missing.length}点の素材は現在利用できないため、復元できた部分だけ表示しています`), 400);
        }
        return decoded;
      }
      setTimeout(() => toast("共有された組み合わせを復元できませんでした"), 400);
    }
    const girl = params.get("girl");
    if (girl) {
      const g = catalog.girls.find((x) => x.id === girl);
      if (g) return core.lookFromDefault(g.defaultLook);
    }
    const item = params.get("item");
    const base = { ...core.emptyState(), selected: ["body-standard", "hair-long", "face-calm", "bg-plain"] };
    return item ? core.select(core.ensureRequired(base), item).state : base;
  }

  const commit = (next) => {
    past.push(state);
    if (past.length > 60) past.shift();
    future.length = 0;
    state = core.ensureRequired(next);
    render();
    hideConflict();
  };

  /* --- 素材一覧の組み立て -------------------------------- */
  let categories = [];
  let items = [];

  function buildCatalogViews() {
    categories = store.mergedCategories();
    items = store.visibleItems().filter((i) => (i.status ?? "PUBLISHED") === "PUBLISHED");

    catTabs.innerHTML =
      `<button class="cat-tab" role="tab" aria-selected="true" data-cat="all"><span class="icon" aria-hidden="true">◆</span>すべて</button>` +
      categories.map((c) => `<button class="cat-tab" role="tab" aria-selected="false" data-cat="${esc(c.key)}">
        <span class="icon" aria-hidden="true">${esc(c.icon ?? "◇")}</span>${esc(c.name)}</button>`).join("");

    panelList.innerHTML = categories.map((c) => {
      const list = items.filter((i) => i.cat === c.key);
      if (!list.length) return "";
      return `<section class="parts-section" data-cat-section="${esc(c.key)}">
        <h2 class="index-label" style="margin:var(--s-4) 0 var(--s-3)">
          <span class="index-label__no">${esc(c.en ?? c.key)}</span><span>${esc(c.name)} · ${list.length}</span>
        </h2>
        <div class="parts-grid" role="listbox" aria-label="${esc(c.name)}の素材" aria-multiselectable="true">
          ${list.map(partButton).join("")}
        </div>
      </section>`;
    }).join("") + (items.length ? "" : `
      <div class="empty">
        <p class="empty__title">着せ替えできる素材がまだありません</p>
        <p class="empty__body">管理画面から素体（キャラクター本体）と衣装を登録すると、ここに並びます。</p>
        <p style="margin-top:var(--s-5)"><a class="btn btn--primary" href="${url("/studio/new/")}">絵を登録する</a></p>
      </div>`) + `<p class="empty" id="parts-empty" hidden>
        <span class="empty__title">条件に合う素材がありません</span>
        <span class="empty__body">条件を1つ外すか、「条件をクリア」で全件に戻せます。</span>
      </p>`;

    const lockChips = document.getElementById("lock-chips");
    if (lockChips) {
      lockChips.innerHTML = categories.filter((c) => c.key !== "body" && c.key !== "face")
        .map((c) => `<button class="chip" type="button" data-lock="${esc(c.key)}" aria-pressed="false">${esc(c.name)}</button>`).join("");
    }
  }

  const partButton = (item) => `
    <div class="part-wrap">
    <button class="part" type="button" role="option" aria-selected="false" aria-pressed="false"
            data-item="${esc(item.id)}" data-cat="${esc(item.cat)}"
            data-name="${esc(item.name)}" data-tags="${esc((item.tags ?? []).join(" "))}"
            data-colors="${esc((item.colors ?? []).join(" "))}" data-season="${esc(item.season ?? "")}"
            data-series="${esc(item.series ?? "")}">
      <img class="part__thumb" src="${esc(thumbFor(item))}" alt="" loading="lazy" decoding="async">
      <span class="part__no num">${esc(item.no)}</span>
      <span class="part__name">${esc(item.name)}</span>
      ${item.custom ? '<span class="part__badge">自作</span>' : ""}
      <span class="visually-hidden" data-state-text>未選択</span>
    </button>
    <button class="part__info" type="button" data-info="${esc(item.id)}"
            aria-label="${esc(item.name)}の詳細を見る">i</button>
    </div>`;

  /* --- 描画 ---------------------------------------------- */
  function render() {
    const pieces = core.resolveLayers(state);
    canvas.textContent = "";
    for (const p of pieces) {
      const img = new Image();
      img.className = "canvas__layer";
      img.alt = "";
      img.decoding = "async";
      img.src = /^data:/.test(p.media) ? p.media : url(p.media);
      img.style.zIndex = String(p.baseOrder);
      canvas.append(img);
    }
    canvas.setAttribute("aria-label", describe());

    for (const btn of panelList.querySelectorAll(".part")) {
      const id = btn.dataset.item;
      const on = state.selected.includes(id);
      btn.setAttribute("aria-pressed", String(on));
      btn.setAttribute("aria-selected", String(on));
      btn.querySelector("[data-state-text]").textContent = on ? "選択中" : "未選択";
      btn.dataset.locked = String(state.locks.includes(btn.dataset.cat));
      btn.dataset.incompatible = String(!on && !!core.findConflict(state.selected, id));
    }
    for (const chip of document.querySelectorAll("[data-lock]")) {
      chip.setAttribute("aria-pressed", String(state.locks.includes(chip.dataset.lock)));
    }

    currentEl.textContent = "";
    for (const id of state.selected) {
      const item = core.getItem(id);
      if (!item || item.cat === "face" || item.cat === "body") continue;
      const chip = document.createElement("span");
      chip.className = "current-look__item";
      chip.innerHTML = `<span class="num">${esc(item.no)}</span><span>${esc(item.name)}</span>`;
      const x = document.createElement("button");
      x.type = "button";
      x.textContent = "×";
      x.setAttribute("aria-label", `${item.name}を外す`);
      x.addEventListener("click", () => commit(core.deselect(state, id)));
      chip.append(x);
      currentEl.append(chip);
    }

    document.getElementById("btn-undo").disabled = past.length === 0;
    document.getElementById("btn-redo").disabled = future.length === 0;
  }

  const describe = () => {
    const names = state.selected.map((id) => core.getItem(id)?.name).filter(Boolean);
    return names.length ? `現在のコーデ: ${names.join("、")}` : "素材を選んでいません";
  };

  const showConflict = (message) => { conflictEl.textContent = message; conflictEl.hidden = false; };
  const hideConflict = () => { conflictEl.hidden = true; };

  /* --- 素材の詳細（フレーバーテキストを読ませる） ------------ */
  const detail = document.getElementById("part-detail");
  const showDetail = (id) => {
    const item = core.getItem(id);
    if (!item) return;
    const f = catalog.flavorOf(item);
    const cat = categories.find((c) => c.key === item.cat);
    detail.innerHTML = `
      <p class="part-detail__no index-label"><span class="index-label__no num">${esc(item.no)}</span>${esc(cat?.name ?? "")}</p>
      <h3 class="part-detail__name">${esc(item.name)}</h3>
      ${f?.body || f?.short
        ? `<p class="part-detail__flavor">${esc(f.body || f.short)}</p>`
        : `<p class="part-detail__flavor part-detail__flavor--empty">フレーバーテキストは登録されていません。</p>`}
      <div class="toolbar">
        ${item.custom ? "" : `<a class="btn btn--sm" href="${url(`/closet/${item.id}/`)}">CLOSETで見る</a>`}
        <span class="spacer"></span>
        <button class="btn btn--sm btn--ghost" type="button" data-close-detail>閉じる</button>
      </div>`;
    detail.hidden = false;
  };
  detail.addEventListener("click", (e) => {
    if (e.target.closest("[data-close-detail]")) detail.hidden = true;
  });

  /* --- 素材の選択（一覧は組み替わるので委譲で受ける） ------- */
  panelList.addEventListener("click", (e) => {
    const info = e.target.closest("[data-info]");
    if (info) { showDetail(info.dataset.info); return; }
    const btn = e.target.closest(".part");
    if (!btn) return;
    const result = core.select(state, btn.dataset.item);
    if (result.blocked) { showConflict(result.blocked.message); return; }
    commit(result.state);
    if (result.removed?.length) {
      const names = result.removed.map((id) => core.getItem(id)?.name).filter(Boolean);
      if (names.length) toast(`${names.join("、")} と入れ替えました`);
    }
    if (root.dataset.view === "full") setView("normal");
  });

  /* --- ツールバー ---------------------------------------- */
  document.getElementById("btn-undo").addEventListener("click", () => {
    if (!past.length) return;
    future.push(state);
    state = past.pop();
    render();
  });
  document.getElementById("btn-redo").addEventListener("click", () => {
    if (!future.length) return;
    past.push(state);
    state = future.pop();
    render();
  });
  document.getElementById("btn-clear").addEventListener("click", () => commit(core.clearAll(state)));

  document.addEventListener("click", (e) => {
    const chip = e.target.closest("[data-lock]");
    if (!chip) return;
    state = core.toggleLock(state, chip.dataset.lock);
    render();
    const name = categories.find((c) => c.key === chip.dataset.lock)?.name;
    toast(state.locks.includes(chip.dataset.lock) ? `${name}をロックしました` : `${name}のロックを解除しました`);
  });

  /* --- 共有 / 保存 / 書き出し ----------------------------- */
  document.getElementById("btn-share").addEventListener("click", async () => {
    const u = new URL(location.href);
    if (window.PINK_SINGLE) u.hash = `#/dressup/?look=${core.encodeState(state)}`;
    else u.search = `?look=${core.encodeState(state)}`;
    try { await navigator.clipboard.writeText(u.toString()); toast("共有URLをコピーしました"); }
    catch { prompt("この共有URLをコピーしてください", u.toString()); }
  });

  const SAVE_KEY = "pinkindex.looks.v1";
  document.getElementById("btn-save").addEventListener("click", () => {
    const name = document.getElementById("look-name").value.trim() || "名前のないコーデ";
    try {
      const saved = JSON.parse(localStorage.getItem(SAVE_KEY) ?? "[]");
      saved.unshift({ name, token: core.encodeState(state), at: new Date().toISOString() });
      localStorage.setItem(SAVE_KEY, JSON.stringify(saved.slice(0, 50)));
      toast(`「${name}」を保存しました（このブラウザにのみ保存）`);
    } catch { toast("このブラウザでは保存できませんでした"); }
  });

  document.getElementById("btn-export").addEventListener("click", async () => {
    const pieces = core.resolveLayers(state);
    const c = document.createElement("canvas");
    c.width = catalog.renderProfile.width;
    c.height = catalog.renderProfile.height;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, c.width, c.height);
    for (const p of pieces) {
      const img = new Image();
      img.src = /^data:/.test(p.media) ? p.media : url(p.media);
      try { await img.decode(); } catch { continue; }
      ctx.drawImage(img, 0, 0, c.width, c.height);
    }
    const filename = `pink-index-${Date.now()}.png`;

    // 埋め込み表示では、ページから直接ファイルを保存できない。
    // 保存の許可を持っている場合はそちらへ渡し、無ければ通常のリンク保存にする。
    let downloads = null;
    try { downloads = window.claude?.use ? await window.claude.use("downloads") : null; } catch { downloads = null; }
    if (downloads) {
      const blob = await new Promise((res) => c.toBlob(res, "image/png"));
      try {
        await downloads.save({ filename, data: blob });
        toast("公開プレビュー解像度で書き出しました");
      } catch (e) {
        toast(e?.code === "declined" ? "書き出しを取りやめました" : "この画面では書き出せませんでした");
      }
      return;
    }

    const a = document.createElement("a");
    a.href = c.toDataURL("image/png");
    a.download = filename;
    a.click();
    toast("公開プレビュー解像度で書き出しました");
  });

  /* --- 検索・絞り込み（既定で畳む） ------------------------ */
  const moreBtn = document.getElementById("panel-more");
  const moreBody = document.getElementById("panel-more-body");
  const UI_KEY = "pinkindex.ui.filters";
  const setMore = (open, remember = true) => {
    moreBtn.setAttribute("aria-expanded", String(open));
    moreBody.hidden = !open;
    moreBtn.textContent = open ? "検索・絞り込み ▴" : "検索・絞り込み ▾";
    if (remember) { try { localStorage.setItem(UI_KEY, open ? "open" : "closed"); } catch { /* 無視 */ } }
  };
  moreBtn.addEventListener("click", () => setMore(moreBtn.getAttribute("aria-expanded") !== "true"));
  try { setMore(localStorage.getItem(UI_KEY) === "open", false); } catch { setMore(false, false); }

  const search = document.getElementById("part-search");
  const countEl = document.getElementById("result-count");
  const activeEl = document.getElementById("active-filters");
  const active = new Map();
  let catFilter = "all";

  function applyFilter() {
    let shown = 0;
    for (const btn of panelList.querySelectorAll(".part")) {
      let ok = catFilter === "all" || btn.dataset.cat === catFilter;
      if (ok) {
        for (const [name, values] of active) {
          if (!values.size) continue;
          const own = (btn.dataset[name] ?? "").split(" ").filter(Boolean);
          if (![...values].every((v) => own.includes(v))) { ok = false; break; }
        }
      }
      const q = search.value.trim().toLowerCase();
      if (ok && q) {
        const hay = `${btn.dataset.name} ${btn.dataset.tags} ${btn.dataset.no ?? ""}`.toLowerCase();
        ok = q.split(/\s+/).every((w) => hay.includes(w));
      }
      btn.hidden = !ok;
      if (ok) shown++;
    }
    for (const sec of panelList.querySelectorAll("[data-cat-section]")) {
      sec.hidden = ![...sec.querySelectorAll(".part")].some((b) => !b.hidden);
    }
    countEl.textContent = String(shown);
    const empty = document.getElementById("parts-empty");
    // 1点も登録されていないときは「まだありません」の案内だけを出す
    if (empty) empty.hidden = shown !== 0 || items.length === 0;
    const labels = [...active].flatMap(([, v]) => [...v]);
    if (catFilter !== "all") labels.unshift(categories.find((c) => c.key === catFilter)?.name ?? catFilter);
    if (search.value.trim()) labels.push(`"${search.value.trim()}"`);
    activeEl.textContent = labels.length ? labels.join(" ・ ") : "条件なし";
  }

  catTabs.addEventListener("click", (e) => {
    const tab = e.target.closest(".cat-tab");
    if (!tab) return;
    catTabs.querySelectorAll(".cat-tab").forEach((t) => t.setAttribute("aria-selected", "false"));
    tab.setAttribute("aria-selected", "true");
    catFilter = tab.dataset.cat;
    applyFilter();
  });
  document.getElementById("filter-chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const { filter, value } = chip.dataset;
    const set = active.get(filter) ?? new Set();
    const on = chip.getAttribute("aria-pressed") === "true";
    if (on) set.delete(value); else set.add(value);
    chip.setAttribute("aria-pressed", String(!on));
    active.set(filter, set);
    applyFilter();
  });
  search.addEventListener("input", applyFilter);
  document.getElementById("btn-reset-filter").addEventListener("click", () => {
    active.clear();
    catFilter = "all";
    catTabs.querySelectorAll(".cat-tab").forEach((t, i) => t.setAttribute("aria-selected", String(i === 0)));
    document.querySelectorAll("#filter-chips .chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
    search.value = "";
    applyFilter();
  });

  /* --- 操作ボタンの置き場所 ------------------------------- */
  const actions = document.getElementById("stage-actions");
  const stageToolbar = document.getElementById("stage-toolbar");
  const narrow = matchMedia("(max-width: 900px)");
  const placeActions = () => {
    if (narrow.matches) stageToolbar.append(...actions.children);
    else if (!actions.children.length) actions.append(...stageToolbar.querySelectorAll("#btn-share, #btn-export, #btn-save"));
  };
  narrow.addEventListener?.("change", placeActions);
  placeActions();

  /* --- ボトムシート（通常 → 拡大 → 鑑賞モード） ------------- */
  const handle = document.getElementById("sheet-handle");
  const VIEWS = ["normal", "full", "focus"];
  const VIEW_LABEL = { normal: "素材パネルを広げる", full: "素材パネルを畳んでプレビューを最大化する", focus: "素材パネルを開く" };
  function setView(view) {
    root.dataset.view = view;
    handle.setAttribute("aria-expanded", String(view !== "focus"));
    handle.querySelector(".visually-hidden").textContent = VIEW_LABEL[view];
  }
  handle?.addEventListener("click", () => setView(VIEWS[(VIEWS.indexOf(root.dataset.view) + 1) % VIEWS.length]));
  setView("normal");

  /* --- キーボード ---------------------------------------- */
  addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea, select")) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      e.preventDefault();
      document.getElementById(e.shiftKey ? "btn-redo" : "btn-undo").click();
    }
  });

  buildCatalogViews();
  applyFilter();
  render();
})();

/**
 * 一覧の絞り込み（CLOSET / GALLERY）。
 *
 * - AND/OR を初期UIで見せず「すべて一致」を既定にする
 * - 選択中の条件と結果件数を常に表示する
 * - 条件の欄は既定で畳む（開いた状態は記憶する）
 * - 一覧には自分で登録した素材を並べ、削除したものは出さない
 */
(() => {
  const { store, catalog, url } = window.PINK ?? {};
  store?.apply();

  const grid = document.getElementById("closet-grid") ?? document.getElementById("gallery-grid");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* --- 自作の素材・作品を一覧へ差し込む ------------------- */
  if (grid && store) {
    for (const card of grid.querySelectorAll("[data-card]")) {
      if (store.isRemoved(card.dataset.id)) card.remove();
    }
    if (grid.id === "closet-grid") {
      const removed = new Set(store.removedIds().items);
      for (const i of store.customItems()) {
        if (removed.has(i.id) || i.cat === "background" || i.cat === "face") continue;
        grid.insertAdjacentHTML("beforeend", `
          <div data-card data-id="${esc(i.id)}" data-cat="${esc(i.cat)}" data-color="${esc((i.colors ?? []).join(" "))}"
               data-season="${esc(i.season)}" data-series="${esc(i.series)}" data-name="${esc(i.name)}"
               data-tags="${esc((i.tags ?? []).join(" "))}" data-no="${esc(i.no)}" data-date="${esc(i.createdOn)}">
            <article class="card">
              <div class="card__media"><img src="${esc(i.pieces[0].media)}" alt="" loading="lazy"></div>
              <div class="card__body">
                <p class="card__no num">${esc(i.no)} <span class="tag-chip">自作</span></p>
                <h3 class="card__name">${esc(i.name)}</h3>
                <p class="card__meta"><time class="num">${esc(String(i.createdOn).replace(/-/g, "."))}</time></p>
              </div>
            </article>
          </div>`);
      }
    }
    if (grid.id === "gallery-grid") {
      const removed = new Set(store.removedIds().artworks);
      for (const a of store.customArtworks()) {
        if (removed.has(a.id)) continue;
        grid.insertAdjacentHTML("beforeend", `
          <article class="card" data-card data-id="${esc(a.id)}" data-series="${esc(a.series)}"
                   data-name="${esc(a.name)}" data-tags="${esc((a.tags ?? []).join(" "))}"
                   data-date="${esc(a.createdOn)}" data-no="${esc(a.no)}">
            <div class="card__media card__media--wide"><img src="${esc(a.media)}" alt="" loading="lazy"></div>
            <div class="card__body">
              <p class="card__no num">No.${esc(a.no)} <span class="tag-chip">自作</span></p>
              <h3 class="card__name">${esc(a.name)}</h3>
              <p class="card__meta"><time class="num">${esc(String(a.createdOn).replace(/-/g, "."))}</time></p>
            </div>
          </article>`);
      }
    }
  }

  if (grid) {
    const cards = [...grid.querySelectorAll("[data-card]")];
    const search = document.getElementById("closet-search");
    const sort = document.getElementById("closet-sort");
    const countEl = document.getElementById("closet-count");
    const activeEl = document.getElementById("closet-active");
    const emptyEl = document.getElementById("closet-empty");
    const resetBtn = document.getElementById("closet-reset");
    const chips = [...document.querySelectorAll(".filters .chip[data-filter]")];
    const active = new Map();

    const matches = (card) => {
      for (const [name, values] of active) {
        if (!values.size) continue;
        const field = { cat: "cat", color: "color", season: "season", series: "series" }[name];
        const own = (card.dataset[field] ?? "").split(" ").filter(Boolean);
        if (![...values].every((v) => own.includes(v))) return false;   // すべて一致
      }
      const q = (search?.value ?? "").trim().toLowerCase();
      if (q) {
        const hay = `${card.dataset.name} ${card.dataset.tags} ${card.dataset.no}`.toLowerCase();
        if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
      }
      return true;
    };

    const reorder = () => {
      if (!sort) return;
      const mode = sort.value;
      const key = (c) => ({ new: c.dataset.date, old: c.dataset.date, no: c.dataset.no, name: c.dataset.name })[mode] ?? "";
      [...cards].sort((a, b) => {
        const r = String(key(a)).localeCompare(String(key(b)), "ja");
        return mode === "new" ? -r : r;
      }).forEach((c) => grid.append(c));
    };

    const apply = () => {
      let shown = 0;
      for (const card of cards) {
        const ok = matches(card);
        card.hidden = !ok;
        if (ok) shown++;
      }
      if (countEl) countEl.textContent = String(shown);
      if (emptyEl) emptyEl.hidden = shown !== 0;
      if (activeEl) {
        const labels = [...active].flatMap(([, v]) => [...v]);
        const q = (search?.value ?? "").trim();
        if (q) labels.push(`"${q}"`);
        activeEl.textContent = labels.length ? labels.join(" ・ ") : "条件なし";
      }
      reorder();
    };

    for (const chip of chips) {
      chip.addEventListener("click", () => {
        const { filter, value } = chip.dataset;
        const set = active.get(filter) ?? new Set();
        const on = chip.getAttribute("aria-pressed") === "true";
        if (on) set.delete(value); else set.add(value);
        chip.setAttribute("aria-pressed", String(!on));
        active.set(filter, set);
        apply();
      });
    }

    /* 条件の欄は既定で畳む。開いたかどうかは記憶する */
    const fToggle = document.getElementById("filters-toggle");
    const fBody = document.getElementById("filters-body");
    const UI_KEY = "pinkindex.ui.closetFilters";
    const setOpen = (open, remember = true) => {
      if (!fToggle || !fBody) return;
      fToggle.setAttribute("aria-expanded", String(open));
      fBody.hidden = !open;
      fToggle.textContent = open ? "絞り込みを閉じる ▴" : "カテゴリ・色・季節・シリーズで絞り込む ▾";
      if (remember) { try { localStorage.setItem(UI_KEY, open ? "open" : "closed"); } catch { /* 無視 */ } }
    };
    fToggle?.addEventListener("click", () => setOpen(fToggle.getAttribute("aria-expanded") !== "true"));
    try { setOpen(localStorage.getItem(UI_KEY) === "open", false); } catch { setOpen(false, false); }

    search?.addEventListener("input", apply);
    sort?.addEventListener("change", apply);
    resetBtn?.addEventListener("click", () => {
      active.clear();
      chips.forEach((c) => c.setAttribute("aria-pressed", "false"));
      if (search) search.value = "";
      apply();
    });
    apply();
  }

  /* GALLERY: 絞り込みは初期状態で閉じておく */
  const gToggle = document.getElementById("gallery-filter-toggle");
  const gFilters = document.getElementById("gallery-filters");
  if (gToggle && gFilters) {
    gToggle.addEventListener("click", () => {
      const open = gToggle.getAttribute("aria-expanded") === "true";
      gToggle.setAttribute("aria-expanded", String(!open));
      gFilters.hidden = open;
      gToggle.textContent = open ? "絞り込みを開く" : "絞り込みを閉じる";
    });
  }
})();

/**
 * STUDIO（管理画面）の振る舞い。
 *
 * 一覧はここで組み立てる。組み込みの素材と、利用者がこの端末に登録した
 * 素体・衣装・小物・カテゴリを合成して表示するため。
 */
(() => {
  const { core, store, catalog, home, url } = window.PINK;
  const toast = (m) => window.pinkToast?.(m);
  store.apply();

  const el = (id) => document.getElementById(id);
  const thumbFor = (item) => (item.custom ? item.pieces[0].media : url(catalog.thumbOf(item)));
  const catName = (key) => store.mergedCategories().find((c) => c.key === key)?.name ?? key;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /**
   * 取り消しの確認。ダイアログを出せない環境（埋め込み表示など）でも
   * 確実に動くよう、ボタン自身を2度押しに切り替える。
   */
  const confirmTwice = (btn, label) => {
    if (btn.dataset.armed === "1") return true;
    const original = btn.textContent;
    btn.dataset.armed = "1";
    btn.textContent = label;
    btn.classList.add("btn--danger");
    setTimeout(() => {
      if (!btn.isConnected) return;
      btn.dataset.armed = "";
      btn.textContent = original;
      btn.classList.remove("btn--danger");
    }, 4000);
    return false;
  };

  /* ============ 共通: プレビュー ============ */
  const LOOKS = [
    ["body-standard", "hair-long", "face-calm", "dress-rose", "shoes-mary", "bg-plain"],
    ["body-standard", "hair-twin", "face-smile", "top-hoodie", "bottom-pleats", "socks-short", "shoes-loafer", "bg-window"],
    ["body-standard", "hair-bob", "face-calm", "dress-gothic", "socks-knee", "shoes-boots", "bg-plain"],
  ];
  let lookIndex = 0;
  let previewPiece = null;   // 登録しようとしている素材
  let showPreview = true;

  function drawPreview() {
    const canvas = el("studio-canvas");
    if (!canvas) return;
    const selected = LOOKS[lookIndex].filter((id) => core.getItem(id));
    const pieces = core.resolveLayers({ ...core.emptyState(), selected });
    if (previewPiece && showPreview) {
      const layerDef = catalog.layerDefinitions.find((l) => l.key === previewPiece.layer);
      pieces.push({ key: "preview", media: previewPiece.media, baseOrder: layerDef?.baseOrder ?? 999, localOrder: 0 });
      pieces.sort((a, b) => a.baseOrder - b.baseOrder || a.localOrder - b.localOrder);
    }
    canvas.textContent = "";
    for (const p of pieces) {
      const img = new Image();
      img.className = "canvas__layer";
      img.alt = "";
      img.src = p.key === "preview" ? p.media : url(p.media);
      img.style.zIndex = String(p.baseOrder);
      canvas.append(img);
    }
  }
  el("studio-toggle")?.addEventListener("click", () => { showPreview = !showPreview; drawPreview(); });
  el("studio-next-look")?.addEventListener("click", () => { lookIndex = (lookIndex + 1) % LOOKS.length; drawPreview(); });

  /* ============ ダッシュボード ============ */
  if (el("dash-counts")) {
    const items = store.visibleItems();
    const arts = store.visibleArtworks();
    const st = store.stats();
    const groups = {
      素体: items.filter((i) => i.cat === "body").length,
      髪: items.filter((i) => i.cat === "hair").length,
      衣装: items.filter((i) => ["dress", "top", "bottom", "outer"].includes(i.cat)).length,
      小物: items.filter((i) => ["headwear", "accessory", "socks", "shoes"].includes(i.cat)).length,
      作品: arts.length,
    };
    el("dash-counts").innerHTML = `
      <div class="dash-card"><h3>Total</h3><p class="dash-card__value num">${items.length + arts.length}</p>
        <p class="card__meta">${Object.entries(groups).map(([k, v]) => `<span>${k} <span class="num">${v}</span></span>`).join("")}</p></div>
      <div class="dash-card"><h3>自分で登録</h3><p class="dash-card__value num">${st.custom}</p>
        <p class="card__meta"><span>カテゴリ <span class="num">${st.categories}</span></span></p></div>
      <div class="dash-card"><h3>削除した組み込み素材</h3><p class="dash-card__value num">${st.removed}</p>
        <p class="card__meta"><span>削除は取り消せません</span></p></div>`;

    const recent = [...items].sort((a, b) => String(b.createdOn).localeCompare(String(a.createdOn))).slice(0, 6);
    el("dash-recent").innerHTML = recent.map((i) => `<li>
      <span class="order num">${esc(i.no)}</span>
      <span>${esc(i.name)}${i.custom ? ' <span class="tag-chip">自作</span>' : ""}</span>
      <span class="status-pill" data-status="${i.status ?? "PUBLISHED"}">${esc(catName(i.cat))}</span>
      <time class="num">${String(i.createdOn).replace(/-/g, ".")}</time></li>`).join("");

    el("dash-bytes").textContent = `${Math.max(1, Math.round(st.bytes / 1024))} KB`;
    el("dash-reset")?.addEventListener("click", (e) => {
      if (!confirmTwice(e.currentTarget, "編集をすべて取り消す（もう一度押す）")) return;
      store.resetAll();
      toast("編集をすべて取り消しました");
      location.reload();
    });

    /* --- 公開サイトへ反映するための書き出し / 読み込み --- */
    el("dash-export")?.addEventListener("click", async () => {
      const json = store.exportData();
      const filename = "site-data.json";
      let downloads = null;
      try { downloads = window.claude?.use ? await window.claude.use("downloads") : null; } catch { downloads = null; }
      if (downloads) {
        try { await downloads.save({ filename, data: json }); toast("書き出しました"); }
        catch (err) { toast(err?.code === "declined" ? "書き出しを取りやめました" : "この画面では書き出せませんでした"); }
        return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
      toast("site-data.json を書き出しました");
    });

    el("dash-import")?.addEventListener("click", () => el("dash-import-file").click());
    el("dash-import-file")?.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const r = store.importData(await file.text());
      toast(r.ok ? "読み込みました" : r.reason);
      if (r.ok) location.reload();
    });
  }

  const mToggle = el("metrics-toggle");
  mToggle?.addEventListener("click", () => {
    const open = mToggle.getAttribute("aria-expanded") === "true";
    mToggle.setAttribute("aria-expanded", String(!open));
    el("metrics-body").hidden = open;
    mToggle.textContent = open ? "表示する" : "隠す";
  });

  /* ============ 新規登録 ============ */
  if (el("entry-form")) {
    const catSelect = el("e-cat");
    const fill = () => {
      catSelect.innerHTML = store.mergedCategories()
        .map((c) => `<option value="${c.key}">${esc(c.icon ?? "")} ${esc(c.name)}</option>`).join("");
    };
    fill();
    el("e-date").value = new Date().toISOString().slice(0, 10);

    const kind = el("kind");
    kind.addEventListener("change", () => {
      const isArt = kind.value === "artwork";
      el("cat-field").hidden = isArt;
      el("register-note").textContent = isArt
        ? "登録した作品は GALLERY に出ます。保存先はこの端末のブラウザです。"
        : "登録した素材はすぐ DRESS UP と CLOSET に出ます。保存先はこの端末のブラウザです。";
    });

    /* --- 画像の取り込み --- */
    const dz = el("dropzone");
    const input = el("file-input");
    let picked = null;

    const inspect = (rows) => {
      el("inspect").innerHTML = rows.map(([ok, label, state]) =>
        `<li data-ok="${ok}"><span class="mark">●</span><span>${esc(label)}</span><span class="state">${esc(state)}</span></li>`).join("");
    };

    async function takeFile(file) {
      if (!file) return;
      const isSvg = file.type === "image/svg+xml" || /\.svg$/i.test(file.name);
      try {
        if (isSvg) {
          const text = await file.text();
          if (/<script|onload=/i.test(text)) {
            inspect([["false", "SVGの内容", "スクリプトを含むため取り込めません"]]);
            return;
          }
          picked = { media: `data:image/svg+xml;utf8,${encodeURIComponent(text)}`, kind: "SVG", w: 0, h: 0 };
        } else {
          picked = await rasterToCanvas(file);
        }
      } catch {
        inspect([["false", "画像の読み込み", "この形式は取り込めませんでした"]]);
        return;
      }
      const sizeKb = Math.round(picked.media.length / 1024);
      inspect([
        ["true", "形式", picked.kind],
        ["true", "キャンバス", picked.w ? `${picked.w} × ${picked.h} → 720 × 1080 に配置` : "720 × 1080（そのまま）"],
        [sizeKb > 900 ? "false" : "true", "データの大きさ", `${sizeKb} KB${sizeKb > 900 ? "（大きすぎます。縮小してください）" : ""}`],
        ["pending", "重なりの確認", "右のプレビューで確認"],
      ]);
      const cat = store.mergedCategories().find((c) => c.key === catSelect.value);
      previewPiece = { media: picked.media, layer: cat?.layer ?? layerForCat(catSelect.value) };
      showPreview = true;
      drawPreview();
      if (!el("e-name").value) el("e-name").value = file.name.replace(/\.[^.]+$/, "");
      markStep(2);
    }

    /** 720×1080 のキャンバスへ、縦横比を保って収める */
    function rasterToCanvas(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const W = 720, H = 1080;
            const c = document.createElement("canvas");
            c.width = W; c.height = H;
            const ctx = c.getContext("2d");
            const scale = Math.min(W / img.width, H / img.height);
            const w = img.width * scale, h = img.height * scale;
            ctx.drawImage(img, (W - w) / 2, H - h, w, h);   // 足元を基準にそろえる
            resolve({ media: c.toDataURL("image/png"), kind: "PNG", w: img.width, h: img.height });
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
