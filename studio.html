<script id="public-template" type="application/json">"<title>PINK INDEX<\/title>\n<link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23FFF9FC%22%2F%3E%20%3Cpath%20d%3D%22M9%208h11l4%205-4%205H9z%22%20fill%3D%22none%22%20stroke%3D%22%23171417%22%20stroke-width%3D%222%22%2F%3E%20%3Ccircle%20cx%3D%2212.5%22%20cy%3D%2213%22%20r%3D%221.6%22%20fill%3D%22%23171417%22%2F%3E%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2224%22%20r%3D%222.5%22%20fill%3D%22%23FF4FA3%22%2F%3E%20%3C%2Fsvg%3E\">\n<style>\n/* ============================================================\n   PINK INDEX — Design Tokens\n   企画書 4章「ブランド・ビジュアルシステム」に対応する唯一の正本。\n   色・余白・文字・罫線・角丸・モーションはここだけで定義し、\n   個別CSSではハードコードした値を使わない。\n   基本比率: 白・淡いピンク 75% / 黒 20% / 鮮やかなピンク 5%\n   ============================================================ */\n\n:root {\n  /* --- Color: 面(75%) ------------------------------------- */\n  --c-canvas: #fff9fc;      /* サイト全体の基本背景 */\n  --c-white: #ffffff;       /* 画像面、モーダル、入力欄 */\n  --c-pale-pink: #ffe8f2;   /* 巨大背景文字、選択領域の淡色面 */\n  --c-pink-mist: #fff2f7;   /* ホバー、空状態、補助背景 */\n\n  /* --- Color: 骨格(20%) ----------------------------------- */\n  --c-ink: #171417;         /* 数字、見出し、主要テキスト、線 */\n  --c-ink-muted: #756a71;   /* 補足、制作日、メタ情報 */\n  --c-hairline: #e8dee3;    /* 罫線、非選択枠、区切り */\n\n  /* --- Color: アクセント(5%) ------------------------------- */\n  --c-accent: #ff4fa3;      /* 小さな印、選択点、リンク矢印のみ */\n  --c-focus: #6d4aff;       /* キーボードフォーカス */\n\n  /* 状態色。面ではなく細線・小面積で使う */\n  --c-danger: #c02b52;\n  --c-ok: #1f7a5a;\n\n  /* --- Typography ----------------------------------------- */\n  --font-jp: \"Zen Kaku Gothic New\", \"Noto Sans JP\", \"Hiragino Kaku Gothic ProN\",\n    \"Yu Gothic\", system-ui, sans-serif;\n  --font-en: \"Archivo\", \"Helvetica Neue\", \"Segoe UI\", Arial, sans-serif;\n  --font-num: var(--font-en);\n\n  /* 流体タイプスケール。最小/最大を固定し、極端な縮小を避ける */\n  --t-hero: clamp(3.5rem, 13vw, 11rem);      /* ローダー数字・巨大見出し */\n  --t-display: clamp(2.25rem, 7vw, 5.5rem);  /* セクション大見出し */\n  --t-title: clamp(1.5rem, 3.2vw, 2.5rem);\n  --t-lead: clamp(1rem, 1.5vw, 1.25rem);\n  --t-body: 1rem;\n  --t-sm: 0.8125rem;\n  --t-xs: 0.6875rem;                          /* ラベル・番号。字間を広げて使う */\n\n  --lh-tight: 1.05;\n  --lh-heading: 1.25;\n  --lh-body: 1.8;      /* 日本語本文は広めに */\n  --ls-label: 0.16em;  /* INDEXラベル・英字小文字 */\n  --ls-hero: -0.02em;\n\n  --w-regular: 400;\n  --w-medium: 500;\n  --w-bold: 700;\n\n  /* --- Space: 4pxベース ----------------------------------- */\n  --s-1: 0.25rem;\n  --s-2: 0.5rem;\n  --s-3: 0.75rem;\n  --s-4: 1rem;\n  --s-5: 1.5rem;\n  --s-6: 2rem;\n  --s-7: 3rem;\n  --s-8: 4rem;\n  --s-9: 6rem;\n  --s-10: 8rem;\n  --section-y: clamp(3rem, 9vw, 8rem);\n  --page-x: clamp(1.25rem, 4vw, 4rem);\n  --measure: 34em;         /* 本文の最大行長 */\n\n  /* --- Line / Radius -------------------------------------- */\n  --line: 1px;\n  --line-ink: var(--line) solid var(--c-ink);\n  --line-hair: var(--line) solid var(--c-hairline);\n  --line-pink: var(--line) solid var(--c-pale-pink);\n  --r-1: 2px;\n  --r-2: 8px;    /* 標準 */\n  --r-3: 12px;   /* 大きめのパネル */\n  --r-pill: 999px; /* タグ・フィルターのみ */\n\n  /* 影は「実際に前後関係がある要素」だけに使う */\n  --shadow-float: 0 12px 32px rgba(23, 20, 23, 0.1);\n  --shadow-sheet: 0 -8px 28px rgba(23, 20, 23, 0.12);\n\n  /* --- Motion --------------------------------------------- */\n  --m-micro: 170ms;   /* ホバー、選択、チェック */\n  --m-panel: 300ms;   /* フィルター、ボトムシート、モーダル */\n  --m-reveal: 520ms;  /* セクション見出し、作品の初回表示 */\n  --m-loader-exit: 560ms;\n  --ease-out: cubic-bezier(0.16, 0.84, 0.32, 1); /* 素早く出て静かに止まる */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n\n  /* --- Layout --------------------------------------------- */\n  --grid-cols: 12;\n  --grid-gap: clamp(1rem, 2vw, 2rem);\n  --max-w: 1600px;\n  --header-h: 64px;\n  --tap-min: 44px;   /* タップ対象の下限 */\n  --z-sticky: 30;\n  --z-sheet: 60;\n  --z-header: 70;\n  --z-dialog: 80;\n  --z-loader: 100;\n}\n\n@media (max-width: 900px) {\n  :root {\n    --grid-cols: 8;\n    --header-h: 56px;\n  }\n}\n@media (max-width: 640px) {\n  :root {\n    --grid-cols: 4;\n  }\n}\n\n/* モーション軽減。演出は削るが、状態変化は色/枠で必ず分かるようにする */\n@media (prefers-reduced-motion: reduce) {\n  :root {\n    --m-micro: 1ms;\n    --m-panel: 1ms;\n    --m-reveal: 1ms;\n    --m-loader-exit: 1ms;\n  }\n  *,\n  *::before,\n  *::after {\n    animation-duration: 1ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 1ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n\n/* ============================================================\n   PINK INDEX — Base / Layout\n   ============================================================ */\n\n*,\n*::before,\n*::after { box-sizing: border-box; }\n\nhtml {\n  -webkit-text-size-adjust: 100%;\n  scroll-behavior: smooth;\n  /* 横スクロールは各区画側で閉じる。\n     ここで overflow-x: clip を掛けると、Chromeでは縦スクロールまで\n     止まってしまうため使わない（tools/check-layout.mjs で常時検査する）。 */\n}\n\nbody {\n  margin: 0;\n  background: var(--c-canvas);\n  color: var(--c-ink);\n  font-family: var(--font-jp);\n  font-size: var(--t-body);\n  line-height: var(--lh-body);\n  font-weight: var(--w-regular);\n  -webkit-font-smoothing: antialiased;\n  font-feature-settings: \"palt\" 1;\n}\n\n/* 数字はカウント中に幅が揺れないよう等幅数字を強制 */\n.num, .u-num, time, .count { font-variant-numeric: tabular-nums; font-feature-settings: \"tnum\" 1; }\n\nh1, h2, h3, h4 {\n  margin: 0;\n  line-height: var(--lh-heading);\n  font-weight: var(--w-bold);\n  letter-spacing: -0.01em;\n}\np { margin: 0 0 var(--s-4); max-width: min(var(--measure), 100%); }\nul, ol { margin: 0; padding: 0; list-style: none; }\nimg, svg { max-width: 100%; display: block; }\n/* display を指定した部品が [hidden] を打ち消さないようにする */\n[hidden] { display: none !important; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\n\na {\n  color: var(--c-ink);\n  text-decoration: none;\n  text-underline-offset: 0.25em;\n}\na:hover { text-decoration: underline; text-decoration-thickness: 1px; }\n\n/* フォーカスリングは絶対に消さない。識別性のためVioletを使う */\n:focus-visible {\n  outline: 2px solid var(--c-focus);\n  outline-offset: 3px;\n  border-radius: var(--r-1);\n}\n\n.visually-hidden {\n  position: absolute !important;\n  width: 1px; height: 1px;\n  margin: -1px; padding: 0; border: 0;\n  clip-path: inset(50%);\n  overflow: hidden; white-space: nowrap;\n}\n\n.skip-link {\n  position: absolute; left: var(--s-4); top: -100px;\n  z-index: calc(var(--z-header) + 1);\n  background: var(--c-ink); color: var(--c-white);\n  padding: var(--s-3) var(--s-4); border-radius: var(--r-2);\n  transition: top var(--m-micro) var(--ease-out);\n}\n.skip-link:focus { top: var(--s-4); }\n\n/* 着せ替えのような操作画面は、ページ全体を伸ばさず画面内に収める。\n   スクロールは素材一覧など、必要な部分だけに閉じ込める。 */\nbody.app-screen { overflow: hidden; height: 100svh; }\nbody.app-screen .site-footer { display: none; }\n\n/* --- Page frame ------------------------------------------ */\n.page { max-width: var(--max-w); margin: 0 auto; padding: 0 var(--page-x); }\n.section { padding-block: var(--section-y); }\n.stack > * + * { margin-top: var(--s-4); }\n\n.grid {\n  display: grid;\n  grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));\n  gap: var(--grid-gap);\n}\n\n/* --- Header ----------------------------------------------\n   4つの状態を持つ。切り替えは client/site.js。\n     top      背景は完全に透明。キービジュアルが背後まで見える\n     hidden   下へ移動したら上へ滑らせて隠す\n     frosted  上へ戻したら乳白色＋ぼかし＋ごく薄い下線で戻す\n   文字色は表示中の作品に合わせて data-tone で切り替える。\n   --------------------------------------------------------- */\n.site-header {\n  position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-header);\n  min-height: var(--header-h);\n  display: flex; align-items: center; gap: clamp(var(--s-4), 3vw, var(--s-7));\n  padding: 0 var(--page-x);\n  color: var(--c-ink);\n  background: transparent;\n  border-bottom: 1px solid transparent;\n  transition: transform 250ms var(--ease-out), background-color 250ms var(--ease-out),\n              border-color 250ms var(--ease-out), color 200ms var(--ease-out);\n}\n/* 先頭以外のページは、白い面の上に置くので常に読みやすくしておく */\nbody:not(.has-hero) .site-header { background: var(--c-canvas); border-bottom-color: var(--c-hairline); }\nbody:not(.has-hero) #main { padding-top: var(--header-h); }\n\n.site-header[data-tone=\"light\"] { color: var(--c-white); }\n.site-header[data-state=\"hidden\"] { transform: translateY(-100%); }\n.site-header[data-state=\"frosted\"] {\n  color: var(--c-ink);\n  background: color-mix(in srgb, var(--c-white) 78%, transparent);\n  backdrop-filter: blur(14px) saturate(1.1);\n  border-bottom-color: color-mix(in srgb, var(--c-ink) 8%, transparent);\n}\n/* ぼかしが使えない環境では、不透明度を上げた白へ切り替える */\n@supports not (backdrop-filter: blur(4px)) {\n  .site-header[data-state=\"frosted\"] { background: color-mix(in srgb, var(--c-white) 96%, transparent); }\n}\n\n.site-header__logo {\n  font-family: var(--font-en); font-weight: var(--w-bold);\n  font-size: 0.95rem; letter-spacing: var(--ls-label); text-transform: uppercase;\n  color: inherit; display: inline-flex; align-items: center; min-height: var(--tap-min);\n}\n.site-header__logo:hover { color: inherit; text-decoration: none; opacity: 0.7; }\n\n.site-nav { margin-left: auto; display: flex; gap: clamp(var(--s-3), 2vw, var(--s-6)); align-items: center; }\n.site-nav a {\n  display: inline-flex; align-items: center; min-height: var(--tap-min);\n  font-family: var(--font-en); font-size: var(--t-xs);\n  letter-spacing: var(--ls-label); text-transform: uppercase;\n  color: inherit; opacity: 0.72;\n  border-bottom: 2px solid transparent;\n  transition: opacity var(--m-micro) var(--ease-out), border-color var(--m-micro) var(--ease-out);\n}\n.site-nav a:hover { opacity: 1; text-decoration: none; }\n.site-nav a[aria-current=\"page\"] { opacity: 1; border-bottom-color: var(--c-accent); }\n.site-header :focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }\n\n.nav-toggle { display: none; }\n\n@media (max-width: 900px) {\n  .site-nav {\n    position: fixed; inset: 0;\n    flex-direction: column; align-items: flex-start; justify-content: center;\n    gap: var(--s-3);\n    background: var(--c-ink); color: var(--c-white);\n    padding: var(--header-h) var(--page-x) var(--s-8);\n    opacity: 0; pointer-events: none;\n    transition: opacity var(--m-panel) var(--ease-out);\n  }\n  .site-nav[data-open=\"true\"] { opacity: 1; pointer-events: auto; }\n  .site-nav a { width: 100%; padding: var(--s-3) 0; font-size: 1.5rem; opacity: 0.85; }\n  .site-nav a[aria-current=\"page\"] { opacity: 1; }\n  .nav-toggle {\n    display: inline-flex; align-items: center; justify-content: center;\n    margin-left: auto; min-width: var(--tap-min); min-height: var(--tap-min);\n    background: none; border: 0; cursor: pointer; color: inherit;\n    font-family: var(--font-en); font-size: var(--t-xs); letter-spacing: var(--ls-label);\n  }\n  body[data-nav-open=\"true\"] .nav-toggle { color: var(--c-white); position: relative; z-index: 1; }\n  body[data-nav-open=\"true\"] { overflow: hidden; }\n}\n\n/* つまみとチェックは、サイトの色（黒）で塗る */\ninput[type=\"range\"], input[type=\"checkbox\"], input[type=\"radio\"], progress {\n  accent-color: var(--c-ink);\n}\n\n/* --- Footer ----------------------------------------------\n   最後の1枚のビジュアルとして置く。巨大なロゴと、その下の横並びだけ。\n   --------------------------------------------------------- */\n.site-footer {\n  border-top: var(--line-ink);\n  padding: clamp(3rem, 8vw, 7rem) var(--page-x) var(--s-6);\n  margin-top: var(--s-9);\n  background: var(--c-white);\n  display: grid; justify-items: center; gap: clamp(1.5rem, 4vw, 3rem);\n  overflow: clip;\n}\n.brand-logo { display: block; width: 100%; max-width: var(--max-w); }\n.brand-logo:hover { text-decoration: none; }\n.brand-logo__img { display: block; width: 100%; height: auto; }\n/* 画面幅いっぱいのロゴタイプ。SVGなので、どの幅でも切れずに収まる */\n.brand-logo__type { display: block; width: 100%; height: auto; }\n.brand-logo__type text {\n  font-family: var(--font-en); font-weight: var(--w-bold);\n  font-size: 118px; fill: var(--c-ink);\n}\n.brand-links {\n  display: flex; flex-wrap: wrap; justify-content: center;\n  gap: clamp(var(--s-3), 2.5vw, var(--s-6));\n}\n.brand-links a {\n  font-family: var(--font-en); font-size: var(--t-xs);\n  letter-spacing: var(--ls-label); text-transform: uppercase;\n  color: var(--c-ink-muted); min-height: var(--tap-min);\n  display: inline-flex; align-items: center;\n}\n.brand-links a:hover { color: var(--c-ink); text-decoration: none; }\n.brand-copy { font-size: var(--t-xs); color: var(--c-ink-muted); margin: 0; }\n\n/* --- Section heading (番号 + 英字 + 和文) ------------------- */\n.section-head { display: flex; align-items: flex-end; gap: var(--s-5); flex-wrap: wrap; margin-bottom: var(--s-6); }\n.section-head__no {\n  font-family: var(--font-num); font-size: var(--t-display);\n  font-weight: var(--w-bold); line-height: 0.85; letter-spacing: var(--ls-hero);\n}\n.section-head__body { flex: 1 1 20rem; }\n.section-head__en {\n  font-family: var(--font-en); font-size: var(--t-title);\n  font-weight: var(--w-bold); text-transform: uppercase; letter-spacing: 0.02em;\n}\n.section-head__jp { font-size: var(--t-sm); color: var(--c-ink-muted); }\n.section-head::after {\n  content: \"\"; flex: 1 1 4rem; height: 1px; background: var(--c-hairline); margin-bottom: 0.6em;\n}\n\n/* ============================================================\n   PINK INDEX — Components (企画書 8章)\n   角丸・影・ピルを多用せず、罫線と余白で階層を作る。\n   選択状態は「色だけ」で示さず、枠 + 小さなピンクの点 + テキストで示す。\n   ============================================================ */\n\n/* --- Buttons --------------------------------------------- */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center;\n  gap: var(--s-2);\n  min-height: var(--tap-min); padding: var(--s-3) var(--s-5);\n  border-radius: var(--r-2); border: var(--line-ink);\n  background: var(--c-white); color: var(--c-ink);\n  font-size: var(--t-sm); font-weight: var(--w-medium);\n  cursor: pointer; text-decoration: none;\n  transition: background var(--m-micro) var(--ease-out), color var(--m-micro) var(--ease-out),\n    transform var(--m-micro) var(--ease-out);\n}\n.btn:hover { background: var(--c-pink-mist); text-decoration: none; }\n.btn:active { transform: translateY(1px); }\n.btn[disabled], .btn[aria-disabled=\"true\"] {\n  color: var(--c-ink-muted); border-color: var(--c-hairline);\n  background: var(--c-white); cursor: not-allowed;\n}\n/* 主要操作は1画面に1〜2個 */\n.btn--primary { background: var(--c-ink); color: var(--c-white); border-color: var(--c-ink); }\n.btn--primary:hover { background: #000; color: var(--c-white); }\n.btn--ghost { border-color: transparent; background: transparent; }\n.btn--ghost:hover { background: var(--c-pink-mist); }\n.btn--sm { min-height: 36px; padding: var(--s-2) var(--s-3); font-size: var(--t-xs); }\n.btn--icon { padding: var(--s-2); min-width: var(--tap-min); }\n\n/* テキストリンク: 黒文字 + 小さなピンク矢印 */\n.link-arrow {\n  display: inline-flex; align-items: center; gap: var(--s-2);\n  font-size: var(--t-sm); font-weight: var(--w-medium);\n}\n.link-arrow::after {\n  content: \"→\"; color: var(--c-accent);\n  transition: transform var(--m-micro) var(--ease-out);\n}\n.link-arrow:hover { text-decoration: none; }\n.link-arrow:hover::after { transform: translateX(4px); }\n\n/* --- Index label (衣服の管理タグ) -------------------------- */\n.index-label {\n  display: inline-flex; align-items: center; gap: var(--s-2);\n  font-family: var(--font-en); font-size: var(--t-xs);\n  letter-spacing: var(--ls-label); text-transform: uppercase;\n  color: var(--c-ink-muted);\n}\n.index-label__no { color: var(--c-ink); font-weight: var(--w-bold); }\n/* 切り欠きのある衣服タグ形状 */\n.tag-chip {\n  display: inline-flex; align-items: center; gap: var(--s-2);\n  padding: var(--s-1) var(--s-3) var(--s-1) var(--s-4);\n  background: var(--c-white); border: var(--line-hair);\n  border-radius: var(--r-1);\n  font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted);\n  position: relative;\n}\n.tag-chip::before {\n  content: \"\"; position: absolute; left: 7px; top: 50%; transform: translateY(-50%);\n  width: 4px; height: 4px; border-radius: 50%;\n  border: 1px solid var(--c-ink-muted);   /* 紐通し穴 */\n}\n\n/* --- Filter chip ----------------------------------------- */\n.chip {\n  display: inline-flex; align-items: center; gap: var(--s-2);\n  min-height: 34px; padding: 0 var(--s-4);\n  border: var(--line-hair); border-radius: var(--r-pill);\n  background: var(--c-white); color: var(--c-ink-muted);\n  font-size: var(--t-xs); letter-spacing: 0.04em; cursor: pointer;\n  transition: all var(--m-micro) var(--ease-out);\n}\n.chip:hover { background: var(--c-pink-mist); color: var(--c-ink); }\n.chip[aria-pressed=\"true\"] {\n  background: var(--c-ink); border-color: var(--c-ink); color: var(--c-white);\n}\n.chip[aria-pressed=\"true\"]::before {\n  content: \"\"; width: 5px; height: 5px; border-radius: 50%; background: var(--c-accent);\n}\n\n/* --- Card ------------------------------------------------ */\n.card {\n  display: flex; flex-direction: column;\n  background: var(--c-white);\n  border: var(--line-hair); border-radius: var(--r-2);\n  overflow: hidden;\n  transition: border-color var(--m-micro) var(--ease-out), transform var(--m-micro) var(--ease-out);\n}\n.card:hover { border-color: var(--c-ink); }\n.card a { display: block; }\n.card__media {\n  position: relative; aspect-ratio: 3 / 4; background: var(--c-white);\n  border-bottom: var(--line-hair); overflow: hidden;\n}\n.card__media img { width: 100%; height: 100%; object-fit: contain; padding: var(--s-3); }\n.card__media--wide { aspect-ratio: 4 / 3; }\n.card__body { padding: var(--s-3) var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: var(--s-1); }\n.card__no {\n  font-family: var(--font-num); font-size: var(--t-xs);\n  letter-spacing: var(--ls-label); color: var(--c-ink-muted);\n}\n.card__name { font-size: 0.9rem; font-weight: var(--w-medium); line-height: 1.5; }\n.card__meta { font-size: var(--t-xs); color: var(--c-ink-muted); display: flex; gap: var(--s-2); flex-wrap: wrap; }\n.card__fav {\n  position: absolute; right: var(--s-2); top: var(--s-2);\n  width: 34px; height: 34px; display: grid; place-items: center;\n  background: color-mix(in srgb, var(--c-white) 85%, transparent);\n  border: var(--line-hair); border-radius: 50%; cursor: pointer;\n}\n.card__fav[aria-pressed=\"true\"] { border-color: var(--c-accent); color: var(--c-accent); }\n\n/* 整列グリッド(検索結果) */\n.card-grid {\n  display: grid; gap: var(--grid-gap);\n  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));\n}\n@media (max-width: 640px) {\n  .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }\n}\n/* 特集・GALLERYだけ可変比率の編集的レイアウトを許可 */\n.editorial-grid {\n  display: grid; gap: var(--grid-gap);\n  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));\n  grid-auto-flow: dense;\n}\n.editorial-grid .card--tall { grid-row: span 2; }\n.editorial-grid .card--tall .card__media { aspect-ratio: 3 / 5; }\n.editorial-grid .card--wide { grid-column: span 2; }\n.editorial-grid .card--wide .card__media { aspect-ratio: 16 / 10; }\n@media (max-width: 640px) {\n  .editorial-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }\n  .editorial-grid .card--wide { grid-column: span 2; }\n  .editorial-grid .card--tall { grid-row: span 1; }\n  .editorial-grid .card--tall .card__media { aspect-ratio: 3 / 4; }\n}\n\n/* --- Empty state ----------------------------------------- */\n.empty {\n  border: 1px dashed var(--c-hairline); border-radius: var(--r-3);\n  background: var(--c-pink-mist);\n  padding: var(--s-8) var(--s-5); text-align: center;\n}\n/* span で書いても行が重ならないよう、必ず block として積む */\n.empty__title { display: block; font-size: 1rem; font-weight: var(--w-medium); margin: 0; }\n.empty__body { display: block; font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-2) auto 0; max-width: 28em; }\n\n/* --- Toast ----------------------------------------------- */\n.toast-region {\n  position: fixed; left: 50%; bottom: var(--s-6); transform: translateX(-50%);\n  z-index: var(--z-dialog); display: flex; flex-direction: column; gap: var(--s-2);\n  pointer-events: none; width: min(90vw, 420px);\n}\n.toast {\n  background: var(--c-ink); color: var(--c-white);\n  border-radius: var(--r-2); padding: var(--s-3) var(--s-4);\n  font-size: var(--t-sm); box-shadow: var(--shadow-float);\n  animation: toast-in var(--m-panel) var(--ease-out);\n}\n@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n\n/* --- Form ------------------------------------------------ */\n.field { display: flex; flex-direction: column; gap: var(--s-2); }\n.field > label { font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted); }\n.field .hint { font-size: var(--t-xs); color: var(--c-ink-muted); }\n.input, .select, .textarea {\n  min-height: var(--tap-min); padding: var(--s-2) var(--s-3);\n  background: var(--c-white); border: var(--line-hair); border-radius: var(--r-2);\n  transition: border-color var(--m-micro) var(--ease-out);\n}\n.input:hover, .select:hover, .textarea:hover { border-color: var(--c-ink-muted); }\n.input:focus, .select:focus, .textarea:focus { border-color: var(--c-ink); }\n.textarea { min-height: 96px; line-height: 1.7; resize: vertical; }\n\n/* --- Meta table ------------------------------------------ */\n.meta-list { display: grid; grid-template-columns: max-content 1fr; gap: var(--s-2) var(--s-5); font-size: var(--t-sm); }\n.meta-list dt { color: var(--c-ink-muted); font-size: var(--t-xs); letter-spacing: 0.06em; }\n.meta-list dd { margin: 0; }\n\n/* --- Counter (ARCHIVE COUNTER) ---------------------------- */\n.counter-row { display: grid; gap: var(--grid-gap); grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }\n.counter {\n  border-top: var(--line-ink); padding-top: var(--s-3);\n}\n.counter__value {\n  font-family: var(--font-num); font-size: clamp(2.5rem, 5vw, 4rem);\n  font-weight: var(--w-bold); line-height: 1; letter-spacing: var(--ls-hero);\n}\n.counter__label {\n  font-family: var(--font-en); font-size: var(--t-xs);\n  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);\n  margin-top: var(--s-2);\n}\n\n/* --- Reveal (セクション初回表示) --------------------------- */\n[data-reveal] {\n  opacity: 0; transform: translateY(14px);\n  transition: opacity var(--m-reveal) var(--ease-out), transform var(--m-reveal) var(--ease-out);\n}\n[data-reveal].is-in { opacity: 1; transform: none; }\n@media (prefers-reduced-motion: reduce) {\n  [data-reveal] { opacity: 1; transform: none; }\n}\n\n/* --- 縫い目風の点線区切り ---------------------------------- */\n.seam {\n  height: 1px; border: 0; margin: var(--s-7) 0;\n  background-image: linear-gradient(90deg, var(--c-hairline) 0 6px, transparent 6px 12px);\n  background-size: 12px 1px;\n}\n\n/* 取り消せない操作の2度押し待ち */\n.btn--danger { border-color: var(--c-danger); color: var(--c-danger); background: var(--c-white); }\n.btn--danger:hover { background: color-mix(in srgb, var(--c-danger) 8%, var(--c-white)); }\n\n/* --- フレーバーテキスト（作品としての文章） ------------------ */\n.card__flavor {\n  font-size: var(--t-xs); line-height: 1.7; color: var(--c-ink-muted);\n  margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;\n}\n.card__flavor:empty { display: none; }\n.detail__flavor {\n  font-size: 1.05rem; line-height: 2.1; margin: var(--s-4) 0 0;\n  max-width: 30em; border-left: 2px solid var(--c-accent); padding-left: var(--s-4);\n}\n.detail__flavor:empty { display: none; }\n\n/* 管理画面から「位置」を押されたときに、その文字を光らせる */\n.is-text-marked {\n  outline: 2px solid var(--c-accent); outline-offset: 3px;\n  background: color-mix(in srgb, var(--c-accent) 14%, transparent);\n}\n\n/* 未登録の区画。理由も導線も書かず、1語だけ置く */\n.coming {\n  font-family: var(--font-en); font-size: var(--t-xs);\n  letter-spacing: var(--ls-label); color: var(--c-ink-muted);\n  text-align: center; padding: clamp(3rem, 10vw, 7rem) 0; margin: 0;\n  max-width: none; width: 100%;\n}\n\n/* ============================================================\n   PINK INDEX — Loader (企画書 5章)\n   「サイトへの待ち時間」ではなく「白い作品台帳が開き、\n    最初の1ページが立ち上がる瞬間」として設計する。\n   外周ラインはフェードアウトせず、ホームの枠線へ変形して接続する。\n   ============================================================ */\n\n.loader {\n  position: fixed; inset: 0; z-index: var(--z-loader);\n  background: var(--c-canvas);\n  display: grid; grid-template-rows: auto 1fr auto;\n  padding: clamp(1.25rem, 4vw, 3rem);\n  /* 端末のノッチ/ブラウザUIと干渉しない内側に描く */\n  padding: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-top))\n           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-right))\n           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-bottom))\n           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-left));\n}\n.loader[hidden] { display: none; }\n\n.loader__top {\n  display: flex; justify-content: space-between; align-items: flex-start;\n  font-family: var(--font-en); font-size: var(--t-xs);\n  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);\n}\n\n/* 数字は中央に置かず、左下寄せ・余白を大きく残す */\n.loader__count {\n  grid-row: 3;\n  display: flex; align-items: flex-end; gap: 0.08em;\n  font-family: var(--font-num); font-weight: var(--w-bold);\n  font-size: var(--t-hero); line-height: 0.78; letter-spacing: var(--ls-hero);\n  font-variant-numeric: tabular-nums;\n  color: var(--c-ink);\n}\n.loader__range {\n  font-size: var(--t-xs); letter-spacing: var(--ls-label);\n  color: var(--c-ink-muted); align-self: flex-start; margin-bottom: 0.6em;\n  font-weight: var(--w-medium);\n}\n.loader__pct {\n  font-size: 0.22em; align-self: flex-start; margin-top: 0.35em; /* 小さな上付きの % */\n  color: var(--c-ink-muted); font-weight: var(--w-medium);\n}\n\n/* 100%で数字が左右へ静かに離れ、その間からイラストが現れる */\n.loader__digits { display: inline-flex; }\n.loader[data-state=\"exit\"] .loader__digits--l { transform: translateX(-28vw); opacity: 0; }\n.loader[data-state=\"exit\"] .loader__digits--r { transform: translateX(28vw); opacity: 0; }\n.loader__digits--l, .loader__digits--r {\n  transition: transform var(--m-loader-exit) var(--ease-in-out),\n              opacity var(--m-loader-exit) var(--ease-out);\n}\n.loader[data-state=\"exit\"] .loader__range,\n.loader[data-state=\"exit\"] .loader__pct,\n.loader[data-state=\"exit\"] .loader__top { opacity: 0; transition: opacity 220ms var(--ease-out); }\n\n.loader { transition: opacity var(--m-loader-exit) var(--ease-out); }\n.loader[data-state=\"done\"] { opacity: 0; pointer-events: none; }\n\n/* --- 画面外周ライン ---------------------------------------- */\n.perimeter {\n  position: fixed; inset: 0; z-index: calc(var(--z-loader) + 1);\n  pointer-events: none;\n}\n.perimeter[hidden] { display: none; }\n.perimeter svg { width: 100%; height: 100%; display: block; }\n.perimeter__track { fill: none; stroke: var(--c-hairline); stroke-width: 1; }\n.perimeter__line { fill: none; stroke: var(--c-ink); stroke-width: 1; stroke-linecap: butt; }\n/* 線の先端にだけ小さなピンクの点 */\n.perimeter__tip { fill: var(--c-accent); }\n.perimeter--handoff .perimeter__tip { opacity: 0; transition: opacity 240ms var(--ease-out); }\n.perimeter--handoff { transition: opacity 420ms var(--ease-out) 260ms; }\n.perimeter--faded { opacity: 0; }\n\n/* ホーム側の受け皿。外周ラインが縮んでここへ重なり、静的な枠へ引き継ぐ */\n.home-frame {\n  position: fixed; z-index: 1; pointer-events: none;\n  inset: var(--frame-inset, 12px);\n  border: var(--line-hair);\n  opacity: 0;\n  transition: opacity 420ms var(--ease-out);\n}\n.home-frame.is-on { opacity: 1; }\n@media (max-width: 640px) { .home-frame { display: none; } }\n\n/* 縮小演出を行わない場合(reduced motion)の短いクロスフェード */\n@media (prefers-reduced-motion: reduce) {\n  .loader__digits--l, .loader__digits--r { transform: none !important; }\n}\n\n/* スクロール抑止 */\nbody[data-loading=\"true\"] { overflow: hidden; }\n\n/* ============================================================\n   PINK INDEX — HOME\n   キービジュアルから始まり、見せ方の違う区画が続く縦長のページ。\n   同じ組みを繰り返さず、区画ごとに比率・余白・文字の位置を変える。\n   ============================================================ */\n\n/* --- KEY VISUAL ------------------------------------------- */\n.kv { position: relative; }\n.kv__track {\n  display: flex;\n  cursor: grab;\n  overflow-x: auto;\n  scroll-snap-type: x mandatory;\n  scroll-behavior: smooth;\n  scrollbar-width: none;\n  overscroll-behavior-x: contain;\n}\n.kv__track::-webkit-scrollbar { display: none; }\n[data-kv][data-dragging] .kv__track { cursor: grabbing; }\n[data-kv][data-dragging] .kv__slide { user-select: none; }\n\n.kv__slide {\n  position: relative;\n  flex: 0 0 100%;\n  scroll-snap-align: start;\n  display: block;\n  min-height: min(100svh, 1100px);\n  background: var(--hs-bg);\n  color: var(--hs-fg);\n  overflow: clip;\n}\n.kv__media { position: absolute; inset: 0; display: block; }\n.kv__img { width: 100%; height: 100%; object-fit: cover;\n  object-position: var(--hs-focus, 50% 40%); transform: scale(var(--hs-zoom, 1)); }\n\n/* 文字を置ける範囲。ヘッダーの高さと操作の分を空ける */\n.kv__free {\n  position: absolute;\n  inset: calc(var(--header-h) + clamp(0.75rem, 3vw, 1.75rem)) var(--page-x) clamp(4.5rem, 8vw, 6rem);\n  pointer-events: none;\n}\n.kv__type {\n  position: absolute;\n  left: var(--hs-tx, 0%); top: var(--hs-ty, 100%);\n  transform: translate(calc(var(--hs-tx, 0%) * -1), calc(var(--hs-ty, 100%) * -1))\n             rotate(var(--hs-trot, 0deg));\n  width: max(16rem, var(--hs-tw, 62%));\n  max-width: 100%; max-height: 100%;\n  text-align: var(--hs-align, left);\n  pointer-events: auto;\n}\n\n/* 縦書き。日本語の題名を縦に流したいときに使う */\n.kv__slide[data-tvert=\"on\"] .kv__type {\n  writing-mode: vertical-rl; text-orientation: mixed;\n  /* 縦書きでは「文字の幅」が、そのまま列の長さになる */\n  width: auto; height: max(6rem, var(--hs-tw, 62%)); max-height: 100%;\n}\n.kv__slide[data-tvert=\"on\"] .kv__title { letter-spacing: var(--hs-tls, 0.02em); }\n\n/* 絵の上でも読めるようにする敷き */\n.kv__slide[data-tplate=\"veil\"] .kv__type {\n  padding: clamp(0.75rem, 2vw, 1.5rem);\n  background: color-mix(in srgb, var(--hs-bg, #fff) 62%, transparent);\n  backdrop-filter: blur(6px);\n}\n.kv__slide[data-tplate=\"band\"] .kv__type {\n  padding: clamp(0.75rem, 2vw, 1.5rem) clamp(1rem, 3vw, 2rem);\n  background: var(--hs-bg, #fff);\n}\n@supports not (background: color-mix(in srgb, red 50%, transparent)) {\n  .kv__slide[data-tplate=\"veil\"] .kv__type { background: var(--hs-bg, #fff); }\n}\n\n/* ヘッダーの下まで文字を置けるようにする */\n.kv__slide[data-tfull=\"on\"] .kv__free { inset: 0 var(--page-x) clamp(3rem, 6vw, 4.5rem); }\n.kv__eyebrow {\n  font-family: var(--font-en); font-size: var(--t-xs);\n  letter-spacing: var(--ls-label); text-transform: uppercase; margin: 0 0 var(--s-3);\n}\n.kv__title {\n  font-family: var(--font-en); font-weight: var(--w-bold);\n  /* 大きさ・行間・字間は1枚ごとに決められる */\n  font-size: calc(clamp(2rem, min(7vw, 12svh), 6rem) * var(--hs-tsize, 1));\n  line-height: var(--hs-tlh, 0.95);\n  letter-spacing: var(--hs-tls, -0.02em);\n  margin: 0;\n}\n.kv__sub { font-size: var(--t-sm); margin: var(--s-3) 0 0; opacity: 0.85; }\n.kv__link {\n  display: inline-block; margin-top: var(--s-5);\n  font-family: var(--font-en); font-size: var(--t-xs);\n  letter-spacing: var(--ls-label); text-transform: uppercase;\n  color: inherit; border-bottom: 1px solid currentColor; padding-bottom: 2px;\n}\n.kv__link:hover { text-decoration: none; opacity: 0.7; }\n\n/* 矢印は左右の端に。絵を邪魔しない細い形で、押せる範囲は44px以上 */\n.kv__arrow {\n  position: absolute; top: 50%; translate: 0 -50%; z-index: 2;\n  width: clamp(44px, 5vw, 64px); height: clamp(44px, 8vh, 84px);\n  display: grid; place-items: center;\n  border: 0; background: none; color: var(--hs-fg, var(--c-ink));\n  cursor: pointer; opacity: 0.7;\n  transition: opacity var(--m-micro) var(--ease-out);\n}\n.kv__arrow:hover { opacity: 1; }\n.kv__arrow[disabled] { opacity: 0.15; cursor: default; }\n.kv__arrow--prev { left: max(var(--s-2), calc(var(--page-x) - 1.25rem)); }\n.kv__arrow--next { right: max(var(--s-2), calc(var(--page-x) - 1.25rem)); }\n.kv__arrow > span {\n  width: 14px; height: 14px;\n  border-left: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;\n}\n.kv__arrow--prev > span { rotate: 45deg; translate: 3px 0; }\n.kv__arrow--next > span { rotate: -135deg; translate: -3px 0; }\n\n.kv__dots {\n  position: absolute; left: 0; right: 0; bottom: clamp(1rem, 2.5vw, 2rem); z-index: 2;\n  display: flex; justify-content: center; gap: var(--s-2);\n  list-style: none; margin: 0; padding: 0; color: var(--hs-fg, var(--c-ink));\n}\n.kv__dots li { display: flex; }\n.kv__dots button {\n  width: 26px; height: 2px; border: 0; padding: 8px 0; cursor: pointer;\n  background: transparent; position: relative; opacity: 0.45;\n  transition: opacity var(--m-micro) var(--ease-out);\n}\n.kv__dots button::after { content: \"\"; position: absolute; inset: 8px 0; background: currentColor; }\n.kv__dots button[aria-current=\"true\"] { opacity: 1; }\n\n/* --- 区画の共通 -------------------------------------------- */\n.sec {\n  padding: clamp(3rem, 9vw, 8rem) var(--page-x);\n  background: var(--hs-bg, var(--c-canvas));\n  color: var(--hs-fg, var(--c-ink));\n}\n.sec__head {\n  display: flex; align-items: baseline; gap: var(--s-4);\n  margin-bottom: clamp(1.5rem, 4vw, 3rem);\n}\n.sec__title, .sec__eyebrow {\n  font-family: var(--font-en); font-size: var(--t-xs);\n  letter-spacing: var(--ls-label); text-transform: uppercase; margin: 0;\n}\n.sec__count { color: var(--c-ink-muted); font-size: var(--t-xs); }\n.sec__lead { font-size: var(--t-sm); color: var(--c-ink-muted); margin: 0 0 var(--s-5); }\n.sec__more { margin: clamp(1.5rem, 4vw, 3rem) 0 0; }\n\n/* 画像の下に小さく置く説明 */\n.cap { display: block; margin-top: var(--s-3); font-size: var(--t-xs); }\n.cap__title { display: block; }\n.cap__meta { color: var(--c-ink-muted); }\n.sec a { color: inherit; }\n.sec a:hover { text-decoration: none; opacity: 0.82; }\n\n/* --- 画像の枡（共通） --------------------------------------\n   比率と切り取る位置はHTML側の style で1枡ずつ指定する。\n   ここでは入れ物と、寄せたときの動きだけを決める。\n   ---------------------------------------------------------- */\n.sec figure, .sec .ph { margin: 0; }\n/* 高さは比率（HTML側の aspect-ratio）から決める。\n   height:100% にすると、行の高さと画像の高さが互いを参照して枡が行からはみ出す。 */\n.sec img { display: block; width: 100%; height: auto; object-fit: cover; background: var(--c-pink-mist); }\n\n/* 画像がまだ1枚も無いときの色面。作品の代わりではなく、区画の骨格を示すだけ */\n.ph {\n  display: block; width: 100%;\n  background:\n    repeating-linear-gradient(135deg, var(--c-pale-pink) 0 14px, var(--c-pink-mist) 14px 28px);\n}\n.sec--spotlight .ph {\n  background: repeating-linear-gradient(135deg, #2a2229 0 14px, #201a1f 14px 28px);\n}\n\n/* 寄せたときの軽い拡大。動きを止める設定なら効かせない */\n.feature__lead, .strip__shot, .picks__shot, .spotlight__cover { display: block; overflow: clip; }\n.feature__lead img, .strip__shot img, .picks__shot img, .spotlight__cover img {\n  transition: transform var(--m-reveal) var(--ease-out);\n}\n.feature__lead:hover img, .strip__shot:hover img,\n.picks__shot:hover img, .spotlight__cover:hover img { transform: scale(1.03); }\n.sec a:hover { opacity: 1; }\n.sec a:hover .cap__title { text-decoration: underline; text-underline-offset: 0.28em; }\n\n/* スクロールで現れるときの短いフェード */\n[data-reveal] { opacity: 1; }\nbody[data-reveal-ready] [data-reveal] {\n  opacity: 0; transform: translateY(18px);\n  transition: opacity var(--m-reveal) var(--ease-out), transform var(--m-reveal) var(--ease-out);\n}\nbody[data-reveal-ready] [data-reveal][data-shown] { opacity: 1; transform: none; }\n\n/* --- 02 FEATURE：1点を大きく、文字は絵の外へ ---------------- */\n.sec--feature { padding-inline: 0; }\n.feature {\n  display: grid;\n  grid-template-columns: minmax(0, 8fr) minmax(0, 4fr);\n  align-items: end;\n  gap: clamp(1.25rem, 3vw, 3.5rem);\n}\n/* 左端まで絵を伸ばし、右に余白を残す非対称。左右は入れ替えられる */\n.feature__stage { grid-column: 1; }\n.sec--feature[data-side=\"left\"] .feature { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); }\n.sec--feature[data-side=\"left\"] .feature__stage { grid-column: 2; }\n.sec--feature[data-side=\"left\"] .feature__aside { grid-column: 1; padding: 0 0 clamp(0.5rem, 3vw, 2.5rem) var(--page-x); }\n.sec--feature[data-align=\"top\"] .feature { align-items: start; }\n.sec--feature[data-align=\"center\"] .feature { align-items: center; }\n.feature__lead img { max-height: 86svh; }\n.feature__aside { grid-column: 2; padding: 0 var(--page-x) clamp(0.5rem, 3vw, 2.5rem) 0; }\n.sec--feature .sec__head { padding-inline: var(--page-x); }\n.feature__name {\n  font-family: var(--font-en); font-weight: var(--w-bold);\n  font-size: clamp(1.5rem, 3vw, 2.75rem); line-height: 1.05;\n  letter-spacing: -0.01em; margin: 0; max-width: none;\n}\n.feature__year { font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-3) 0 0; }\n.feature__note { font-size: var(--t-sm); margin: var(--s-4) 0 0; max-width: 26em; }\n.feature__aside .sec__more { margin-top: var(--s-5); }\n\n/* --- 03 DETAILS：比率のちがう切り取りを横へ ----------------- */\n.sec--details { padding-inline: 0; background: var(--c-pink-mist); }\n.sec--details .sec__head { padding-inline: var(--page-x); }\n\n/* 横へ流す帯。つかんで動かせて、端がつながっている */\n.rail { position: relative; }\n.strip {\n  display: flex; gap: clamp(0.5rem, 1.6vw, 1.25rem);\n  overflow-x: auto; scroll-snap-type: x proximity;\n  padding-inline: var(--page-x);\n  scrollbar-width: none; overscroll-behavior-x: contain;\n  cursor: grab; touch-action: pan-x pan-y;\n}\n.strip::-webkit-scrollbar { display: none; }\n.rail[data-dragging] .strip { cursor: grabbing; scroll-snap-type: none; }\n.rail[data-dragging] .strip a { pointer-events: none; }\n.strip__cell { flex: 0 0 auto; scroll-snap-align: center; }\n\n/* いま帯のどこを見ているかを示す細い棒。つまんで動かせる */\n.rail__bar {\n  margin: clamp(1rem, 3vw, 2rem) var(--page-x) 0;\n  height: 3px; border-radius: 999px;\n  background: color-mix(in srgb, var(--c-ink) 12%, transparent);\n  position: relative; cursor: pointer;\n}\n.rail__thumb {\n  position: absolute; inset-block: -1px; left: 0; width: 20%;\n  border-radius: 999px; background: var(--c-ink-muted);\n}\n.rail:not([data-rail-ready]) .rail__bar { display: none; }\n@supports not (background: color-mix(in srgb, red 50%, transparent)) {\n  .rail__bar { background: var(--c-hairline); }\n}\n/* 枡ごとに幅を変えて、同じ形の繰り返しに見せない */\n.strip__cell--narrow { width: min(46vw, 300px); }\n.strip__cell--square { width: min(52vw, 360px); }\n.strip__cell--wide { width: min(78vw, 560px); }\n/* 上下に段差をつけ、帯が一直線に見えないようにする */\n.strip__cell:nth-child(even) { margin-top: clamp(1rem, 4vw, 3.5rem); }\n\n/* --- 04 SELECTED：大きさの違う4枡の非対称グリッド ------------ */\n.picks {\n  display: grid;\n  grid-template-columns: repeat(12, minmax(0, 1fr));\n  gap: clamp(1rem, 2.5vw, 2.5rem) clamp(1rem, 3vw, 3rem);\n  align-items: start;\n}\n/* 縦長1点の横に、横長2点を積む。最後の1点だけ列をずらして息をつく */\n.picks__item--tall { grid-column: 1 / span 5; grid-row: 1 / span 2; }\n.picks__item--wide { grid-column: 7 / span 6; grid-row: 1; align-self: start; }\n.picks__item--wide2 { grid-column: 7 / span 5; grid-row: 2; align-self: start; }\n.picks__item--square { grid-column: 3 / span 4; grid-row: 3; }\n\n/* --- 05 SPOTLIGHT：終盤の色の切り替え ---------------------- */\n.sec--spotlight { padding-inline: 0; }\n.spotlight {\n  display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);\n  align-items: center; gap: clamp(1.5rem, 4vw, 4rem);\n}\n/* 文字を左に置くときは、絵と文字を入れ替える */\n.sec--spotlight[data-side=\"left\"] .spotlight { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }\n.sec--spotlight[data-side=\"left\"] .spotlight__stage { order: 2; }\n.sec--spotlight[data-side=\"left\"] .spotlight__body { order: 1; padding-inline: var(--page-x) 0; }\n.spotlight__cover img { max-height: 82svh; }\n.spotlight__body { padding: clamp(1rem, 4vw, 3rem) var(--page-x) clamp(1rem, 4vw, 3rem) 0; }\n.spotlight__title {\n  font-family: var(--font-en); font-size: var(--t-display); line-height: 0.95;\n  margin: var(--s-3) 0 0; max-width: none;\n}\n.spotlight__copy { font-size: var(--t-sm); margin: var(--s-4) 0 0; max-width: 30em; opacity: 0.82; }\n.sec--spotlight .link-arrow { color: inherit; }\n\n/* --- 以前の設定を残している人向け（COLOR STORY / ARCHIVE） -- */\n.color-row {\n  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));\n  gap: clamp(0.75rem, 2vw, 2rem); align-items: start;\n}\n.color-row__item { display: block; margin-top: calc(var(--n, 0) * clamp(0.5rem, 2vw, 2rem)); }\n.color-row__img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }\n.mosaic { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 2px; }\n.mosaic__cell { display: block; }\n.mosaic__img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; filter: saturate(0.92); }\n.mosaic__cell:hover .mosaic__img { filter: none; }\n\n/* --- 縦画面・スマートフォン --------------------------------- */\n@media (orientation: portrait) {\n  .kv__slide { min-height: min(88svh, 900px); }\n  .kv__type { width: max(14rem, min(100%, calc(var(--hs-tw, 62%) + 25%))); }\n}\n\n@media (max-width: 900px) {\n  .kv__arrow { width: 44px; height: 56px; }\n  .kv__free { inset: calc(var(--header-h) + 0.5rem) var(--page-x) clamp(4rem, 12vw, 5rem); }\n\n  /* FEATURE：絵を上、文字を下の縦並びに */\n  .feature { grid-template-columns: 1fr; align-items: start; }\n  .feature__stage, .feature__aside { grid-column: 1; }\n  .feature__aside { padding: 0 var(--page-x); }\n  .feature__lead img { max-height: none; }\n\n  /* SELECTED：縦に積むが、幅と比率は変えたままにする */\n  .picks { grid-template-columns: repeat(6, minmax(0, 1fr)); }\n  .picks__item--tall { grid-column: 1 / span 6; grid-row: auto; }\n  .picks__item--wide { grid-column: 1 / span 5; grid-row: auto; }\n  .picks__item--wide2 { grid-column: 2 / span 5; grid-row: auto; }\n  .picks__item--square { grid-column: 1 / span 4; grid-row: auto; }\n\n  /* SPOTLIGHT：絵を上、文字を下へ */\n  .spotlight { grid-template-columns: 1fr; gap: 0; }\n  .spotlight__body { padding: clamp(1.5rem, 6vw, 3rem) var(--page-x) clamp(2rem, 8vw, 4rem); }\n  .spotlight__cover img { max-height: 62svh; }\n\n  .strip__cell--narrow { width: min(62vw, 260px); }\n  .strip__cell--square { width: min(70vw, 300px); }\n  .strip__cell--wide { width: min(86vw, 420px); }\n}\n\n/* 動きを減らす設定のときは、フェードも拡大も止める */\n@media (prefers-reduced-motion: reduce) {\n  .kv__track, .strip { scroll-behavior: auto; }\n  body[data-reveal-ready] [data-reveal] { opacity: 1; transform: none; transition: none; }\n  .feature__lead img, .strip__shot img, .picks__shot img, .spotlight__cover img { transition: none; }\n  .feature__lead:hover img, .strip__shot:hover img,\n  .picks__shot:hover img, .spotlight__cover:hover img { transform: none; }\n}\n\n/* ============================================================\n   PINK INDEX — Archive pages (CLOSET / GIRLS / COLLECTIONS / GALLERY)\n   検索結果は整列グリッド、特集だけ可変比率の編集的レイアウト。\n   ============================================================ */\n\n.page-head {\n  display: grid; gap: var(--s-3);\n  padding-top: var(--s-7); padding-bottom: var(--s-5);\n  border-bottom: var(--line-ink);\n}\n/* 見出し直後のセクションは上の余白を詰め、一覧をすぐ見せる */\n.page-head + .section, .page-head + .page .section:first-child { padding-top: var(--s-6); }\n.page-head__title { display: flex; align-items: baseline; gap: clamp(1rem, 2.5vw, 2.5rem); flex-wrap: wrap; }\n.page-head__no {\n  font-family: var(--font-num); font-size: var(--t-display);\n  font-weight: var(--w-bold); line-height: 0.8; letter-spacing: var(--ls-hero);\n}\n.page-head__en {\n  font-family: var(--font-en); font-size: var(--t-display);\n  font-weight: var(--w-bold); text-transform: uppercase; line-height: 0.9; letter-spacing: -0.02em;\n}\n.page-head__jp { font-size: var(--t-sm); color: var(--c-ink-muted); max-width: var(--measure); margin: 0; }\n@media (max-width: 640px) { .page-head { gap: var(--s-2); } }\n\n/* --- Filter bar ------------------------------------------ */\n.filters {\n  display: grid; gap: var(--s-4);\n  padding: var(--s-5) 0; border-bottom: var(--line-hair);\n  position: sticky; top: (--s-6)) var(--s-8); }\n.work__media { background: var(--c-white); }\n.work__media img { width: 100%; height: auto; max-height: 86svh; object-fit: contain; display: block; }\n.work__head { display: flex; align-items: baseline; gap: var(--s-5); flex-wrap: wrap; padding-top: var(--s-5); }\n.work__title { font-size: var(--t-title); margin: 0; }\n.work__meta { display: flex; gap: var(--s-4); font-size: var(--t-xs); color: var(--c-ink-muted); margin: 0; }\n.work__text { max-width: 42rem; margin-top: var(--s-5); line-height: var(--lh-body); }\n.work__more { display: grid; gap: var(--s-3); margin-top: var(--s-7); }\n.work__more img { width: 100%; height: auto; display: block; }\n.work__tags { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-6); }\n\n/* --- SERIES ----------------------------------------------- */\n.series-list { display: grid; gap: clamp(1rem, 3vw, 2.5rem); }\n.series-row {\n  display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr);\n  gap: clamp(1rem, 3vw, 2.5rem); align-items: center; color: inherit;\n}\n.series-row:hover { text-decoration: none; opacity: 0.85; }\n.series-row__media img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }\n.series-row__body { display: grid; gap: var(--s-2); }\n.series-row__name { font-family: var(--font-en); font-size: var(--t-title); line-height: 1; }\n.series-row__copy { font-size: var(--t-sm); color: var(--c-ink-muted); }\n.series-row__count { font-size: var(--t-xs); color: var(--c-ink-muted); }\n.series-head { padding-block: calc(var(--header-h) + var(--s-7)) var(--s-5); border-bottom: var(--line-ink); }\n.series-head__copy { font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-3) 0 0; max-width: var(--measure); }\n\n/* --- ABOUT ------------------------------------------------ */\n.about__portrait img { width: min(220px, 45%); aspect-ratio: 1; object-fit: cover; border-radius: 50%; }\n.about__lead { font-size: var(--t-lead); margin: var(--s-5) 0 0; ue, ...save(next), moved: used.length };\n}\n\nconst categoryUsage = (key) => mergedWorks().filter((w) => w.category === key).length;\n\n/* --- HOME に並べる区画 ------------------------------------- */\n\nconst cloneHome = () => builtinHomeSlots.map((s) => ({ ...s }));\n\nconst homeSlotsAll = () => (load().home ?? cloneHome()).slice().sort((a, b) => a.order - b.order);\nconst visibleHomeSlots = () => homeSlotsAll().filter((s) => s.published !== false);\n\nconst writeHome = (slots) => {\n  const st = load();\n  const normalized = slots.map((s, i) => ({ ...s, order: i + 1 }));\n  return { ok: true, ...save({ ...st, home: normalized }), slots: normalized };\n};\n\nfunction updateHomeSlot(id, patch) {\n  const slots = homeSlotsAll();\n  if (!slots.some((s) => s.id === id)) return { ok: false, reason: \"この区画は見つかりません。\" };\n  return writeHome(slots.map((s) => (s.id === id ? { ...s, ...patch } : s)));\n}\n\nfunction addHomeSlot(layout = \"feature\") {\n  const slots = homeSlotsAll();\n  const slot = {\n    id: uid(\"hs-u\"), layout, order: slots.length + 1, published: false,\n    title: \"NEW SECTION\", href: \"/works/\", linkLabel: \"VIEW MORE\", custom: true,\n  };\n  return { ...writeHome([...slots, slot]), slot };\n}\n\nfunction deleteHomeSlot(id) {\n  const slots = homeSlotsAll();\n  if (slots.length <= 1) return { ok: false, reason: \"区画を全部消すことはできません。\" };\n  return writeHome(slots.filter((s) => s.id !== id));\n}\n\nfunction moveHomeSlot(id, dir) {\n  const slots = homeSlotsAll();\n  const i = slots.findIndex((s) => s.id === id);\n  const j = i + dir;\n  if (i < 0 || j < 0 || j >= slots.length) return { ok: false, reason: \"これ以上は動かせません。\" };\n  const next = slots.slice();\n  [next[i], next[j]] = [next[j], next[i]];\n  return writeHome(next);\n}\n\nfunction resetHome() {\n  const st = load();\n  return { ok: true, ...save({ ...st, home: null }) };\n}\n\n/** HOMEに使える画像の一覧。登録した作品の絵だけが並ぶ */\nfunction mediaLibrary() {\n  return mergedWorks().filter((w) => w.mainImage).map((w) => ({ value: w.mainImage, label: w.title }));\n}\n\n/* --- キービジュアル（1枚ずつ切り替える） -------------------- */\n\nconst slidesOf = (slot) => slot?.slides ?? [];\n\nfunction addHomeSlide(slotId) {\n  const slot = homeSlotsAll().find((s) => s.id === slotId);\n  if (!slot) return { ok: false, reason: \"この区画は見つかりません。\" };\n  const slide = {\n    id: uid(\"sl\"), eyebrow: \"\", title: \"\", subtitle: \"\", copy: \"\",\n    href: \"/works/\", linkLabel: \"VIEW WORK\", media: \"\", mediaMobile: \"\",\n    focus: \"50% 40%\", zoom: 1, bg: \"#FFF9FC\", fg: \"#171417\", tone: \"dark\",\n    tx: 0, ty: 100, tw: 62, align: \"left\",\n  };\n  const r = updateHomeSlot(slotId, { slides: [...slidesOf(slot), slide] });\n  return { ...r, slide };\n}\n\nfunction updateHomeSlide(slotId, slideId, patch) {\n  const slot = homeSlotsAll().find((s) => s.id === slotId);\n  if (!slot) return { ok: false, reason: \"この区画は見つかりません。\" };\n  return updateHomeSlot(slotId, {\n    slides: slidesOf(slot).map((sl) => (sl.id === slideId ? { ...sl, ...patch } : sl)),\n  });\n}\n\nfunction deleteHomeSlide(slotId, slideId) {\n  const slot = homeSlotsAll().find((s) => s.id === slotId);\n  const slides = slidesOf(slot);\n  if (slides.length <= 1) return { ok: false, reason: \"キービジュアルを全部消すことはできません。\" };\n  return updateHomeSlot(slotId, { slides: slides.filter((sl) => sl.id !== slideId) });\n}\n\nfunction moveHomeSlide(slotId, slideId, dir) {\n  const slot = homeSlotsAll().find((s) => s.id === slotId);\n  const slides = slidesOf(slot).slice();\n  const i = slides.findIndex((sl) => sl.id === slideId);\n  const j = i + dir;\n  if (i < 0 || j < 0 || j >= slides.length) return { ok: false, reason: \"これ以上は動かせません。\" };\n  [slides[i], slides[j]] = [slides[j], slides[i]];\n  return updateHomeSlot(slotId, { slides });\n}\n\n/* --- ABOUT ------------------------------------------------- */\n\nconst DEFAULT_ABOUT = {\n  name: \"PINK INDEX\",\n  lead: \"\",\n  body: \"\",\n  links: [],      // [{ label, href }]\n  portrait: \"\",\n  contactMail: \"\",\n};\n\nconst about = () => ({ ...DEFAULT_ABOUT, ...(load().about ?? {}) });\nfunction updateAbout(patch) {\n  const st = load();\n  return { ok: true, ...save({ ...st, about: { ...about(), ...patch } }) };\n}\n\n/* --- ブランドロゴ ------------------------------------------ */\n\nconst brandLogo = () => load().brandLogo ?? \"\";\nfunction setBrandLogo(media) {\n  const st = load();\n  return { ok: true, ...save({ ...st, brandLogo: media || \"\" }) };\n}\n\n/* --- サイトの文字 ------------------------------------------ */\n\nconst textsAll = () => load().texts ?? {};\n\nfunction updateText(key, patch) {\n  if (!key) return { ok: false, reason: \"どの文字か分かりません。\" };\n  const st = load();\n  const next = { ...(st.texts ?? {}) };\n  const merged = { ...(next[key] ?? {}), ...patch };\n  if (merged.text === undefined && !merged.hidden && !merged.align) delete next[key];\n  else next[key] = merged;\n  return { ok: true, ...save({ ...st, texts: next }) };\n}\n\nfunction resetText(key) {\n  const st = load();\n  if (!st.texts?.[key]) return { ok: true, persisted: true };\n  const next = { ...st.texts };\n  delete next[key];\n  return { ok: true, ...save({ ...st, texts: next }) };\n}\n\nfunction resetTexts() {\n  const st = load();\n  return { ok: true, ...save({ ...st, texts: {} }) };\n}\n\n/* --- 集計 -------------------------------------------------- */\n\nfunction stats() {\n  const st = load();\n  const all = mergedWorks();\n  return {\n    works: all.length,\n    published: all.filter((w) => w.visibility === \"PUBLIC\").length,\n    drafts: all.filter((w) => w.visibility === \"DRAFT\").length,\n    private: all.filter((w) => w.visibility === \"PRIVATE\").length,\n    series: mergedSeries().length,\n    categories: mergedCategories().length,\n    homeEdited: Boolean(st.home),\n    textsEdited: Object.keys(st.texts ?? {}).length,\n    bytes: (() => { try { return JSON.stringify(st).length; } catch { return 0; } })(),\n  };\n}\n\n/**\n * HOMEに並べる区画のHTML。\n *\n * サーバー側の書き出しと、管理画面のプレビューで同じ関数を使う。\n * DOMには触れず、文字列だけを返す。\n *\n * キービジュアルの下は FEATURE / DETAILS / SELECTED / SPOTLIGHT の順で、\n * 見せ方の違う区画が続く。中身は登録した作品と、キービジュアルに使った絵から\n * 拾う。同じ組みを繰り返さず、区画ごとに画像の比率・切り取る場所・余白を変える。\n */\n\nconst esc = (s) => String(s ?? \"\")\n  .replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\")\n  .replace(/\"/g, \"&quot;\").replace(/'/g, \"&#39;\");\n\n/** 0〜100% の値。0.1刻みまで受ける（つかんで動かしたときの細かさ） */\nconst pct = (v, fallback) => {\n  const n = Number(v);\n  return Number.isFinite(n) ? Math.min(100, Math.max(0, Math.round(n * 10) / 10)) : fallback;\n};\n/** 範囲を決めた数値。文字の大きさ・字間・行間・傾きに使う */\nconst num = (v, min, max, fallback) => {\n  const n = Number(v);\n  return Number.isFinite(n) ? Math.min(max, Math.max(min, Math.round(n * 100) / 100)) : fallback;\n};\nconst ALIGN = [\"left\", \"center\", \"right\"];\nconst PLATE = [\"none\", \"veil\", \"band\"];\n\n/**\n * 1枠ぶんの見た目をCSS変数で渡す。\n * 文字は「置き場所」だけでなく、大きさ・字間・行間・傾き・縦横も選べる。\n */\nconst style = (o) => [\n  `--hs-bg:${/^#[0-9a-fA-F]{3,8}$/.test(o.bg || \"\") ? o.bg : \"#FFF9FC\"}`,\n  `--hs-fg:${/^#[0-9a-fA-F]{3,8}$/.test(o.fg || \"\") ? o.fg : \"#171417\"}`,\n  `--hs-focus:${/^[\\d.]+% [\\d.]+%$/.test(o.focus || \"\") ? o.focus : \"50% 40%\"}`,\n  `--hs-zoom:${Math.min(3, Math.max(1, Number(o.zoom) || 1))}`,\n  `--hs-tx:${pct(o.tx, 0)}%`,\n  `--hs-ty:${pct(o.ty, 100)}%`,\n  `--hs-tw:${pct(o.tw, 62)}%`,\n  `--hs-align:${ALIGN.includes(o.align) ? o.align : \"left\"}`,\n  `--hs-tsize:${num(o.tsize, 40, 260, 100) / 100}`,\n  `--hs-tls:${num(o.tls, -8, 40, -2) / 100}em`,\n  `--hs-tlh:${num(o.tlh, 70, 240, 95) / 100}`,\n  `--hs-trot:${num(o.trot, -20, 20, 0)}deg`,\n].join(\";\");\n\n/** 文字まわりの見せ方。縦書き・敷き・ヘッダーの下まで使うか */\nconst textMods = (o) => [\n  o.tvert ? ' data-tvert=\"on\"' : \"\",\n  ` data-tplate=\"${PLATE.includes(o.tplate) ? o.tplate : \"none\"}\"`,\n  o.tfull ? ' data-tfull=\"on\"' : \"\",\n].join(\"\");\n\nconst img = (src, alt, cls, { eager = false, sizes = \"\" } = {}) => (src\n  ? `<img class=\"${cls}\" src=\"${esc(src)}\" alt=\"${esc(alt ?? \"\")}\"\n       loading=\"${eager ? \"eager\" : \"lazy\"}\" decoding=\"async\"${eager ? ' fetchpriority=\"high\"' : \"\"}${sizes}>`\n  : \"\");\n\n/** 区画の見出し。短い英単語だけを置く */\nconst head = (slot, { count = 0 } = {}) => (slot.title\n  ? `<div class=\"sec__head\">\n      <h2 class=\"sec__title\">${esc(slot.title)}<\/h2>\n      ${count ? `<span class=\"sec__count num\">${count}<\/span>` : \"\"}\n    <\/div>`\n  : \"\");\n\n/** 誘導は区画の末尾に1つだけ */\nconst more = (slot, url) => (slot.href && slot.linkLabel\n  ? `<p class=\"sec__more\"><a class=\"link-arrow\" href=\"${esc(url(slot.href))}\">${esc(slot.linkLabel)}<\/a><\/p>`\n  : \"\");\n\n/** 作品と シリーズ は、登録データから引くページへ渡す */\nconst workHref = (w, url) => `${url(\"/work/\")}?w=${encodeURIComponent(w.slug)}`;\nconst seriesHref = (s, url) => `${url(\"/series/\")}?s=${encodeURIComponent(s.slug)}`;\n\n/* --- 01 KEY VISUAL ---------------------------------------- */\n\n/**\n * 主役は一度に一作品。左右の矢印と横スワイプで1枚ずつ切り替える。\n * 文字色は作品ごとに選べる（透明ヘッダーの上でも読めるようにするため）。\n */\nfunction slideHTML(s, { url = (p) => p, heading = \"h2\", eager = false, attrs = \"\" } = {}) {\n  const link = s.href && s.linkLabel\n    ? `<a class=\"kv__link\" href=\"${esc(url(s.href))}\">${esc(s.linkLabel)}<\/a>` : \"\";\n  const text = s.showText === false ? \"\" : `\n          <div class=\"kv__type\">\n            ${s.eyebrow ? `<p class=\"kv__eyebrow\">${esc(s.eyebrow)}<\/p>` : \"\"}\n            ${s.title ? `<${heading} class=\"kv__title\">${esc(s.title)}<\/${heading}>` : \"\"}\n            ${s.subtitle ? `<p class=\"kv__sub\">${esc(s.subtitle)}<\/p>` : \"\"}\n            ${link}\n          <\/div>`;\n  return `\n        <article class=\"kv__slide\" style=\"${style(s)}\" data-tone=\"${s.tone === \"light\" ? \"light\" : \"dark\"}\"${textMods(s)}${attrs}>\n          ${s.media ? `<picture class=\"kv__media\">\n            ${s.mediaMobile ? `<source media=\"(max-width: 820px)\" srcset=\"${esc(url(s.mediaMobile))}\">` : \"\"}\n            ${img(url(s.media), s.altText ?? s.title ?? \"\", \"kv__img\", { eager })}\n          <\/picture>` : \"\"}\n          <div class=\"kv__free\">${text}<\/div>\n        <\/article>`;\n}\n\nfunction heroHTML(slot, { url, first }) {\n  const slides = (slot.slides ?? []).filter((s) => s.published !== false);\n  if (!slides.length) return \"\";\n\n  const multi = slides.length > 1;\n  return `\n  <section class=\"kv\" data-kv${slot.autoplay ? ` data-autoplay=\"${Math.max(2, Number(slot.interval) || 6)}\"` : \"\"}>\n    <div class=\"kv__track\" id=\"kv-track\" tabindex=\"0\"\n         role=\"group\" aria-roledescription=\"カルーセル\" aria-label=\"キービジュアル\">\n      ${slides.map((s, i) => slideHTML(s, {\n        url, heading: first && i === 0 ? \"h1\" : \"h2\", eager: i === 0,\n        attrs: ` data-kv-slide=\"${i}\" role=\"group\" aria-roledescription=\"スライド\"` +\n               ` aria-label=\"${i + 1} / ${slides.length}\"`,\n      })).join(\"\")}\n    <\/div>\n    ${multi ? `\n    <button class=\"kv__arrow kv__arrow--prev\" type=\"button\" data-kv-prev aria-label=\"前の作品\">\n      <span aria-hidden=\"true\"><\/span>\n    <\/button>\n    <button class=\"kv__arrow kv__arrow--next\" type=\"button\" data-kv-next aria-label=\"次の作品\">\n      <span aria-hidden=\"true\"><\/span>\n    <\/button>\n    <ol class=\"kv__dots\">\n      ${slides.map((s, i) => `<li><button type=\"button\" data-kv-go=\"${i}\"\n        aria-label=\"${i + 1}枚目を見る\"${i === 0 ? ' aria-current=\"true\"' : \"\"}><\/button><\/li>`).join(\"\")}\n    <\/ol>` : \"\"}\n  <\/section>`;\n}\n\n/* --- 画像の在庫 ---------------------------------------------\n   キービジュアルの下の区画は、登録した作品と、キービジュアルに使った絵から\n   画像を集めて組む。外から持ってきた画像は一切足さない。\n   点数が少ないときは、同じ絵を「別の比率・別の切り取り位置」で見せる。\n   ---------------------------------------------------------- */\n\n/** 作品 → 作品の追加画像 → キービジュアル の順に集め、重複は落とす */\nfunction buildPool(works, slots, url) {\n  const out = [];\n  const seen = new Set();\n  const push = (src, alt, href, work) => {\n    if (!src || seen.has(src)) return;\n    seen.add(src);\n    out.push({ src, alt: alt ?? \"\", href, work });\n  };\n  for (const w of works) push(w.mainImage, w.altText ?? w.title, workHref(w, url), w);\n  for (const w of works) for (const extra of w.images ?? []) push(extra, w.altText ?? w.title, workHref(w, url), w);\n  for (const slot of slots ?? []) {\n    if (slot.layout !== \"hero\") continue;\n    for (const s of slot.slides ?? []) {\n      push(s.media, s.altText ?? s.title, s.href ? url(s.href) : url(\"/works/\"), null);\n    }\n  }\n  return out;\n}\n\n/** 在庫から順に取り出す。足りなければ先頭へ戻る */\nconst pick = (pool, i) => (pool.length ? pool[((i % pool.length) + pool.length) % pool.length] : null);\n\n/**\n * 切り取りの型。比率と、絵のどこを見せるかの組。\n * 1枚しか無い場合でも、ここが違えば毎回ちがう絵として見える。\n */\nconst CROPS = [\n  { ratio: \"3 / 4\", pos: \"50% 16%\", span: \"narrow\" },   // 顔まわり\n  { ratio: \"16 / 9\", pos: \"50% 44%\", span: \"wide\" },    // 帯状に\n  { ratio: \"1 / 1\", pos: \"28% 30%\", span: \"square\" },   // 左寄りの部分\n  { ratio: \"9 / 16\", pos: \"50% 22%\", span: \"narrow\" },  // 縦に深く\n  { ratio: \"2 / 1\", pos: \"50% 72%\", span: \"wide\" },     // 裾・足元\n  { ratio: \"4 / 5\", pos: \"72% 34%\", span: \"square\" },   // 右寄りの部分\n];\n\n/** 区画で選べる比率。管理画面の選択肢と同じ並び */\nconst RATIOS = {\n  wide: \"16 / 9\", cinema: \"2 / 1\", box: \"5 / 4\", square: \"1 / 1\", tall: \"4 / 5\", portrait: \"3 / 4\",\n};\n\n/** 区画ごとの「絵のどこを見せるか」。未設定なら区画の既定 */\nconst focusOf = (o, fallback) =>\n  (/^[\\d.]+% [\\d.]+%$/.test(o.focus || \"\") ? o.focus : fallback);\n\n/**\n * 1枡。画像があればリンク付きの絵、無ければ色面だけを置く。\n * 色面は装飾で、作品の代わりではない（外の画像を持ち込まないため）。\n */\nfunction cell(entry, { ratio, pos, cls, eager = false, cap = \"\" } = {}) {\n  const box = `aspect-ratio:${ratio};object-position:${pos}`;\n  if (!entry) {\n    return `<span class=\"${cls} ${cls}--empty\"><span class=\"ph\" style=\"aspect-ratio:${ratio}\"><\/span>${cap}<\/span>`;\n  }\n  return `<a class=\"${cls}\" href=\"${esc(entry.href)}\">\n      <img class=\"${cls}__img\" src=\"${esc(entry.src)}\" alt=\"${esc(entry.alt)}\" style=\"${box}\"\n        loading=\"${eager ? \"eager\" : \"lazy\"}\" decoding=\"async\"${eager ? ' fetchpriority=\"high\"' : \"\"}>\n      ${cap}\n    <\/a>`;\n}\n\n/** 画像の外側に置く小さな見出し。絵の上には重ねない */\nconst cap = (title, meta) => (title || meta\n  ? `<span class=\"cap\">${title ? `<span class=\"cap__title\">${esc(title)}<\/span>` : \"\"}${\n      meta ? `<span class=\"cap__meta num\">${esc(meta)}<\/span>` : \"\"}<\/span>`\n  : \"\");\n\nconst year = (w) => String(w?.createdOn ?? \"\").slice(0, 4);\nconst dotted = (w) => String(w?.createdOn ?? \"\").replace(/-/g, \".\");\n\n/* --- 02 FEATURE ------------------------------------------- */\n/**\n * いま一番見せたい1点を、画面の大部分を使って大きく置く。\n * 文字は絵の外、右下に寄せる（中央に小さくまとめない）。\n */\nfunction featureHTML(slot, { url, works, pool }) {\n  // 見せる1点は管理画面で選べる。選んでいなければ「おすすめ」→最初の作品\n  const picked = slot.workId ? works.all.find((w) => w.id === slot.workId) : null;\n  const lead = picked ?? works.featured[0] ?? works.all[0] ?? null;\n  const shot = lead\n    ? { src: lead.mainImage, alt: lead.altText ?? lead.title, href: workHref(lead, url), work: lead }\n    : pick(pool, 0);\n  const note = (lead?.description ?? \"\").trim().split(/\\n|。/)[0].slice(0, 60);\n  const ratio = RATIOS[slot.ratio] ?? \"5 / 4\";\n\n  return `\n  <section class=\"sec sec--feature\" data-side=\"${slot.side === \"left\" ? \"left\" : \"right\"}\"\n           data-align=\"${slot.valign === \"top\" ? \"top\" : slot.valign === \"center\" ? \"center\" : \"bottom\"}\" data-reveal>\n    ${head(slot)}\n    <div class=\"feature\">\n      <div class=\"feature__stage\">\n        ${cell(shot, { ratio, pos: focusOf(slot, \"50% 38%\"), cls: \"feature__lead\", eager: true })}\n      <\/div>\n      <div class=\"feature__aside\">\n        ${lead ? `<p class=\"feature__name\">${esc(lead.title)}<\/p>` : \"\"}\n        ${lead && year(lead) ? `<p class=\"feature__year num\">${esc(year(lead))}<\/p>` : \"\"}\n        ${note ? `<p class=\"feature__note\">${esc(note)}<\/p>` : \"\"}\n        <p class=\"sec__more\"><a class=\"link-arrow\" href=\"${\n          lead ? workHref(lead, url) : url(slot.href || \"/works/\")}\">${\n          esc(lead ? \"VIEW WORK\" : slot.linkLabel || \"VIEW WORKS\")}<\/a><\/p>\n      <\/div>\n    <\/div>\n  <\/section>`;\n}\n\n/* --- 03 DETAILS ------------------------------------------- */\n/**\n * 作品の一部だけを大胆に切り取って横へ並べる帯。\n * 比率も切り取る場所も枡ごとに変える。完成画像の縮小版は並べない。\n */\nfunction detailsHTML(slot, { url, works, pool }) {\n  // 元にする絵は、タグで絞れる。枡の数も選べる（4・6・8）\n  const tagged = slot.tag ? works.all.filter((w) => (w.tags ?? []).includes(slot.tag)) : [];\n  const from = tagged.length\n    ? tagged.map((w) => ({ src: w.mainImage, alt: w.altText ?? w.title, href: workHref(w, url), work: w }))\n    : pool;\n  const count = [4, 6, 8].includes(Number(slot.count)) ? Number(slot.count) : 6;\n\n  // 在庫がある分だけ順に使う。1枚しか無いときは切り取る場所で差をつける\n  const cells = Array.from({ length: count }, (_, i) => {\n    const c = CROPS[i % CROPS.length];\n    const entry = pick(from, i);\n    return `<div class=\"strip__cell strip__cell--${c.span}\" role=\"listitem\">\n        ${cell(entry, { ratio: c.ratio, pos: c.pos, cls: \"strip__shot\" })}\n      <\/div>`;\n  }).join(\"\");\n\n  return `\n  <section class=\"sec sec--details\" data-reveal>\n    ${head(slot)}\n    <div class=\"rail\" data-rail>\n      <div class=\"strip\" role=\"list\" data-rail-track>${cells}<\/div>\n      <div class=\"rail__bar\" data-rail-bar>\n        <span class=\"rail__thumb\" data-rail-thumb><\/span>\n      <\/div>\n    <\/div>\n  <\/section>`;\n}\n\n/* --- 04 COLOR STORY --------------------------------------- */\n/** 以前の設定を残している人のための区画。段差をつけて並べる */\nfunction colorStoryHTML(slot, { url, works }) {\n  const tagged = slot.tag ? works.all.filter((w) => (w.tags ?? []).includes(slot.tag)) : works.all;\n  const list = tagged.slice(0, 5);\n  if (list.length < 3) return \"\";\n  return `\n  <section class=\"sec sec--color\" style=\"${style(slot)}\" data-reveal>\n    ${head(slot)}\n    ${slot.tag ? `<p class=\"sec__lead\">${esc(slot.tag)}<\/p>` : \"\"}\n    <div class=\"color-row\">\n      ${list.map((w, i) => `\n      <a class=\"color-row__item\" href=\"${workHref(w, url)}\" style=\"--n:${i}\">\n        ${img(url(w.mainImage), w.altText, \"color-row__img\")}\n        <span class=\"cap\"><span class=\"cap__title\">${esc(w.title)}<\/span><\/span>\n      <\/a>`).join(\"\")}\n    <\/div>\n    ${more(slot, url)}\n  <\/section>`;\n}\n\n/* --- 05 SELECTED ------------------------------------------ */\n/**\n * 大きな縦長1点・横長2点・正方形1点の非対称な組み。\n * 同じ大きさの枠を並べない。題名は絵の外に小さく置く。\n */\nconst SELECTED_SHAPES = [\n  { key: \"tall\", ratio: \"3 / 4\", pos: \"50% 26%\" },\n  { key: \"wide\", ratio: \"16 / 9\", pos: \"50% 40%\" },\n  { key: \"wide2\", ratio: \"16 / 10\", pos: \"50% 52%\" },\n  { key: \"square\", ratio: \"1 / 1\", pos: \"42% 30%\" },\n];\n\nfunction selectedHTML(slot, { url, works, pool }) {\n  // FEATURE で大きく出した1点は、点数に余裕があれば外す（同じ絵が続かないように）\n  const lead = works.featured[0] ?? works.all[0] ?? null;\n  const sorted = [...works.all]\n    .sort((a, b) => String(b.createdOn ?? \"\").localeCompare(String(a.createdOn ?? \"\")));\n  const recent = works.all.length > 4 ? sorted.filter((w) => w.id !== lead?.id) : sorted;\n  // 4枠それぞれ、管理画面で作品を指名できる（空なら新しい順に埋める）\n  const picks = Array.isArray(slot.pickIds) ? slot.pickIds : [];\n  const named = new Set(picks.filter(Boolean));\n  const rest = recent.filter((x) => !named.has(x.id));\n  let n = 0;\n\n  const items = SELECTED_SHAPES.map((shape, i) => {\n    const chosen = picks[i] ? works.all.find((x) => x.id === picks[i]) : null;\n    const w = chosen ?? rest[n++] ?? null;\n    const entry = w\n      ? { src: w.mainImage, alt: w.altText ?? w.title, href: workHref(w, url), work: w }\n      : pick(pool, i + 1);\n    return `<div class=\"picks__item picks__item--${shape.key}\">\n        ${cell(entry, { ratio: shape.ratio, pos: shape.pos, cls: \"picks__shot\",\n          cap: cap(w?.title ?? \"\", w ? dotted(w) : \"\") })}\n      <\/div>`;\n  }).join(\"\");\n\n  return `\n  <section class=\"sec sec--picks\" data-reveal>\n    ${head(slot, { count: works.all.length })}\n    <div class=\"picks\">${items}<\/div>\n    ${more(slot, url)}\n  <\/section>`;\n}\n\n/* --- 06 SPOTLIGHT ------------------------------------------ */\n/**\n * ページの終盤。背景色を変えて横幅いっぱいに1点（または1シリーズ）を置く。\n * ここまでの白い流れに対する視覚的な切り替え。\n */\nfunction spotlightHTML(slot, { url, works, series, pool }) {\n  // 作品を指名していればそれを、していなければシリーズを、どちらも無ければ自動\n  const named = slot.workId ? works.all.find((w) => w.id === slot.workId) : null;\n  const target = named ? null : slot.seriesSlug\n    ? series.find((s) => s.slug === slot.seriesSlug)\n    : series.find((s) => works.all.some((w) => w.series === s.slug));\n  const list = target ? works.all.filter((w) => w.series === target.slug) : [];\n\n  const solo = named\n    ?? (!target ? (works.featured[1] ?? works.featured[0] ?? works.all[works.all.length - 1] ?? null) : null);\n  const shot = list[0]\n    ? { src: list[0].mainImage, alt: list[0].altText ?? list[0].title, href: seriesHref(target, url) }\n    : solo\n      ? { src: solo.mainImage, alt: solo.altText ?? solo.title, href: workHref(solo, url) }\n      : pick(pool, pool.length - 1);\n\n  const title = target?.name ?? solo?.title ?? \"\";\n  const copy = (target?.copy ?? solo?.description ?? \"\").trim().split(/\\n/)[0].slice(0, 90);\n  const href = target ? seriesHref(target, url) : solo ? workHref(solo, url) : url(slot.href || \"/works/\");\n\n  return `\n  <section class=\"sec sec--spotlight\" style=\"${style(slot)}\"\n           data-side=\"${slot.side === \"left\" ? \"left\" : \"right\"}\" data-reveal>\n    <div class=\"spotlight\">\n      <div class=\"spotlight__stage\">\n        ${cell(shot, { ratio: RATIOS[slot.ratio] ?? \"4 / 3\", pos: focusOf(slot, \"50% 34%\"), cls: \"spotlight__cover\" })}\n      <\/div>\n      <div class=\"spotlight__body\">\n        <p class=\"sec__eyebrow\">${esc(slot.title || \"SPOTLIGHT\")}<\/p>\n        ${title ? `<h2 class=\"spotlight__title\">${esc(title)}<\/h2>` : \"\"}\n        ${copy ? `<p class=\"spotlight__copy\">${esc(copy)}<\/p>` : \"\"}\n        <p class=\"sec__more\"><a class=\"link-arrow\" href=\"${esc(href)}\">${\n          esc(target ? \"VIEW SERIES\" : slot.linkLabel || \"VIEW MORE\")}<\/a><\/p>\n      <\/div>\n    <\/div>\n  <\/section>`;\n}\n\n/* --- 07 ARCHIVE -------------------------------------------- */\n/** 以前の設定を残している人のための区画。量そのものを見せる */\nfunction archiveHTML(slot, { url, works }) {\n  const list = works.all.slice(0, 40);\n  if (list.length < 4) return \"\";\n  return `\n  <section class=\"sec sec--archive\" data-reveal>\n    ${head(slot, { count: works.all.length })}\n    <div class=\"mosaic\">\n      ${list.map((w) => `<a class=\"mosaic__cell\" href=\"${workHref(w, url)}\"\n        >${img(url(w.mainImage), w.altText, \"mosaic__img\")}<\/a>`).join(\"\")}\n    <\/div>\n    ${more(slot, url)}\n  <\/section>`;\n}\n\n/* --- 組み立て ---------------------------------------------- */\n\nconst LAYOUTS = {\n  hero: heroHTML, feature: featureHTML, details: detailsHTML, colorstory: colorStoryHTML,\n  new: selectedHTML, spotlight: spotlightHTML, archive: archiveHTML,\n};\n\n/**\n * @param {object} slot\n * @param {{url?: Function, first?: boolean, works?: array, series?: array, pool?: array}} opts\n */\nfunction homeSlotHTML(slot, opts = {}) {\n  const url = opts.url ?? ((p) => p);\n  const all = opts.works ?? [];\n  const ctx = {\n    url,\n    first: opts.first,\n    works: { all, featured: all.filter((w) => w.featured) },\n    series: opts.series ?? [],\n    pool: opts.pool ?? buildPool(all, opts.slots ?? [], url),\n  };\n  return (LAYOUTS[slot.layout] ?? (() => \"\"))(slot, ctx);\n}\n\nconst homeSlotsHTML = (slots, opts = {}) => {\n  const url = opts.url ?? ((p) => p);\n  // 使える画像は一度だけ集めて、全部の区画で使い回す\n  const pool = buildPool(opts.works ?? [], slots, url);\n  return slots.map((slot, i) => homeSlotHTML(slot, { ...opts, url, pool, first: i === 0 })).join(\"\\n\");\n};\n\n\n  /**\n   * ページの深さに応じた相対パスへ変換する（file:// でも壊れないようにする）。\n   * 1ファイル版では、埋め込んだ画像の表を先に引く。\n   */\n  function url(path) {\n    var p = String(path == null ? \"\" : path);\n    // 自分で登録した絵は data: URL のまま。外部URLも書き換えない\n    if (p.slice(0, 5) === \"data:\" || p.slice(0, 5) === \"blob:\" || /^https?:/.test(p) || p.charAt(0) === \"#\") return p;\n    var map = window.PINK_ASSETS;\n    if (map && map[p]) return map[p];\n    // 1ファイル版はページをハッシュで切り替える。\n    // ここを通さないと、公開先（/pink-index/ など）で404になる。\n    if (window.PINK_SINGLE && p.charAt(0) === \"/\") return \"#\" + p;\n    var base = window.PINK_BASE || \"/\";\n    return base + p.replace(/^\\//, \"\");\n  }\n\n  window.PINK = {\n    catalog: { SCHEMA_VERSION, VISIBILITY, isPublic, categories, series, works, homeSlots, seriesBySlug, shortOf, thumbOf },\n    store: { load, reload, exportData, importData, save, resetAll, customWorks, customSeries, customCategories, removedIds, mergedCategories, mergedSeries, mergedWorks, publicWorks, featuredWorks, worksOfSeries, worksWithTag, workById, workBySlug, addWork, updateWork, deleteWork, addSeries, updateSeries, deleteSeries, seriesUsage, addCategory, deleteCategory, categoryUsage, homeSlotsAll, visibleHomeSlots, updateHomeSlot, addHomeSlot, deleteHomeSlot, moveHomeSlot, resetHome, mediaLibrary, addHomeSlide, updateHomeSlide, deleteHomeSlide, moveHomeSlide, DEFAULT_ABOUT, about, updateAbout, brandLogo, setBrandLogo, textsAll, updateText, resetText, resetTexts, stats },\n    home: { slideHTML, homeSlotHTML, homeSlotsHTML },\n    url: url,\n  };\n})();\n<\/script>\n<script>/**\n * サイト共通の振る舞い。ページ固有の処理は各ページのモジュールに置く。\n *\n * ヘッダーは4つの状態を持つ:\n *   top      先頭。背景は完全に透明で、キービジュアルが背後まで見える\n *   hidden   下へ一定量スクロールした。上へ滑らせて隠す\n *   frosted  途中で上へスクロールした。乳白色＋ぼかし＋薄い下線で戻す\n *   （先頭へ戻ると top に戻る）\n */\n(() => {\n\n/* --- メニュー -------------------------------------------- */\nconst toggle = document.querySelector(\".nav-toggle\");\nconst nav = document.getElementById(\"site-nav\");\nif (toggle && nav) {\n  const label = toggle.querySelector(\".nav-toggle__label\");\n  toggle.addEventListener(\"click\", () => {\n    const open = toggle.getAttribute(\"aria-expanded\") === \"true\";\n    toggle.setAttribute(\"aria-expanded\", String(!open));\n    nav.dataset.open = String(!open);\n    document.body.dataset.navOpen = String(!open);\n    if (label) label.textContent = open ? \"MENU\" : \"CLOSE\";\n  });\n  nav.addEventListener(\"click\", (e) => { if (e.target.tagName === \"A\") toggle.click(); });\n  document.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Escape\" && nav.dataset.open === \"true\") { toggle.click(); toggle.focus(); }\n  });\n}\n\n/* --- ヘッダーの4状態 -------------------------------------- */\nconst header = document.getElementById(\"site-header\");\nif (header) {\n  const TOP = 12;        // ここまでは「先頭」とみなす\n  const STEP = 8;        // 小さな揺れで反転しないためのしきい値\n  const HIDE_AFTER = 220; // これより下でなければ隠さない\n  let last = window.scrollY;\n\n  const setState = (state) => {\n    if (header.dataset.state !== state) header.dataset.state = state;\n  };\n\n  const update = () => {\n    const y = window.scrollY;\n    const menuOpen = nav?.dataset.open === \"true\";\n    const diff = y - last;\n\n    if (y <= TOP) setState(\"top\");\n    else if (menuOpen) setState(\"frosted\");\n    else if (diff > STEP && y > HIDE_AFTER) { setState(\"hidden\"); last = y; }\n    else if (diff < -STEP) { setState(\"frosted\"); last = y; }\n    if (Math.abs(diff) > STEP) last = y;\n  };\n\n  // 読むのは scrollY だけなので、そのまま実行してよい（描き直しは起こさない）\n  addEventListener(\"scroll\", update, { passive: true });\n  update();\n}\n\n/* --- トースト -------------------------------------------- */\nfunction toast(message) {\n  const region = document.getElementById(\"toast-region\");\n  if (!region) return;\n  const el = document.createElement(\"p\");\n  el.className = \"toast\";\n  el.textContent = message;\n  region.append(el);\n  setTimeout(() => el.remove(), 3200);\n}\nwindow.pinkToast = toast;\n})();\n\n/**\n * サイトの文字\n *\n * ページに出ている文字を1つずつ扱えるようにする。\n *   ・保存された書き換え・そろえ・非表示を、読み込み時にあてる\n *   ・管理画面（/studio/texts/）から呼ばれたら、いまの一覧を返す\n *\n * 管理画面はこのページを枠（iframe）の中に置いて編集する。\n * file:// では枠の中を直接読めないため、やり取りは postMessage で行う。\n */\n(() => {\n  const { store } = window.PINK ?? {};\n  if (!store) return;\n\n  /* --- どの文字かを表す鍵 -----------------------------------\n     ページの中での位置（親をさかのぼったタグと組の並び）で作る。\n     文言そのものを鍵にしないので、書き換えても同じ文字を指し続ける。\n     --------------------------------------------------------- */\n  const route = () => {\n    const h = location.hash.replace(/^#/, \"\");\n    if (h) return h.split(\"?\")[0];\n    const p = location.pathname.replace(/index\\.html$/, \"\");\n    const i = p.indexOf(\"/pink-index/\");\n    return i >= 0 ? p.slice(i + \"/pink-index\".length) : p;\n  };\n\n  const step = (n) => {\n    const tag = n.tagName.toLowerCase();\n    const cls = (n.getAttribute(\"class\") || \"\").trim().split(/\\s+/).filter(Boolean).slice(0, 2).join(\".\");\n    const sibs = [...(n.parentElement ? n.parentElement.children : [])].filter((x) => x.tagName === n.tagName);\n    return tag + (cls ? \".\" + cls : \"\") + (sibs.length > 1 ? \":\" + sibs.indexOf(n) : \"\");\n  };\n\n  const keyOf = (el) => {\n    const parts = [];\n    for (let n = el; n && n !== document.body; n = n.parentElement) parts.unshift(step(n));\n    return route() + \"|\" + parts.join(\">\");\n  };\n\n  /* --- 扱う対象 ---------------------------------------------\n     読み込み中の演出、支援技術むけの補助テキスト、入力欄、\n     HOMEのキービジュアル（HOMEの編集で扱う）は対象にしない。\n     --------------------------------------------------------- */\n  const SKIP = \"#loader, .perimeter, .home-frame, .toast-region, [data-kv], .visually-hidden, [aria-hidden='true'], .studio\";\n  const targets = () => [...document.querySelectorAll(\"main *, .site-header *, .site-footer *\")]\n    .filter((el) => {\n      if (el.children.length) return false;\n      if (!(el.textContent || \"\").trim()) return false;\n      if (el.closest(SKIP)) return false;\n      if (/^(script|style|input|textarea|select|option|svg|path|rect|circle)$/.test(el.tagName.toLowerCase())) return false;\n      return true;\n    });\n\n  /** 保存されている指定を、いまのページへあてる */\n  const apply = () => {\n    const over = store.textsAll();\n    for (const el of targets()) {\n      const o = over[keyOf(el)];\n      if (!el.dataset.tOrig) el.dataset.tOrig = el.textContent;\n      if (!o) {\n        if (el.hidden) el.hidden = false;\n        if (el.textContent !== el.dataset.tOrig) el.textContent = el.dataset.tOrig;\n        el.style.textAlign = \"\";\n        continue;\n      }\n      el.hidden = Boolean(o.hidden);\n      el.textContent = typeof o.text === \"string\" ? o.text : el.dataset.tOrig;\n      el.style.textAlign = o.align || \"\";\n    }\n  };\n\n  /** 管理画面へ渡す一覧 */\n  const collect = () => {\n    const over = store.textsAll();\n    return targets().map((el) => {\n      const key = keyOf(el);\n      const o = over[key] ?? {};\n      return {\n        key,\n        text: typeof o.text === \"string\" ? o.text : (el.dataset.tOrig ?? el.textContent),\n        original: el.dataset.tOrig ?? el.textContent,\n        hidden: Boolean(o.hidden),\n        align: o.align || \"\",\n        where: el.closest(\"header\") ? \"ヘッダー\" : el.closest(\"footer\") ? \"フッター\" : \"本文\",\n        edited: Boolean(over[key]),\n      };\n    });\n  };\n\n  let marked = null;\n  const mark = (key) => {\n    if (marked) marked.classList.remove(\"is-text-marked\");\n    marked = targets().find((el) => keyOf(el) === key) ?? null;\n    if (!marked) return;\n    marked.classList.add(\"is-text-marked\");\n    marked.scrollIntoView({ block: \"center\", behavior: \"smooth\" });\n  };\n\n  /** 最下部のロゴを、登録された画像へ差し替える */\n  const applyLogo = () => {\n    const img = document.getElementById(\"brand-logo-img\");\n    const type = document.getElementById(\"brand-logo-type\");\n    if (!img || !type) return;\n    const src = store.brandLogo();\n    img.hidden = !src;\n    type.hidden = Boolean(src);\n    if (src) img.src = src;\n  };\n\n  apply();\n  applyLogo();\n  window.PINK_TEXTS = { apply, collect, mark, keyOf };\n\n  // 管理画面（親の窓）とのやり取り\n  addEventListener(\"message\", (e) => {\n    const msg = e.data;\n    if (!msg || msg.pinkTexts === undefined) return;\n    if (msg.pinkTexts === \"collect\") {\n      e.source.postMessage({ pinkTexts: \"list\", route: route(), rows: collect() }, \"*\");\n    } else if (msg.pinkTexts === \"refresh\") {\n      store.reload();          // 管理画面が保存した内容を読み直す\n      apply();\n      applyLogo();\n      e.source.postMessage({ pinkTexts: \"list\", route: route(), rows: collect() }, \"*\");\n    } else if (msg.pinkTexts === \"mark\") {\n      mark(msg.key);\n    }\n  });\n\n  // 親から見えるよう、読み込みが終わったことを伝える\n  try { parent !== window && parent.postMessage({ pinkTexts: \"ready\", route: route() }, \"*\"); } catch { /* 単独で開いたとき */ }\n})();\n\n/**\n * 初回ローディング演出。\n *\n * 設計上の要点（企画書 5.3 / 5.4）:\n * - 実際の読み込み進捗で数字を進める（偽のアニメーションにしない）\n * - 外周ラインを同じ進捗率で時計回りに描き、先端にだけピンクの点を置く\n * - 100%で数字が左右へ離れ、その間からヒーローのイラストが現れる\n * - 外周ラインはフェードアウトせず、ホームの枠線へ縮んで接続する\n * - 同一セッションでは初回のみフル演出\n * - 進捗が取れない場合も 99% で止めず、最大待機時間でホームへ進める\n */\n(() => {\nconst loader = document.getElementById(\"loader\");\nconst perimeter = document.getElementById(\"perimeter\");\nif (loader) {\n  const reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  const seen = (() => { try { return sessionStorage.getItem(\"pinkindex.loader.seen\") === \"1\"; } catch { return false; } })();\n  const d1 = document.getElementById(\"loader-d1\");\n  const d2 = document.getElementById(\"loader-d2\");\n  const status = document.getElementById(\"loader-status\");\n  const svg = document.getElementById(\"perimeter-svg\");\n  const track = document.getElementById(\"perimeter-track\");\n  const lineRect = document.getElementById(\"perimeter-line\");\n  const tip = document.getElementById(\"perimeter-tip\");\n  const homeFrame = document.getElementById(\"
