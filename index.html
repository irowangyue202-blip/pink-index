<title>PINK INDEX</title>
<style>
/* ============================================================
   PINK INDEX — Design Tokens
   企画書 4章「ブランド・ビジュアルシステム」に対応する唯一の正本。
   色・余白・文字・罫線・角丸・モーションはここだけで定義し、
   個別CSSではハードコードした値を使わない。
   基本比率: 白・淡いピンク 75% / 黒 20% / 鮮やかなピンク 5%
   ============================================================ */

:root {
  /* --- Color: 面(75%) ------------------------------------- */
  --c-canvas: #fff9fc;      /* サイト全体の基本背景 */
  --c-white: #ffffff;       /* 画像面、モーダル、入力欄 */
  --c-pale-pink: #ffe8f2;   /* 巨大背景文字、選択領域の淡色面 */
  --c-pink-mist: #fff2f7;   /* ホバー、空状態、補助背景 */

  /* --- Color: 骨格(20%) ----------------------------------- */
  --c-ink: #171417;         /* 数字、見出し、主要テキスト、線 */
  --c-ink-muted: #756a71;   /* 補足、制作日、メタ情報 */
  --c-hairline: #e8dee3;    /* 罫線、非選択枠、区切り */

  /* --- Color: アクセント(5%) ------------------------------- */
  --c-accent: #ff4fa3;      /* 小さな印、選択点、リンク矢印のみ */
  --c-focus: #6d4aff;       /* キーボードフォーカス */

  /* 状態色。面ではなく細線・小面積で使う */
  --c-danger: #c02b52;
  --c-ok: #1f7a5a;

  /* --- Typography ----------------------------------------- */
  --font-jp: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Kaku Gothic ProN",
    "Yu Gothic", system-ui, sans-serif;
  --font-en: "Archivo", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --font-num: var(--font-en);

  /* 流体タイプスケール。最小/最大を固定し、極端な縮小を避ける */
  --t-hero: clamp(3.5rem, 13vw, 11rem);      /* ローダー数字・巨大見出し */
  --t-display: clamp(2.25rem, 7vw, 5.5rem);  /* セクション大見出し */
  --t-title: clamp(1.5rem, 3.2vw, 2.5rem);
  --t-lead: clamp(1rem, 1.5vw, 1.25rem);
  --t-body: 1rem;
  --t-sm: 0.8125rem;
  --t-xs: 0.6875rem;                          /* ラベル・番号。字間を広げて使う */

  --lh-tight: 1.05;
  --lh-heading: 1.25;
  --lh-body: 1.8;      /* 日本語本文は広めに */
  --ls-label: 0.16em;  /* INDEXラベル・英字小文字 */
  --ls-hero: -0.02em;

  --w-regular: 400;
  --w-medium: 500;
  --w-bold: 700;

  /* --- Space: 4pxベース ----------------------------------- */
  --s-1: 0.25rem;
  --s-2: 0.5rem;
  --s-3: 0.75rem;
  --s-4: 1rem;
  --s-5: 1.5rem;
  --s-6: 2rem;
  --s-7: 3rem;
  --s-8: 4rem;
  --s-9: 6rem;
  --s-10: 8rem;
  --section-y: clamp(3rem, 9vw, 8rem);
  --page-x: clamp(1.25rem, 4vw, 4rem);
  --measure: 34em;         /* 本文の最大行長 */

  /* --- Line / Radius -------------------------------------- */
  --line: 1px;
  --line-ink: var(--line) solid var(--c-ink);
  --line-hair: var(--line) solid var(--c-hairline);
  --line-pink: var(--line) solid var(--c-pale-pink);
  --r-1: 2px;
  --r-2: 8px;    /* 標準 */
  --r-3: 12px;   /* 大きめのパネル */
  --r-pill: 999px; /* タグ・フィルターのみ */

  /* 影は「実際に前後関係がある要素」だけに使う */
  --shadow-float: 0 12px 32px rgba(23, 20, 23, 0.1);
  --shadow-sheet: 0 -8px 28px rgba(23, 20, 23, 0.12);

  /* --- Motion --------------------------------------------- */
  --m-micro: 170ms;   /* ホバー、選択、チェック */
  --m-panel: 300ms;   /* フィルター、ボトムシート、モーダル */
  --m-reveal: 520ms;  /* セクション見出し、作品の初回表示 */
  --m-loader-exit: 560ms;
  --ease-out: cubic-bezier(0.16, 0.84, 0.32, 1); /* 素早く出て静かに止まる */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  /* --- Layout --------------------------------------------- */
  --grid-cols: 12;
  --grid-gap: clamp(1rem, 2vw, 2rem);
  --max-w: 1600px;
  --header-h: 64px;
  --tap-min: 44px;   /* タップ対象の下限 */
  --z-sticky: 30;
  --z-sheet: 60;
  --z-header: 70;
  --z-dialog: 80;
  --z-loader: 100;
}

@media (max-width: 900px) {
  :root {
    --grid-cols: 8;
    --header-h: 56px;
  }
}
@media (max-width: 640px) {
  :root {
    --grid-cols: 4;
  }
}

/* モーション軽減。演出は削るが、状態変化は色/枠で必ず分かるようにする */
@media (prefers-reduced-motion: reduce) {
  :root {
    --m-micro: 1ms;
    --m-panel: 1ms;
    --m-reveal: 1ms;
    --m-loader-exit: 1ms;
  }
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============================================================
   PINK INDEX — Base / Layout
   ============================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  /* 装飾の巨大文字などで横スクロールが生まれないようにする最終防衛線 */
  overflow-x: clip;
}

body {
  margin: 0;
  background: var(--c-canvas);
  color: var(--c-ink);
  font-family: var(--font-jp);
  font-size: var(--t-body);
  line-height: var(--lh-body);
  font-weight: var(--w-regular);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "palt" 1;
}

/* 数字はカウント中に幅が揺れないよう等幅数字を強制 */
.num, .u-num, time, .count { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

h1, h2, h3, h4 {
  margin: 0;
  line-height: var(--lh-heading);
  font-weight: var(--w-bold);
  letter-spacing: -0.01em;
}
p { margin: 0 0 var(--s-4); max-width: min(var(--measure), 100%); }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg { max-width: 100%; display: block; }
/* display を指定した部品が [hidden] を打ち消さないようにする */
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }

a {
  color: var(--c-ink);
  text-decoration: none;
  text-underline-offset: 0.25em;
}
a:hover { text-decoration: underline; text-decoration-thickness: 1px; }

/* フォーカスリングは絶対に消さない。識別性のためVioletを使う */
:focus-visible {
  outline: 2px solid var(--c-focus);
  outline-offset: 3px;
  border-radius: var(--r-1);
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip-path: inset(50%);
  overflow: hidden; white-space: nowrap;
}

.skip-link {
  position: absolute; left: var(--s-4); top: -100px;
  z-index: calc(var(--z-header) + 1);
  background: var(--c-ink); color: var(--c-white);
  padding: var(--s-3) var(--s-4); border-radius: var(--r-2);
  transition: top var(--m-micro) var(--ease-out);
}
.skip-link:focus { top: var(--s-4); }

/* 着せ替えのような操作画面は、ページ全体を伸ばさず画面内に収める。
   スクロールは素材一覧など、必要な部分だけに閉じ込める。 */
body.app-screen { overflow: hidden; height: 100svh; }
body.app-screen .site-footer { display: none; }

/* --- Page frame ------------------------------------------ */
.page { max-width: var(--max-w); margin: 0 auto; padding: 0 var(--page-x); }
.section { padding-block: var(--section-y); }
.stack > * + * { margin-top: var(--s-4); }

.grid {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
  gap: var(--grid-gap);
}

/* --- Header ---------------------------------------------- */
.site-header {
  position: sticky; top: 0; z-index: var(--z-header);
  height: var(--header-h);
  display: flex; align-items: center; gap: var(--s-5);
  padding: 0 var(--page-x);
  background: color-mix(in srgb, var(--c-canvas) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: var(--line-hair);
}
.site-header--overlay {
  position: fixed; left: 0; right: 0;
  background: transparent; backdrop-filter: none; border-bottom: 0;
}
.logo {
  font-family: var(--font-en);
  font-weight: var(--w-bold);
  font-size: 0.95rem;
  letter-spacing: var(--ls-label);
  text-transform: uppercase;
  display: inline-flex; align-items: baseline; gap: var(--s-2);
}
.logo::after {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: var(--c-accent);            /* 鮮やかなピンクは直径数pxの点だけ */
}
.site-nav { margin-left: auto; display: flex; gap: var(--s-5); align-items: center; }
/* 英字だけでは何の画面か分からないため、必ず日本語を併記する */
.site-nav a {
  display: flex; flex-direction: column; gap: 1px;
  color: var(--c-ink-muted);
  padding: var(--s-2) 0;
  border-bottom: 1px solid transparent;
  transition: color var(--m-micro) var(--ease-out), border-color var(--m-micro) var(--ease-out);
}
.site-nav .nav-en {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
}
.site-nav .nav-jp { font-size: 10px; letter-spacing: 0.04em; }
.site-nav a:hover { color: var(--c-ink); border-bottom-color: var(--c-ink); text-decoration: none; }
.site-nav a[aria-current="page"] { color: var(--c-ink); border-bottom-color: var(--c-accent); }

.nav-toggle { display: none; }

@media (max-width: 900px) {
  .site-nav {
    position: fixed; inset: var(--header-h) 0 auto 0;
    flex-direction: column; align-items: flex-start; gap: 0;
    background: var(--c-white);
    border-bottom: var(--line-ink);
    padding: var(--s-4) var(--page-x) var(--s-6);
    transform: translateY(-8px); opacity: 0; pointer-events: none;
    transition: opacity var(--m-panel) var(--ease-out), transform var(--m-panel) var(--ease-out);
  }
  .site-nav[data-open="true"] { transform: none; opacity: 1; pointer-events: auto; }
  .site-nav a {
    flex-direction: row; align-items: baseline; gap: var(--s-3);
    padding: var(--s-3) 0; width: 100%; min-height: var(--tap-min);
    border-bottom: var(--line-hair);
  }
  .site-nav .nav-en { font-size: 0.9rem; }
  .site-nav .nav-jp { font-size: var(--t-sm); }
  .nav-toggle {
    display: inline-flex; align-items: center; gap: var(--s-2);
    margin-left: auto; min-height: var(--tap-min); padding: 0 var(--s-2);
    background: none; border: 0; cursor: pointer;
    font-family: var(--font-en); font-size: var(--t-xs);
    letter-spacing: var(--ls-label); text-transform: uppercase;
  }
}

/* つまみとチェックは、サイトの色（黒）で塗る */
input[type="range"], input[type="checkbox"], input[type="radio"], progress {
  accent-color: var(--c-ink);
}

/* --- Footer ---------------------------------------------- */
.site-footer {
  border-top: var(--line-ink);
  padding: var(--s-7) var(--page-x) var(--s-6);
  margin-top: var(--s-9);
  background: var(--c-white);
}
.site-footer .footer-grid {
  max-width: var(--max-w); margin: 0 auto;
  display: grid; gap: var(--s-6);
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
}
.site-footer h2 {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
  color: var(--c-ink-muted); margin-bottom: var(--s-3);
}
.site-footer li + li { margin-top: var(--s-2); }
.site-footer a { font-size: var(--t-sm); }
.footer-note {
  max-width: var(--max-w); margin: var(--s-6) auto 0;
  padding-top: var(--s-4); border-top: var(--line-hair);
  font-size: var(--t-xs); color: var(--c-ink-muted); line-height: 1.9;
}

/* --- Section heading (番号 + 英字 + 和文) ------------------- */
.section-head { display: flex; align-items: flex-end; gap: var(--s-5); flex-wrap: wrap; margin-bottom: var(--s-6); }
.section-head__no {
  font-family: var(--font-num); font-size: var(--t-display);
  font-weight: var(--w-bold); line-height: 0.85; letter-spacing: var(--ls-hero);
}
.section-head__body { flex: 1 1 20rem; }
.section-head__en {
  font-family: var(--font-en); font-size: var(--t-title);
  font-weight: var(--w-bold); text-transform: uppercase; letter-spacing: 0.02em;
}
.section-head__jp { font-size: var(--t-sm); color: var(--c-ink-muted); }
.section-head::after {
  content: ""; flex: 1 1 4rem; height: 1px; background: var(--c-hairline); margin-bottom: 0.6em;
}

/* ============================================================
   PINK INDEX — Components (企画書 8章)
   角丸・影・ピルを多用せず、罫線と余白で階層を作る。
   選択状態は「色だけ」で示さず、枠 + 小さなピンクの点 + テキストで示す。
   ============================================================ */

/* --- Buttons --------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--s-2);
  min-height: var(--tap-min); padding: var(--s-3) var(--s-5);
  border-radius: var(--r-2); border: var(--line-ink);
  background: var(--c-white); color: var(--c-ink);
  font-size: var(--t-sm); font-weight: var(--w-medium);
  cursor: pointer; text-decoration: none;
  transition: background var(--m-micro) var(--ease-out), color var(--m-micro) var(--ease-out),
    transform var(--m-micro) var(--ease-out);
}
.btn:hover { background: var(--c-pink-mist); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] {
  color: var(--c-ink-muted); border-color: var(--c-hairline);
  background: var(--c-white); cursor: not-allowed;
}
/* 主要操作は1画面に1〜2個 */
.btn--primary { background: var(--c-ink); color: var(--c-white); border-color: var(--c-ink); }
.btn--primary:hover { background: #000; color: var(--c-white); }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--ghost:hover { background: var(--c-pink-mist); }
.btn--sm { min-height: 36px; padding: var(--s-2) var(--s-3); font-size: var(--t-xs); }
.btn--icon { padding: var(--s-2); min-width: var(--tap-min); }

/* テキストリンク: 黒文字 + 小さなピンク矢印 */
.link-arrow {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-sm); font-weight: var(--w-medium);
}
.link-arrow::after {
  content: "→"; color: var(--c-accent);
  transition: transform var(--m-micro) var(--ease-out);
}
.link-arrow:hover { text-decoration: none; }
.link-arrow:hover::after { transform: translateX(4px); }

/* --- Index label (衣服の管理タグ) -------------------------- */
.index-label {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
  color: var(--c-ink-muted);
}
.index-label__no { color: var(--c-ink); font-weight: var(--w-bold); }
/* 切り欠きのある衣服タグ形状 */
.tag-chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-1) var(--s-3) var(--s-1) var(--s-4);
  background: var(--c-white); border: var(--line-hair);
  border-radius: var(--r-1);
  font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted);
  position: relative;
}
.tag-chip::before {
  content: ""; position: absolute; left: 7px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 4px; border-radius: 50%;
  border: 1px solid var(--c-ink-muted);   /* 紐通し穴 */
}

/* --- Filter chip ----------------------------------------- */
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: 34px; padding: 0 var(--s-4);
  border: var(--line-hair); border-radius: var(--r-pill);
  background: var(--c-white); color: var(--c-ink-muted);
  font-size: var(--t-xs); letter-spacing: 0.04em; cursor: pointer;
  transition: all var(--m-micro) var(--ease-out);
}
.chip:hover { background: var(--c-pink-mist); color: var(--c-ink); }
.chip[aria-pressed="true"] {
  background: var(--c-ink); border-color: var(--c-ink); color: var(--c-white);
}
.chip[aria-pressed="true"]::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--c-accent);
}

/* --- Card ------------------------------------------------ */
.card {
  display: flex; flex-direction: column;
  background: var(--c-white);
  border: var(--line-hair); border-radius: var(--r-2);
  overflow: hidden;
  transition: border-color var(--m-micro) var(--ease-out), transform var(--m-micro) var(--ease-out);
}
.card:hover { border-color: var(--c-ink); }
.card a { display: block; }
.card__media {
  position: relative; aspect-ratio: 3 / 4; background: var(--c-white);
  border-bottom: var(--line-hair); overflow: hidden;
}
.card__media img { width: 100%; height: 100%; object-fit: contain; padding: var(--s-3); }
.card__media--wide { aspect-ratio: 4 / 3; }
.card__body { padding: var(--s-3) var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: var(--s-1); }
.card__no {
  font-family: var(--font-num); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); color: var(--c-ink-muted);
}
.card__name { font-size: 0.9rem; font-weight: var(--w-medium); line-height: 1.5; }
.card__meta { font-size: var(--t-xs); color: var(--c-ink-muted); display: flex; gap: var(--s-2); flex-wrap: wrap; }
.card__fav {
  position: absolute; right: var(--s-2); top: var(--s-2);
  width: 34px; height: 34px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--c-white) 85%, transparent);
  border: var(--line-hair); border-radius: 50%; cursor: pointer;
}
.card__fav[aria-pressed="true"] { border-color: var(--c-accent); color: var(--c-accent); }

/* 整列グリッド(検索結果) */
.card-grid {
  display: grid; gap: var(--grid-gap);
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}
@media (max-width: 640px) {
  .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
}
/* 特集・GALLERYだけ可変比率の編集的レイアウトを許可 */
.editorial-grid {
  display: grid; gap: var(--grid-gap);
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  grid-auto-flow: dense;
}
.editorial-grid .card--tall { grid-row: span 2; }
.editorial-grid .card--tall .card__media { aspect-ratio: 3 / 5; }
.editorial-grid .card--wide { grid-column: span 2; }
.editorial-grid .card--wide .card__media { aspect-ratio: 16 / 10; }
@media (max-width: 640px) {
  .editorial-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
  .editorial-grid .card--wide { grid-column: span 2; }
  .editorial-grid .card--tall { grid-row: span 1; }
  .editorial-grid .card--tall .card__media { aspect-ratio: 3 / 4; }
}

/* --- Empty state ----------------------------------------- */
.empty {
  border: 1px dashed var(--c-hairline); border-radius: var(--r-3);
  background: var(--c-pink-mist);
  padding: var(--s-8) var(--s-5); text-align: center;
}
.empty__title { font-size: 1rem; font-weight: var(--w-medium); }
.empty__body { font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-2) auto 0; max-width: 28em; }

/* --- Toast ----------------------------------------------- */
.toast-region {
  position: fixed; left: 50%; bottom: var(--s-6); transform: translateX(-50%);
  z-index: var(--z-dialog); display: flex; flex-direction: column; gap: var(--s-2);
  pointer-events: none; width: min(90vw, 420px);
}
.toast {
  background: var(--c-ink); color: var(--c-white);
  border-radius: var(--r-2); padding: var(--s-3) var(--s-4);
  font-size: var(--t-sm); box-shadow: var(--shadow-float);
  animation: toast-in var(--m-panel) var(--ease-out);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* --- Form ------------------------------------------------ */
.field { display: flex; flex-direction: column; gap: var(--s-2); }
.field > label { font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted); }
.field .hint { font-size: var(--t-xs); color: var(--c-ink-muted); }
.input, .select, .textarea {
  min-height: var(--tap-min); padding: var(--s-2) var(--s-3);
  background: var(--c-white); border: var(--line-hair); border-radius: var(--r-2);
  transition: border-color var(--m-micro) var(--ease-out);
}
.input:hover, .select:hover, .textarea:hover { border-color: var(--c-ink-muted); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--c-ink); }
.textarea { min-height: 96px; line-height: 1.7; resize: vertical; }

/* --- Meta table ------------------------------------------ */
.meta-list { display: grid; grid-template-columns: max-content 1fr; gap: var(--s-2) var(--s-5); font-size: var(--t-sm); }
.meta-list dt { color: var(--c-ink-muted); font-size: var(--t-xs); letter-spacing: 0.06em; }
.meta-list dd { margin: 0; }

/* --- Counter (ARCHIVE COUNTER) ---------------------------- */
.counter-row { display: grid; gap: var(--grid-gap); grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.counter {
  border-top: var(--line-ink); padding-top: var(--s-3);
}
.counter__value {
  font-family: var(--font-num); font-size: clamp(2.5rem, 5vw, 4rem);
  font-weight: var(--w-bold); line-height: 1; letter-spacing: var(--ls-hero);
}
.counter__label {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
  margin-top: var(--s-2);
}

/* --- Reveal (セクション初回表示) --------------------------- */
[data-reveal] {
  opacity: 0; transform: translateY(14px);
  transition: opacity var(--m-reveal) var(--ease-out), transform var(--m-reveal) var(--ease-out);
}
[data-reveal].is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  [data-reveal] { opacity: 1; transform: none; }
}

/* --- 縫い目風の点線区切り ---------------------------------- */
.seam {
  height: 1px; border: 0; margin: var(--s-7) 0;
  background-image: linear-gradient(90deg, var(--c-hairline) 0 6px, transparent 6px 12px);
  background-size: 12px 1px;
}

/* 取り消せない操作の2度押し待ち */
.btn--danger { border-color: var(--c-danger); color: var(--c-danger); background: var(--c-white); }
.btn--danger:hover { background: color-mix(in srgb, var(--c-danger) 8%, var(--c-white)); }

/* --- フレーバーテキスト（作品としての文章） ------------------ */
.card__flavor {
  font-size: var(--t-xs); line-height: 1.7; color: var(--c-ink-muted);
  margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card__flavor:empty { display: none; }
.detail__flavor {
  font-size: 1.05rem; line-height: 2.1; margin: var(--s-4) 0 0;
  max-width: 30em; border-left: 2px solid var(--c-accent); padding-left: var(--s-4);
}
.detail__flavor:empty { display: none; }

/* ============================================================
   PINK INDEX — Loader (企画書 5章)
   「サイトへの待ち時間」ではなく「白い作品台帳が開き、
    最初の1ページが立ち上がる瞬間」として設計する。
   外周ラインはフェードアウトせず、ホームの枠線へ変形して接続する。
   ============================================================ */

.loader {
  position: fixed; inset: 0; z-index: var(--z-loader);
  background: var(--c-canvas);
  display: grid; grid-template-rows: auto 1fr auto;
  padding: clamp(1.25rem, 4vw, 3rem);
  /* 端末のノッチ/ブラウザUIと干渉しない内側に描く */
  padding: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-top))
           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-right))
           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-bottom))
           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-left));
}
.loader[hidden] { display: none; }

.loader__top {
  display: flex; justify-content: space-between; align-items: flex-start;
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
}

/* 数字は中央に置かず、左下寄せ・余白を大きく残す */
.loader__count {
  grid-row: 3;
  display: flex; align-items: flex-end; gap: 0.08em;
  font-family: var(--font-num); font-weight: var(--w-bold);
  font-size: var(--t-hero); line-height: 0.78; letter-spacing: var(--ls-hero);
  font-variant-numeric: tabular-nums;
  color: var(--c-ink);
}
.loader__range {
  font-size: var(--t-xs); letter-spacing: var(--ls-label);
  color: var(--c-ink-muted); align-self: flex-start; margin-bottom: 0.6em;
  font-weight: var(--w-medium);
}
.loader__pct {
  font-size: 0.22em; align-self: flex-start; margin-top: 0.35em; /* 小さな上付きの % */
  color: var(--c-ink-muted); font-weight: var(--w-medium);
}

/* 100%で数字が左右へ静かに離れ、その間からイラストが現れる */
.loader__digits { display: inline-flex; }
.loader[data-state="exit"] .loader__digits--l { transform: translateX(-28vw); opacity: 0; }
.loader[data-state="exit"] .loader__digits--r { transform: translateX(28vw); opacity: 0; }
.loader__digits--l, .loader__digits--r {
  transition: transform var(--m-loader-exit) var(--ease-in-out),
              opacity var(--m-loader-exit) var(--ease-out);
}
.loader[data-state="exit"] .loader__range,
.loader[data-state="exit"] .loader__pct,
.loader[data-state="exit"] .loader__top { opacity: 0; transition: opacity 220ms var(--ease-out); }

.loader { transition: opacity var(--m-loader-exit) var(--ease-out); }
.loader[data-state="done"] { opacity: 0; pointer-events: none; }

/* --- 画面外周ライン ---------------------------------------- */
.perimeter {
  position: fixed; inset: 0; z-index: calc(var(--z-loader) + 1);
  pointer-events: none;
}
.perimeter[hidden] { display: none; }
.perimeter svg { width: 100%; height: 100%; display: block; }
.perimeter__track { fill: none; stroke: var(--c-hairline); stroke-width: 1; }
.perimeter__line { fill: none; stroke: var(--c-ink); stroke-width: 1; stroke-linecap: butt; }
/* 線の先端にだけ小さなピンクの点 */
.perimeter__tip { fill: var(--c-accent); }
.perimeter--handoff .perimeter__tip { opacity: 0; transition: opacity 240ms var(--ease-out); }
.perimeter--handoff { transition: opacity 420ms var(--ease-out) 260ms; }
.perimeter--faded { opacity: 0; }

/* ホーム側の受け皿。外周ラインが縮んでここへ重なり、静的な枠へ引き継ぐ */
.home-frame {
  position: fixed; z-index: 1; pointer-events: none;
  inset: var(--frame-inset, 12px);
  border: var(--line-hair);
  opacity: 0;
  transition: opacity 420ms var(--ease-out);
}
.home-frame.is-on { opacity: 1; }
@media (max-width: 640px) { .home-frame { display: none; } }

/* 縮小演出を行わない場合(reduced motion)の短いクロスフェード */
@media (prefers-reduced-motion: reduce) {
  .loader__digits--l, .loader__digits--r { transform: none !important; }
}

/* スクロール抑止 */
body[data-loading="true"] { overflow: hidden; }

/* ============================================================
   PINK INDEX — HOME
   キャンペーンサイト / ポートフォリオとしての縦長構成。
     - 画像はカード・角丸・枠線・影に入れず、色面へ直接置く
     - 文字は小さく、画像の上か大きな余白の側に置く
     - セクションごとに構図を変える（全面 / 左大画像 / 右縦画像 /
       エディトリアル / 余白の大きい導線）
   ============================================================ */

/* --- 1枠の共通 -------------------------------------------- */
.hs {
  position: relative;
  background: var(--hs-bg, var(--c-canvas));
  color: var(--hs-fg, var(--c-ink));
  overflow: clip;
}
.hs__img {
  display: block; width: 100%; height: 100%;
  object-fit: cover;
  object-position: var(--hs-focus, 50% 40%);
  transform: scale(var(--hs-zoom, 1));
}
.hs__media { display: block; height: 100%; }
.hs__media picture { display: block; height: 100%; }

.hs__eyebrow {
  font-family: var(--font-en); font-size: 0.6875rem;
  letter-spacing: 0.24em; text-transform: uppercase;
  margin: 0 0 var(--s-4); opacity: 0.72;
}
.hs__title {
  font-family: var(--font-en); font-weight: var(--w-bold);
  font-size: clamp(2.5rem, 6.5vw, 6rem);
  line-height: 0.92; letter-spacing: -0.025em;
  text-transform: uppercase; margin: 0;
  text-wrap: balance;
}
.hs__sub {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: 0.18em; text-transform: uppercase;
  margin: var(--s-4) 0 0; opacity: 0.72;
}
.hs__copy {
  font-size: 0.95rem; line-height: 2.05;
  max-width: 26em; margin: var(--s-5) 0 0; opacity: 0.9;
}
.hs__link {
  display: inline-flex; align-items: baseline; gap: var(--s-2);
  margin-top: var(--s-6);
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: 0.2em; text-transform: uppercase;
  color: inherit; padding-bottom: var(--s-2);
  border-bottom: 1px solid currentColor;
}
.hs__link::after { content: "→"; color: var(--c-accent); transition: transform var(--m-micro) var(--ease-out); }
.hs__link:hover { text-decoration: none; }
.hs__link:hover::after { transform: translateX(5px); }

/* --- 01 キービジュアル（横スクロールで切り替える） ----------- */
.hs--hero { min-height: 0; padding: 0; }
.kv { position: relative; }
.kv__track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.kv__track::-webkit-scrollbar { display: none; }
.kv__slide {
  position: relative;
  flex: 0 0 100%;
  scroll-snap-align: start;
  display: block;
  min-height: min(86svh, 940px);
  background: var(--hs-bg);
  color: var(--hs-fg);
  overflow: clip;
}
.kv__media { position: absolute; inset: 0; display: block; }
.kv__media .hs__img { width: 100%; height: 100%; }

/* 文字を置ける範囲。上下左右に最小限の余白だけ残し、
   その中で --hs-tx / --hs-ty（0〜100%）の位置へ自由に動かせる。
   0% は左（上）端ぞろえ、100% は右（下）端ぞろえになる。 */
.hs__free {
  position: absolute;
  inset: clamp(1.5rem, 5vw, 3.5rem) var(--page-x) clamp(5.5rem, 9vw, 7rem);
  z-index: 1;
  pointer-events: none;
}
.hs__type--hero {
  position: absolute;
  left: var(--hs-tx, 0%);
  top: var(--hs-ty, 100%);
  transform: translate(calc(var(--hs-tx, 0%) * -1), calc(var(--hs-ty, 100%) * -1));
  width: max(16rem, var(--hs-tw, 62%));
  max-width: 100%;
  text-align: var(--hs-align, left);
  pointer-events: auto;
}
.hs__type--hero .hs__title { margin-inline: unset; }
.hs--hero .hs__title { font-size: clamp(3rem, 10vw, 9.5rem); line-height: 0.86; }
.hs--hero .hs__eyebrow, .hs--hero .hs__sub { opacity: 1; }
.hs__empty {
  font-size: var(--t-xs); letter-spacing: 0.06em; opacity: 0.6;
  margin: var(--s-5) 0 0;
}

/* 切り替えの操作。画面の下端に小さく置く */
.kv__nav {
  position: absolute; left: var(--page-x); right: var(--page-x); bottom: clamp(1.25rem, 3vw, 2.25rem);
  z-index: 2; display: flex; align-items: center; gap: var(--s-3);
  color: var(--hs-fg); pointer-events: none;
}
.kv__nav > * { pointer-events: auto; }
.kv__arrow {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid currentColor; background: transparent; color: inherit;
  font-size: 1rem; line-height: 1; cursor: pointer;
  transition: background var(--m-micro) var(--ease-out), color var(--m-micro) var(--ease-out);
}
.kv__arrow:hover { background: currentColor; }
.kv__arrow:hover::first-line { color: var(--hs-bg); }
.kv__arrow[disabled] { opacity: 0.3; cursor: default; }
.kv__dots { display: flex; gap: var(--s-2); align-items: center; margin-left: var(--s-2); }
.kv__dots button {
  width: 28px; height: 2px; border: 0; padding: 0; cursor: pointer;
  background: currentColor; opacity: 0.3;
  transition: opacity var(--m-micro) var(--ease-out);
}
.kv__dots button[aria-current="true"] { opacity: 1; }
.kv__dots li { display: flex; }
.kv__count {
  margin: 0 0 0 auto; font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: 0.18em;
}

/* 画像がまだ無いときも、色面と文字だけで成立させる */
.hs--hero-empty { min-height: min(72svh, 760px); display: grid; }
.hs--hero-empty .hs__type--hero {
  position: static; transform: none; width: auto; max-width: 46rem;
  align-self: center; padding: clamp(3rem, 8vw, 6rem) var(--page-x);
}

/* --- 02 / 03 左右分割 ------------------------------------- */
.hs--split {
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
  align-items: stretch;
  min-height: min(86svh, 900px);
}
.hs--split .hs__media { min-height: 52svh; }
.hs--split .hs__type {
  /* 文字の寄せかたは管理画面から選ぶ（上下 = --hs-ay / 左右 = --hs-ax） */
  align-self: var(--hs-ay, center);
  justify-self: var(--hs-ax, start);
  text-align: var(--hs-align, left);
  padding: clamp(3rem, 7vw, 7rem) var(--page-x);
}
/* 右に縦長画像を置く回は、左のタイポグラフィを主役にする */
.hs--right { grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); }
.hs--right .hs__media { order: 2; }
.hs--right .hs__type { order: 1; }
.hs--right .hs__title { font-size: clamp(2.75rem, 8vw, 8rem); }

/* --- 04 エディトリアル ------------------------------------ */
.hs--editorial {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: clamp(1rem, 2.5vw, 2.5rem);
  padding-block: clamp(3rem, 8vw, 8rem);
  align-items: end;
}
.hs--editorial .hs__ed-wide { grid-column: 1 / 10; }
.hs--editorial .hs__ed-type {
  grid-column: 10 / 13; align-self: center;
  padding-right: var(--page-x);
}
.hs--editorial .hs__ed-a { grid-column: 2 / 6; margin-top: clamp(2rem, 5vw, 5rem); }
.hs--editorial .hs__ed-b { grid-column: 7 / 12; margin-top: clamp(4rem, 10vw, 10rem); }
.hs--editorial .hs__title { font-size: clamp(2rem, 4.5vw, 4rem); }
.hs--editorial .hs__ed-a .hs__img,
.hs--editorial .hs__ed-b .hs__img { aspect-ratio: 3 / 4; }

/* --- 05 余白の大きい導線 ----------------------------------- */
.hs--cta {
  display: grid;
  grid-template-columns: minmax(0, 6fr) minmax(0, 4fr);
  gap: var(--grid-gap);
  align-items: center;
  padding: clamp(4rem, 12vw, 12rem) var(--page-x) clamp(4rem, 12vw, 12rem);
}
.hs--cta .hs__type {
  justify-self: var(--hs-ax, start);
  text-align: var(--hs-align, left);
}
.hs--cta .hs__title { font-size: clamp(2.5rem, 7vw, 6.5rem); }
.hs--cta .hs__cta-media { justify-self: center; width: min(100%, 360px); }
.hs--cta .hs__img { aspect-ratio: 2 / 3; object-fit: contain; }

.hs--editorial .hs__ed-type { text-align: var(--hs-align, left); }

/* --- INDEX（各画面への入口） ------------------------------- */
.home-index {
  padding: clamp(3rem, 7vw, 7rem) var(--page-x);
  border-top: var(--line-ink);
}
.home-index__label {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: 0.24em; color: var(--c-ink-muted);
  margin-bottom: var(--s-6);
}
.home-index ul { display: grid; }
.home-index li { border-top: var(--line-hair); }
.home-index li:last-child { border-bottom: var(--line-hair); }
.home-index a {
  display: grid;
  grid-template-columns: 4rem minmax(0, 1fr) auto;
  align-items: baseline; gap: var(--s-5);
  padding: clamp(1rem, 2.6vw, 2rem) 0;
  transition: padding-left var(--m-panel) var(--ease-out);
}
.home-index a:hover { text-decoration: none; padding-left: var(--s-4); }
.home-index__no { font-family: var(--font-num); font-size: 1rem; color: var(--c-ink-muted); }
.home-index__en {
  font-family: var(--font-en); font-weight: var(--w-bold);
  font-size: clamp(1.5rem, 4vw, 3rem); line-height: 1;
  letter-spacing: -0.02em; text-transform: uppercase;
}
.home-index__jp { font-size: var(--t-sm); color: var(--c-ink-muted); }
.home-index a:hover .home-index__jp { color: var(--c-ink); }

/* --- ARCHIVE（数と更新） ----------------------------------- */
.home-archive {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 5fr) minmax(0, 4fr);
  gap: clamp(2rem, 5vw, 5rem);
  padding: clamp(3rem, 7vw, 7rem) var(--page-x) clamp(4rem, 9vw, 9rem);
  border-top: var(--line-hair);
}
.home-archive__count {
  display: flex; align-items: baseline; gap: var(--s-3);
  margin: 0 0 var(--s-2); font-size: var(--t-sm); color: var(--c-ink-muted);
}
.home-archive__count .num {
  font-family: var(--font-num); font-size: 1.5rem; font-weight: var(--w-bold);
  color: var(--c-ink); min-width: 2.5ch; text-align: right;
}
.home-archive__note li {
  display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: var(--s-4);
  padding: var(--s-3) 0; border-bottom: var(--line-hair); font-size: var(--t-sm);
}
.home-archive__note time { color: var(--c-ink-muted); font-size: var(--t-xs); }
.home-archive__latest { margin: 0; }
.home-archive__latest img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; margin-top: var(--s-3); }
.home-archive__caption {
  display: flex; gap: var(--s-3); flex-wrap: wrap;
  font-size: var(--t-xs); color: var(--c-ink-muted); margin-top: var(--s-3);
}

/* --- 縦画面（スマートフォン・タブレットを縦に持ったとき） ------ */
@media (orientation: portrait) {
  .kv__slide { min-height: min(74svh, 900px); }
  /* 縦画面は横幅が狭いので、文字は指定位置のまま幅だけ広げる */
  .hs__type--hero { width: max(14rem, min(100%, calc(var(--hs-tw, 62%) + 25%))); }
  .hs--split, .hs--cta { grid-template-columns: 1fr; min-height: 0; }
  .hs--split .hs__media { min-height: 0; aspect-ratio: 4 / 5; }
  .hs--right .hs__media { order: 1; }
  .hs--right .hs__type { order: 2; }
}

/* --- スマートフォン ---------------------------------------- */
@media (max-width: 900px) {
  .kv__slide { min-height: min(78svh, 720px); }
  .kv__nav { gap: var(--s-2); }
  .kv__count { display: none; }
  .hs__free { inset: clamp(1rem, 6vw, 2.5rem) var(--page-x) clamp(4.5rem, 14vw, 6rem); }

  .hs--split, .hs--cta { grid-template-columns: 1fr; min-height: 0; }
  .hs--split .hs__media { min-height: 0; aspect-ratio: 4 / 5; }
  .hs--right .hs__media { order: 1; }
  .hs--right .hs__type { order: 2; }
  .hs--split .hs__type, .hs--cta { padding: clamp(2rem, 8vw, 4rem) var(--page-x) clamp(3rem, 10vw, 5rem); }
  .hs--cta .hs__cta-media { margin-top: var(--s-6); }

  .hs--editorial {
    grid-template-columns: repeat(6, minmax(0, 1fr));
    padding-block: clamp(2.5rem, 9vw, 5rem);
  }
  .hs--editorial .hs__ed-wide { grid-column: 1 / -1; }
  .hs--editorial .hs__ed-type { grid-column: 1 / -1; padding: 0 var(--page-x); }
  .hs--editorial .hs__ed-a { grid-column: 1 / 5; margin-top: var(--s-4); }
  .hs--editorial .hs__ed-b { grid-column: 3 / 7; margin-top: var(--s-6); }

  .home-index a { grid-template-columns: 2.5rem minmax(0, 1fr); gap: var(--s-3); }
  .home-index__jp { grid-column: 2; }
  .home-archive { grid-template-columns: 1fr; }
}

/* 画像の初回表示だけ、静かに立ち上げる */
@media (prefers-reduced-motion: no-preference) {
  .hs__img { animation: hs-in var(--m-reveal) var(--ease-out) both; }
  @keyframes hs-in { from { opacity: 0 } to { opacity: 1 } }
}

/* ============================================================
   PINK INDEX — DRESS UP (企画書 7.1 / 全体設計書 8.2-8.4)
   プレビューは白い展示台。操作パネルは淡いピンクまたは白で分離。
   パーツ一覧に広告や無関係な情報を混在させない(本サイトは広告なし)。
   ============================================================ */

.stage, .sheet, .panel, .cat-tabs, .panel__search, .panel__list { min-width: 0; }

/* デスクトップでは .sheet は単なる縦並びの容器 */
.sheet { display: flex; flex-direction: column; min-height: 0; height: 100%; overflow: hidden; }
.toolbar { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; }
.lock-row { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }

.dressup {
  display: grid;
  grid-template-columns: minmax(0, 60fr) minmax(320px, 40fr); /* 左55-65% / 右35-45% */
  gap: 0;
  /* 画面の高さで固定する。縦に長いページにせず、素材一覧だけを内側でスクロールさせる */
  height: calc(100svh - var(--header-h));
  overflow: hidden;
}

/* --- Stage ------------------------------------------------ */
.stage {
  height: 100%; min-height: 0;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding: var(--s-4) var(--page-x);
  background: var(--c-white);
  border-right: var(--line-hair);
}
.stage__bar { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
.stage__bar .spacer { margin-left: auto; }
.stage__actions { display: inline-flex; gap: var(--s-2); }
.stage__name {
  border: 0; border-bottom: var(--line-hair); background: none;
  font-size: var(--t-sm); padding: var(--s-2) var(--s-1); min-width: 12ch; max-width: 22ch;
  border-radius: 0;
}
.stage__name:focus { border-bottom-color: var(--c-ink); }

.canvas {
  position: relative; justify-self: center; align-self: center;
  height: min(100%, 74svh); aspect-ratio: 2 / 3;
  background: var(--c-white);
  border: var(--line-pink); border-radius: var(--r-2);
}
.canvas__layer {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: contain;
}
.canvas__layer[data-enter] { animation: piece-in var(--m-micro) var(--ease-out); }
@keyframes piece-in { from { opacity: 0 } to { opacity: 1 } }
/* 展示台の足元ライン */
.canvas::after {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: 6%;
  height: 1px; background: var(--c-pale-pink);
}

.stage__foot {
  display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap;
  border-top: var(--line-hair); padding-top: var(--s-3);
}
.current-look { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }
.current-look__item {
  display: inline-flex; align-items: center; gap: var(--s-2);
  border: var(--line-hair); border-radius: var(--r-1);
  padding: var(--s-1) var(--s-2); font-size: var(--t-xs); background: var(--c-white);
}
.current-look__item button {
  border: 0; background: none; cursor: pointer; color: var(--c-ink-muted);
  line-height: 1; padding: 2px;
}
.current-look__item button:hover { color: var(--c-danger); }

/* 競合理由は黙って外さず、必ず文章で示す */
.conflict {
  border: 1px solid var(--c-danger); border-radius: var(--r-2);
  background: var(--c-white); color: var(--c-danger);
  padding: var(--s-2) var(--s-3); font-size: var(--t-xs); line-height: 1.6;
}
.conflict[hidden] { display: none; }

/* --- Panel ------------------------------------------------ */
.panel {
  background: var(--c-canvas);
  display: flex; flex-direction: column;
  min-height: 0; flex: 1 1 auto;
}
.panel__search {
  flex: 0 0 auto; z-index: 2;
  background: var(--c-canvas); border-bottom: var(--line-hair);
  padding: var(--s-4) var(--s-5) var(--s-3);
  display: flex; flex-direction: column; gap: var(--s-3);
}
/* カテゴリはアイコンだけにせず文字を併記する */
.cat-tabs { display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: var(--tap-min); padding: 0 var(--s-4);
  border: var(--line-hair); border-radius: var(--r-pill); background: var(--c-white);
  font-size: var(--t-sm); cursor: pointer; white-space: nowrap;
  transition: all var(--m-micro) var(--ease-out);
}
.cat-tab .icon { font-size: 0.95rem; line-height: 1; }
.cat-tab:hover { background: var(--c-pink-mist); }
.cat-tab[aria-selected="true"] { background: var(--c-ink); color: var(--c-white); border-color: var(--c-ink); }
.panel__meta {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  font-size: var(--t-xs); color: var(--c-ink-muted);
}
.panel__list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--s-4) var(--s-5) var(--s-6); }
.panel__more { display: flex; flex-direction: column; gap: var(--s-3); }
.panel__more-toggle { display: none; }   /* PCでは常時表示のため不要 */

.parts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--s-3); }
.part {
  position: relative; display: flex; flex-direction: column; gap: var(--s-1);
  background: var(--c-white); border: var(--line-hair); border-radius: var(--r-2);
  padding: var(--s-2); cursor: pointer; text-align: left;
  transition: border-color var(--m-micro) var(--ease-out), background var(--m-micro) var(--ease-out);
}
.part:hover { background: var(--c-pink-mist); }
.part__thumb {
  aspect-ratio: 1; width: 100%; object-fit: contain;
  background: var(--c-white); border-radius: var(--r-1);
}
.part__name { font-size: var(--t-xs); line-height: 1.4; }
.part__no { font-size: var(--t-xs); color: var(--c-ink-muted); letter-spacing: 0.06em; }
/* 選択中: 黒い枠 + 小さなピンクの点 + スクリーンリーダー用テキスト */
.part[aria-pressed="true"] { border-color: var(--c-ink); border-width: 1px; background: var(--c-pale-pink); }
.part[aria-pressed="true"]::after {
  content: ""; position: absolute; right: 7px; top: 7px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--c-accent);
}
.part[data-locked="true"]::before {
  content: "LOCK"; position: absolute; left: 7px; top: 7px;
  font-family: var(--font-en); font-size: 9px; letter-spacing: 0.1em;
  background: var(--c-ink); color: var(--c-white); padding: 1px 4px; border-radius: var(--r-1);
}
.part[data-incompatible="true"] { opacity: 0.45; }
.part[data-incompatible="true"] .part__thumb { filter: grayscale(1); }

/* --- Mobile: sticky preview + bottom sheet ---------------- */
/* 上=可変プレビュー、下=スワイプ可能なボトムシート。
   素材を触ってもプレビュー面積が消えず、顔と全身が隠れない高さを標準にする。 */
@media (max-width: 900px) {
  .dressup {
    grid-template-columns: 1fr;
    --sheet-h: 42svh;
    /* 基本レイアウトの min-height を打ち消してから高さを決める */
    min-height: 0;
    height: calc(100svh - var(--header-h) - var(--sheet-h));
    overflow: hidden;
  }
  .stage {
    position: static; height: 100%; border-right: 0;
    padding: var(--s-2) var(--s-4) 0;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }
  .stage__bar { flex-wrap: nowrap; gap: var(--s-1); }
  .stage__bar .btn { padding: 0 var(--s-2); font-size: var(--t-xs); min-height: 38px; white-space: nowrap; }
  .stage__name { flex: 1 1 4ch; min-width: 0; font-size: var(--t-xs); }
  .canvas { height: 100%; width: auto; max-width: 100%; margin-inline: auto; }
  .stage__foot { border-top: 0; padding: var(--s-2) 0 var(--s-1); gap: var(--s-1); }
  .stage__foot .toolbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; }
  .stage__foot .toolbar::-webkit-scrollbar { display: none; }
  .stage__foot .toolbar .btn { flex: 0 0 auto; min-height: 34px; }
  /* 現在のコーデはプレビュー自体が示すため、狭い画面では畳む */
  .current-look { display: none; }

  /* シートは3段階。
     normal = プレビュー42svhを確保する既定
     full   = 素材を広く見る（シートがプレビューに重なる）
     focus  = 鑑賞モード。シートを畳んでプレビューを最大化する */
  .dressup[data-view="focus"] { --sheet-h: 56px; }
  .sheet { height: var(--sheet-open-h, var(--sheet-h)); }
  .dressup[data-view="full"] { --sheet-open-h: 78svh; }
  .dressup[data-view="focus"] { --sheet-open-h: 56px; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-sheet);
    background: var(--c-white);
    border-top: var(--line-ink); border-radius: var(--r-3) var(--r-3) 0 0;
    box-shadow: var(--shadow-sheet);
    display: flex; flex-direction: column;
    transition: height var(--m-panel) var(--ease-out);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet__handle {
    display: grid; place-items: center; padding: var(--s-2) 0 var(--s-1);
    min-height: 32px; border: 0; background: none; width: 100%; cursor: pointer;
  }
  .sheet__handle span { width: 40px; height: 3px; border-radius: var(--r-pill); background: var(--c-hairline); }
  .panel { background: var(--c-white); overflow: hidden; }
  /* 1段目=カテゴリ 2段目=検索・フィルター 3段目=素材サムネイル */
  .panel__search { position: static; padding: 0 var(--s-4) var(--s-3); background: var(--c-white); gap: var(--s-2); }
  .panel__list { padding: var(--s-3) var(--s-4) var(--s-6); }
  .parts-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
  /* 狭い画面では 1段目=カテゴリ / 2段目=検索 だけを常時表示し、
     色・季節・ロックは「絞り込み・ロック」で開く。素材グリッドの面積を優先する。 */
  .panel__more-toggle { display: inline-flex; align-self: flex-start; }
  .panel__more { gap: var(--s-2); }
  .lock-row, #filter-chips { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
  .lock-row::-webkit-scrollbar, #filter-chips::-webkit-scrollbar { display: none; }
  .lock-row .chip, #filter-chips .chip { flex: 0 0 auto; }
}

@media (min-width: 901px) {
  .sheet__handle { display: none; }
}

/* 検索・絞り込みは既定で畳み、必要なときだけ開く */
.panel__bar { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.panel__bar .panel__meta { margin-left: auto; }
.part__badge {
  position: absolute; left: 7px; top: 7px;
  font-size: 9px; letter-spacing: 0.08em;
  background: var(--c-pale-pink); color: var(--c-ink);
  border-radius: var(--r-1); padding: 1px 4px;
}

/* --- 素材の詳細（フレーバーテキスト） ---------------------- */
.part-wrap { position: relative; display: flex; }
.part-wrap .part { flex: 1 1 auto; }
.part__info {
  position: absolute; right: 6px; bottom: 6px;
  width: 22px; height: 22px; border-radius: 50%;
  border: var(--line-hair); background: var(--c-white); color: var(--c-ink-muted);
  font-family: var(--font-en); font-size: 11px; line-height: 1; cursor: pointer;
  opacity: 0; transition: opacity var(--m-micro) var(--ease-out);
}
.part-wrap:hover .part__info, .part__info:focus-visible { opacity: 1; }
@media (hover: none) { .part__info { opacity: 1; } }

.part-detail {
  border-top: var(--line-ink); background: var(--c-white);
  padding: var(--s-4) var(--s-5) var(--s-5);
  display: grid; gap: var(--s-2);
  max-height: 42%; overflow-y: auto;
}
.part-detail__name { font-size: 1.05rem; }
.part-detail__flavor { font-size: var(--t-sm); line-height: 2; margin: 0; }
.part-detail__flavor--empty { color: var(--c-ink-muted); }
.part-detail .toolbar { margin-top: var(--s-2); }
.part-detail .spacer { margin-left: auto; }

/* ============================================================
   PINK INDEX — Archive pages (CLOSET / GIRLS / COLLECTIONS / GALLERY)
   検索結果は整列グリッド、特集だけ可変比率の編集的レイアウト。
   ============================================================ */

.page-head {
  display: grid; gap: var(--s-3);
  padding-top: var(--s-7); padding-bottom: var(--s-5);
  border-bottom: var(--line-ink);
}
/* 見出し直後のセクションは上の余白を詰め、一覧をすぐ見せる */
.page-head + .section, .page-head + .page .section:first-child { padding-top: var(--s-6); }
.page-head__title { display: flex; align-items: baseline; gap: clamp(1rem, 2.5vw, 2.5rem); flex-wrap: wrap; }
.page-head__no {
  font-family: var(--font-num); font-size: var(--t-display);
  font-weight: var(--w-bold); line-height: 0.8; letter-spacing: var(--ls-hero);
}
.page-head__en {
  font-family: var(--font-en); font-size: var(--t-display);
  font-weight: var(--w-bold); text-transform: uppercase; line-height: 0.9; letter-spacing: -0.02em;
}
.page-head__jp { font-size: var(--t-sm); color: var(--c-ink-muted); max-width: var(--measure); margin: 0; }
@media (max-width: 640px) { .page-head { gap: var(--s-2); } }

/* --- Filter bar ------------------------------------------ */
.filters {
  display: grid; gap: var(--s-4);
  padding: var(--s-5) 0; border-bottom: var(--line-hair);
  position: sticky; top: var(--header-h); z-index: var(--z-sticky);
  background: color-mix(in srgb, var(--c-canvas) 94%, transparent);
  backdrop-filter: blur(8px);
}
.filters__row { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }
.filters__body { display: grid; gap: var(--s-4); }
.filters__toggle { display: inline-flex; justify-self: start; }
@media (max-width: 900px) {
  .filters { gap: var(--s-3); }
  .filters__label { min-width: 3.5rem; font-size: 10px; }
}
.filters__label {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
  min-width: 4.5rem;
}
.filters__search { flex: 1 1 220px; max-width: 380px; }
/* 選択中の条件と結果件数を常に表示する */
.result-bar {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  padding: var(--s-4) 0; font-size: var(--t-sm); color: var(--c-ink-muted);
}
.result-bar strong { color: var(--c-ink); font-variant-numeric: tabular-nums; font-size: 1.1rem; }

/* --- Detail ---------------------------------------------- */
.detail {
  display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
  gap: var(--s-8); padding-block: var(--s-7);
}
.detail__media {
  background: var(--c-white); border: var(--line-hair); border-radius: var(--r-3);
  display: grid; place-items: center; padding: var(--s-6);
  position: sticky; top: calc(var(--header-h) + var(--s-4)); align-self: start;
}
.detail__media img { max-height: 70svh; }
.detail__title { font-size: var(--t-title); }
.detail__no {
  font-family: var(--font-num); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); color: var(--c-ink-muted);
}
.detail__memo {
  background: var(--c-pink-mist); border-radius: var(--r-2);
  padding: var(--s-4); font-size: var(--t-sm); line-height: 1.9;
}
.detail__actions { display: flex; gap: var(--s-3); flex-wrap: wrap; margin-block: var(--s-5); }
@media (max-width: 900px) {
  .detail { grid-template-columns: 1fr; gap: var(--s-5); }
  .detail__media { position: static; padding: var(--s-4); }
}

/* --- GIRLS ----------------------------------------------- */
.girl-card { position: relative; }
.girl-card__no {
  font-family: var(--font-num); font-size: 1.6rem; font-weight: var(--w-bold);
  line-height: 1; letter-spacing: var(--ls-hero);
}
.girl-grid { display: grid; gap: var(--grid-gap); grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
@media (max-width: 640px) { .girl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); } }

/* --- COLLECTIONS ----------------------------------------- */
.collection-hero {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--s-7); align-items: center;
  padding: var(--s-7) 0; border-bottom: var(--line-hair);
}
.collection-hero__copy p { font-size: var(--t-lead); }
/* コレクション色は小面積のみ。サイト全体の基調色は維持する */
.collection-accent {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted);
}
.collection-accent::before {
  content: ""; width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent, var(--c-accent)); border: 1px solid var(--c-ink);
}
.progress {
  display: grid; gap: var(--s-2); font-size: var(--t-xs); color: var(--c-ink-muted);
}
.progress__track { height: 3px; background: var(--c-hairline); border-radius: var(--r-pill); overflow: hidden; }
.progress__bar { height: 100%; background: var(--c-ink); }
@media (max-width: 900px) { .collection-hero { grid-template-columns: 1fr; gap: var(--s-5); } }

/* --- 静的ページ(ABOUT / POLICY) --------------------------- */
.prose { max-width: min(42em, 100%); padding-block: var(--s-7); }
.prose h2 {
  font-size: var(--t-title); margin-top: var(--s-7); margin-bottom: var(--s-3);
  padding-top: var(--s-4); border-top: var(--line-hair);
}
.prose h3 { font-size: 1.05rem; margin-top: var(--s-5); margin-bottom: var(--s-2); }
.prose ul { list-style: none; }
.prose ul li { position: relative; padding-left: var(--s-4); margin-bottom: var(--s-2); }
.prose ul li::before {
  content: ""; position: absolute; left: 0; top: 0.75em;
  width: 5px; height: 5px; border-radius: 50%; background: var(--c-accent);
}
.prose dl { margin: 0; }
.callout {
  border: var(--line-ink); border-radius: var(--r-2);
  padding: var(--s-4) var(--s-5); background: var(--c-white);
}
.callout h3 { margin-top: 0; }

/* --- Pagination ------------------------------------------ */
.pager { display: flex; gap: var(--s-2); justify-content: center; align-items: center; padding: var(--s-7) 0; }
.to-top {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-xs); letter-spacing: var(--ls-label); text-transform: uppercase;
  color: var(--c-ink-muted); margin-left: auto;
}


/* --- DESIGN SYSTEM：番号のついた章と、その もくじ --------------
   長い1枚ものにせず、先に「どこに何があるか」を見せてから中身へ入る。
   ------------------------------------------------------------ */
.ds-index {
  border-top: var(--line-ink);
  border-bottom: var(--line-ink);
  padding: clamp(2rem, 5vw, 3.5rem) var(--page-x);
}
.ds-index__title {
  font-size: var(--t-xs); letter-spacing: var(--ls-label);
  color: var(--c-ink-muted); margin: 0 0 var(--s-5);
}
.ds-index__list {
  list-style: none; margin: 0; padding: 0;
  display: grid; gap: 0;
}
.ds-index__list a {
  display: grid;
  grid-template-columns: 2.5rem minmax(5rem, 8rem) minmax(6rem, 12rem) minmax(0, 1fr);
  gap: var(--s-4); align-items: baseline;
  padding: var(--s-3) 0;
  border-bottom: var(--line-hair);
  color: inherit; text-decoration: none;
}
.ds-index__list a:hover { background: var(--c-pink-mist); text-decoration: none; }
.ds-index__no { color: var(--c-ink-muted); }
.ds-index__jp { font-weight: var(--w-bold); }
.ds-index__en {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); color: var(--c-ink-muted);
}
.ds-index__lead { font-size: var(--t-sm); color: var(--c-ink-muted); }

.ds-chapter { scroll-margin-top: calc(var(--header-h) + var(--s-4)); }
.ds-chapter__head {
  display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) max-content;
  gap: var(--s-4); align-items: baseline;
  padding-bottom: var(--s-4); margin-bottom: var(--s-5);
  border-bottom: var(--line-ink);
}
.ds-chapter__no { font-size: var(--t-lead); color: var(--c-ink-muted); }
.ds-chapter__jp { margin: 0; font-size: var(--t-title); }
.ds-chapter__en {
  margin: var(--s-1) 0 0; font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); color: var(--c-ink-muted);
}
.ds-chapter__back { font-size: var(--t-xs); color: var(--c-ink-muted); white-space: nowrap; }

@media (max-width: 720px) {
  .ds-index__list a { grid-template-columns: 2rem minmax(0, 1fr); }
  .ds-index__en, .ds-index__lead { grid-column: 2; }
  .ds-chapter__head { grid-template-columns: 2rem minmax(0, 1fr); }
  .ds-chapter__back { grid-column: 2; }
}

/* ============================================================
   PINK INDEX — Studio (管理画面 / 企画書 7.7)
   同じ色・書体・罫線を使うが、巨大文字や演出は最小限。
   装飾より入力効率と誤操作防止を優先する。
   ============================================================ */

.studio { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100svh; }
.studio__nav {
  border-right: var(--line-hair); background: var(--c-white);
  padding: var(--s-5) var(--s-4); position: sticky; top: 0; height: 100svh; overflow-y: auto;
}
.studio__nav h1 {
  font-family: var(--font-en); font-size: var(--t-xs); letter-spacing: var(--ls-label);
  text-transform: uppercase; color: var(--c-ink-muted); margin-bottom: var(--s-4);
}
.studio__nav a {
  display: flex; align-items: center; gap: var(--s-2);
  min-height: 38px; padding: 0 var(--s-3); border-radius: var(--r-2);
  font-size: var(--t-sm); color: var(--c-ink-muted);
}
.studio__nav a:hover { background: var(--c-pink-mist); color: var(--c-ink); text-decoration: none; }
.studio__nav a[aria-current="page"] { background: var(--c-ink); color: var(--c-white); }
.studio__nav .group { margin-top: var(--s-5); }

.studio__main { padding: var(--s-6) var(--s-6) var(--s-9); min-width: 0; }
.studio__head { display: flex; align-items: baseline; gap: var(--s-4); flex-wrap: wrap; margin-bottom: var(--s-5); }
.studio__head h2 { font-size: 1.5rem; }
.studio__head .spacer { margin-left: auto; }

.dash-grid { display: grid; gap: var(--s-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.dash-card {
  border: var(--line-hair); border-radius: var(--r-2); background: var(--c-white);
  padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-2);
}
.dash-card h3 {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
}
.dash-card__value {
  font-family: var(--font-num); font-size: 2.5rem; font-weight: var(--w-bold); line-height: 1;
  font-variant-numeric: tabular-nums;
}
.dash-card--muted { background: var(--c-pink-mist); }
/* 公開アクセス数は隔離し、非表示にできる */
.dash-card--isolated { border-style: dashed; }

.wizard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: var(--s-6); align-items: start; }
.wizard__steps { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-bottom: var(--s-5); }
.wizard__step {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-xs); color: var(--c-ink-muted);
  border-bottom: 2px solid var(--c-hairline); padding-bottom: var(--s-2); flex: 1 1 80px;
}
.wizard__step[data-state="current"] { color: var(--c-ink); border-bottom-color: var(--c-ink); }
.wizard__step[data-state="done"] { border-bottom-color: var(--c-accent); }
.wizard__form { display: grid; gap: var(--s-5); }
.form-row { display: grid; gap: var(--s-4); grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

.dropzone {
  border: 1px dashed var(--c-ink-muted); border-radius: var(--r-3);
  background: var(--c-pink-mist); padding: var(--s-7) var(--s-5); text-align: center;
  cursor: pointer;
}
.dropzone:hover, .dropzone[data-over="true"] { background: var(--c-pale-pink); border-color: var(--c-ink); }

/* アップロード直後の自動検査 */
.checklist li {
  display: grid; grid-template-columns: 1.2rem 1fr auto; gap: var(--s-3);
  align-items: baseline; padding: var(--s-2) 0; border-bottom: var(--line-hair); font-size: var(--t-sm);
}
.checklist .state { font-size: var(--t-xs); letter-spacing: 0.06em; }
.checklist [data-ok="true"] .mark { color: var(--c-ok); }
.checklist [data-ok="false"] .mark { color: var(--c-danger); }
.checklist [data-ok="pending"] .mark { color: var(--c-ink-muted); }

.layer-list { border: var(--line-hair); border-radius: var(--r-2); overflow: hidden; background: var(--c-white); }
.layer-list li {
  display: grid; grid-template-columns: auto 1fr auto auto; gap: var(--s-3);
  align-items: center; padding: var(--s-2) var(--s-3);
  border-bottom: var(--line-hair); font-size: var(--t-xs);
}
.layer-list li:last-child { border-bottom: 0; }
.layer-list li[draggable="true"] { cursor: grab; }
.layer-list .order { font-family: var(--font-num); color: var(--c-ink-muted); }
.layer-list .handle { color: var(--c-ink-muted); }

.side-preview {
  position: sticky; top: var(--s-5);
  border: var(--line-hair); border-radius: var(--r-3); background: var(--c-white);
  padding: var(--s-4); display: grid; gap: var(--s-3);
}
.side-preview .canvas { height: 46svh; width: 100%; justify-self: center; }

.publish-bar {
  display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap;
  border-top: var(--line-ink); padding-top: var(--s-4); margin-top: var(--s-6);
}
.publish-bar .spacer { margin-left: auto; }
.status-pill {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-xs); letter-spacing: 0.06em;
  border: var(--line-hair); border-radius: var(--r-pill); padding: var(--s-1) var(--s-3);
}
.status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c-ink-muted); }
.status-pill[data-status="PUBLISHED"]::before { background: var(--c-ok); }
.status-pill[data-status="DRAFT"]::before { background: var(--c-ink-muted); }
.status-pill[data-status="REVIEW"]::before { background: var(--c-accent); }
.status-pill[data-status="ARCHIVED"]::before { background: var(--c-hairline); }

@media (max-width: 900px) {
  .studio { grid-template-columns: 1fr; }
  .studio__nav { position: static; height: auto; border-right: 0; border-bottom: var(--line-hair); }
  .studio__nav ul { display: flex; gap: var(--s-2); overflow-x: auto; }
  .studio__nav .group { margin-top: var(--s-3); }
  .wizard { grid-template-columns: 1fr; }
  .studio__main { padding: var(--s-5) var(--s-4) var(--s-8); }
}

/* --- フレーバーテキスト欄（メモとは別項目） ------------------ */
.flavor-fields {
  border: var(--line-hair); border-radius: var(--r-2);
  padding: var(--s-4) var(--s-5); display: grid; gap: var(--s-4);
  background: var(--c-pink-mist);
}
.flavor-fields legend { font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted); padding: 0 var(--s-2); }
.check { display: inline-flex; align-items: center; gap: var(--s-2); font-size: var(--t-sm); }

/* --- HOMEの編集 ------------------------------------------- */
.home-editor { display: grid; gap: var(--s-3); margin-top: var(--s-5); }
.home-slot { border: var(--line-hair); border-radius: var(--r-2); background: var(--c-white); }
.home-slot[data-published="false"] { opacity: 0.62; }
.home-slot__head {
  display: grid; grid-template-columns: 2.5rem 64px minmax(0, 1fr) auto;
  gap: var(--s-3); align-items: center; padding: var(--s-3) var(--s-4);
}
.home-slot__no { font-family: var(--font-num); color: var(--c-ink-muted); }
.home-slot__thumb { width: 64px; height: 44px; object-fit: cover; background: var(--c-grey); }
.home-slot__title { display: flex; gap: var(--s-2); align-items: baseline; flex-wrap: wrap; }
.home-slot__title strong { font-size: 0.95rem; }
.home-slot__actions { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.home-slot__body { border-top: var(--line-hair); padding: var(--s-4); display: grid; gap: var(--s-4); }

.home-preview {

.home-preview .hs { min-height: 0 !important; }
.home-preview .hs--hero { min-height: 320px !important; }
.home-preview .hs__title { font-size: 2rem !important; }
.range-row { display: grid; grid-template-columns: max-content 1fr max-content; gap: var(--s-3); align-items: center; font-size: var(--t-xs); }
.color-row { display: flex; gap: var(--s-4); flex-wrap: wrap; align-items: center; font-size: var(--t-xs); }
.color-row input[type="color"] { width: 44px; height: 32px; border: var(--line-hair); border-radius: var(--r-1); background: none; }

/* --- 素材の編集パネル -------------------------------------- */
.item-edit { border-top: var(--line-hair); padding: var(--s-4); display: grid; gap: var(--s-4); background: var(--c-pink-mist); }
.item-edit[hidden] { display: none; }
.layer-list li.is-editing { display: block; padding: 0; }
.layer-list li.is-editing .row { display: grid; grid-template-columns: auto 1fr auto auto; gap: var(--s-3); align-items: center; padding: var(--s-2) var(--s-3); }

.home-slides { display: grid; gap: var(--s-3); }
.home-slide { border: var(--line-hair); border-radius: var(--r-2); background: var(--c-canvas); }
.home-slide .home-slot__head { grid-template-columns: 2rem 64px minmax(0, 1fr) auto; }
.home-slide .home-slot__body { border-top: var(--line-hair); }

   9つのボタンで大まかに置き、つまみで細かく詰める。
   触っている間はプレビューだけが動き、フォームは組み直さない。
   ---------------------------------------------------------- */
.place {
  border: var(--line-hair); border-radius: var(--r-2);
  padding: var(--s-4); margin: 0;
  display: grid; grid-template-columns: max-content minmax(0, 1fr);
  gap: var(--s-4) var(--s-5); align-items: start;
}
.place > legend {
  font-size: var(--t-xs); letter-spacing: var(--ls-label);
  color: var(--c-ink-muted); padding: 0 var(--s-2);
}
.place__grid {
  display: grid; grid-template-columns: repeat(3, 34px); grid-auto-rows: 34px; gap: 3px;
  border: var(--line-hair); border-radius: var(--r-1); padding: 3px;
  background: var(--c-white);
}
.place__spot {
  border: 0; border-radius: var(--r-1); cursor: pointer;
  background: var(--c-pink-mist);
  transition: background var(--m-micro) var(--ease-out);
}
.place__spot:hover { background: var(--c-pale-pink); }
.place__spot[aria-pressed="true"] { background: var(--c-ink); }
.place__ranges { display: grid; gap: var(--s-2); }
.place .hint { grid-column: 1 / -1; margin: 0; }

.seg { justify-self: start; display: inline-flex; border: var(--line-hair); border-radius: var(--r-1); overflow: hidden; }
.seg__btn {
  border: 0; background: none; cursor: pointer;
  padding: var(--s-2) var(--s-3); font-size: var(--t-xs); min-height: var(--tap-min);

@media (max-width: 720px) {
  .place { grid-template-columns: 1fr; }
}
