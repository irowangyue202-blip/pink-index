<title>PINK INDEX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23FFF9FC%22%2F%3E%20%3Cpath%20d%3D%22M9%208h11l4%205-4%205H9z%22%20fill%3D%22none%22%20stroke%3D%22%23171417%22%20stroke-width%3D%222%22%2F%3E%20%3Ccircle%20cx%3D%2212.5%22%20cy%3D%2213%22%20r%3D%221.6%22%20fill%3D%22%23171417%22%2F%3E%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2224%22%20r%3D%222.5%22%20fill%3D%22%23FF4FA3%22%2F%3E%20%3C%2Fsvg%3E">
<style>
/* ============================================================
   PINK INDEX — Design Tokens
   企画書 4章「ブランド・ビジュアルシステム」に対応する唯一の正本。
   色・余白・文字・罫線・角丸・モーションはここだけで定義し、
   個別CSSではハードコードした値を使わない。
   基本比率: 白・淡いピンク 75% / 黒 20% / 鮮やかなピンク 5%
   ============================================================ */

:root {
  /* --- Color: 面(75%) ------------------------------------- */
  --c-canvas: #fff9fc;      /* サイト全体の基本背景 */
  --c-white: #ffffff;       /* 画像面、モーダル、入力欄 */
  --c-pale-pink: #ffe8f2;   /* 巨大背景文字、選択領域の淡色面 */
  --c-pink-mist: #fff2f7;   /* ホバー、空状態、補助背景 */

  /* --- Color: 骨格(20%) ----------------------------------- */
  --c-ink: #171417;         /* 数字、見出し、主要テキスト、線 */
  --c-ink-muted: #756a71;   /* 補足、制作日、メタ情報 */
  --c-hairline: #e8dee3;    /* 罫線、非選択枠、区切り */

  /* --- Color: アクセント(5%) ------------------------------- */
  --c-accent: #ff4fa3;      /* 小さな印、選択点、リンク矢印のみ */
  --c-focus: #6d4aff;       /* キーボードフォーカス */

  /* 状態色。面ではなく細線・小面積で使う */
  --c-danger: #c02b52;
  --c-ok: #1f7a5a;

  /* --- Typography ----------------------------------------- */
  --font-jp: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Kaku Gothic ProN",
    "Yu Gothic", system-ui, sans-serif;
  --font-en: "Archivo", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --font-num: var(--font-en);

  /* 流体タイプスケール。最小/最大を固定し、極端な縮小を避ける */
  --t-hero: clamp(3.5rem, 13vw, 11rem);      /* ローダー数字・巨大見出し */
  --t-display: clamp(2.25rem, 7vw, 5.5rem);  /* セクション大見出し */
  --t-title: clamp(1.5rem, 3.2vw, 2.5rem);
  --t-lead: clamp(1rem, 1.5vw, 1.25rem);
  --t-body: 1rem;
  --t-sm: 0.8125rem;
  --t-xs: 0.6875rem;                          /* ラベル・番号。字間を広げて使う */

  --lh-tight: 1.05;
  --lh-heading: 1.25;
  --lh-body: 1.8;      /* 日本語本文は広めに */
  --ls-label: 0.16em;  /* INDEXラベル・英字小文字 */
  --ls-hero: -0.02em;

  --w-regular: 400;
  --w-medium: 500;
  --w-bold: 700;

  /* --- Space: 4pxベース ----------------------------------- */
  --s-1: 0.25rem;
  --s-2: 0.5rem;
  --s-3: 0.75rem;
  --s-4: 1rem;
  --s-5: 1.5rem;
  --s-6: 2rem;
  --s-7: 3rem;
  --s-8: 4rem;
  --s-9: 6rem;
  --s-10: 8rem;
  --section-y: clamp(3rem, 9vw, 8rem);
  --page-x: clamp(1.25rem, 4vw, 4rem);
  --measure: 34em;         /* 本文の最大行長 */

  /* --- Line / Radius -------------------------------------- */
  --line: 1px;
  --line-ink: var(--line) solid var(--c-ink);
  --line-hair: var(--line) solid var(--c-hairline);
  --line-pink: var(--line) solid var(--c-pale-pink);
  --r-1: 2px;
  --r-2: 8px;    /* 標準 */
  --r-3: 12px;   /* 大きめのパネル */
  --r-pill: 999px; /* タグ・フィルターのみ */

  /* 影は「実際に前後関係がある要素」だけに使う */
  --shadow-float: 0 12px 32px rgba(23, 20, 23, 0.1);
  --shadow-sheet: 0 -8px 28px rgba(23, 20, 23, 0.12);

  /* --- Motion --------------------------------------------- */
  --m-micro: 170ms;   /* ホバー、選択、チェック */
  --m-panel: 300ms;   /* フィルター、ボトムシート、モーダル */
  --m-reveal: 520ms;  /* セクション見出し、作品の初回表示 */
  --m-loader-exit: 560ms;
  --ease-out: cubic-bezier(0.16, 0.84, 0.32, 1); /* 素早く出て静かに止まる */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  /* --- Layout --------------------------------------------- */
  --grid-cols: 12;
  --grid-gap: clamp(1rem, 2vw, 2rem);
  --max-w: 1600px;
  --header-h: 64px;
  --tap-min: 44px;   /* タップ対象の下限 */
  --z-sticky: 30;
  --z-sheet: 60;
  --z-header: 70;
  --z-dialog: 80;
  --z-loader: 100;
}

@media (max-width: 900px) {
  :root {
    --grid-cols: 8;
    --header-h: 56px;
  }
}
@media (max-width: 640px) {
  :root {
    --grid-cols: 4;
  }
}

/* モーション軽減。演出は削るが、状態変化は色/枠で必ず分かるようにする */
@media (prefers-reduced-motion: reduce) {
  :root {
    --m-micro: 1ms;
    --m-panel: 1ms;
    --m-reveal: 1ms;
    --m-loader-exit: 1ms;
  }
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============================================================
   PINK INDEX — Base / Layout
   ============================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  /* 横スクロールは各区画側で閉じる。
     ここで overflow-x: clip を掛けると、Chromeでは縦スクロールまで
     止まってしまうため使わない（tools/check-layout.mjs で常時検査する）。 */
}

body {
  margin: 0;
  background: var(--c-canvas);
  color: var(--c-ink);
  font-family: var(--font-jp);
  font-size: var(--t-body);
  line-height: var(--lh-body);
  font-weight: var(--w-regular);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "palt" 1;
}

/* 数字はカウント中に幅が揺れないよう等幅数字を強制 */
.num, .u-num, time, .count { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

h1, h2, h3, h4 {
  margin: 0;
  line-height: var(--lh-heading);
  font-weight: var(--w-bold);
  letter-spacing: -0.01em;
}
p { margin: 0 0 var(--s-4); max-width: min(var(--measure), 100%); }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg { max-width: 100%; display: block; }
/* display を指定した部品が [hidden] を打ち消さないようにする */
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }

a {
  color: var(--c-ink);
  text-decoration: none;
  text-underline-offset: 0.25em;
}
a:hover { text-decoration: underline; text-decoration-thickness: 1px; }

/* フォーカスリングは絶対に消さない。識別性のためVioletを使う */
:focus-visible {
  outline: 2px solid var(--c-focus);
  outline-offset: 3px;
  border-radius: var(--r-1);
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip-path: inset(50%);
  overflow: hidden; white-space: nowrap;
}

.skip-link {
  position: absolute; left: var(--s-4); top: -100px;
  z-index: calc(var(--z-header) + 1);
  background: var(--c-ink); color: var(--c-white);
  padding: var(--s-3) var(--s-4); border-radius: var(--r-2);
  transition: top var(--m-micro) var(--ease-out);
}
.skip-link:focus { top: var(--s-4); }

/* 着せ替えのような操作画面は、ページ全体を伸ばさず画面内に収める。
   スクロールは素材一覧など、必要な部分だけに閉じ込める。 */
body.app-screen { overflow: hidden; height: 100svh; }
body.app-screen .site-footer { display: none; }

/* --- Page frame ------------------------------------------ */
.page { max-width: var(--max-w); margin: 0 auto; padding: 0 var(--page-x); }
.section { padding-block: var(--section-y); }
.stack > * + * { margin-top: var(--s-4); }

.grid {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
  gap: var(--grid-gap);
}

/* --- Header ----------------------------------------------
   4つの状態を持つ。切り替えは client/site.js。
     top      背景は完全に透明。キービジュアルが背後まで見える
     hidden   下へ移動したら上へ滑らせて隠す
     frosted  上へ戻したら乳白色＋ぼかし＋ごく薄い下線で戻す
   文字色は表示中の作品に合わせて data-tone で切り替える。
   --------------------------------------------------------- */
.site-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-header);
  min-height: var(--header-h);
  display: flex; align-items: center; gap: clamp(var(--s-4), 3vw, var(--s-7));
  padding: 0 var(--page-x);
  color: var(--c-ink);
  background: transparent;
  border-bottom: 1px solid transparent;
  transition: transform 250ms var(--ease-out), background-color 250ms var(--ease-out),
              border-color 250ms var(--ease-out), color 200ms var(--ease-out);
}
/* 先頭以外のページは、白い面の上に置くので常に読みやすくしておく */
body:not(.has-hero) .site-header { background: var(--c-canvas); border-bottom-color: var(--c-hairline); }
body:not(.has-hero) #main { padding-top: var(--header-h); }

.site-header[data-tone="light"] { color: var(--c-white); }
.site-header[data-state="hidden"] { transform: translateY(-100%); }
.site-header[data-state="frosted"] {
  color: var(--c-ink);
  background: color-mix(in srgb, var(--c-white) 78%, transparent);
  backdrop-filter: blur(14px) saturate(1.1);
  border-bottom-color: color-mix(in srgb, var(--c-ink) 8%, transparent);
}
/* ぼかしが使えない環境では、不透明度を上げた白へ切り替える */
@supports not (backdrop-filter: blur(4px)) {
  .site-header[data-state="frosted"] { background: color-mix(in srgb, var(--c-white) 96%, transparent); }
}

.site-header__logo {
  font-family: var(--font-en); font-weight: var(--w-bold);
  font-size: 0.95rem; letter-spacing: var(--ls-label); text-transform: uppercase;
  color: inherit; display: inline-flex; align-items: center; min-height: var(--tap-min);
}
.site-header__logo:hover { color: inherit; text-decoration: none; opacity: 0.7; }

.site-nav { margin-left: auto; display: flex; gap: clamp(var(--s-3), 2vw, var(--s-6)); align-items: center; }
.site-nav a {
  display: inline-flex; align-items: center; min-height: var(--tap-min);
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
  color: inherit; opacity: 0.72;
  border-bottom: 2px solid transparent;
  transition: opacity var(--m-micro) var(--ease-out), border-color var(--m-micro) var(--ease-out);
}
.site-nav a:hover { opacity: 1; text-decoration: none; }
.site-nav a[aria-current="page"] { opacity: 1; border-bottom-color: var(--c-accent); }
.site-header :focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

.nav-toggle { display: none; }

@media (max-width: 900px) {
  .site-nav {
    position: fixed; inset: 0;
    flex-direction: column; align-items: flex-start; justify-content: center;
    gap: var(--s-3);
    background: var(--c-ink); color: var(--c-white);
    padding: var(--header-h) var(--page-x) var(--s-8);
    opacity: 0; pointer-events: none;
    transition: opacity var(--m-panel) var(--ease-out);
  }
  .site-nav[data-open="true"] { opacity: 1; pointer-events: auto; }
  .site-nav a { width: 100%; padding: var(--s-3) 0; font-size: 1.5rem; opacity: 0.85; }
  .site-nav a[aria-current="page"] { opacity: 1; }
  .nav-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    margin-left: auto; min-width: var(--tap-min); min-height: var(--tap-min);
    background: none; border: 0; cursor: pointer; color: inherit;
    font-family: var(--font-en); font-size: var(--t-xs); letter-spacing: var(--ls-label);
  }
  body[data-nav-open="true"] .nav-toggle { color: var(--c-white); position: relative; z-index: 1; }
  body[data-nav-open="true"] { overflow: hidden; }
}

/* つまみとチェックは、サイトの色（黒）で塗る */
input[type="range"], input[type="checkbox"], input[type="radio"], progress {
  accent-color: var(--c-ink);
}

/* --- Footer ----------------------------------------------
   最後の1枚のビジュアルとして置く。巨大なロゴと、その下の横並びだけ。
   --------------------------------------------------------- */
.site-footer {
  border-top: var(--line-ink);
  padding: clamp(3rem, 8vw, 7rem) var(--page-x) var(--s-6);
  margin-top: var(--s-9);
  background: var(--c-white);
  display: grid; justify-items: center; gap: clamp(1.5rem, 4vw, 3rem);
  overflow: clip;
}
.brand-logo { display: block; width: 100%; max-width: var(--max-w); }
.brand-logo:hover { text-decoration: none; }
.brand-logo__img { display: block; width: 100%; height: auto; }
/* 画面幅いっぱいのロゴタイプ。SVGなので、どの幅でも切れずに収まる */
.brand-logo__type { display: block; width: 100%; height: auto; }
.brand-logo__type text {
  font-family: var(--font-en); font-weight: var(--w-bold);
  font-size: 118px; fill: var(--c-ink);
}
.brand-links {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: clamp(var(--s-3), 2.5vw, var(--s-6));
}
.brand-links a {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
  color: var(--c-ink-muted); min-height: var(--tap-min);
  display: inline-flex; align-items: center;
}
.brand-links a:hover { color: var(--c-ink); text-decoration: none; }
.brand-copy { font-size: var(--t-xs); color: var(--c-ink-muted); margin: 0; }

/* --- Section heading (番号 + 英字 + 和文) ------------------- */
.section-head { display: flex; align-items: flex-end; gap: var(--s-5); flex-wrap: wrap; margin-bottom: var(--s-6); }
.section-head__no {
  font-family: var(--font-num); font-size: var(--t-display);
  font-weight: var(--w-bold); line-height: 0.85; letter-spacing: var(--ls-hero);
}
.section-head__body { flex: 1 1 20rem; }
.section-head__en {
  font-family: var(--font-en); font-size: var(--t-title);
  font-weight: var(--w-bold); text-transform: uppercase; letter-spacing: 0.02em;
}
.section-head__jp { font-size: var(--t-sm); color: var(--c-ink-muted); }
.section-head::after {
  content: ""; flex: 1 1 4rem; height: 1px; background: var(--c-hairline); margin-bottom: 0.6em;
}

/* ============================================================
   PINK INDEX — Components (企画書 8章)
   角丸・影・ピルを多用せず、罫線と余白で階層を作る。
   選択状態は「色だけ」で示さず、枠 + 小さなピンクの点 + テキストで示す。
   ============================================================ */

/* --- Buttons --------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--s-2);
  min-height: var(--tap-min); padding: var(--s-3) var(--s-5);
  border-radius: var(--r-2); border: var(--line-ink);
  background: var(--c-white); color: var(--c-ink);
  font-size: var(--t-sm); font-weight: var(--w-medium);
  cursor: pointer; text-decoration: none;
  transition: background var(--m-micro) var(--ease-out), color var(--m-micro) var(--ease-out),
    transform var(--m-micro) var(--ease-out);
}
.btn:hover { background: var(--c-pink-mist); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] {
  color: var(--c-ink-muted); border-color: var(--c-hairline);
  background: var(--c-white); cursor: not-allowed;
}
/* 主要操作は1画面に1〜2個 */
.btn--primary { background: var(--c-ink); color: var(--c-white); border-color: var(--c-ink); }
.btn--primary:hover { background: #000; color: var(--c-white); }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--ghost:hover { background: var(--c-pink-mist); }
.btn--sm { min-height: 36px; padding: var(--s-2) var(--s-3); font-size: var(--t-xs); }
.btn--icon { padding: var(--s-2); min-width: var(--tap-min); }

/* テキストリンク: 黒文字 + 小さなピンク矢印 */
.link-arrow {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-sm); font-weight: var(--w-medium);
}
.link-arrow::after {
  content: "→"; color: var(--c-accent);
  transition: transform var(--m-micro) var(--ease-out);
}
.link-arrow:hover { text-decoration: none; }
.link-arrow:hover::after { transform: translateX(4px); }

/* --- Index label (衣服の管理タグ) -------------------------- */
.index-label {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
  color: var(--c-ink-muted);
}
.index-label__no { color: var(--c-ink); font-weight: var(--w-bold); }
/* 切り欠きのある衣服タグ形状 */
.tag-chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-1) var(--s-3) var(--s-1) var(--s-4);
  background: var(--c-white); border: var(--line-hair);
  border-radius: var(--r-1);
  font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted);
  position: relative;
}
.tag-chip::before {
  content: ""; position: absolute; left: 7px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 4px; border-radius: 50%;
  border: 1px solid var(--c-ink-muted);   /* 紐通し穴 */
}

/* --- Filter chip ----------------------------------------- */
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: 34px; padding: 0 var(--s-4);
  border: var(--line-hair); border-radius: var(--r-pill);
  background: var(--c-white); color: var(--c-ink-muted);
  font-size: var(--t-xs); letter-spacing: 0.04em; cursor: pointer;
  transition: all var(--m-micro) var(--ease-out);
}
.chip:hover { background: var(--c-pink-mist); color: var(--c-ink); }
.chip[aria-pressed="true"] {
  background: var(--c-ink); border-color: var(--c-ink); color: var(--c-white);
}
.chip[aria-pressed="true"]::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--c-accent);
}

/* --- Card ------------------------------------------------ */
.card {
  display: flex; flex-direction: column;
  background: var(--c-white);
  border: var(--line-hair); border-radius: var(--r-2);
  overflow: hidden;
  transition: border-color var(--m-micro) var(--ease-out), transform var(--m-micro) var(--ease-out);
}
.card:hover { border-color: var(--c-ink); }
.card a { display: block; }
.card__media {
  position: relative; aspect-ratio: 3 / 4; background: var(--c-white);
  border-bottom: var(--line-hair); overflow: hidden;
}
.card__media img { width: 100%; height: 100%; object-fit: contain; padding: var(--s-3); }
.card__media--wide { aspect-ratio: 4 / 3; }
.card__body { padding: var(--s-3) var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: var(--s-1); }
.card__no {
  font-family: var(--font-num); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); color: var(--c-ink-muted);
}
.card__name { font-size: 0.9rem; font-weight: var(--w-medium); line-height: 1.5; }
.card__meta { font-size: var(--t-xs); color: var(--c-ink-muted); display: flex; gap: var(--s-2); flex-wrap: wrap; }
.card__fav {
  position: absolute; right: var(--s-2); top: var(--s-2);
  width: 34px; height: 34px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--c-white) 85%, transparent);
  border: var(--line-hair); border-radius: 50%; cursor: pointer;
}
.card__fav[aria-pressed="true"] { border-color: var(--c-accent); color: var(--c-accent); }

/* 整列グリッド(検索結果) */
.card-grid {
  display: grid; gap: var(--grid-gap);
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}
@media (max-width: 640px) {
  .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
}
/* 特集・GALLERYだけ可変比率の編集的レイアウトを許可 */
.editorial-grid {
  display: grid; gap: var(--grid-gap);
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  grid-auto-flow: dense;
}
.editorial-grid .card--tall { grid-row: span 2; }
.editorial-grid .card--tall .card__media { aspect-ratio: 3 / 5; }
.editorial-grid .card--wide { grid-column: span 2; }
.editorial-grid .card--wide .card__media { aspect-ratio: 16 / 10; }
@media (max-width: 640px) {
  .editorial-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
  .editorial-grid .card--wide { grid-column: span 2; }
  .editorial-grid .card--tall { grid-row: span 1; }
  .editorial-grid .card--tall .card__media { aspect-ratio: 3 / 4; }
}

/* --- Empty state ----------------------------------------- */
.empty {
  border: 1px dashed var(--c-hairline); border-radius: var(--r-3);
  background: var(--c-pink-mist);
  padding: var(--s-8) var(--s-5); text-align: center;
}
/* span で書いても行が重ならないよう、必ず block として積む */
.empty__title { display: block; font-size: 1rem; font-weight: var(--w-medium); margin: 0; }
.empty__body { display: block; font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-2) auto 0; max-width: 28em; }

/* --- Toast ----------------------------------------------- */
.toast-region {
  position: fixed; left: 50%; bottom: var(--s-6); transform: translateX(-50%);
  z-index: var(--z-dialog); display: flex; flex-direction: column; gap: var(--s-2);
  pointer-events: none; width: min(90vw, 420px);
}
.toast {
  background: var(--c-ink); color: var(--c-white);
  border-radius: var(--r-2); padding: var(--s-3) var(--s-4);
  font-size: var(--t-sm); box-shadow: var(--shadow-float);
  animation: toast-in var(--m-panel) var(--ease-out);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* --- Form ------------------------------------------------ */
.field { display: flex; flex-direction: column; gap: var(--s-2); }
.field > label { font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted); }
.field .hint { font-size: var(--t-xs); color: var(--c-ink-muted); }
.input, .select, .textarea {
  min-height: var(--tap-min); padding: var(--s-2) var(--s-3);
  background: var(--c-white); border: var(--line-hair); border-radius: var(--r-2);
  transition: border-color var(--m-micro) var(--ease-out);
}
.input:hover, .select:hover, .textarea:hover { border-color: var(--c-ink-muted); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--c-ink); }
.textarea { min-height: 96px; line-height: 1.7; resize: vertical; }

/* --- Meta table ------------------------------------------ */
.meta-list { display: grid; grid-template-columns: max-content 1fr; gap: var(--s-2) var(--s-5); font-size: var(--t-sm); }
.meta-list dt { color: var(--c-ink-muted); font-size: var(--t-xs); letter-spacing: 0.06em; }
.meta-list dd { margin: 0; }

/* --- Counter (ARCHIVE COUNTER) ---------------------------- */
.counter-row { display: grid; gap: var(--grid-gap); grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.counter {
  border-top: var(--line-ink); padding-top: var(--s-3);
}
.counter__value {
  font-family: var(--font-num); font-size: clamp(2.5rem, 5vw, 4rem);
  font-weight: var(--w-bold); line-height: 1; letter-spacing: var(--ls-hero);
}
.counter__label {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
  margin-top: var(--s-2);
}

/* --- Reveal (セクション初回表示) --------------------------- */
[data-reveal] {
  opacity: 0; transform: translateY(14px);
  transition: opacity var(--m-reveal) var(--ease-out), transform var(--m-reveal) var(--ease-out);
}
[data-reveal].is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  [data-reveal] { opacity: 1; transform: none; }
}

/* --- 縫い目風の点線区切り ---------------------------------- */
.seam {
  height: 1px; border: 0; margin: var(--s-7) 0;
  background-image: linear-gradient(90deg, var(--c-hairline) 0 6px, transparent 6px 12px);
  background-size: 12px 1px;
}

/* 取り消せない操作の2度押し待ち */
.btn--danger { border-color: var(--c-danger); color: var(--c-danger); background: var(--c-white); }
.btn--danger:hover { background: color-mix(in srgb, var(--c-danger) 8%, var(--c-white)); }

/* --- フレーバーテキスト（作品としての文章） ------------------ */
.card__flavor {
  font-size: var(--t-xs); line-height: 1.7; color: var(--c-ink-muted);
  margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card__flavor:empty { display: none; }
.detail__flavor {
  font-size: 1.05rem; line-height: 2.1; margin: var(--s-4) 0 0;
  max-width: 30em; border-left: 2px solid var(--c-accent); padding-left: var(--s-4);
}
.detail__flavor:empty { display: none; }

/* 管理画面から「位置」を押されたときに、その文字を光らせる */
.is-text-marked {
  outline: 2px solid var(--c-accent); outline-offset: 3px;
  background: color-mix(in srgb, var(--c-accent) 14%, transparent);
}

/* 未登録の区画。理由も導線も書かず、1語だけ置く */
.coming {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); color: var(--c-ink-muted);
  text-align: center; padding: clamp(3rem, 10vw, 7rem) 0; margin: 0;
  max-width: none; width: 100%;
}

/* ============================================================
   PINK INDEX — Loader (企画書 5章)
   「サイトへの待ち時間」ではなく「白い作品台帳が開き、
    最初の1ページが立ち上がる瞬間」として設計する。
   外周ラインはフェードアウトせず、ホームの枠線へ変形して接続する。
   ============================================================ */

.loader {
  position: fixed; inset: 0; z-index: var(--z-loader);
  background: var(--c-canvas);
  display: grid; grid-template-rows: auto 1fr auto;
  padding: clamp(1.25rem, 4vw, 3rem);
  /* 端末のノッチ/ブラウザUIと干渉しない内側に描く */
  padding: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-top))
           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-right))
           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-bottom))
           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-left));
}
.loader[hidden] { display: none; }

.loader__top {
  display: flex; justify-content: space-between; align-items: flex-start;
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
}

/* 数字は中央に置かず、左下寄せ・余白を大きく残す */
.loader__count {
  grid-row: 3;
  display: flex; align-items: flex-end; gap: 0.08em;
  font-family: var(--font-num); font-weight: var(--w-bold);
  font-size: var(--t-hero); line-height: 0.78; letter-spacing: var(--ls-hero);
  font-variant-numeric: tabular-nums;
  color: var(--c-ink);
}
.loader__range {
  font-size: var(--t-xs); letter-spacing: var(--ls-label);
  color: var(--c-ink-muted); align-self: flex-start; margin-bottom: 0.6em;
  font-weight: var(--w-medium);
}
.loader__pct {
  font-size: 0.22em; align-self: flex-start; margin-top: 0.35em; /* 小さな上付きの % */
  color: var(--c-ink-muted); font-weight: var(--w-medium);
}

/* 100%で数字が左右へ静かに離れ、その間からイラストが現れる */
.loader__digits { display: inline-flex; }
.loader[data-state="exit"] .loader__digits--l { transform: translateX(-28vw); opacity: 0; }
.loader[data-state="exit"] .loader__digits--r { transform: translateX(28vw); opacity: 0; }
.loader__digits--l, .loader__digits--r {
  transition: transform var(--m-loader-exit) var(--ease-in-out),
              opacity var(--m-loader-exit) var(--ease-out);
}
.loader[data-state="exit"] .loader__range,
.loader[data-state="exit"] .loader__pct,
.loader[data-state="exit"] .loader__top { opacity: 0; transition: opacity 220ms var(--ease-out); }

.loader { transition: opacity var(--m-loader-exit) var(--ease-out); }
.loader[data-state="done"] { opacity: 0; pointer-events: none; }

/* --- 画面外周ライン ---------------------------------------- */
.perimeter {
  position: fixed; inset: 0; z-index: calc(var(--z-loader) + 1);
  pointer-events: none;
}
.perimeter[hidden] { display: none; }
.perimeter svg { width: 100%; height: 100%; display: block; }
.perimeter__track { fill: none; stroke: var(--c-hairline); stroke-width: 1; }
.perimeter__line { fill: none; stroke: var(--c-ink); stroke-width: 1; stroke-linecap: butt; }
/* 線の先端にだけ小さなピンクの点 */
.perimeter__tip { fill: var(--c-accent); }
.perimeter--handoff .perimeter__tip { opacity: 0; transition: opacity 240ms var(--ease-out); }
.perimeter--handoff { transition: opacity 420ms var(--ease-out) 260ms; }
.perimeter--faded { opacity: 0; }

/* ホーム側の受け皿。外周ラインが縮んでここへ重なり、静的な枠へ引き継ぐ */
.home-frame {
  position: fixed; z-index: 1; pointer-events: none;
  inset: var(--frame-inset, 12px);
  border: var(--line-hair);
  opacity: 0;
  transition: opacity 420ms var(--ease-out);
}
.home-frame.is-on { opacity: 1; }
@media (max-width: 640px) { .home-frame { display: none; } }

/* 縮小演出を行わない場合(reduced motion)の短いクロスフェード */
@media (prefers-reduced-motion: reduce) {
  .loader__digits--l, .loader__digits--r { transform: none !important; }
}

/* スクロール抑止 */
body[data-loading="true"] { overflow: hidden; }

/* ============================================================
   PINK INDEX — HOME
   キービジュアルから始まり、見せ方の違う区画が続く縦長のページ。
   同じ組みを繰り返さず、区画ごとに比率・余白・文字の位置を変える。
   ============================================================ */

/* --- KEY VISUAL ------------------------------------------- */
.kv { position: relative; }
.kv__track {
  display: flex;
  cursor: grab;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.kv__track::-webkit-scrollbar { display: none; }
[data-kv][data-dragging] .kv__track { cursor: grabbing; }
[data-kv][data-dragging] .kv__slide { user-select: none; }

.kv__slide {
  position: relative;
  flex: 0 0 100%;
  scroll-snap-align: start;
  display: block;
  min-height: min(100svh, 1100px);
  background: var(--hs-bg);
  color: var(--hs-fg);
  overflow: clip;
}
.kv__media { position: absolute; inset: 0; display: block; }
.kv__img { width: 100%; height: 100%; object-fit: cover;
  object-position: var(--hs-focus, 50% 40%); transform: scale(var(--hs-zoom, 1)); }

/* 文字を置ける範囲。ヘッダーの高さと操作の分を空ける */
.kv__free {
  position: absolute;
  inset: calc(var(--header-h) + clamp(0.75rem, 3vw, 1.75rem)) var(--page-x) clamp(4.5rem, 8vw, 6rem);
  pointer-events: none;
}
.kv__type {
  position: absolute;
  left: var(--hs-tx, 0%); top: var(--hs-ty, 100%);
  transform: translate(calc(var(--hs-tx, 0%) * -1), calc(var(--hs-ty, 100%) * -1))
             rotate(var(--hs-trot, 0deg));
  width: max(16rem, var(--hs-tw, 62%));
  max-width: 100%; max-height: 100%;
  text-align: var(--hs-align, left);
  pointer-events: auto;
}

/* 縦書き。日本語の題名を縦に流したいときに使う */
.kv__slide[data-tvert="on"] .kv__type {
  writing-mode: vertical-rl; text-orientation: mixed;
  /* 縦書きでは「文字の幅」が、そのまま列の長さになる */
  width: auto; height: max(6rem, var(--hs-tw, 62%)); max-height: 100%;
}
.kv__slide[data-tvert="on"] .kv__title { letter-spacing: var(--hs-tls, 0.02em); }

/* 絵の上でも読めるようにする敷き */
.kv__slide[data-tplate="veil"] .kv__type {
  padding: clamp(0.75rem, 2vw, 1.5rem);
  background: color-mix(in srgb, var(--hs-bg, #fff) 62%, transparent);
  backdrop-filter: blur(6px);
}
.kv__slide[data-tplate="band"] .kv__type {
  padding: clamp(0.75rem, 2vw, 1.5rem) clamp(1rem, 3vw, 2rem);
  background: var(--hs-bg, #fff);
}
@supports not (background: color-mix(in srgb, red 50%, transparent)) {
  .kv__slide[data-tplate="veil"] .kv__type { background: var(--hs-bg, #fff); }
}

/* ヘッダーの下まで文字を置けるようにする */
.kv__slide[data-tfull="on"] .kv__free { inset: 0 var(--page-x) clamp(3rem, 6vw, 4.5rem); }
.kv__eyebrow {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; margin: 0 0 var(--s-3);
}
.kv__title {
  font-family: var(--font-en); font-weight: var(--w-bold);
  /* 大きさ・行間・字間は1枚ごとに決められる */
  font-size: calc(clamp(2rem, min(7vw, 12svh), 6rem) * var(--hs-tsize, 1));
  line-height: var(--hs-tlh, 0.95);
  letter-spacing: var(--hs-tls, -0.02em);
  margin: 0;
}
.kv__sub { font-size: var(--t-sm); margin: var(--s-3) 0 0; opacity: 0.85; }
.kv__link {
  display: inline-block; margin-top: var(--s-5);
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
  color: inherit; border-bottom: 1px solid currentColor; padding-bottom: 2px;
}
.kv__link:hover { text-decoration: none; opacity: 0.7; }

/* 矢印は左右の端に。絵を邪魔しない細い形で、押せる範囲は44px以上 */
.kv__arrow {
  position: absolute; top: 50%; translate: 0 -50%; z-index: 2;
  width: clamp(44px, 5vw, 64px); height: clamp(44px, 8vh, 84px);
  display: grid; place-items: center;
  border: 0; background: none; color: var(--hs-fg, var(--c-ink));
  cursor: pointer; opacity: 0.7;
  transition: opacity var(--m-micro) var(--ease-out);
}
.kv__arrow:hover { opacity: 1; }
.kv__arrow[disabled] { opacity: 0.15; cursor: default; }
.kv__arrow--prev { left: max(var(--s-2), calc(var(--page-x) - 1.25rem)); }
.kv__arrow--next { right: max(var(--s-2), calc(var(--page-x) - 1.25rem)); }
.kv__arrow > span {
  width: 14px; height: 14px;
  border-left: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
}
.kv__arrow--prev > span { rotate: 45deg; translate: 3px 0; }
.kv__arrow--next > span { rotate: -135deg; translate: -3px 0; }

.kv__dots {
  position: absolute; left: 0; right: 0; bottom: clamp(1rem, 2.5vw, 2rem); z-index: 2;
  display: flex; justify-content: center; gap: var(--s-2);
  list-style: none; margin: 0; padding: 0; color: var(--hs-fg, var(--c-ink));
}
.kv__dots li { display: flex; }
.kv__dots button {
  width: 26px; height: 2px; border: 0; padding: 8px 0; cursor: pointer;
  background: transparent; position: relative; opacity: 0.45;
  transition: opacity var(--m-micro) var(--ease-out);
}
.kv__dots button::after { content: ""; position: absolute; inset: 8px 0; background: currentColor; }
.kv__dots button[aria-current="true"] { opacity: 1; }

/* --- 区画の共通 -------------------------------------------- */
.sec {
  padding: clamp(3rem, 9vw, 8rem) var(--page-x);
  background: var(--hs-bg, var(--c-canvas));
  color: var(--hs-fg, var(--c-ink));
}
.sec__head {
  display: flex; align-items: baseline; gap: var(--s-4);
  margin-bottom: clamp(1.5rem, 4vw, 3rem);
}
.sec__title, .sec__eyebrow {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; margin: 0;
}
.sec__count { color: var(--c-ink-muted); font-size: var(--t-xs); }
.sec__lead { font-size: var(--t-sm); color: var(--c-ink-muted); margin: 0 0 var(--s-5); }
.sec__more { margin: clamp(1.5rem, 4vw, 3rem) 0 0; }

/* 画像の下に小さく置く説明 */
.cap { display: block; margin-top: var(--s-3); font-size: var(--t-xs); }
.cap__title { display: block; }
.cap__meta { color: var(--c-ink-muted); }
.sec a { color: inherit; }
.sec a:hover { text-decoration: none; opacity: 0.82; }

/* --- 画像の枡（共通） --------------------------------------
   比率と切り取る位置はHTML側の style で1枡ずつ指定する。
   ここでは入れ物と、寄せたときの動きだけを決める。
   ---------------------------------------------------------- */
.sec figure, .sec .ph { margin: 0; }
/* 高さは比率（HTML側の aspect-ratio）から決める。
   height:100% にすると、行の高さと画像の高さが互いを参照して枡が行からはみ出す。 */
.sec img { display: block; width: 100%; height: auto; object-fit: cover; background: var(--c-pink-mist); }

/* 画像がまだ1枚も無いときの色面。作品の代わりではなく、区画の骨格を示すだけ */
.ph {
  display: block; width: 100%;
  background:
    repeating-linear-gradient(135deg, var(--c-pale-pink) 0 14px, var(--c-pink-mist) 14px 28px);
}
.sec--spotlight .ph {
  background: repeating-linear-gradient(135deg, #2a2229 0 14px, #201a1f 14px 28px);
}

/* 寄せたときの軽い拡大。動きを止める設定なら効かせない */
.feature__lead, .strip__shot, .picks__shot, .spotlight__cover { display: block; overflow: clip; }
.feature__lead img, .strip__shot img, .picks__shot img, .spotlight__cover img {
  transition: transform var(--m-reveal) var(--ease-out);
}
.feature__lead:hover img, .strip__shot:hover img,
.picks__shot:hover img, .spotlight__cover:hover img { transform: scale(1.03); }
.sec a:hover { opacity: 1; }
.sec a:hover .cap__title { text-decoration: underline; text-underline-offset: 0.28em; }

/* スクロールで現れるときの短いフェード */
[data-reveal] { opacity: 1; }
body[data-reveal-ready] [data-reveal] {
  opacity: 0; transform: translateY(18px);
  transition: opacity var(--m-reveal) var(--ease-out), transform var(--m-reveal) var(--ease-out);
}
body[data-reveal-ready] [data-reveal][data-shown] { opacity: 1; transform: none; }

/* --- 02 FEATURE：1点を大きく、文字は絵の外へ ---------------- */
.sec--feature { padding-inline: 0; }
.feature {
  display: grid;
  grid-template-columns: minmax(0, 8fr) minmax(0, 4fr);
  align-items: end;
  gap: clamp(1.25rem, 3vw, 3.5rem);
}
/* 左端まで絵を伸ばし、右に余白を残す非対称。左右は入れ替えられる */
.feature__stage { grid-column: 1; }
.sec--feature[data-side="left"] .feature { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); }
.sec--feature[data-side="left"] .feature__stage { grid-column: 2; }
.sec--feature[data-side="left"] .feature__aside { grid-column: 1; padding: 0 0 clamp(0.5rem, 3vw, 2.5rem) var(--page-x); }
.sec--feature[data-align="top"] .feature { align-items: start; }
.sec--feature[data-align="center"] .feature { align-items: center; }
.feature__lead img { max-height: 86svh; }
.feature__aside { grid-column: 2; padding: 0 var(--page-x) clamp(0.5rem, 3vw, 2.5rem) 0; }
.sec--feature .sec__head { padding-inline: var(--page-x); }
.feature__name {
  font-family: var(--font-en); font-weight: var(--w-bold);
  font-size: clamp(1.5rem, 3vw, 2.75rem); line-height: 1.05;
  letter-spacing: -0.01em; margin: 0; max-width: none;
}
.feature__year { font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-3) 0 0; }
.feature__note { font-size: var(--t-sm); margin: var(--s-4) 0 0; max-width: 26em; }
.feature__aside .sec__more { margin-top: var(--s-5); }

/* --- 03 DETAILS：比率のちがう切り取りを横へ ----------------- */
.sec--details { padding-inline: 0; background: var(--c-pink-mist); }
.sec--details .sec__head { padding-inline: var(--page-x); }

/* 横へ流す帯。つかんで動かせて、端がつながっている */
.rail { position: relative; }
.strip {
  display: flex; gap: clamp(0.5rem, 1.6vw, 1.25rem);
  overflow-x: auto; scroll-snap-type: x proximity;
  padding-inline: var(--page-x);
  scrollbar-width: none; overscroll-behavior-x: contain;
  cursor: grab; touch-action: pan-x pan-y;
}
.strip::-webkit-scrollbar { display: none; }
.rail[data-dragging] .strip { cursor: grabbing; scroll-snap-type: none; }
.rail[data-dragging] .strip a { pointer-events: none; }
.strip__cell { flex: 0 0 auto; scroll-snap-align: center; }

/* いま帯のどこを見ているかを示す細い棒。つまんで動かせる */
.rail__bar {
  margin: clamp(1rem, 3vw, 2rem) var(--page-x) 0;
  height: 3px; border-radius: 999px;
  background: color-mix(in srgb, var(--c-ink) 12%, transparent);
  position: relative; cursor: pointer;
}
.rail__thumb {
  position: absolute; inset-block: -1px; left: 0; width: 20%;
  border-radius: 999px; background: var(--c-ink-muted);
}
.rail:not([data-rail-ready]) .rail__bar { display: none; }
@supports not (background: color-mix(in srgb, red 50%, transparent)) {
  .rail__bar { background: var(--c-hairline); }
}
/* 枡ごとに幅を変えて、同じ形の繰り返しに見せない */
.strip__cell--narrow { width: min(46vw, 300px); }
.strip__cell--square { width: min(52vw, 360px); }
.strip__cell--wide { width: min(78vw, 560px); }
/* 上下に段差をつけ、帯が一直線に見えないようにする */
.strip__cell:nth-child(even) { margin-top: clamp(1rem, 4vw, 3.5rem); }

/* --- 04 SELECTED：大きさの違う4枡の非対称グリッド ------------ */
.picks {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: clamp(1rem, 2.5vw, 2.5rem) clamp(1rem, 3vw, 3rem);
  align-items: start;
}
/* 縦長1点の横に、横長2点を積む。最後の1点だけ列をずらして息をつく */
.picks__item--tall { grid-column: 1 / span 5; grid-row: 1 / span 2; }
.picks__item--wide { grid-column: 7 / span 6; grid-row: 1; align-self: start; }
.picks__item--wide2 { grid-column: 7 / span 5; grid-row: 2; align-self: start; }
.picks__item--square { grid-column: 3 / span 4; grid-row: 3; }

/* --- 05 SPOTLIGHT：終盤の色の切り替え ---------------------- */
.sec--spotlight { padding-inline: 0; }
.spotlight {
  display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
  align-items: center; gap: clamp(1.5rem, 4vw, 4rem);
}
/* 文字を左に置くときは、絵と文字を入れ替える */
.sec--spotlight[data-side="left"] .spotlight { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
.sec--spotlight[data-side="left"] .spotlight__stage { order: 2; }
.sec--spotlight[data-side="left"] .spotlight__body { order: 1; padding-inline: var(--page-x) 0; }
.spotlight__cover img { max-height: 82svh; }
.spotlight__body { padding: clamp(1rem, 4vw, 3rem) var(--page-x) clamp(1rem, 4vw, 3rem) 0; }
.spotlight__title {
  font-family: var(--font-en); font-size: var(--t-display); line-height: 0.95;
  margin: var(--s-3) 0 0; max-width: none;
}
.spotlight__copy { font-size: var(--t-sm); margin: var(--s-4) 0 0; max-width: 30em; opacity: 0.82; }
.sec--spotlight .link-arrow { color: inherit; }

/* --- 以前の設定を残している人向け（COLOR STORY / ARCHIVE） -- */
.color-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: clamp(0.75rem, 2vw, 2rem); align-items: start;
}
.color-row__item { display: block; margin-top: calc(var(--n, 0) * clamp(0.5rem, 2vw, 2rem)); }
.color-row__img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
.mosaic { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 2px; }
.mosaic__cell { display: block; }
.mosaic__img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; filter: saturate(0.92); }
.mosaic__cell:hover .mosaic__img { filter: none; }

/* --- 縦画面・スマートフォン --------------------------------- */
@media (orientation: portrait) {
  .kv__slide { min-height: min(88svh, 900px); }
  .kv__type { width: max(14rem, min(100%, calc(var(--hs-tw, 62%) + 25%))); }
}

@media (max-width: 900px) {
  .kv__arrow { width: 44px; height: 56px; }
  .kv__free { inset: calc(var(--header-h) + 0.5rem) var(--page-x) clamp(4rem, 12vw, 5rem); }

  /* FEATURE：絵を上、文字を下の縦並びに */
  .feature { grid-template-columns: 1fr; align-items: start; }
  .feature__stage, .feature__aside { grid-column: 1; }
  .feature__aside { padding: 0 var(--page-x); }
  .feature__lead img { max-height: none; }

  /* SELECTED：縦に積むが、幅と比率は変えたままにする */
  .picks { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .picks__item--tall { grid-column: 1 / span 6; grid-row: auto; }
  .picks__item--wide { grid-column: 1 / span 5; grid-row: auto; }
  .picks__item--wide2 { grid-column: 2 / span 5; grid-row: auto; }
  .picks__item--square { grid-column: 1 / span 4; grid-row: auto; }

  /* SPOTLIGHT：絵を上、文字を下へ */
  .spotlight { grid-template-columns: 1fr; gap: 0; }
  .spotlight__body { padding: clamp(1.5rem, 6vw, 3rem) var(--page-x) clamp(2rem, 8vw, 4rem); }
  .spotlight__cover img { max-height: 62svh; }

  .strip__cell--narrow { width: min(62vw, 260px); }
  .strip__cell--square { width: min(70vw, 300px); }
  .strip__cell--wide { width: min(86vw, 420px); }
}

/* 動きを減らす設定のときは、フェードも拡大も止める */
@media (prefers-reduced-motion: reduce) {
  .kv__track, .strip { scroll-behavior: auto; }
  body[data-reveal-ready] [data-reveal] { opacity: 1; transform: none; transition: none; }
  .feature__lead img, .strip__shot img, .picks__shot img, .spotlight__cover img { transition: none; }
  .feature__lead:hover img, .strip__shot:hover img,
  .picks__shot:hover img, .spotlight__cover:hover img { transform: none; }
}

/* ============================================================
   PINK INDEX — Archive pages (CLOSET / GIRLS / COLLECTIONS / GALLERY)
   検索結果は整列グリッド、特集だけ可変比率の編集的レイアウト。
   ============================================================ */

.page-head {
  display: grid; gap: var(--s-3);
  padding-top: var(--s-7); padding-bottom: var(--s-5);
  border-bottom: var(--line-ink);
}
/* 見出し直後のセクションは上の余白を詰め、一覧をすぐ見せる */
.page-head + .section, .page-head + .page .section:first-child { padding-top: var(--s-6); }
.page-head__title { display: flex; align-items: baseline; gap: clamp(1rem, 2.5vw, 2.5rem); flex-wrap: wrap; }
.page-head__no {
  font-family: var(--font-num); font-size: var(--t-display);
  font-weight: var(--w-bold); line-height: 0.8; letter-spacing: var(--ls-hero);
}
.page-head__en {
  font-family: var(--font-en); font-size: var(--t-display);
  font-weight: var(--w-bold); text-transform: uppercase; line-height: 0.9; letter-spacing: -0.02em;
}
.page-head__jp { font-size: var(--t-sm); color: var(--c-ink-muted); max-width: var(--measure); margin: 0; }
@media (max-width: 640px) { .page-head { gap: var(--s-2); } }

/* --- Filter bar ------------------------------------------ */
.filters {
  display: grid; gap: var(--s-4);
  padding: var(--s-5) 0; border-bottom: var(--line-hair);
  position: sticky; top: var(--header-h); z-index: var(--z-sticky);
  background: color-mix(in srgb, var(--c-canvas) 94%, transparent);
  backdrop-filter: blur(8px);
}
.filters__row { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }
.filters__body { display: grid; gap: var(--s-4); }
.filters__toggle { display: inline-flex; justify-self: start; }
@media (max-width: 900px) {
  .filters { gap: var(--s-3); }
  .filters__label { min-width: 3.5rem; font-size: 10px; }
}
.filters__label {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
  min-width: 4.5rem;
}
.filters__search { flex: 1 1 220px; max-width: 380px; }
/* 選択中の条件と結果件数を常に表示する */
.result-bar {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  padding: var(--s-4) 0; font-size: var(--t-sm); color: var(--c-ink-muted);
}
.result-bar strong { color: var(--c-ink); font-variant-numeric: tabular-nums; font-size: 1.1rem; }

/* --- WORKS：整列グリッド ---------------------------------- */
.work-grid {
  display: grid; gap: clamp(var(--s-3), 2vw, var(--s-6));
  grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
  padding-block: var(--s-6) var(--s-9);
}
.work-card { display: block; color: inherit; }
.work-card:hover { text-decoration: none; }
.work-card__media { display: block; background: var(--c-white); overflow: clip; }
.work-card__media img {
  width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block;
  transition: transform var(--m-panel) var(--ease-out);
}
.work-card:hover .work-card__media img { transform: scale(1.02); }
.work-card__body { display: flex; gap: var(--s-3); align-items: baseline; padding-top: var(--s-2); font-size: var(--t-xs); }
.work-card__title { flex: 1 1 auto; }
.work-card__meta { color: var(--c-ink-muted); }

/* --- 作品の詳細 ------------------------------------------- */
.work { padding-block: calc(var(--header-h) + var(--s-6)) var(--s-8); }
.work__media { background: var(--c-white); }
.work__media img { width: 100%; height: auto; max-height: 86svh; object-fit: contain; display: block; }
.work__head { display: flex; align-items: baseline; gap: var(--s-5); flex-wrap: wrap; padding-top: var(--s-5); }
.work__title { font-size: var(--t-title); margin: 0; }
.work__meta { display: flex; gap: var(--s-4); font-size: var(--t-xs); color: var(--c-ink-muted); margin: 0; }
.work__text { max-width: 42rem; margin-top: var(--s-5); line-height: var(--lh-body); }
.work__more { display: grid; gap: var(--s-3); margin-top: var(--s-7); }
.work__more img { width: 100%; height: auto; display: block; }
.work__tags { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-6); }

/* --- SERIES ----------------------------------------------- */
.series-list { display: grid; gap: clamp(1rem, 3vw, 2.5rem); }
.series-row {
  display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr);
  gap: clamp(1rem, 3vw, 2.5rem); align-items: center; color: inherit;
}
.series-row:hover { text-decoration: none; opacity: 0.85; }
.series-row__media img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
.series-row__body { display: grid; gap: var(--s-2); }
.series-row__name { font-family: var(--font-en); font-size: var(--t-title); line-height: 1; }
.series-row__copy { font-size: var(--t-sm); color: var(--c-ink-muted); }
.series-row__count { font-size: var(--t-xs); color: var(--c-ink-muted); }
.series-head { padding-block: calc(var(--header-h) + var(--s-7)) var(--s-5); border-bottom: var(--line-ink); }
.series-head__copy { font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-3) 0 0; max-width: var(--measure); }

/* --- ABOUT ------------------------------------------------ */
.about__portrait img { width: min(220px, 45%); aspect-ratio: 1; object-fit: cover; border-radius: 50%; }
.about__lead { font-size: var(--t-lead); margin: var(--s-5) 0 0; }

@media (max-width: 900px) {
  .series-row { grid-template-columns: 1fr; }
}

/* --- TERMS / PRIVACY / CONTACT -------------------------------
   最下部の並びから開く3枚。読ませる面なので、幅を詰めて行間を広く。
   ------------------------------------------------------------ */
.doc { max-width: 46rem; padding-block: clamp(2.5rem, 7vw, 6rem); }
.doc__title {
  font-family: var(--font-en); font-size: var(--t-display);

.doc__sub { font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-3) 0 0; }
.doc__section { margin-top: clamp(2rem, 5vw, 3.5rem); }
.doc__section h2 {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); color: var(--c-ink-muted);

}
.doc__section ul { margin: var(--s-4) 0 0; padding-left: 1.2em; }
.doc__section li + li { margin-top: var(--s-3); }

  var path = q < 0 ? raw : raw.slice(0, q);
  window.PINK_QUERY = q < 0 ? "" : raw.slice(q);
  if (!ROUTES[path]) path = "/";

  var page = ROUTES[path];
  document.title = page.title;
  document.body.dataset.chrome = page.chrome ? "on" : "off";
  document.body.className = page.bodyClass || "";
  if (page.pre) {
    document.getElementById("pre").innerHTML = page.pre;
    document.body.dataset.loading = "true";
  }
  document.getElementById("main").innerHTML = page.main;

  // 画像は表から data URI へ差し替える（同じ絵を何度も埋め込まないため）
  var imgs = document.querySelectorAll('img[src^="/assets/"]');
  for (var i = 0; i < imgs.length; i++) {
    var src = imgs[i].getAttribute("src");
    if (window.PINK_ASSETS[src]) imgs[i].setAttribute("src", window.PINK_ASSETS[src]);
  }

  // 編集用のファイルから公開ページへ戻るリンクは、公開用のファイルへ向ける
  if (window.PINK_PUBLIC) {
    var out = document.querySelectorAll('a[href^="#/"]');
    for (var k = 0; k < out.length; k++) {
      var to = out[k].getAttribute("href");
      if (!ROUTES[to.slice(1)]) out[k].setAttribute("href", window.PINK_PUBLIC + to);
    }
  }

  // 現在地をナビへ反映
  var links = document.querySelectorAll(".site-nav a");
  for (var j = 0; j < links.length; j++) {
    var href = links[j].getAttribute("href").replace(/^#/, "");
    if (href === path) links[j].setAttribute("aria-current", "page");
    else links[j].removeAttribute("aria-current");
  }

  addEventListener("hashchange", function () { location.reload(); });
})();

/* --- 集計 -------------------------------------------------- */

function stats() {
  const st = load();
  const all = mergedWorks();
  return {
    works: all.length,
    published: all.filter((w) => w.visibility === "PUBLIC").length,
    drafts: all.filter((w) => w.visibility === "DRAFT").length,
    private: all.filter((w) => w.visibility === "PRIVATE").length,
    series: mergedSeries().length,
    categories: mergedCategories().length,
    homeEdited: Boolean(st.home),
    textsEdited: Object.keys(st.texts ?? {}).length,
    bytes: (() => { try { return JSON.stringify(st).length; } catch { return 0; } })(),
  };
}

/**
 * HOMEに並べる区画のHTML。
 *
 * サーバー側の書き出しと、管理画面のプレビューで同じ関数を使う。
 * DOMには触れず、文字列だけを返す。
 *
 * キービジュアルの下は FEATURE / DETAILS / SELECTED / SPOTLIGHT の順で、
 * 見せ方の違う区画が続く。中身は登録した作品と、キービジュアルに使った絵から
 * 拾う。同じ組みを繰り返さず、区画ごとに画像の比率・切り取る場所・余白を変える。
 */

const esc = (s) => String(s ?? "")
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

/** 0〜100% の値。0.1刻みまで受ける（つかんで動かしたときの細かさ） */
const pct = (v, fallback) => {
  const n = Number(v);
  return Number.isFinite(n) ? Math.min(100, Math.max(0, Math.round(n * 10) / 10)) : fallback;
};
/** 範囲を決めた数値。文字の大きさ・字間・行間・傾きに使う */
const num = (v, min, max, fallback) => {
  const n = Number(v);
  return Number.isFinite(n) ? Math.min(max, Math.max(min, Math.round(n * 100) / 100)) : fallback;
};
const ALIGN = ["left", "center", "right"];
const PLATE = ["none", "veil", "band"];

/**
 * 1枠ぶんの見た目をCSS変数で渡す。
 * 文字は「置き場所」だけでなく、大きさ・字間・行間・傾き・縦横も選べる。
 */
const style = (o) => [
  `--hs-bg:${/^#[0-9a-fA-F]{3,8}$/.test(o.bg || "") ? o.bg : "#FFF9FC"}`,
  `--hs-fg:${/^#[0-9a-fA-F]{3,8}$/.test(o.fg || "") ? o.fg : "#171417"}`,
  `--hs-focus:${/^[\d.]+% [\d.]+%$/.test(o.focus || "") ? o.focus : "50% 40%"}`,
  `--hs-zoom:${Math.min(3, Math.max(1, Number(o.zoom) || 1))}`,
  `--hs-tx:${pct(o.tx, 0)}%`,
  `--hs-ty:${pct(o.ty, 100)}%`,
  `--hs-tw:${pct(o.tw, 62)}%`,
  `--hs-align:${ALIGN.includes(o.align) ? o.align : "left"}`,
  `--hs-tsize:${num(o.tsize, 40, 260, 100) / 100}`,
  `--hs-tls:${num(o.tls, -8, 40, -2) / 100}em`,
  `--hs-tlh:${num(o.tlh, 70, 240, 95) / 100}`,
  `--hs-trot:${num(o.trot, -20, 20, 0)}deg`,
].join(";");

/** 文字まわりの見せ方。縦書き・敷き・ヘッダーの下まで使うか */
const textMods = (o) => [
  o.tvert ? ' data-tvert="on"' : "",
  ` data-tplate="${PLATE.includes(o.tplate) ? o.tplate : "none"}"`,
  o.tfull ? ' data-tfull="on"' : "",
].join("");

const img = (src, alt, cls, { eager = false, sizes = "" } = {}) => (src
  ? `<img class="${cls}" src="${esc(src)}" alt="${esc(alt ?? "")}"
       loading="${eager ? "eager" : "lazy"}" decoding="async"${eager ? ' fetchpriority="high"' : ""}${sizes}>`
  : "");

/** 区画の見出し。短い英単語だけを置く */
const head = (slot, { count = 0 } = {}) => (slot.title
  ? `<div class="sec__head">
      <h2 class="sec__title">${esc(slot.title)}</h2>
      ${count ? `<span class="sec__count num">${count}</span>` : ""}
    </div>`
  : "");

/** 誘導は区画の末尾に1つだけ */
const more = (slot, url) => (slot.href && slot.linkLabel
  ? `<p class="sec__more"><a class="link-arrow" href="${esc(url(slot.href))}">${esc(slot.linkLabel)}</a></p>`
  : "");

/** 作品と シリーズ は、登録データから引くページへ渡す */
const workHref = (w, url) => `${url("/work/")}?w=${encodeURIComponent(w.slug)}`;
const seriesHref = (s, url) => `${url("/series/")}?s=${encodeURIComponent(s.slug)}`;

/* --- 01 KEY VISUAL ---------------------------------------- */

/**
 * 主役は一度に一作品。左右の矢印と横スワイプで1枚ずつ切り替える。
 * 文字色は作品ごとに選べる（透明ヘッダーの上でも読めるようにするため）。
 */
function slideHTML(s, { url = (p) => p, heading = "h2", eager = false, attrs = "" } = {}) {
  const link = s.href && s.linkLabel
    ? `<a class="kv__link" href="${esc(url(s.href))}">${esc(s.linkLabel)}</a>` : "";
  const text = s.showText === false ? "" : `
          <div class="kv__type">
            ${s.eyebrow ? `<p class="kv__eyebrow">${esc(s.eyebrow)}</p>` : ""}
            ${s.title ? `<${heading} class="kv__title">${esc(s.title)}</${heading}>` : ""}
            ${s.subtitle ? `<p class="kv__sub">${esc(s.subtitle)}</p>` : ""}
            ${link}
          </div>`;
  return `
        <article class="kv__slide" style="${style(s)}" data-tone="${s.tone === "light" ? "light" : "dark"}"${textMods(s)}${attrs}>
          ${s.media ? `<picture class="kv__media">
            ${s.mediaMobile ? `<source media="(max-width: 820px)" srcset="${esc(url(s.mediaMobile))}">` : ""}
            ${img(url(s.media), s.altText ?? s.title ?? "", "kv__img", { eager })}
          </picture>` : ""}
          <div class="kv__free">${text}</div>
        </article>`;
}

function heroHTML(slot, { url, first }) {
  const slides = (slot.slides ?? []).filter((s) => s.published !== false);
  if (!slides.length) return "";

  const multi = slides.length > 1;
  return `
  <section class="kv" data-kv${slot.autoplay ? ` data-autoplay="${Math.max(2, Number(slot.interval) || 6)}"` : ""}>
    <div class="kv__track" id="kv-track" tabindex="0"
         role="group" aria-roledescription="カルーセル" aria-label="キービジュアル">
      ${slides.map((s, i) => slideHTML(s, {
        url, heading: first && i === 0 ? "h1" : "h2", eager: i === 0,
        attrs: ` data-kv-slide="${i}" role="group" aria-roledescription="スライド"` +
               ` aria-label="${i + 1} / ${slides.length}"`,
      })).join("")}
    </div>
    ${multi ? `
    <button class="kv__arrow kv__arrow--prev" type="button" data-kv-prev aria-label="前の作品">
      <span aria-hidden="true"></span>
    </button>
    <button class="kv__arrow kv__arrow--next" type="button" data-kv-next aria-label="次の作品">
      <span aria-hidden="true"></span>
    </button>
    <ol class="kv__dots">
      ${slides.map((s, i) => `<li><button type="button" data-kv-go="${i}"
        aria-label="${i + 1}枚目を見る"${i === 0 ? ' aria-current="true"' : ""}></button></li>`).join("")}
    </ol>` : ""}
  </section>`;
}

/* --- 画像の在庫 ---------------------------------------------
   キービジュアルの下の区画は、登録した作品と、キービジュアルに使った絵から
   画像を集めて組む。外から持ってきた画像は一切足さない。
   点数が少ないときは、同じ絵を「別の比率・別の切り取り位置」で見せる。
   ---------------------------------------------------------- */

/** 作品 → 作品の追加画像 → キービジュアル の順に集め、重複は落とす */
function buildPool(works, slots, url) {
  const out = [];
  const seen = new Set();
  const push = (src, alt, href, work) => {
    if (!src || seen.has(src)) return;
    seen.add(src);
    out.push({ src, alt: alt ?? "", href, work });
  };
  for (const w of works) push(w.mainImage, w.altText ?? w.title, workHref(w, url), w);
  for (const w of works) for (const extra of w.images ?? []) push(extra, w.altText ?? w.title, workHref(w, url), w);
  for (const slot of slots ?? []) {
    if (slot.layout !== "hero") continue;
    for (const s of slot.slides ?? []) {
      push(s.media, s.altText ?? s.title, s.href ? url(s.href) : url("/works/"), null);
    }
  }
  return out;
}

/** 在庫から順に取り出す。足りなければ先頭へ戻る */
const pick = (pool, i) => (pool.length ? pool[((i % pool.length) + pool.length) % pool.length] : null);

/**
 * 切り取りの型。比率と、絵のどこを見せるかの組。
 * 1枚しか無い場合でも、ここが違えば毎回ちがう絵として見える。
 */
const CROPS = [
  { ratio: "3 / 4", pos: "50% 16%", span: "narrow" },   // 顔まわり
  { ratio: "16 / 9", pos: "50% 44%", span: "wide" },    // 帯状に
  { ratio: "1 / 1", pos: "28% 30%", span: "square" },   // 左寄りの部分
  { ratio: "9 / 16", pos: "50% 22%", span: "narrow" },  // 縦に深く
  { ratio: "2 / 1", pos: "50% 72%", span: "wide" },     // 裾・足元
  { ratio: "4 / 5", pos: "72% 34%", span: "square" },   // 右寄りの部分
];

/** 区画で選べる比率。管理画面の選択肢と同じ並び */
const RATIOS = {
  wide: "16 / 9", cinema: "2 / 1", box: "5 / 4", square: "1 / 1", tall: "4 / 5", portrait: "3 / 4",
};

/** 区画ごとの「絵のどこを見せるか」。未設定なら区画の既定 */
const focusOf = (o, fallback) =>
  (/^[\d.]+% [\d.]+%$/.test(o.focus || "") ? o.focus : fallback);

/**
 * 1枡。画像があればリンク付きの絵、無ければ色面だけを置く。
 * 色面は装飾で、作品の代わりではない（外の画像を持ち込まないため）。
 */
function cell(entry, { ratio, pos, cls, eager = false, cap = "" } = {}) {
  const box = `aspect-ratio:${ratio};object-position:${pos}`;
  if (!entry) {
    return `<span class="${cls} ${cls}--empty"><span class="ph" style="aspect-ratio:${ratio}"></span>${cap}</span>`;
  }
  return `<a class="${cls}" href="${esc(entry.href)}">
      <img class="${cls}__img" src="${esc(entry.src)}" alt="${esc(entry.alt)}" style="${box}"
        loading="${eager ? "eager" : "lazy"}" decoding="async"${eager ? ' fetchpriority="high"' : ""}>
      ${cap}
    </a>`;
}

/** 画像の外側に置く小さな見出し。絵の上には重ねない */
const cap = (title, meta) => (title || meta
  ? `<span class="cap">${title ? `<span class="cap__title">${esc(title)}</span>` : ""}${
      meta ? `<span class="cap__meta num">${esc(meta)}</span>` : ""}</span>`
  : "");

const year = (w) => String(w?.createdOn ?? "").slice(0, 4);
const dotted = (w) => String(w?.createdOn ?? "").replace(/-/g, ".");

/* --- 02 FEATURE ------------------------------------------- */
/**
 * いま一番見せたい1点を、画面の大部分を使って大きく置く。
 * 文字は絵の外、右下に寄せる（中央に小さくまとめない）。
 */
function featureHTML(slot, { url, works, pool }) {
  // 見せる1点は管理画面で選べる。選んでいなければ「おすすめ」→最初の作品
  const picked = slot.workId ? works.all.find((w) => w.id === slot.workId) : null;
  const lead = picked ?? works.featured[0] ?? works.all[0] ?? null;
  const shot = lead
    ? { src: lead.mainImage, alt: lead.altText ?? lead.title, href: workHref(lead, url), work: lead }
    : pick(pool, 0);
  const note = (lead?.description ?? "").trim().split(/\n|。/)[0].slice(0, 60);
  const ratio = RATIOS[slot.ratio] ?? "5 / 4";

  return `
  <section class="sec sec--feature" data-side="${slot.side === "left" ? "left" : "right"}"
           data-align="${slot.valign === "top" ? "top" : slot.valign === "center" ? "center" : "bottom"}" data-reveal>
    ${head(slot)}
    <div class="feature">
      <div class="feature__stage">
        ${cell(shot, { ratio, pos: focusOf(slot, "50% 38%"), cls: "feature__lead", eager: true })}
      </div>
      <div class="feature__aside">
        ${lead ? `<p class="feature__name">${esc(lead.title)}</p>` : ""}
        ${lead && year(lead) ? `<p class="feature__year num">${esc(year(lead))}</p>` : ""}
        ${note ? `<p class="feature__note">${esc(note)}</p>` : ""}
        <p class="sec__more"><a class="link-arrow" href="${
          lead ? workHref(lead, url) : url(slot.href || "/works/")}">${
          esc(lead ? "VIEW WORK" : slot.linkLabel || "VIEW WORKS")}</a></p>
      </div>
    </div>
  </section>`;
}

/* --- 03 DETAILS ------------------------------------------- */
/**
 * 作品の一部だけを大胆に切り取って横へ並べる帯。
 * 比率も切り取る場所も枡ごとに変える。完成画像の縮小版は並べない。
 */
function detailsHTML(slot, { url, works, pool }) {
  // 元にする絵は、タグで絞れる。枡の数も選べる（4・6・8）
  const tagged = slot.tag ? works.all.filter((w) => (w.tags ?? []).includes(slot.tag)) : [];
  const from = tagged.length
    ? tagged.map((w) => ({ src: w.mainImage, alt: w.altText ?? w.title, href: workHref(w, url), work: w }))
    : pool;
  const count = [4, 6, 8].includes(Number(slot.count)) ? Number(slot.count) : 6;

  // 在庫がある分だけ順に使う。1枚しか無いときは切り取る場所で差をつける
  const cells = Array.from({ length: count }, (_, i) => {
    const c = CROPS[i % CROPS.length];
    const entry = pick(from, i);
    return `<div class="strip__cell strip__cell--${c.span}" role="listitem">
        ${cell(entry, { ratio: c.ratio, pos: c.pos, cls: "strip__shot" })}
      </div>`;
  }).join("");

  return `
  <section class="sec sec--details" data-reveal>
    ${head(slot)}
    <div class="rail" data-rail>
      <div class="strip" role="list" data-rail-track>${cells}</div>
      <div class="rail__bar" data-rail-bar>
        <span class="rail__thumb" data-rail-thumb></span>
      </div>
    </div>
  </section>`;
}

/* --- 04 COLOR STORY --------------------------------------- */
/** 以前の設定を残している人のための区画。段差をつけて並べる */
function colorStoryHTML(slot, { url, works }) {
  const tagged = slot.tag ? works.all.filter((w) => (w.tags ?? []).includes(slot.tag)) : works.all;
  const list = tagged.slice(0, 5);
  if (list.length < 3) return "";
  return `
  <section class="sec sec--color" style="${style(slot)}" data-reveal>
    ${head(slot)}
    ${slot.tag ? `<p class="sec__lead">${esc(slot.tag)}</p>` : ""}
    <div class="color-row">
      ${list.map((w, i) => `
      <a class="color-row__item" href="${workHref(w, url)}" style="--n:${i}">
        ${img(url(w.mainImage), w.altText, "color-row__img")}
        <span class="cap"><span class="cap__title">${esc(w.title)}</span></span>
      </a>`).join("")}
    </div>
    ${more(slot, url)}
  </section>`;
}

/* --- 05 SELECTED ------------------------------------------ */
/**
 * 大きな縦長1点・横長2点・正方形1点の非対称な組み。
 * 同じ大きさの枠を並べない。題名は絵の外に小さく置く。
 */
const SELECTED_SHAPES = [
  { key: "tall", ratio: "3 / 4", pos: "50% 26%" },
  { key: "wide", ratio: "16 / 9", pos: "50% 40%" },
  { key: "wide2", ratio: "16 / 10", pos: "50% 52%" },
  { key: "square", ratio: "1 / 1", pos: "42% 30%" },
];

function selectedHTML(slot, { url, works, pool }) {
  // FEATURE で大きく出した1点は、点数に余裕があれば外す（同じ絵が続かないように）
  const lead = works.featured[0] ?? works.all[0] ?? null;
  const sorted = [...works.all]
    .sort((a, b) => String(b.createdOn ?? "").localeCompare(String(a.createdOn ?? "")));
  const recent = works.all.length > 4 ? sorted.filter((w) => w.id !== lead?.id) : sorted;
  // 4枠それぞれ、管理画面で作品を指名できる（空なら新しい順に埋める）
  const picks = Array.isArray(slot.pickIds) ? slot.pickIds : [];
  const named = new Set(picks.filter(Boolean));
  const rest = recent.filter((x) => !named.has(x.id));
  let n = 0;

  const items = SELECTED_SHAPES.map((shape, i) => {
    const chosen = picks[i] ? works.all.find((x) => x.id === picks[i]) : null;
    const w = chosen ?? rest[n++] ?? null;
    const entry = w
      ? { src: w.mainImage, alt: w.altText ?? w.title, href: workHref(w, url), work: w }
      : pick(pool, i + 1);
    return `<div class="picks__item picks__item--${shape.key}">
        ${cell(entry, { ratio: shape.ratio, pos: shape.pos, cls: "picks__shot",
          cap: cap(w?.title ?? "", w ? dotted(w) : "") })}
      </div>`;
  }).join("");

  return `
  <section class="sec sec--picks" data-reveal>
    ${head(slot, { count: works.all.length })}
    <div class="picks">${items}</div>
    ${more(slot, url)}
  </section>`;
}

/* --- 06 SPOTLIGHT ------------------------------------------ */
/**
 * ページの終盤。背景色を変えて横幅いっぱいに1点（または1シリーズ）を置く。
 * ここまでの白い流れに対する視覚的な切り替え。
 */
function spotlightHTML(slot, { url, works, series, pool }) {
  // 作品を指名していればそれを、していなければシリーズを、どちらも無ければ自動
  const named = slot.workId ? works.all.find((w) => w.id === slot.workId) : null;
  const target = named ? null : slot.seriesSlug
    ? series.find((s) => s.slug === slot.seriesSlug)
    : series.find((s) => works.all.some((w) => w.series === s.slug));
  const list = target ? works.all.filter((w) => w.series === target.slug) : [];

  const solo = named
    ?? (!target ? (works.featured[1] ?? works.featured[0] ?? works.all[works.all.length - 1] ?? null) : null);
  const shot = list[0]
    ? { src: list[0].mainImage, alt: list[0].altText ?? list[0].title, href: seriesHref(target, url) }
    : solo
      ? { src: solo.mainImage, alt: solo.altText ?? solo.title, href: workHref(solo, url) }
      : pick(pool, pool.length - 1);

  const title = target?.name ?? solo?.title ?? "";
  const copy = (target?.copy ?? solo?.description ?? "").trim().split(/\n/)[0].slice(0, 90);
  const href = target ? seriesHref(target, url) : solo ? workHref(solo, url) : url(slot.href || "/works/");

  return `
  <section class="sec sec--spotlight" style="${style(slot)}"
           data-side="${slot.side === "left" ? "left" : "right"}" data-reveal>
    <div class="spotlight">
      <div class="spotlight__stage">
        ${cell(shot, { ratio: RATIOS[slot.ratio] ?? "4 / 3", pos: focusOf(slot, "50% 34%"), cls: "spotlight__cover" })}
      </div>
      <div class="spotlight__body">
        <p class="sec__eyebrow">${esc(slot.title || "SPOTLIGHT")}</p>
        ${title ? `<h2 class="spotlight__title">${esc(title)}</h2>` : ""}
        ${copy ? `<p class="spotlight__copy">${esc(copy)}</p>` : ""}
        <p class="sec__more"><a class="link-arrow" href="${esc(href)}">${
          esc(target ? "VIEW SERIES" : slot.linkLabel || "VIEW MORE")}</a></p>
      </div>
    </div>
  </section>`;
}

/* --- 07 ARCHIVE -------------------------------------------- */
/** 以前の設定を残している人のための区画。量そのものを見せる */
function archiveHTML(slot, { url, works }) {
  const list = works.all.slice(0, 40);
  if (list.length < 4) return "";
  return `
  <section class="sec sec--archive" data-reveal>
    ${head(slot, { count: works.all.length })}
    <div class="mosaic">
      ${list.map((w) => `<a class="mosaic__cell" href="${workHref(w, url)}"
        >${img(url(w.mainImage), w.altText, "mosaic__img")}</a>`).join("")}
    </div>
    ${more(slot, url)}
  </section>`;
}

/* --- 組み立て ---------------------------------------------- */

const LAYOUTS = {
  hero: heroHTML, feature: featureHTML, details: detailsHTML, colorstory: colorStoryHTML,
  new: selectedHTML, spotlight: spotlightHTML, archive: archiveHTML,
};

/**
 * @param {object} slot
 * @param {{url?: Function, first?: boolean, works?: array, series?: array, pool?: array}} opts
 */
function homeSlotHTML(slot, opts = {}) {
  const url = opts.url ?? ((p) => p);
  const all = opts.works ?? [];
  const ctx = {
    url,
    first: opts.first,
    works: { all, featured: all.filter((w) => w.featured) },
    series: opts.series ?? [],
    pool: opts.pool ?? buildPool(all, opts.slots ?? [], url),
  };
  return (LAYOUTS[slot.layout] ?? (() => ""))(slot, ctx);
}

const homeSlotsHTML = (slots, opts = {}) => {
  const url = opts.url ?? ((p) => p);
  // 使える画像は一度だけ集めて、全部の区画で使い回す
  const pool = buildPool(opts.works ?? [], slots, url);
  return slots.map((slot, i) => homeSlotHTML(slot, { ...opts, url, pool, first: i === 0 })).join("\n");
};


  /**
   * ページの深さに応じた相対パスへ変換する（file:// でも壊れないようにする）。
   * 1ファイル版では、埋め込んだ画像の表を先に引く。
   */
  function url(path) {
    var p = String(path == null ? "" : path);
    // 自分で登録した絵は data: URL のまま。外部URLも書き換えない
    if (p.slice(0, 5) === "data:" || p.slice(0, 5) === "blob:" || /^https?:/.test(p) || p.charAt(0) === "#") return p;
    var map = window.PINK_ASSETS;
    if (map && map[p]) return map[p];
    // 1ファイル版はページをハッシュで切り替える。
    // ここを通さないと、公開先（/pink-index/ など）で404になる。
