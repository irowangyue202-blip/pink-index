<title>PINK INDEX</title>
<style>
/* ============================================================
   PINK INDEX — Design Tokens
   企画書 4章「ブランド・ビジュアルシステム」に対応する唯一の正本。
   色・余白・文字・罫線・角丸・モーションはここだけで定義し、
   個別CSSではハードコードした値を使わない。
   基本比率: 白・淡いピンク 75% / 黒 20% / 鮮やかなピンク 5%
   ============================================================ */

:root {
  /* --- Color: 面(75%) ------------------------------------- */
  --c-canvas: #fff9fc;      /* サイト全体の基本背景 */
  --c-white: #ffffff;       /* 画像面、モーダル、入力欄 */
  --c-pale-pink: #ffe8f2;   /* 巨大背景文字、選択領域の淡色面 */
  --c-pink-mist: #fff2f7;   /* ホバー、空状態、補助背景 */

  /* --- Color: 骨格(20%) ----------------------------------- */
  --c-ink: #171417;         /* 数字、見出し、主要テキスト、線 */
  --c-ink-muted: #756a71;   /* 補足、制作日、メタ情報 */
  --c-hairline: #e8dee3;    /* 罫線、非選択枠、区切り */

  /* --- Color: アクセント(5%) ------------------------------- */
  --c-accent: #ff4fa3;      /* 小さな印、選択点、リンク矢印のみ */
  --c-focus: #6d4aff;       /* キーボードフォーカス */

  /* 状態色。面ではなく細線・小面積で使う */
  --c-danger: #c02b52;
  --c-ok: #1f7a5a;

  /* --- Typography ----------------------------------------- */
  --font-jp: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Kaku Gothic ProN",
    "Yu Gothic", system-ui, sans-serif;
  --font-en: "Archivo", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --font-num: var(--font-en);

  /* 流体タイプスケール。最小/最大を固定し、極端な縮小を避ける */
  --t-hero: clamp(3.5rem, 13vw, 11rem);      /* ローダー数字・巨大見出し */
  --t-display: clamp(2.25rem, 7vw, 5.5rem);  /* セクション大見出し */
  --t-title: clamp(1.5rem, 3.2vw, 2.5rem);
  --t-lead: clamp(1rem, 1.5vw, 1.25rem);
  --t-body: 1rem;
  --t-sm: 0.8125rem;
  --t-xs: 0.6875rem;                          /* ラベル・番号。字間を広げて使う */

  --lh-tight: 1.05;
  --lh-heading: 1.25;
  --lh-body: 1.8;      /* 日本語本文は広めに */
  --ls-label: 0.16em;  /* INDEXラベル・英字小文字 */
  --ls-hero: -0.02em;

  --w-regular: 400;
  --w-medium: 500;
  --w-bold: 700;

  /* --- Space: 4pxベース ----------------------------------- */
  --s-1: 0.25rem;
  --s-2: 0.5rem;
  --s-3: 0.75rem;
  --s-4: 1rem;
  --s-5: 1.5rem;
  --s-6: 2rem;
  --s-7: 3rem;
  --s-8: 4rem;
  --s-9: 6rem;
  --s-10: 8rem;
  --section-y: clamp(3rem, 9vw, 8rem);
  --page-x: clamp(1.25rem, 4vw, 4rem);
  --measure: 34em;         /* 本文の最大行長 */

  /* --- Line / Radius -------------------------------------- */
  --line: 1px;
  --line-ink: var(--line) solid var(--c-ink);
  --line-hair: var(--line) solid var(--c-hairline);
  --line-pink: var(--line) solid var(--c-pale-pink);
  --r-1: 2px;
  --r-2: 8px;    /* 標準 */
  --r-3: 12px;   /* 大きめのパネル */
  --r-pill: 999px; /* タグ・フィルターのみ */

  /* 影は「実際に前後関係がある要素」だけに使う */
  --shadow-float: 0 12px 32px rgba(23, 20, 23, 0.1);
  --shadow-sheet: 0 -8px 28px rgba(23, 20, 23, 0.12);

  /* --- Motion --------------------------------------------- */
  --m-micro: 170ms;   /* ホバー、選択、チェック */
  --m-panel: 300ms;   /* フィルター、ボトムシート、モーダル */
  --m-reveal: 520ms;  /* セクション見出し、作品の初回表示 */
  --m-loader-exit: 560ms;
  --ease-out: cubic-bezier(0.16, 0.84, 0.32, 1); /* 素早く出て静かに止まる */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  /* --- Layout --------------------------------------------- */
  --grid-cols: 12;
  --grid-gap: clamp(1rem, 2vw, 2rem);
  --max-w: 1600px;
  --header-h: 64px;
  --tap-min: 44px;   /* タップ対象の下限 */
  --z-sticky: 30;
  --z-sheet: 60;
  --z-header: 70;
  --z-dialog: 80;
  --z-loader: 100;
}

@media (max-width: 900px) {
  :root {
    --grid-cols: 8;
    --header-h: 56px;
  }
}
@media (max-width: 640px) {
  :root {
    --grid-cols: 4;
  }
}

/* モーション軽減。演出は削るが、状態変化は色/枠で必ず分かるようにする */
@media (prefers-reduced-motion: reduce) {
  :root {
    --m-micro: 1ms;
    --m-panel: 1ms;
    --m-reveal: 1ms;
    --m-loader-exit: 1ms;
  }
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============================================================
   PINK INDEX — Base / Layout
   ============================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  /* 横スクロールは各区画側で閉じる。
     ここで overflow-x: clip を掛けると、Chromeでは縦スクロールまで
     止まってしまうため使わない（tools/check-layout.mjs で常時検査する）。 */
}

body {
  margin: 0;
  background: var(--c-canvas);
  color: var(--c-ink);
  font-family: var(--font-jp);
  font-size: var(--t-body);
  line-height: var(--lh-body);
  font-weight: var(--w-regular);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "palt" 1;
}

/* 数字はカウント中に幅が揺れないよう等幅数字を強制 */
.num, .u-num, time, .count { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

h1, h2, h3, h4 {
  margin: 0;
  line-height: var(--lh-heading);
  font-weight: var(--w-bold);
  letter-spacing: -0.01em;
}
p { margin: 0 0 var(--s-4); max-width: min(var(--measure), 100%); }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg { max-width: 100%; display: block; }
/* display を指定した部品が [hidden] を打ち消さないようにする */
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }

a {
  color: var(--c-ink);
  text-decoration: none;
  text-underline-offset: 0.25em;
}
a:hover { text-decoration: underline; text-decoration-thickness: 1px; }

/* フォーカスリングは絶対に消さない。識別性のためVioletを使う */
:focus-visible {
  outline: 2px solid var(--c-focus);
  outline-offset: 3px;
  border-radius: var(--r-1);
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip-path: inset(50%);
  overflow: hidden; white-space: nowrap;
}

.skip-link {
  position: absolute; left: var(--s-4); top: -100px;
  z-index: calc(var(--z-header) + 1);
  background: var(--c-ink); color: var(--c-white);
  padding: var(--s-3) var(--s-4); border-radius: var(--r-2);
  transition: top var(--m-micro) var(--ease-out);
}
.skip-link:focus { top: var(--s-4); }

/* 着せ替えのような操作画面は、ページ全体を伸ばさず画面内に収める。
   スクロールは素材一覧など、必要な部分だけに閉じ込める。 */
body.app-screen { overflow: hidden; height: 100svh; }
body.app-screen .site-footer { display: none; }

/* --- Page frame ------------------------------------------ */
.page { max-width: var(--max-w); margin: 0 auto; padding: 0 var(--page-x); }
.section { padding-block: var(--section-y); }
.stack > * + * { margin-top: var(--s-4); }

.grid {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
  gap: var(--grid-gap);
}

/* --- Header ----------------------------------------------
   4つの状態を持つ。切り替えは client/site.js。
     top      背景は完全に透明。キービジュアルが背後まで見える
     hidden   下へ移動したら上へ滑らせて隠す
     frosted  上へ戻したら乳白色＋ぼかし＋ごく薄い下線で戻す
   文字色は表示中の作品に合わせて data-tone で切り替える。
   --------------------------------------------------------- */
.site-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-header);
  min-height: var(--header-h);
  display: flex; align-items: center; gap: clamp(var(--s-4), 3vw, var(--s-7));
  padding: 0 var(--page-x);
  color: var(--c-ink);
  background: transparent;
  border-bottom: 1px solid transparent;
  transition: transform 250ms var(--ease-out), background-color 250ms var(--ease-out),
              border-color 250ms var(--ease-out), color 200ms var(--ease-out);
}
/* 先頭以外のページは、白い面の上に置くので常に読みやすくしておく */
body:not(.has-hero) .site-header { background: var(--c-canvas); border-bottom-color: var(--c-hairline); }
body:not(.has-hero) #main { padding-top: var(--header-h); }

.site-header[data-tone="light"] { color: var(--c-white); }
.site-header[data-state="hidden"] { transform: translateY(-100%); }
.site-header[data-state="frosted"] {
  color: var(--c-ink);
  background: color-mix(in srgb, var(--c-white) 78%, transparent);
  backdrop-filter: blur(14px) saturate(1.1);
  border-bottom-color: color-mix(in srgb, var(--c-ink) 8%, transparent);
}
/* ぼかしが使えない環境では、不透明度を上げた白へ切り替える */
@supports not (backdrop-filter: blur(4px)) {
  .site-header[data-state="frosted"] { background: color-mix(in srgb, var(--c-white) 96%, transparent); }
}

.site-header__logo {
  font-family: var(--font-en); font-weight: var(--w-bold);
  font-size: 0.95rem; letter-spacing: var(--ls-label); text-transform: uppercase;
  color: inherit; display: inline-flex; align-items: center; min-height: var(--tap-min);
}
.site-header__logo:hover { color: inherit; text-decoration: none; opacity: 0.7; }

.site-nav { margin-left: auto; display: flex; gap: clamp(var(--s-3), 2vw, var(--s-6)); align-items: center; }
.site-nav a {
  display: inline-flex; align-items: center; min-height: var(--tap-min);
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
  color: inherit; opacity: 0.72;
  border-bottom: 2px solid transparent;
  transition: opacity var(--m-micro) var(--ease-out), border-color var(--m-micro) var(--ease-out);
}
.site-nav a:hover { opacity: 1; text-decoration: none; }
.site-nav a[aria-current="page"] { opacity: 1; border-bottom-color: var(--c-accent); }
.site-header :focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

.nav-toggle { display: none; }

@media (max-width: 900px) {
  .site-nav {
    position: fixed; inset: 0;
    flex-direction: column; align-items: flex-start; justify-content: center;
    gap: var(--s-3);
    background: var(--c-ink); color: var(--c-white);
    padding: var(--header-h) var(--page-x) var(--s-8);
    opacity: 0; pointer-events: none;
    transition: opacity var(--m-panel) var(--ease-out);
  }
  .site-nav[data-open="true"] { opacity: 1; pointer-events: auto; }
  .site-nav a { width: 100%; padding: var(--s-3) 0; font-size: 1.5rem; opacity: 0.85; }
  .site-nav a[aria-current="page"] { opacity: 1; }
  .nav-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    margin-left: auto; min-width: var(--tap-min); min-height: var(--tap-min);
    background: none; border: 0; cursor: pointer; color: inherit;
    font-family: var(--font-en); font-size: var(--t-xs); letter-spacing: var(--ls-label);
  }
  body[data-nav-open="true"] .nav-toggle { color: var(--c-white); position: relative; z-index: 1; }
  body[data-nav-open="true"] { overflow: hidden; }
}

/* つまみとチェックは、サイトの色（黒）で塗る */
input[type="range"], input[type="checkbox"], input[type="radio"], progress {
  accent-color: var(--c-ink);
}

/* --- Footer ----------------------------------------------
   最後の1枚のビジュアルとして置く。巨大なロゴと、その下の横並びだけ。
   --------------------------------------------------------- */
.site-footer {
  border-top: var(--line-ink);
  padding: clamp(3rem, 8vw, 7rem) var(--page-x) var(--s-6);
  margin-top: var(--s-9);
  background: var(--c-white);
  display: grid; justify-items: center; gap: clamp(1.5rem, 4vw, 3rem);
  overflow: clip;
}
.brand-logo { display: block; width: 100%; max-width: var(--max-w); }
.brand-logo:hover { text-decoration: none; }
.brand-logo__img { display: block; width: 100%; height: auto; }
/* 画面幅いっぱいのロゴタイプ。SVGなので、どの幅でも切れずに収まる */
.brand-logo__type { display: block; width: 100%; height: auto; }
.brand-logo__type text {
  font-family: var(--font-en); font-weight: var(--w-bold);
  font-size: 118px; fill: var(--c-ink);
}
.brand-links {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: clamp(var(--s-3), 2.5vw, var(--s-6));
}
.brand-links a {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
  color: var(--c-ink-muted); min-height: var(--tap-min);
  display: inline-flex; align-items: center;
}
.brand-links a:hover { color: var(--c-ink); text-decoration: none; }
.brand-copy { font-size: var(--t-xs); color: var(--c-ink-muted); margin: 0; }

/* --- Section heading (番号 + 英字 + 和文) ------------------- */
.section-head { display: flex; align-items: flex-end; gap: var(--s-5); flex-wrap: wrap; margin-bottom: var(--s-6); }
.section-head__no {
  font-family: var(--font-num); font-size: var(--t-display);
  font-weight: var(--w-bold); line-height: 0.85; letter-spacing: var(--ls-hero);
}
.section-head__body { flex: 1 1 20rem; }
.section-head__en {
  font-family: var(--font-en); font-size: var(--t-title);
  font-weight: var(--w-bold); text-transform: uppercase; letter-spacing: 0.02em;
}
.section-head__jp { font-size: var(--t-sm); color: var(--c-ink-muted); }
.section-head::after {
  content: ""; flex: 1 1 4rem; height: 1px; background: var(--c-hairline); margin-bottom: 0.6em;
}

/* ============================================================
   PINK INDEX — Components (企画書 8章)
   角丸・影・ピルを多用せず、罫線と余白で階層を作る。
   選択状態は「色だけ」で示さず、枠 + 小さなピンクの点 + テキストで示す。
   ============================================================ */

/* --- Buttons --------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--s-2);
  min-height: var(--tap-min); padding: var(--s-3) var(--s-5);
  border-radius: var(--r-2); border: var(--line-ink);
  background: var(--c-white); color: var(--c-ink);
  font-size: var(--t-sm); font-weight: var(--w-medium);
  cursor: pointer; text-decoration: none;
  transition: background var(--m-micro) var(--ease-out), color var(--m-micro) var(--ease-out),
    transform var(--m-micro) var(--ease-out);
}
.btn:hover { background: var(--c-pink-mist); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] {
  color: var(--c-ink-muted); border-color: var(--c-hairline);
  background: var(--c-white); cursor: not-allowed;
}
/* 主要操作は1画面に1〜2個 */
.btn--primary { background: var(--c-ink); color: var(--c-white); border-color: var(--c-ink); }
.btn--primary:hover { background: #000; color: var(--c-white); }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--ghost:hover { background: var(--c-pink-mist); }
.btn--sm { min-height: 36px; padding: var(--s-2) var(--s-3); font-size: var(--t-xs); }
.btn--icon { padding: var(--s-2); min-width: var(--tap-min); }

/* テキストリンク: 黒文字 + 小さなピンク矢印 */
.link-arrow {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-sm); font-weight: var(--w-medium);
}
.link-arrow::after {
  content: "→"; color: var(--c-accent);
  transition: transform var(--m-micro) var(--ease-out);
}
.link-arrow:hover { text-decoration: none; }
.link-arrow:hover::after { transform: translateX(4px); }

/* --- Index label (衣服の管理タグ) -------------------------- */
.index-label {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
  color: var(--c-ink-muted);
}
.index-label__no { color: var(--c-ink); font-weight: var(--w-bold); }
/* 切り欠きのある衣服タグ形状 */
.tag-chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-1) var(--s-3) var(--s-1) var(--s-4);
  background: var(--c-white); border: var(--line-hair);
  border-radius: var(--r-1);
  font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted);
  position: relative;
}
.tag-chip::before {
  content: ""; position: absolute; left: 7px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 4px; border-radius: 50%;
  border: 1px solid var(--c-ink-muted);   /* 紐通し穴 */
}

/* --- Filter chip ----------------------------------------- */
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: 34px; padding: 0 var(--s-4);
  border: var(--line-hair); border-radius: var(--r-pill);
  background: var(--c-white); color: var(--c-ink-muted);
  font-size: var(--t-xs); letter-spacing: 0.04em; cursor: pointer;
  transition: all var(--m-micro) var(--ease-out);
}
.chip:hover { background: var(--c-pink-mist); color: var(--c-ink); }
.chip[aria-pressed="true"] {
  background: var(--c-ink); border-color: var(--c-ink); color: var(--c-white);
}
.chip[aria-pressed="true"]::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--c-accent);
}

/* --- Card ------------------------------------------------ */
.card {
  display: flex; flex-direction: column;
  background: var(--c-white);
  border: var(--line-hair); border-radius: var(--r-2);
  overflow: hidden;
  transition: border-color var(--m-micro) var(--ease-out), transform var(--m-micro) var(--ease-out);
}
.card:hover { border-color: var(--c-ink); }
.card a { display: block; }
.card__media {
  position: relative; aspect-ratio: 3 / 4; background: var(--c-white);
  border-bottom: var(--line-hair); overflow: hidden;
}
.card__media img { width: 100%; height: 100%; object-fit: contain; padding: var(--s-3); }
.card__media--wide { aspect-ratio: 4 / 3; }
.card__body { padding: var(--s-3) var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: var(--s-1); }
.card__no {
  font-family: var(--font-num); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); color: var(--c-ink-muted);
}
.card__name { font-size: 0.9rem; font-weight: var(--w-medium); line-height: 1.5; }
.card__meta { font-size: var(--t-xs); color: var(--c-ink-muted); display: flex; gap: var(--s-2); flex-wrap: wrap; }
.card__fav {
  position: absolute; right: var(--s-2); top: var(--s-2);
  width: 34px; height: 34px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--c-white) 85%, transparent);
  border: var(--line-hair); border-radius: 50%; cursor: pointer;
}
.card__fav[aria-pressed="true"] { border-color: var(--c-accent); color: var(--c-accent); }

/* 整列グリッド(検索結果) */
.card-grid {
  display: grid; gap: var(--grid-gap);
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}
@media (max-width: 640px) {
  .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
}
/* 特集・GALLERYだけ可変比率の編集的レイアウトを許可 */
.editorial-grid {
  display: grid; gap: var(--grid-gap);
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  grid-auto-flow: dense;
}
.editorial-grid .card--tall { grid-row: span 2; }
.editorial-grid .card--tall .card__media { aspect-ratio: 3 / 5; }
.editorial-grid .card--wide { grid-column: span 2; }
.editorial-grid .card--wide .card__media { aspect-ratio: 16 / 10; }
@media (max-width: 640px) {
  .editorial-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
  .editorial-grid .card--wide { grid-column: span 2; }
  .editorial-grid .card--tall { grid-row: span 1; }
  .editorial-grid .card--tall .card__media { aspect-ratio: 3 / 4; }
}

/* --- Empty state ----------------------------------------- */
.empty {
  border: 1px dashed var(--c-hairline); border-radius: var(--r-3);
  background: var(--c-pink-mist);
  padding: var(--s-8) var(--s-5); text-align: center;
}
/* span で書いても行が重ならないよう、必ず block として積む */
.empty__title { display: block; font-size: 1rem; font-weight: var(--w-medium); margin: 0; }
.empty__body { display: block; font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-2) auto 0; max-width: 28em; }

/* --- Toast ----------------------------------------------- */
.toast-region {
  position: fixed; left: 50%; bottom: var(--s-6); transform: translateX(-50%);
  z-index: var(--z-dialog); display: flex; flex-direction: column; gap: var(--s-2);
  pointer-events: none; width: min(90vw, 420px);
}
.toast {
  background: var(--c-ink); color: var(--c-white);
  border-radius: var(--r-2); padding: var(--s-3) var(--s-4);
  font-size: var(--t-sm); box-shadow: var(--shadow-float);
  animation: toast-in var(--m-panel) var(--ease-out);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* --- Form ------------------------------------------------ */
.field { display: flex; flex-direction: column; gap: var(--s-2); }
.field > label { font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted); }
.field .hint { font-size: var(--t-xs); color: var(--c-ink-muted); }
.input, .select, .textarea {
  min-height: var(--tap-min); padding: var(--s-2) var(--s-3);
  background: var(--c-white); border: var(--line-hair); border-radius: var(--r-2);
  transition: border-color var(--m-micro) var(--ease-out);
}
.input:hover, .select:hover, .textarea:hover { border-color: var(--c-ink-muted); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--c-ink); }
.textarea { min-height: 96px; line-height: 1.7; resize: vertical; }

/* --- Meta table ------------------------------------------ */
.meta-list { display: grid; grid-template-columns: max-content 1fr; gap: var(--s-2) var(--s-5); font-size: var(--t-sm); }
.meta-list dt { color: var(--c-ink-muted); font-size: var(--t-xs); letter-spacing: 0.06em; }
.meta-list dd { margin: 0; }

/* --- Counter (ARCHIVE COUNTER) ---------------------------- */
.counter-row { display: grid; gap: var(--grid-gap); grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.counter {
  border-top: var(--line-ink); padding-top: var(--s-3);
}
.counter__value {
  font-family: var(--font-num); font-size: clamp(2.5rem, 5vw, 4rem);
  font-weight: var(--w-bold); line-height: 1; letter-spacing: var(--ls-hero);
}
.counter__label {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
  margin-top: var(--s-2);
}

/* --- Reveal (セクション初回表示) --------------------------- */
[data-reveal] {
  opacity: 0; transform: translateY(14px);
  transition: opacity var(--m-reveal) var(--ease-out), transform var(--m-reveal) var(--ease-out);
}
[data-reveal].is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  [data-reveal] { opacity: 1; transform: none; }
}

/* --- 縫い目風の点線区切り ---------------------------------- */
.seam {
  height: 1px; border: 0; margin: var(--s-7) 0;
  background-image: linear-gradient(90deg, var(--c-hairline) 0 6px, transparent 6px 12px);
  background-size: 12px 1px;
}

/* 取り消せない操作の2度押し待ち */
.btn--danger { border-color: var(--c-danger); color: var(--c-danger); background: var(--c-white); }
.btn--danger:hover { background: color-mix(in srgb, var(--c-danger) 8%, var(--c-white)); }

/* --- フレーバーテキスト（作品としての文章） ------------------ */
.card__flavor {
  font-size: var(--t-xs); line-height: 1.7; color: var(--c-ink-muted);
  margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card__flavor:empty { display: none; }
.detail__flavor {
  font-size: 1.05rem; line-height: 2.1; margin: var(--s-4) 0 0;
  max-width: 30em; border-left: 2px solid var(--c-accent); padding-left: var(--s-4);
}
.detail__flavor:empty { display: none; }

/* 管理画面から「位置」を押されたときに、その文字を光らせる */
.is-text-marked {
  outline: 2px solid var(--c-accent); outline-offset: 3px;
  background: color-mix(in srgb, var(--c-accent) 14%, transparent);
}

/* 未登録の区画。理由も導線も書かず、1語だけ置く */
.coming {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); color: var(--c-ink-muted);
  text-align: center; padding: clamp(3rem, 10vw, 7rem) 0; margin: 0;
  max-width: none; width: 100%;
}

/* ============================================================
   PINK INDEX — Loader (企画書 5章)
   「サイトへの待ち時間」ではなく「白い作品台帳が開き、
    最初の1ページが立ち上がる瞬間」として設計する。
   外周ラインはフェードアウトせず、ホームの枠線へ変形して接続する。
   ============================================================ */

.loader {
  position: fixed; inset: 0; z-index: var(--z-loader);
  background: var(--c-canvas);
  display: grid; grid-template-rows: auto 1fr auto;
  padding: clamp(1.25rem, 4vw, 3rem);
  /* 端末のノッチ/ブラウザUIと干渉しない内側に描く */
  padding: max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-top))
           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-right))
           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-bottom))
           max(clamp(1.25rem, 4vw, 3rem), env(safe-area-inset-left));
}
.loader[hidden] { display: none; }

.loader__top {
  display: flex; justify-content: space-between; align-items: flex-start;
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
}

/* 数字は中央に置かず、左下寄せ・余白を大きく残す */
.loader__count {
  grid-row: 3;
  display: flex; align-items: flex-end; gap: 0.08em;
  font-family: var(--font-num); font-weight: var(--w-bold);
  font-size: var(--t-hero); line-height: 0.78; letter-spacing: var(--ls-hero);
  font-variant-numeric: tabular-nums;
  color: var(--c-ink);
}
.loader__range {
  font-size: var(--t-xs); letter-spacing: var(--ls-label);
  color: var(--c-ink-muted); align-self: flex-start; margin-bottom: 0.6em;
  font-weight: var(--w-medium);
}
.loader__pct {
  font-size: 0.22em; align-self: flex-start; margin-top: 0.35em; /* 小さな上付きの % */
  color: var(--c-ink-muted); font-weight: var(--w-medium);
}

/* 100%で数字が左右へ静かに離れ、その間からイラストが現れる */
.loader__digits { display: inline-flex; }
.loader[data-state="exit"] .loader__digits--l { transform: translateX(-28vw); opacity: 0; }
.loader[data-state="exit"] .loader__digits--r { transform: translateX(28vw); opacity: 0; }
.loader__digits--l, .loader__digits--r {
  transition: transform var(--m-loader-exit) var(--ease-in-out),
              opacity var(--m-loader-exit) var(--ease-out);
}
.loader[data-state="exit"] .loader__range,
.loader[data-state="exit"] .loader__pct,
.loader[data-state="exit"] .loader__top { opacity: 0; transition: opacity 220ms var(--ease-out); }

.loader { transition: opacity var(--m-loader-exit) var(--ease-out); }
.loader[data-state="done"] { opacity: 0; pointer-events: none; }

/* --- 画面外周ライン ---------------------------------------- */
.perimeter {
  position: fixed; inset: 0; z-index: calc(var(--z-loader) + 1);
  pointer-events: none;
}
.perimeter[hidden] { display: none; }
.perimeter svg { width: 100%; height: 100%; display: block; }
.perimeter__track { fill: none; stroke: var(--c-hairline); stroke-width: 1; }
.perimeter__line { fill: none; stroke: var(--c-ink); stroke-width: 1; stroke-linecap: butt; }
/* 線の先端にだけ小さなピンクの点 */
.perimeter__tip { fill: var(--c-accent); }
.perimeter--handoff .perimeter__tip { opacity: 0; transition: opacity 240ms var(--ease-out); }
.perimeter--handoff { transition: opacity 420ms var(--ease-out) 260ms; }
.perimeter--faded { opacity: 0; }

/* ホーム側の受け皿。外周ラインが縮んでここへ重なり、静的な枠へ引き継ぐ */
.home-frame {
  position: fixed; z-index: 1; pointer-events: none;
  inset: var(--frame-inset, 12px);
  border: var(--line-hair);
  opacity: 0;
  transition: opacity 420ms var(--ease-out);
}
.home-frame.is-on { opacity: 1; }
@media (max-width: 640px) { .home-frame { display: none; } }

/* 縮小演出を行わない場合(reduced motion)の短いクロスフェード */
@media (prefers-reduced-motion: reduce) {
  .loader__digits--l, .loader__digits--r { transform: none !important; }
}

/* スクロール抑止 */
body[data-loading="true"] { overflow: hidden; }

/* ============================================================
   PINK INDEX — HOME
   キービジュアルから始まり、見せ方の違う区画が続く縦長のページ。
   同じ組みを繰り返さず、区画ごとに比率・余白・文字の位置を変える。
   ============================================================ */

/* --- KEY VISUAL ------------------------------------------- */
.kv { position: relative; }
.kv__track {
  display: flex;
  cursor: grab;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.kv__track::-webkit-scrollbar { display: none; }
[data-kv][data-dragging] .kv__track { cursor: grabbing; }
[data-kv][data-dragging] .kv__slide { user-select: none; }

.kv__slide {
  position: relative;
  flex: 0 0 100%;
  scroll-snap-align: start;
  display: block;
  min-height: min(100svh, 1100px);
  background: var(--hs-bg);
  color: var(--hs-fg);
  overflow: clip;
}
.kv__media { position: absolute; inset: 0; display: block; }
.kv__img { width: 100%; height: 100%; object-fit: cover;
  object-position: var(--hs-focus, 50% 40%); transform: scale(var(--hs-zoom, 1)); }

/* 文字を置ける範囲。ヘッダーの高さと操作の分を空ける */
.kv__free {
  position: absolute;
  inset: calc(var(--header-h) + clamp(0.75rem, 3vw, 1.75rem)) var(--page-x) clamp(4.5rem, 8vw, 6rem);
  pointer-events: none;
}
.kv__type {
  position: absolute;
  left: var(--hs-tx, 0%); top: var(--hs-ty, 100%);
  transform: translate(calc(var(--hs-tx, 0%) * -1), calc(var(--hs-ty, 100%) * -1));
  width: max(16rem, var(--hs-tw, 62%));
  max-width: 100%; max-height: 100%;
  text-align: var(--hs-align, left);
  pointer-events: auto;
}
.kv__eyebrow {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; margin: 0 0 var(--s-3);
}
.kv__title {
  font-family: var(--font-en); font-weight: var(--w-bold);
  font-size: clamp(2rem, min(7vw, 12svh), 6rem); line-height: 0.95;
  letter-spacing: -0.02em; margin: 0;
}
.kv__sub { font-size: var(--t-sm); margin: var(--s-3) 0 0; opacity: 0.85; }
.kv__link {
  display: inline-block; margin-top: var(--s-5);
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase;
  color: inherit; border-bottom: 1px solid currentColor; padding-bottom: 2px;
}
.kv__link:hover { text-decoration: none; opacity: 0.7; }

/* 矢印は左右の端に。絵を邪魔しない細い形で、押せる範囲は44px以上 */
.kv__arrow {
  position: absolute; top: 50%; translate: 0 -50%; z-index: 2;
  width: clamp(44px, 5vw, 64px); height: clamp(44px, 8vh, 84px);
  display: grid; place-items: center;
  border: 0; background: none; color: var(--hs-fg, var(--c-ink));
  cursor: pointer; opacity: 0.7;
  transition: opacity var(--m-micro) var(--ease-out);
}
.kv__arrow:hover { opacity: 1; }
.kv__arrow[disabled] { opacity: 0.15; cursor: default; }
.kv__arrow--prev { left: max(var(--s-2), calc(var(--page-x) - 1.25rem)); }
.kv__arrow--next { right: max(var(--s-2), calc(var(--page-x) - 1.25rem)); }
.kv__arrow > span {
  width: 14px; height: 14px;
  border-left: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
}
.kv__arrow--prev > span { rotate: 45deg; translate: 3px 0; }
.kv__arrow--next > span { rotate: -135deg; translate: -3px 0; }

.kv__dots {
  position: absolute; left: 0; right: 0; bottom: clamp(1rem, 2.5vw, 2rem); z-index: 2;
  display: flex; justify-content: center; gap: var(--s-2);
  list-style: none; margin: 0; padding: 0; color: var(--hs-fg, var(--c-ink));
}
.kv__dots li { display: flex; }
.kv__dots button {
  width: 26px; height: 2px; border: 0; padding: 8px 0; cursor: pointer;
  background: transparent; position: relative; opacity: 0.45;
  transition: opacity var(--m-micro) var(--ease-out);
}
.kv__dots button::after { content: ""; position: absolute; inset: 8px 0; background: currentColor; }
.kv__dots button[aria-current="true"] { opacity: 1; }

/* --- 区画の共通 -------------------------------------------- */
.sec {
  padding: clamp(3rem, 9vw, 8rem) var(--page-x);
  background: var(--hs-bg, var(--c-canvas));
  color: var(--hs-fg, var(--c-ink));
}
.sec__head {
  display: flex; align-items: baseline; gap: var(--s-4);
  margin-bottom: clamp(1.5rem, 4vw, 3rem);
}
.sec__title, .sec__eyebrow {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; margin: 0;
}
.sec__count { color: var(--c-ink-muted); font-size: var(--t-xs); }
.sec__lead { font-size: var(--t-sm); color: var(--c-ink-muted); margin: 0 0 var(--s-5); }
.sec__more { margin: clamp(1.5rem, 4vw, 3rem) 0 0; }

/* 画像の下に小さく置く説明 */
.cap { display: block; margin-top: var(--s-3); font-size: var(--t-xs); }
.cap__title { display: block; }
.cap__meta { color: var(--c-ink-muted); }
.sec a { color: inherit; }
.sec a:hover { text-decoration: none; opacity: 0.82; }

/* --- 02 FEATURE：大判1点＋小判2点 --------------------------- */
.feature { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(1rem, 3vw, 3rem); align-items: start; }
.feature__lead { display: block; }
.feature__lead .feature__img { aspect-ratio: 4 / 5; }
.feature__side { display: grid; gap: clamp(1rem, 3vw, 2.5rem); padding-top: clamp(2rem, 8vw, 6rem); }
.feature__item .feature__img { aspect-ratio: 1 / 1; }
.feature__img { width: 100%; height: auto; object-fit: cover; display: block; }

/* --- 03 DETAILS：横長のストリップ --------------------------- */
.sec--details { padding-inline: 0; }
.sec--details .sec__head, .sec--details .sec__more { padding-inline: var(--page-x); }
.strip {
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.strip::-webkit-scrollbar { display: none; }
.strip__cell { flex: 0 0 min(42vw, 420px); scroll-snap-align: start; display: block; }
.strip__img {
  width: 100%; height: clamp(180px, 34svh, 380px);
  object-fit: cover; object-position: 50% var(--crop, 40%); display: block;
}

/* --- 04 COLOR STORY：段差をつけて並べる --------------------- */
.color-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: clamp(1rem, 3vw, 2.5rem); align-items: start;
}
.color-row__item { display: block; margin-top: calc(var(--n, 0) * clamp(0.5rem, 2vw, 2rem)); }
.color-row__img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }

/* --- 05 NEW：大小の混ざったグリッド ------------------------- */
.mixed {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: clamp(0.75rem, 2vw, 2rem); grid-auto-flow: dense;
}
.mixed__item { display: block; }
.mixed__img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1 / 1; display: block; }
.mixed__item--tall { grid-row: span 2; }
.mixed__item--tall .mixed__img { aspect-ratio: 1 / 2; }
.mixed__item--wide { grid-column: span 2; }
.mixed__item--wide .mixed__img { aspect-ratio: 2 / 1; }

/* --- 06 SPOTLIGHT：横幅いっぱいの特集 ----------------------- */
.sec--spotlight { padding-inline: 0; }
.spotlight { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); align-items: center; }
.spotlight__cover { display: block; }
.spotlight__img { width: 100%; height: 100%; max-height: 78svh; object-fit: cover; display: block; }
.spotlight__body { padding: clamp(2rem, 6vw, 5rem) var(--page-x); }
.spotlight__title { font-family: var(--font-en); font-size: var(--t-display); line-height: 0.95; margin: var(--s-3) 0 0; }
.spotlight__copy { font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-4) 0 0; max-width: 32em; }
.spotlight__thumbs { display: flex; gap: var(--s-3); margin-top: var(--s-5); }
.spotlight__thumbs img { width: clamp(64px, 9vw, 110px); aspect-ratio: 1; object-fit: cover; display: block; }

/* --- 07 ARCHIVE：小さなモザイク ----------------------------- */
.mosaic { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 2px; }
.mosaic__cell { display: block; }
.mosaic__img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; filter: saturate(0.92); }
.mosaic__cell:hover .mosaic__img { filter: none; }

/* --- 08 ABOUT の帯 ------------------------------------------ */
.about-strip { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 7fr); gap: clamp(1.5rem, 4vw, 4rem); align-items: center; }
/* 写真が無いときは1列にする（空の列に文字が押し込まれないように） */
.about-strip:not(:has(.about-strip__media)) { grid-template-columns: 1fr; }
.about-strip__media img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 50%; }
.about-strip__lead { font-size: var(--t-lead); margin: var(--s-3) 0 0; max-width: 34em; }

/* --- 縦画面・スマートフォン --------------------------------- */
@media (orientation: portrait) {
  .kv__slide { min-height: min(88svh, 900px); }
  .kv__type { width: max(14rem, min(100%, calc(var(--hs-tw, 62%) + 25%))); }
}

@media (max-width: 900px) {
  .kv__arrow { width: 44px; height: 56px; }
  .kv__free { inset: calc(var(--header-h) + 0.5rem) var(--page-x) clamp(4rem, 12vw, 5rem); }
  .feature, .spotlight, .about-strip { grid-template-columns: 1fr; }
  .feature__side { padding-top: 0; grid-template-columns: 1fr 1fr; }
  .about-strip__media img { max-width: 180px; }
  .mixed__item--wide { grid-column: span 1; }
  .mixed__item--wide .mixed__img { aspect-ratio: 1 / 1; }
}

/* ============================================================
   PINK INDEX — Archive pages (CLOSET / GIRLS / COLLECTIONS / GALLERY)
   検索結果は整列グリッド、特集だけ可変比率の編集的レイアウト。
   ============================================================ */

.page-head {
  display: grid; gap: var(--s-3);
  padding-top: var(--s-7); padding-bottom: var(--s-5);
  border-bottom: var(--line-ink);
}
/* 見出し直後のセクションは上の余白を詰め、一覧をすぐ見せる */
.page-head + .section, .page-head + .page .section:first-child { padding-top: var(--s-6); }
.page-head__title { display: flex; align-items: baseline; gap: clamp(1rem, 2.5vw, 2.5rem); flex-wrap: wrap; }
.page-head__no {
  font-family: var(--font-num); font-size: var(--t-display);
  font-weight: var(--w-bold); line-height: 0.8; letter-spacing: var(--ls-hero);
}
.page-head__en {
  font-family: var(--font-en); font-size: var(--t-display);
  font-weight: var(--w-bold); text-transform: uppercase; line-height: 0.9; letter-spacing: -0.02em;
}
.page-head__jp { font-size: var(--t-sm); color: var(--c-ink-muted); max-width: var(--measure); margin: 0; }
@media (max-width: 640px) { .page-head { gap: var(--s-2); } }

/* --- Filter bar ------------------------------------------ */
.filters {
  display: grid; gap: var(--s-4);
  padding: var(--s-5) 0; border-bottom: var(--line-hair);
  position: sticky; top: var(--header-h); z-index: var(--z-sticky);
  background: color-mix(in srgb, var(--c-canvas) 94%, transparent);
  backdrop-filter: blur(8px);
}
.filters__row { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }
.filters__body { display: grid; gap: var(--s-4); }
.filters__toggle { display: inline-flex; justify-self: start; }
@media (max-width: 900px) {
  .filters { gap: var(--s-3); }
  .filters__label { min-width: 3.5rem; font-size: 10px; }
}
.filters__label {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
  min-width: 4.5rem;
}
.filters__search { flex: 1 1 220px; max-width: 380px; }
/* 選択中の条件と結果件数を常に表示する */
.result-bar {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  padding: var(--s-4) 0; font-size: var(--t-sm); color: var(--c-ink-muted);
}
.result-bar strong { color: var(--c-ink); font-variant-numeric: tabular-nums; font-size: 1.1rem; }

/* --- WORKS：整列グリッド ---------------------------------- */
.work-grid {
  display: grid; gap: clamp(var(--s-3), 2vw, var(--s-6));
  grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
  padding-block: var(--s-6) var(--s-9);
}
.work-card { display: block; color: inherit; }
.work-card:hover { text-decoration: none; }
.work-card__media { display: block; background: var(--c-white); overflow: clip; }
.work-card__media img {
  width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block;
  transition: transform var(--m-panel) var(--ease-out);
}
.work-card:hover .work-card__media img { transform: scale(1.02); }
.work-card__body { display: flex; gap: var(--s-3); align-items: baseline; padding-top: var(--s-2); font-size: var(--t-xs); }
.work-card__title { flex: 1 1 auto; }
.work-card__meta { color: var(--c-ink-muted); }

/* --- 作品の詳細 ------------------------------------------- */
.work { padding-block: calc(var(--header-h) + var(--s-6)) var(--s-8); }
.work__media { background: var(--c-white); }
.work__media img { width: 100%; height: auto; max-height: 86svh; object-fit: contain; display: block; }
.work__head { display: flex; align-items: baseline; gap: var(--s-5); flex-wrap: wrap; padding-top: var(--s-5); }
.work__title { font-size: var(--t-title); margin: 0; }
.work__meta { display: flex; gap: var(--s-4); font-size: var(--t-xs); color: var(--c-ink-muted); margin: 0; }
.work__text { max-width: 42rem; margin-top: var(--s-5); line-height: var(--lh-body); }
.work__more { display: grid; gap: var(--s-3); margin-top: var(--s-7); }
.work__more img { width: 100%; height: auto; display: block; }
.work__tags { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-6); }

/* --- SERIES ----------------------------------------------- */
.series-list { display: grid; gap: clamp(1rem, 3vw, 2.5rem); }
.series-row {
  display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr);
  gap: clamp(1rem, 3vw, 2.5rem); align-items: center; color: inherit;
}
.series-row:hover { text-decoration: none; opacity: 0.85; }
.series-row__media img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
.series-row__body { display: grid; gap: var(--s-2); }
.series-row__name { font-family: var(--font-en); font-size: var(--t-title); line-height: 1; }
.series-row__copy { font-size: var(--t-sm); color: var(--c-ink-muted); }
.series-row__count { font-size: var(--t-xs); color: var(--c-ink-muted); }
.series-head { padding-block: calc(var(--header-h) + var(--s-7)) var(--s-5); border-bottom: var(--line-ink); }
.series-head__copy { font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-3) 0 0; max-width: var(--measure); }

/* --- ABOUT ------------------------------------------------ */
.about__portrait img { width: min(220px, 45%); aspect-ratio: 1; object-fit: cover; border-radius: 50%; }
.about__lead { font-size: var(--t-lead); margin: var(--s-5) 0 0; }

@media (max-width: 900px) {
  .series-row { grid-template-columns: 1fr; }
}

/* --- TERMS / PRIVACY / CONTACT -------------------------------
   最下部の並びから開く3枚。読ませる面なので、幅を詰めて行間を広く。
   ------------------------------------------------------------ */
.doc { max-width: 46rem; padding-block: clamp(2.5rem, 7vw, 6rem); }
.doc__title {
  font-family: var(--font-en); font-size: var(--t-display);
  font-weight: var(--w-bold); letter-spacing: -0.02em; line-height: 0.9;
}
.doc__sub { font-size: var(--t-sm); color: var(--c-ink-muted); margin: var(--s-3) 0 0; }
.doc__section { margin-top: clamp(2rem, 5vw, 3.5rem); }
.doc__section h2 {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); color: var(--c-ink-muted);
  padding-bottom: var(--s-2); border-bottom: var(--line-hair);
}
.doc__section ul { margin: var(--s-4) 0 0; padding-left: 1.2em; }
.doc__section li + li { margin-top: var(--s-3); }

/* ============================================================
   PINK INDEX — Studio (管理画面 / 企画書 7.7)
   同じ色・書体・罫線を使うが、巨大文字や演出は最小限。
   装飾より入力効率と誤操作防止を優先する。
   ============================================================ */

.studio { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100svh; }
.studio__nav {
  border-right: var(--line-hair); background: var(--c-white);
  padding: var(--s-5) var(--s-4); position: sticky; top: 0; height: 100svh; overflow-y: auto;
}
.studio__nav h1 {
  font-family: var(--font-en); font-size: var(--t-xs); letter-spacing: var(--ls-label);
  text-transform: uppercase; color: var(--c-ink-muted); margin-bottom: var(--s-4);
}
.studio__nav a {
  display: flex; align-items: center; gap: var(--s-2);
  min-height: 38px; padding: 0 var(--s-3); border-radius: var(--r-2);
  font-size: var(--t-sm); color: var(--c-ink-muted);
}
.studio__nav a:hover { background: var(--c-pink-mist); color: var(--c-ink); text-decoration: none; }
.studio__nav a[aria-current="page"] { background: var(--c-ink); color: var(--c-white); }
.studio__nav .group { margin-top: var(--s-5); }

.studio__main { padding: var(--s-6) var(--s-6) var(--s-9); min-width: 0; }
.studio__head { display: flex; align-items: baseline; gap: var(--s-4); flex-wrap: wrap; margin-bottom: var(--s-5); }
.studio__head h2 { font-size: 1.5rem; }
.studio__head .spacer { margin-left: auto; }

.dash-grid { display: grid; gap: var(--s-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.dash-card {
  border: var(--line-hair); border-radius: var(--r-2); background: var(--c-white);
  padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-2);
}
.dash-card h3 {
  font-family: var(--font-en); font-size: var(--t-xs);
  letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--c-ink-muted);
}
.dash-card__value {
  font-family: var(--font-num); font-size: 2.5rem; font-weight: var(--w-bold); line-height: 1;
  font-variant-numeric: tabular-nums;
}
.dash-card--muted { background: var(--c-pink-mist); }
/* 公開アクセス数は隔離し、非表示にできる */
.dash-card--isolated { border-style: dashed; }

.wizard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: var(--s-6); align-items: start; }
.wizard__steps { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-bottom: var(--s-5); }
.wizard__step {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-xs); color: var(--c-ink-muted);
  border-bottom: 2px solid var(--c-hairline); padding-bottom: var(--s-2); flex: 1 1 80px;
}
.wizard__step[data-state="current"] { color: var(--c-ink); border-bottom-color: var(--c-ink); }
.wizard__step[data-state="done"] { border-bottom-color: var(--c-accent); }
.wizard__form { display: grid; gap: var(--s-5); }
.form-row { display: grid; gap: var(--s-4); grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

.dropzone {
  border: 1px dashed var(--c-ink-muted); border-radius: var(--r-3);
  background: var(--c-pink-mist); padding: var(--s-7) var(--s-5); text-align: center;
  cursor: pointer;
}
.dropzone:hover, .dropzone[data-over="true"] { background: var(--c-pale-pink); border-color: var(--c-ink); }

/* アップロード直後の自動検査 */
.checklist li {
  display: grid; grid-template-columns: 1.2rem 1fr auto; gap: var(--s-3);
  align-items: baseline; padding: var(--s-2) 0; border-bottom: var(--line-hair); font-size: var(--t-sm);
}
.checklist .state { font-size: var(--t-xs); letter-spacing: 0.06em; }
.checklist [data-ok="true"] .mark { color: var(--c-ok); }
.checklist [data-ok="false"] .mark { color: var(--c-danger); }
.checklist [data-ok="pending"] .mark { color: var(--c-ink-muted); }

.layer-list { border: var(--line-hair); border-radius: var(--r-2); overflow: hidden; background: var(--c-white); }
.layer-list li {
  display: grid; grid-template-columns: auto 1fr auto auto; gap: var(--s-3);
  align-items: center; padding: var(--s-2) var(--s-3);
  border-bottom: var(--line-hair); font-size: var(--t-xs);
}
.layer-list li:last-child { border-bottom: 0; }
.layer-list li[draggable="true"] { cursor: grab; }
.layer-list .order { font-family: var(--font-num); color: var(--c-ink-muted); }
.layer-list .handle { color: var(--c-ink-muted); }

.side-preview {
  position: sticky; top: var(--s-5);
  border: var(--line-hair); border-radius: var(--r-3); background: var(--c-white);
  padding: var(--s-4); display: grid; gap: var(--s-3);
}
.side-preview .canvas { height: 46svh; width: 100%; justify-self: center; }

.publish-bar {
  display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap;
  border-top: var(--line-ink); padding-top: var(--s-4); margin-top: var(--s-6);
}
.publish-bar .spacer { margin-left: auto; }
.status-pill {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-xs); letter-spacing: 0.06em;
  border: var(--line-hair); border-radius: var(--r-pill); padding: var(--s-1) var(--s-3);
}
.status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c-ink-muted); }
.status-pill[data-status="PUBLISHED"]::before { background: var(--c-ok); }
.status-pill[data-status="DRAFT"]::before { background: var(--c-ink-muted); }
.status-pill[data-status="REVIEW"]::before { background: var(--c-accent); }
.status-pill[data-status="ARCHIVED"]::before { background: var(--c-hairline); }

@media (max-width: 900px) {
  .studio { grid-template-columns: 1fr; }
  .studio__nav { position: static; height: auto; border-right: 0; border-bottom: var(--line-hair); }
  .studio__nav { min-width: 0; }
  .studio__nav ul {
    display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none;
    min-width: 0; max-width: 100%;
  }
  .studio__nav ul::-webkit-scrollbar { display: none; }
  .studio__nav li { flex: 0 0 auto; }
  .studio__nav .group { margin-top: var(--s-3); }
  .wizard { grid-template-columns: 1fr; }
  .studio__main { padding: var(--s-5) var(--s-4) var(--s-8); }
}

/* --- フレーバーテキスト欄（メモとは別項目） ------------------ */
.flavor-fields {
  border: var(--line-hair); border-radius: var(--r-2);
  padding: var(--s-4) var(--s-5); display: grid; gap: var(--s-4);
  background: var(--c-pink-mist);
}
.flavor-fields legend { font-size: var(--t-xs); letter-spacing: 0.06em; color: var(--c-ink-muted); padding: 0 var(--s-2); }
.check { display: inline-flex; align-items: center; gap: var(--s-2); font-size: var(--t-sm); }

/* --- HOMEの編集 ------------------------------------------- */
.home-editor { display: grid; gap: var(--s-3); margin-top: var(--s-5); }
.home-slot { border: var(--line-hair); border-radius: var(--r-2); background: var(--c-white); }
.home-slot[data-published="false"] { opacity: 0.62; }
.home-slot__head {
  display: grid; grid-template-columns: 2.5rem 64px minmax(0, 1fr) auto;
  gap: var(--s-3); align-items: center; padding: var(--s-3) var(--s-4);
}
.home-slot__no { font-family: var(--font-num); color: var(--c-ink-muted); }
.home-slot__thumb { width: 64px; height: 44px; object-fit: cover; background: var(--c-grey); }
.home-slot__title { display: flex; gap: var(--s-2); align-items: baseline; flex-wrap: wrap; }
.home-slot__title strong { font-size: 0.95rem; }
.home-slot__actions { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.home-slot__body { border-top: var(--line-hair); padding: var(--s-4); display: grid; gap: var(--s-4); }
.home-slot__body[hidden] { display: none; }
.home-preview {
  border: var(--line-hair); border-radius: var(--r-2); overflow: hidden;
  max-height: 340px; background: var(--c-canvas);
}
.home-preview .hs { min-height: 0 !important; }
.home-preview .hs--hero { min-height: 320px !important; }
.home-preview .hs__title { font-size: 2rem !important; }
.range-row { display: grid; grid-template-columns: max-content 1fr max-content; gap: var(--s-3); align-items: center; font-size: var(--t-xs); }
.color-row { display: flex; gap: var(--s-4); flex-wrap: wrap; align-items: center; font-size: var(--t-xs); }
.color-row input[type="color"] { width: 44px; height: 32px; border: var(--line-hair); border-radius: var(--r-1); background: none; }

/* --- 素材の編集パネル -------------------------------------- */
.item-edit { border-top: var(--line-hair); padding: var(--s-4); display: grid; gap: var(--s-4); background: var(--c-pink-mist); }
.item-edit[hidden] { display: none; }
.layer-list li.is-editing { display: block; padding: 0; }
.layer-list li.is-editing .row { display: grid; grid-template-columns: auto 1fr auto auto; gap: var(--s-3); align-items: center; padding: var(--s-2) var(--s-3); }

/* --- キービジュアル（横スクロール切り替え）の編集 ------------ */
.home-slides { display: grid; gap: var(--s-3); }
.home-slide { border: var(--line-hair); border-radius: var(--r-2); background: var(--c-canvas); }
.home-slide .home-slot__head { grid-template-columns: 2rem 64px minmax(0, 1fr) auto; }
.home-slide .home-slot__body { border-top: var(--line-hair); }

/* 狭い画面では、見出しの行と操作の行を分けて重ならないようにする */
@media (max-width: 720px) {
  .home-slot__head,
  .home-slide .home-slot__head {
    grid-template-columns: 2rem 48px minmax(0, 1fr);
    row-gap: var(--s-2);
  }
  .home-slot__thumb { width: 48px; height: 34px; }
  .home-slot__actions { grid-column: 1 / -1; }
}

/* --- 文字を置く場所を決める操作 ------------------------------
   9つのボタンで大まかに置き、つまみで細かく詰める。
   触っている間はプレビューだけが動き、フォームは組み直さない。
   ---------------------------------------------------------- */
.place {
  border: var(--line-hair); border-radius: var(--r-2);
  padding: var(--s-4); margin: 0;
  display: grid; grid-template-columns: max-content minmax(0, 1fr);
  gap: var(--s-4) var(--s-5); align-items: start;
}
.place > legend {
  font-size: var(--t-xs); letter-spacing: var(--ls-label);
  color: var(--c-ink-muted); padding: 0 var(--s-2);
}
.place__grid {
  display: grid; grid-template-columns: repeat(3, 34px); grid-auto-rows: 34px; gap: 3px;
  border: var(--line-hair); border-radius: var(--r-1); padding: 3px;
  background: var(--c-white);
}
.place__spot {
  border: 0; border-radius: var(--r-1); cursor: pointer;
  background: var(--c-pink-mist);
  transition: background var(--m-micro) var(--ease-out);
}
.place__spot:hover { background: var(--c-pale-pink); }
.place__spot[aria-pressed="true"] { background: var(--c-ink); }
.place__ranges { display: grid; gap: var(--s-2); }
.place .hint { grid-column: 1 / -1; margin: 0; }

.seg {
  justify-self: start; display: inline-flex; flex-wrap: wrap; max-width: 100%;
  border: var(--line-hair); border-radius: var(--r-1); overflow: hidden;
}
.seg__btn {
  border: 0; background: none; cursor: pointer;
  padding: var(--s-2) var(--s-3); font-size: var(--t-xs); min-height: var(--tap-min);
}
.seg__btn + .seg__btn { border-left: var(--line-hair); }
.seg__btn[aria-pressed="true"] { background: var(--c-ink); color: var(--c-white); }

@media (max-width: 720px) {
  .place { grid-template-columns: 1fr; }
}

/* --- 編集ステージ（画面を見ながら動かす） --------------------
   公開ページと同じ1枚を出し、その上で直接つかんで動かす。
   ------------------------------------------------------------ */
.edit-stage {
  border: var(--line-hair); border-radius: var(--r-2);
  background: var(--c-white); overflow: hidden;
}
.edit-stage__bar {
  display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap;
  padding: var(--s-2) var(--s-3); border-bottom: var(--line-hair);
  font-size: var(--t-xs);
}
.edit-stage__bar .spacer { margin-left: auto; }
.edit-stage__read { color: var(--c-ink-muted); }
.zoom { display: inline-flex; gap: var(--s-2); align-items: center; }

.edit-stage__frame {
  position: relative;
  aspect-ratio: 16 / 9;
  max-height: 62svh;
  overflow: hidden;
  background: var(--c-canvas);
  touch-action: none;              /* つかんで動かす操作をブラウザに取られない */
}
.edit-stage[data-view="sp"] .edit-stage__frame { aspect-ratio: 9 / 16; max-width: 360px; margin-inline: auto; }
.edit-stage__frame .kv__slide { position: absolute; inset: 0; min-height: 0; }
.edit-stage__frame .hs__title { font-size: clamp(1.25rem, 4.5cqw, 3rem); }
.edit-stage__frame .hs__free { inset: var(--s-4); }

/* つかめる場所であることを、枠と手の形で示す */
.edit-stage .hs__type--hero {
  outline: 1px dashed color-mix(in srgb, currentColor 45%, transparent);
  outline-offset: 6px; cursor: grab;
}
.edit-stage .hs__type--hero:focus-visible { outline: 2px solid var(--c-focus); }
.edit-stage[data-dragging="text"] .hs__type--hero { cursor: grabbing; }
.edit-stage[data-mode="image"] .hs__type--hero { outline-color: transparent; cursor: default; pointer-events: none; }
.edit-stage[data-mode="image"] .edit-stage__frame { cursor: grab; }
.edit-stage[data-dragging="image"] .edit-stage__frame { cursor: grabbing; }
.edit-stage[data-mode="image"] .edit-stage__handle { display: none; }

.edit-stage__handle {
  position: absolute; right: -10px; bottom: -10px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--c-ink); border: 2px solid var(--c-white);
  cursor: ew-resize;
}

/* ステージの中のリンクは、編集中は押させない */
.edit-stage a { pointer-events: none; }

.fine > summary {
  cursor: pointer; font-size: var(--t-xs); color: var(--c-ink-muted);
  padding: var(--s-2) 0; letter-spacing: var(--ls-label);
}
.fine[open] > summary { margin-bottom: var(--s-3); }

/* --- サイトの文字（画面を見ながら直す） ---------------------- */
.texts {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
  gap: var(--s-4); align-items: start;
}
.texts__view { position: sticky; top: var(--s-4); display: grid; gap: var(--s-3); }
.texts__frame {
  width: 100%; height: min(70svh, 720px);
  border: var(--line-hair); border-radius: var(--r-2); background: var(--c-white);
}
.texts__list { display: grid; gap: var(--s-3); max-height: 78svh; overflow-y: auto; padding-right: var(--s-2); }

.text-row {
  border: var(--line-hair); border-radius: var(--r-2);
  padding: var(--s-2) var(--s-3) var(--s-3); background: var(--c-white);
  display: grid; gap: var(--s-2);
}
.text-row.is-off { opacity: 0.55; }
.text-row.is-edited { border-color: var(--c-ink); }
.text-row__head { display: flex; gap: var(--s-1); align-items: center; flex-wrap: wrap; font-size: var(--t-xs); }
.text-row__head .spacer { margin-left: auto; }
.text-row .textarea { min-height: 0; font-size: var(--t-sm); padding: var(--s-2); }
.seg--tight .seg__btn { padding: var(--s-1) var(--s-2); min-height: 28px; }
.text-row .btn--sm { padding: var(--s-1) var(--s-2); min-height: 28px; }

@media (max-width: 900px) {
  .texts { grid-template-columns: 1fr; }
  .texts__view { position: static; }
  .texts__list { max-height: none; }
}

/* 管理サイドバーの補足（公開側では使わない） */
.footer-note {
  padding-top: var(--s-4); border-top: var(--line-hair);
  font-size: var(--t-xs); color: var(--c-ink-muted); line-height: 1.9;
}

/* --- タグ・色の入力（押して外せるチップ） --------------------- */
.chips-input {
  border: var(--line-hair); border-radius: var(--r-2); padding: var(--s-2);
  display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; background: var(--c-white);
}
.chips-input__list { display: contents; }
.chips-input .input { border: 0; flex: 1 1 8rem; min-width: 8rem; padding: var(--s-1) var(--s-2); }
.chip-token {
  display: inline-flex; align-items: center; gap: var(--s-2);
  border: var(--line-hair); border-radius: 999px; background: var(--c-pink-mist);

<script>
/* --- ルーター ---------------------------------------------
   ハッシュが変わったら読み込み直す。ページごとの初期化スクリプトを
   ちょうど1回だけ走らせるため（listener の二重登録を避ける）。
   --------------------------------------------------------- */
window.PINK_SINGLE = true;
window.PINK_ASSETS = JSON.parse(document.getElementById("assets").textContent);
(function () {
  var ROUTES = JSON.parse(document.getElementById("routes").textContent);
  var raw = location.hash.replace(/^#/, "") || "/";
  var q = raw.indexOf("?");
  var path = q < 0 ? raw : raw.slice(0, q);
  window.PINK_QUERY = q < 0 ? "" : raw.slice(q);
  if (!ROUTES[path]) path = "/";

  var page = ROUTES[path];
  document.title = page.title;
  document.body.dataset.chrome = page.chrome ? "on" : "off";
  document.body.className = page.bodyClass || "";
  if (page.pre) {
    document.getElementById("pre").innerHTML = page.pre;
    document.body.dataset.loading = "true";
  }
  document.getElementById("main").innerHTML = page.main;

  // 画像は表から data URI へ差し替える（同じ絵を何度も埋め込まないため）
  var imgs = document.querySelectorAll('img[src^="/assets/"]');
  for (var i = 0; i < imgs.length; i++) {
    var src = imgs[i].getAttribute("src");
    if (window.PINK_ASSETS[src]) imgs[i].setAttribute("src", window.PINK_ASSETS[src]);
  }

  // 現在地をナビへ反映
  var links = document.querySelectorAll(".site-nav a");
  for (var j = 0; j < links.length; j++) {
    var href = links[j].getAttribute("href").replace(/^#/, "");
    if (href === path) links[j].setAttribute("aria-current", "page");
    else links[j].removeAttribute("aria-current");
  }

  addEventListener("hashchange", function () { location.reload(); });
})();
</script>
<script>/* 自動生成 — tools/bundle-core.mjs が src/data から作成する。直接編集しない。 */

];

  const builtinCategories = categories;

});

function load() {
  if (memory) return memory;
  const s = storage();
  if (s) {
    try {
      const raw = s.getItem(KEY);
      if (raw) { memory = normalize(JSON.parse(raw)); return memory; }
    } catch { /* 壊れていたら初期状態から始める */ }
  }
  // この端末にまだ何もないときは、サイトに同梱された公開データを土台にする
  const seed = typeof window !== "undefined" ? window.PINK_SEED : null;
  memory = seed ? normalize(seed) : EMPTY();
  return memory;
}

/** 別の窓（管理画面の枠）で書き換えられた内容を読み直す */
function reload() { memory = null; return load(); }

/** 管理画面で編集した内容を、公開用に書き出す */
const exportData = () => JSON.stringify(load(), null, 2);

/** 書き出したデータを読み込む（別の端末へ持っていくため） */
function importData(json) {
  let parsed;
  try { parsed = typeof json === "string" ? JSON.parse(json) : json; }
  catch { return { ok: false, reason: "このファイルは読み込めませんでした。" }; }
  if (!parsed || typeof parsed !== "object") return { ok: false, reason: "このファイルは読み込めませんでした。" };
  return { ok: true, ...save(normalize(parsed)) };
}

/**
 * 保存を試みる。
 * 「操作が成立したか(ok)」と「この端末に保存できたか(persisted)」を分けて返す。
 */
function save(next = memory) {
  memory = next;
  const s = storage();
  if (!s) return { persisted: false, reason: "この環境では保存できないため、次に開いたときは元に戻ります。" };
  try {
    s.setItem(KEY, JSON.stringify(next));
    return { persisted: true };
  } catch {
    return { persisted: false, reason: "保存領域がいっぱいです。使わない作品を削除してください。" };
  }
}

function resetAll() {
  memory = EMPTY();
  const s = storage();
  try { s?.removeItem(KEY); } catch { /* 無視してよい */ }
}

/* --- 作品 ------------------------------------------------- */

const slugify = (name) => (String(name).trim().toLowerCase()
  .replace(/[^a-z0-9぀-ヿ一-鿿]+/g, "-").replace(/^-|-$/g, "")
  || `w-${Math.random().toString(36).slice(2, 7)}`);

const uniqueSlug = (base) => {
  let slug = slugify(base);
  const used = new Set(mergedWorks().map((w) => w.slug));
  while (used.has(slug)) slug = `${slug}-${Math.random().toString(36).slice(2, 4)}`;
  return slug;
};

/**
 * 作品を登録する。
 * 既定は DRAFT（編集中）。公開はあとから選ぶ。
 */
function addWork({ title, mainImage, images = [], createdOn, category, tags = [],
  series = "", description = "", altText = "", visibility = "DRAFT",
  featured = false, sortOrder = 0, memo = "", slug }) {
  const st = load();
  if (!title?.trim()) return { ok: false, reason: "作品名を入力してください。" };
  if (!mainImage) return { ok: false, reason: "画像を選んでください。" };
  if (!altText?.trim()) return { ok: false, reason: "画像の説明（代替テキスト）を入れてください。" };

  const work = {
    id: `w-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
    slug: slug ? uniqueSlug(slug) : uniqueSlug(title),
    title: title.trim(), mainImage, images: [...images],
    createdOn: createdOn || new Date().toISOString().slice(0, 10),
    category: category || mergedCategories()[0]?.key || "illustration",
    tags: [...tags], series,
    description, altText: altText.trim(),
    visibility: VISIBILITY.includes(visibility) ? visibility : "DRAFT",
    featured: Boolean(featured), sortOrder: Number(sortOrder) || 0,
    memo, custom: true,
  };
  return { ok: true, ...save({ ...st, works: [...st.works, work] }), work };
}

function updateWork(id, patch) {
  const st = load();
  if (!st.works.some((w) => w.id === id)) return { ok: false, reason: "この作品は見つかりません。" };
  const works = st.works.map((w) => (w.id === id ? { ...w, ...patch } : w));
  return { ok: true, ...save({ ...st, works }) };
}

/** 削除は即時・完全。取り消せるのは「編集をすべて取り消す」だけ */
function deleteWork(id) {
  const st = load();
  const mine = st.works.some((w) => w.id === id);
  const next = {
    ...st,
    works: st.works.filter((w) => w.id !== id),
    removed: mine ? st.removed : { ...st.removed, works: [...new Set([...st.removed.works, id])] },
  };
  return { ok: true, ...save(next), permanent: mine };
}

/* --- シリーズ --------------------------------------------- */

function addSeries({ name, slug, jp = "", copy = "", cover = "" }) {
  const st = load();
  if (!name?.trim()) return { ok: false, reason: "シリーズ名を入力してください。" };
  let key = slugify(slug || name);
  if (mergedSeries().some((s) => s.slug === key)) key = `${key}-${Date.now().toString(36).slice(-3)}`;
  const item = { slug: key, name: name.trim(), jp, copy, cover, custom: true };
  return { ok: true, ...save({ ...st, series: [...st.series, item] }), series: item };
}

function updateSeries(slug, patch) {
  const st = load();
  if (!st.series.some((s) => s.slug === slug)) return { ok: false, reason: "このシリーズは見つかりません。" };
  return { ok: true, ...save({ ...st, series: st.series.map((s) => (s.slug === slug ? { ...s, ...patch } : s)) }) };
}

/** 使っている作品があるときは件数を返し、force で紐付けだけ外して消す */
function deleteSeries(slug, { force = false } = {}) {
  const st = load();
  if (!mergedSeries().some((s) => s.slug === slug)) return { ok: false, reason: "このシリーズは見つかりません。" };
  const used = mergedWorks().filter((w) => w.series === slug);
  if (used.length && !force) return { ok: false, used: used.length, reason: `このシリーズの作品が ${used.length} 点あります。` };
  const next = {
    ...st,
    series: st.series.filter((s) => s.slug !== slug),
    // 作品は消さず、シリーズの紐付けだけ外す（参照切れを残さない）
    works: st.works.map((w) => (w.series === slug ? { ...w, series: "" } : w)),
    removed: { ...st.removed, series: [...new Set([...st.removed.series, slug])] },
  };
  return { ok: true, ...save(next), detached: used.length };
}

const seriesUsage = (slug) => mergedWorks().filter((w) => w.series === slug).length;

function addCategory({ name, jp = "" }) {
  const st = load();
  if (!name?.trim()) return { ok: false, reason: "分類名を入力してください。" };
  let key = slugify(name);
  if (mergedCategories().some((c) => c.key === key)) key = `${key}-${Date.now().toString(36).slice(-3)}`;
  const cat = { key, name: name.trim().toUpperCase(), jp, custom: true };
  return { ok: true, ...save({ ...st, categories: [...st.categories, cat] }), category: cat };
}

function deleteCategory(key, { force = false } = {}) {
  const st = load();
  if (!mergedCategories().some((c) => c.key === key)) return { ok: false, reason: "この分類は見つかりません。" };
  const used = mergedWorks().filter((w) => w.category === key);
  if (used.length && !force) return { ok: false, used: used.length, reason: `この分類の作品が ${used.length} 点あります。` };
  const fallback = mergedCategories().find((c) => c.key !== key)?.key ?? "";
  const next = {
    ...st,
    categories: st.categories.filter((c) => c.key !== key),
    works: st.works.map((w) => (w.category === key ? { ...w, category: fallback } : w)),
    removed: { ...st.removed, categories: [...new Set([...st.removed.categories, key])] },
  };
  return { ok: true, ...save(next), moved: used.length };
}

const categoryUsage = (key) => mergedWorks().filter((w) => w.category === key).length;

const homeSlotsAll = () => (load().home ?? cloneHome()).slice().sort((a, b) => a.order - b.order);

function updateHomeSlot(id, patch) {
  const slots = homeSlotsAll();
  if (!slots.some((s) => s.id === id)) return { ok: false, reason: "この区画は見つかりません。" };
  return writeHome(slots.map((s) => (s.id === id ? { ...s, ...patch } : s)));
}

function addHomeSlot(layout = "feature") {
  const slots = homeSlotsAll();
  const slot = {
    id: `hs-u-${Date.now().toString(36)}`, layout, order: slots.length + 1, published: false,
    title: "NEW SECTION", href: "/works/", linkLabel: "VIEW MORE", custom: true,
  };
  return { ...writeHome([...slots, slot]), slot };
}

function deleteHomeSlot(id) {
  const slots = homeSlotsAll();
  if (slots.length <= 1) return { ok: false, reason: "区画を全部消すことはできません。" };
  return writeHome(slots.filter((s) => s.id !== id));
}

function moveHomeSlot(id, dir) {
  const slots = homeSlotsAll();
  const i = slots.findIndex((s) => s.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= slots.length) return { ok: false, reason: "これ以上は動かせません。" };
  const next = slots.slice();
  [next[i], next[j]] = [next[j], next[i]];
  return writeHome(next);
}

function resetHome() {

  return { ok: true, ...save({ ...st, home: null }) };

const slidesOf = (slot) => slot?.slides ?? [];

function addHomeSlide(slotId) {
  const slot = homeSlotsAll().find((s) => s.id === slotId);
  if (!slot) return { ok: false, reason: "この区画は見つかりません。" };
  const slide = {

    href: "/works/", linkLabel: "VIEW WORK", media: "", mediaMobile: "",
    focus: "50% 40%", zoom: 1, bg: "#FFF9FC", fg: "#171417", tone: "dark",
    tx: 0, ty: 100, tw: 62, align: "left",
  };
  const r = updateHomeSlot(slotId, { slides: [...slidesOf(slot), slide] });
  return { ...r, slide };
}

function updateHomeSlide(slotId, slideId, patch) {
  const slot = homeSlotsAll().find((s) => s.id === slotId);
  if (!slot) return { ok: false, reason: "この区画は見つかりません。" };
  return updateHomeSlot(slotId, {
    slides: slidesOf(slot).map((sl) => (sl.id === slideId ? { ...sl, ...patch } : sl)),
  });
}

function deleteHomeSlide(slotId, slideId) {
  const slot = homeSlotsAll().find((s) => s.id === slotId);
  const slides = slidesOf(slot);
  if (slides.length <= 1) return { ok: false, reason: "キービジュアルを全部消すことはできません。" };
  return updateHomeSlot(slotId, { slides: slides.filter((sl) => sl.id !== slideId) });
}

function moveHomeSlide(slotId, slideId, dir) {
  const slot = homeSlotsAll().find((s) => s.id === slotId);
  const slides = slidesOf(slot).slice();
  const i = slides.findIndex((sl) => sl.id === slideId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= slides.length) return { ok: false, reason: "これ以上は動かせません。" };
  [slides[i], slides[j]] = [slides[j], slides[i]];
  return updateHomeSlot(slotId, { slides });
}

/**
 * HOMEに並べる区画のHTML。
 *
 * サーバー側の書き出しと、管理画面のプレビューで同じ関数を使う。
 * DOMには触れず、文字列だけを返す。
 *
 * 区画の中身は「登録した作品」から自動で拾う。作品が無い区画は何も返さない
 * （公開側に0件の枠を出さないため）。同じ組みを繰り返さず、区画ごとに
 * 画像の比率・余白・文字の位置を変える。
 */

const esc = (s) => String(s ?? "")
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

const pct = (v, fallback) => {
  const n = Number(v);
  return Number.isFinite(n) ? Math.min(100, Math.max(0, Math.round(n))) : fallback;
};
const ALIGN = ["left", "center", "right"];

/** 1枠ぶんの見た目をCSS変数で渡す。文字の置き場所も含む */
const style = (o) => [
  `--hs-bg:${/^#[0-9a-fA-F]{3,8}$/.test(o.bg || "") ? o.bg : "#FFF9FC"}`,
  `--hs-fg:${/^#[0-9a-fA-F]{3,8}$/.test(o.fg || "") ? o.fg : "#171417"}`,
  `--hs-focus:${/^[\d.]+% [\d.]+%$/.test(o.focus || "") ? o.focus : "50% 40%"}`,
  `--hs-zoom:${Math.min(3, Math.max(1, Number(o.zoom) || 1))}`,
  `--hs-tx:${pct(o.tx, 0)}%`,
  `--hs-ty:${pct(o.ty, 100)}%`,
  `--hs-tw:${pct(o.tw, 62)}%`,
  `--hs-align:${ALIGN.includes(o.align) ? o.align : "left"}`,
].join(";");

const img = (src, alt, cls, { eager = false, sizes = "" } = {}) => (src
  ? `<img class="${cls}" src="${esc(src)}" alt="${esc(alt ?? "")}"
       loading="${eager ? "eager" : "lazy"}" decoding="async"${eager ? ' fetchpriority="high"' : ""}${sizes}>`
  : "");

/** 区画の見出し。短い英単語だけを置く */
const head = (slot, { count = 0 } = {}) => (slot.title
  ? `<div class="sec__head">
      <h2 class="sec__title">${esc(slot.title)}</h2>
      ${count ? `<span class="sec__count num">${count}</span>` : ""}
    </div>`
  : "");

/** 誘導は区画の末尾に1つだけ */
const more = (slot, url) => (slot.href && slot.linkLabel
  ? `<p class="sec__more"><a class="link-arrow" href="${esc(url(slot.href))}">${esc(slot.linkLabel)}</a></p>`
  : "");

const workHref = (w, url) => url(`/works/${w.slug}/`);

/* --- 01 KEY VISUAL ---------------------------------------- */

/**
 * 主役は一度に一作品。左右の矢印と横スワイプで1枚ずつ切り替える。
 * 文字色は作品ごとに選べる（透明ヘッダーの上でも読めるようにするため）。
 */
function slideHTML(s, { url = (p) => p, heading = "h2", eager = false, attrs = "" } = {}) {
  const link = s.href && s.linkLabel
    ? `<a class="kv__link" href="${esc(url(s.href))}">${esc(s.linkLabel)}</a>` : "";
  const text = s.showText === false ? "" : `
          <div class="kv__type">
            ${s.eyebrow ? `<p class="kv__eyebrow">${esc(s.eyebrow)}</p>` : ""}
            ${s.title ? `<${heading} class="kv__title">${esc(s.title)}</${heading}>` : ""}
            ${s.subtitle ? `<p class="kv__sub">${esc(s.subtitle)}</p>` : ""}
            ${link}
          </div>`;
  return `
        <article class="kv__slide" style="${style(s)}" data-tone="${s.tone === "light" ? "light" : "dark"}"${attrs}>
          ${s.media ? `<picture class="kv__media">
            ${s.mediaMobile ? `<source media="(max-width: 820px)" srcset="${esc(url(s.mediaMobile))}">` : ""}
            ${img(url(s.media), s.altText ?? s.title ?? "", "kv__img", { eager })}
          </picture>` : ""}
          <div class="kv__free">${text}</div>
        </article>`;
}

function heroHTML(slot, { url, first }) {
  const slides = (slot.slides ?? []).filter((s) => s.published !== false);
  if (!slides.length) return "";

  const multi = slides.length > 1;
  return `
  <section class="kv" data-kv${slot.autoplay ? ` data-autoplay="${Math.max(2, Number(slot.interval) || 6)}"` : ""}>
    <div class="kv__track" id="kv-track" tabindex="0"
         role="group" aria-roledescription="カルーセル" aria-label="キービジュアル">
      ${slides.map((s, i) => slideHTML(s, {
        url, heading: first && i === 0 ? "h1" : "h2", eager: i === 0,
        attrs: ` data-kv-slide="${i}" role="group" aria-roledescription="スライド"` +
               ` aria-label="${i + 1} / ${slides.length}"`,
      })).join("")}
    </div>
    ${multi ? `
    <button class="kv__arrow kv__arrow--prev" type="button" data-kv-prev aria-label="前の作品">
      <span aria-hidden="true"></span>
    </button>
    <button class="kv__arrow kv__arrow--next" type="button" data-kv-next aria-label="次の作品">
      <span aria-hidden="true"></span>
    </button>
    <ol class="kv__dots">
      ${slides.map((s, i) => `<li><button type="button" data-kv-go="${i}"
        aria-label="${i + 1}枚目を見る"${i === 0 ? ' aria-current="true"' : ""}></button></li>`).join("")}
    </ol>` : ""}
  </section>`;
}

/* --- 04 COLOR STORY --------------------------------------- */
/** 同じ色・季節・モチーフの3〜5点を編集して並べる */
function colorStoryHTML(slot, { url, works }) {
